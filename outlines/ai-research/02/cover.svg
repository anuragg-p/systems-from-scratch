<text class="t mono" x="114" y="89" font-size="14" text-anchor="middle">+</text>
<text class="t mono" x="214" y="89" font-size="14" text-anchor="middle">=</text>
<text class="tm mono" x="64" y="128" font-size="10.5" text-anchor="middle">x  (3, 4)</text>
