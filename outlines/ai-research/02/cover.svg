<text class="t mono" x="94.0" y="218.7" font-size="10.5" text-anchor="middle">1</text>
<text class="tm mono" x="64" y="238" font-size="10.5" text-anchor="middle">out.grad  (3, 4)</text>
<path class="a" d="M108 197 H 172" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#r02-aa)"/>
<text class="ta mono" x="140" y="190" font-size="10" text-anchor="middle">sum(axis=0)</text>
<rect class="a af" x="176" y="188" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="186.0" y="200.7" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
<rect class="a af" x="196" y="188" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="206.0" y="200.7" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
<rect class="a af" x="216" y="188" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="226.0" y="200.7" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
<rect class="a af" x="236" y="188" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="246.0" y="200.7" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
<text class="ta mono" x="216" y="222" font-size="10.5" text-anchor="middle">b.grad  (4,)</text>
<text class="tm" x="24" y="254" font-size="10.5">b was used in 3 rows, so its gradient adds up all 3</text>
<text class="t" x="340" y="28" font-size="12" font-weight="700">matrix multiply</text>
<text class="tm" x="616" y="28" font-size="10" text-anchor="end">drawn with n = 3, k = 4, m = 2</text>
<text class="t mono" x="340" y="50" font-size="11" font-weight="600">out = x @ w</text>
<rect class="s f" x="356.0" y="58" width="36" height="27" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="374" y="106" font-size="9.5" text-anchor="middle">(n, k)</text>
<text class="t mono" x="411.0" y="75.5" font-size="12" text-anchor="middle">@</text>
<rect class="s f" x="439.0" y="58" width="18" height="36" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="448" y="106" font-size="9.5" text-anchor="middle">(k, m)</text>
<text class="t mono" x="485.0" y="75.5" font-size="12" text-anchor="middle">=</text>
<rect class="s f" x="513.0" y="58" width="18" height="27" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="522" y="106" font-size="9.5" text-anchor="middle">(n, m)</text>
<text class="ta mono" x="340" y="124" font-size="11" font-weight="600">w.grad = x.T @ out.grad</text>
<rect class="s f" x="360.5" y="132" width="27" height="36" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="374" y="180" font-size="9.5" text-anchor="middle">(k, n)</text>
<text class="t mono" x="411.0" y="149.5" font-size="12" text-anchor="middle">@</text>
<rect class="s f" x="439.0" y="132" width="18" height="27" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="448" y="180" font-size="9.5" text-anchor="middle">(n, m)</text>
<text class="t mono" x="485.0" y="149.5" font-size="12" text-anchor="middle">=</text>
<rect class="a af" x="513.0" y="132" width="18" height="36" rx="2" stroke-width="1.5"/>
<text class="ta mono" x="522" y="180" font-size="9.5" text-anchor="middle">(k, m)</text>
<text class="ta" x="566" y="149.5" font-size="10" font-weight="600">&lt;- shape of w</text>
<text class="ta mono" x="340" y="194" font-size="11" font-weight="600">x.grad = out.grad @ w.T</text>
<rect class="s f" x="365.0" y="202" width="18" height="27" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="374" y="250" font-size="9.5" text-anchor="middle">(n, m)</text>
<text class="t mono" x="411.0" y="219.5" font-size="12" text-anchor="middle">@</text>
<rect class="s f" x="430.0" y="202" width="36" height="18" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="448" y="250" font-size="9.5" text-anchor="middle">(m, k)</text>
<text class="t mono" x="485.0" y="219.5" font-size="12" text-anchor="middle">=</text>
<rect class="a af" x="504.0" y="202" width="36" height="27" rx="2" stroke-width="1.5"/>
<text class="ta mono" x="522" y="250" font-size="9.5" text-anchor="middle">(n, k)</text>
<text class="ta" x="566" y="219.5" font-size="10" font-weight="600">&lt;- shape of x</text>
<text class="tm" x="24" y="272" font-size="11">Each gradient has the shape of the tensor it belongs to: the first check on any backward.</text>
<text class="tm" x="24" y="288" font-size="11">Every backward here is checked against the nudge, and against PyTorch&#x27;s gradients to within 1e-6.</text>
</svg>
