<text class="tm mono" x="590" y="82.0" font-size="9.5" text-anchor="middle">0.0645</text>
<text class="tm mono" x="590" y="208.0" font-size="9.5" text-anchor="middle">0.0472</text>
<text class="tm" x="24" y="272" font-size="11">One run is never a result. The five test losses, as the lab reports them:</text>
