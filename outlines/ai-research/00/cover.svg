<text class="t" x="78.0" y="95.0" font-size="11.5" font-weight="600" text-anchor="middle">model</text>
<text class="tm" x="134" y="95" font-size="10.5">y = f(x; w)</text>
<line class="s" x1="78" y1="66" x2="78" y2="76" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r00-ah)"/>
<rect class="s f" x="32" y="116" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="t" x="78.0" y="133.0" font-size="11.5" font-weight="600" text-anchor="middle">loss</text>
<text class="tm" x="134" y="133" font-size="10.5">mean squared error</text>
<line class="s" x1="78" y1="104" x2="78" y2="114" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r00-ah)"/>
<rect class="s fs" x="32" y="154" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="t" x="78.0" y="171.0" font-size="11.5" font-weight="600" text-anchor="middle">update</text>
<text class="tm" x="134" y="171" font-size="10.5">w -= lr * grad, worked by hand</text>
<line class="s" x1="78" y1="142" x2="78" y2="152" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r00-ah)"/>
<rect class="s f" x="32" y="192" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="t" x="78.0" y="209.0" font-size="11.5" font-weight="600" text-anchor="middle">evaluate</text>
<text class="tm" x="134" y="209" font-size="10.5">loss on held-out points</text>
<line class="s" x1="78" y1="180" x2="78" y2="190" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r00-ah)"/>
<path class="m" d="M32 167 H 20 V 91 H 30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#r00-ah)"/>
