<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Preferences: a choice between two answers is the data; fit a reward model to the choices, or tune the model on them directly with DPO</title>
<defs><marker id="r20-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r20-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="30" font-size="11.5" font-weight="700">the data: one prompt, two stories, a choice</text>
<rect class="s fs" x="24" y="42" width="230" height="24" rx="5" stroke-width="1.5"/>
<text class="t" x="139.0" y="57.7" font-size="10.5" text-anchor="middle">prompt: a story about a lost cat</text>
<rect class="a af" x="24" y="76" width="110" height="30" rx="6" stroke-width="1.5"/>
<text class="ta" x="79.0" y="94.8" font-size="11" font-weight="700" text-anchor="middle">story A</text>
<rect class="s f" x="144" y="76" width="110" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="199.0" y="94.8" font-size="11" text-anchor="middle">story B</text>
<text class="ta" x="139" y="125" font-size="10.5" font-weight="600" text-anchor="middle">A is preferred</text>
<text class="t" x="24" y="160" font-size="11.5" font-weight="700">reward model</text>
<text class="t mono" x="24" y="178" font-size="10.5">P(A over B) = sigmoid(r(A) - r(B))</text>
<text class="tm" x="24" y="194" font-size="10.5">fit r to the choices, then tune the</text>
<text class="tm" x="24" y="208" font-size="10.5">model to score high under r</text>
<text class="t" x="300" y="30" font-size="11.5" font-weight="700">DPO: no reward model</text>
<text class="t mono" x="300" y="50" font-size="10.5">loss = -log sigmoid(beta (dA - dB))</text>
<text class="t mono" x="300" y="66" font-size="10.5">dY = log pi(Y|x) - log pi_ref(Y|x)</text>
<text class="tm" x="300" y="84" font-size="10.5">raise A&#x27;s probability relative to the start,</text>
<text class="tm" x="300" y="98" font-size="10.5">lower B&#x27;s; beta keeps it near the start</text>
<line class="m" x1="308" y1="222" x2="600" y2="222" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="308" y1="222" x2="308" y2="130" stroke-width="1.5" stroke-linecap="round"/>
<path class="s" d="M308.0 215.1 L313.8 211.4 L319.7 207.9 L325.5 204.6 L331.4 201.4 L337.2 198.4 L343.0 195.5 L348.9 192.8 L354.7 190.2 L360.6 187.8 L366.4 185.5 L372.2 183.3 L378.1 181.2 L383.9 179.2 L389.8 177.3 L395.6 175.5 L401.4 173.8 L407.3 172.2 L413.1 170.7 L419.0 169.2 L424.8 167.9 L430.6 166.5 L436.5 165.3 L442.3 164.1 L448.2 163.0 L454.0 161.9 L459.8 160.9 L465.7 160.0 L471.5 159.1 L477.4 158.2 L483.2 157.4 L489.0 156.6 L494.9 155.9 L500.7 155.2 L506.6 154.5 L512.4 153.9 L518.2 153.3 L524.1 152.7 L529.9 152.2 L535.8 151.6 L541.6 151.2 L547.4 150.7 L553.3 150.3 L559.1 149.8 L565.0 149.4 L570.8 149.1 L576.6 148.7 L582.5 148.4 L588.3 148.0 L594.2 147.7 L600.0 147.4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="a" d="M308.0 215.1 L313.8 211.5 L319.7 208.3 L325.5 205.4 L331.4 202.8 L337.2 200.5 L343.0 198.5 L348.9 196.7 L354.7 195.2 L360.6 193.8 L366.4 192.6 L372.2 191.6 L378.1 190.8 L383.9 190.1 L389.8 189.5 L395.6 189.1 L401.4 188.8 L407.3 188.5 L413.1 188.4 L419.0 188.4 L424.8 188.4 L430.6 188.5 L436.5 188.6 L442.3 188.8 L448.2 189.0 L454.0 189.3 L459.8 189.7 L465.7 190.0 L471.5 190.4 L477.4 190.8 L483.2 191.3 L489.0 191.7 L494.9 192.2 L500.7 192.7 L506.6 193.2 L512.4 193.7 L518.2 194.2 L524.1 194.7 L529.9 195.2 L535.8 195.7 L541.6 196.2 L547.4 196.7 L553.3 197.2 L559.1 197.7 L565.0 198.2 L570.8 198.7 L576.6 199.2 L582.5 199.7 L588.3 200.2 L594.2 200.6 L600.0 201.1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="596" y="139.44939856746782" font-size="10" text-anchor="end">the reward model&#x27;s score</text>
<text class="ta" x="489.03999999999996" y="207.7192316879067" font-size="10" font-weight="600" text-anchor="middle">what you wanted</text>
<text class="tm" x="312" y="124" font-size="10">score</text>
<text class="tm" x="600" y="236" font-size="10" text-anchor="end">how far the model has moved from where it started</text>
<text class="tm" x="24" y="266" font-size="11">Push too far and the score keeps rising while the stories get worse: over-optimisation.</text>
<text class="tm" x="24" y="288" font-size="10.5">A schematic, no measured numbers. What the tuning cost elsewhere is measured too.</text>
</svg>
