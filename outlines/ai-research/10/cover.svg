<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Today&#x27;s architecture: four pieces of GPT-2 replaced one paper at a time, each tested against the piece it replaced</title>
<defs><marker id="r10-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r10-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="112" y="30" font-size="11.5" font-weight="700">GPT-2, 2019</text>
<text class="ta" x="300" y="30" font-size="11.5" font-weight="700">open models now</text>
<text class="t" x="24" y="58" font-size="11.5" font-weight="700">norm</text>
<text class="t" x="112" y="58" font-size="10.5">LayerNorm</text>
<text class="tm mono" x="112" y="74" font-size="10.5">(x - mean) / std * g + b</text>
<line class="a" x1="274" y1="62" x2="292" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="300" y="58" font-size="10.5" font-weight="600">RMSNorm</text>
<text class="ta mono" x="300" y="74" font-size="10.5">x / rms(x) * g</text>
<line class="m" x1="24" y1="88" x2="450" y2="88" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="106" font-size="11.5" font-weight="700">position</text>
<text class="t" x="112" y="106" font-size="10.5">learned, added once</text>
<text class="tm mono" x="112" y="122" font-size="10.5">x = tok_emb + pos_emb</text>
<line class="a" x1="274" y1="110" x2="292" y2="110" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="300" y="106" font-size="10.5" font-weight="600">rotary (RoPE)</text>
<text class="ta mono" x="300" y="122" font-size="10.5">turn q, k by m * theta</text>
<line class="m" x1="24" y1="136" x2="450" y2="136" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="154" font-size="11.5" font-weight="700">MLP</text>
<text class="t" x="112" y="154" font-size="10.5">GELU</text>
<text class="tm mono" x="112" y="170" font-size="10.5">W2 gelu(W1 x)</text>
<line class="a" x1="274" y1="158" x2="292" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="300" y="154" font-size="10.5" font-weight="600">SwiGLU</text>
<text class="ta mono" x="300" y="170" font-size="10.5">W2 (silu(W1 x) * W3 x)</text>
<line class="m" x1="24" y1="184" x2="450" y2="184" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="202" font-size="11.5" font-weight="700">attention</text>
<text class="t" x="112" y="202" font-size="10.5">each head its own k, v</text>
<text class="tm mono" x="112" y="218" font-size="10.5">12 q heads, 12 k, v</text>
<line class="a" x1="274" y1="206" x2="292" y2="206" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="300" y="202" font-size="10.5" font-weight="600">grouped-query</text>
<text class="ta mono" x="300" y="218" font-size="10.5">q heads share k, v</text>
<text class="tm" x="300" y="233" font-size="10">SmolLM2-135M: 9 q heads on 3</text>
<text class="t" x="470" y="30" font-size="11.5" font-weight="700">rotary, one pair of dims</text>
<circle class="m" cx="534" cy="118" r="52" stroke-width="1.5"/>
<line class="m" x1="476" y1="118" x2="592" y2="118" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="534" y1="60" x2="534" y2="176" stroke-width="1.5" stroke-linecap="round"/>
<line class="a" x1="534" y1="118" x2="582.0" y2="118.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta mono" x="597.0" y="122.0" font-size="10.5" font-weight="600" text-anchor="middle">0</text>
<line class="s" x1="534" y1="118" x2="576.4" y2="95.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-ah)"/>
<text class="tm mono" x="589.6" y="92.4" font-size="10.5" font-weight="600" text-anchor="middle">1</text>
<line class="s" x1="534" y1="118" x2="560.8" y2="78.2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-ah)"/>
<text class="tm mono" x="569.2" y="69.8" font-size="10.5" font-weight="600" text-anchor="middle">2</text>
<line class="a" x1="534" y1="118" x2="539.0" y2="70.3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta mono" x="540.6" y="59.3" font-size="10.5" font-weight="600" text-anchor="middle">3</text>
<path class="s" d="M556 118 A 22 22 0 0 0 553.4 107.7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm mono" x="548" y="134" font-size="9.5">theta</text>
<text class="tm" x="470" y="196" font-size="10">the same q at positions 0 to 3:</text>
<text class="tm" x="470" y="210" font-size="10">position m turns it by m * theta,</text>
<text class="tm" x="470" y="224" font-size="10">so q . k depends only on how far</text>
<text class="tm" x="470" y="238" font-size="10">apart q&#x27;s and k&#x27;s positions are</text>
<text class="tm" x="24" y="270" font-size="11">Each change goes in alone, same parameter count, several seeds; then a current open model&#x27;s</text>
<text class="tm" x="24" y="286" font-size="11">weights load into the result and give the reference&#x27;s logits.</text>
</svg>
