<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Today&#x27;s architecture: four pieces of GPT-2 replaced one paper at a time, each measured against the piece it replaced, then all four in one table; a model of 2025 loads into the result</title>
<defs><marker id="r10-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r10-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="100" y="30" font-size="11.5" font-weight="700">GPT-2, 2019</text>
<text class="ta" x="258" y="30" font-size="11.5" font-weight="700">open models now</text>
<text class="tm" x="462" y="20" font-size="10" text-anchor="end">the long run:</text>
<text class="tm" x="462" y="32" font-size="10" text-anchor="end">less the base</text>
<text class="t" x="24" y="58" font-size="11.5" font-weight="700">norm</text>
<text class="t" x="100" y="58" font-size="10.5">LayerNorm</text>
<text class="tm mono" x="100" y="74" font-size="9.5">(x - mean) / std * g + b</text>
<line class="a" x1="236" y1="62" x2="252" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="258" y="58" font-size="10.5" font-weight="600">RMSNorm</text>
<text class="ta mono" x="258" y="74" font-size="9.5">x / rms(x) * g</text>
<text class="tm mono" x="462" y="58" font-size="11" text-anchor="end">+0.013</text>
<text class="tm" x="462" y="74" font-size="9.5" text-anchor="end">in the noise</text>
<line class="m" x1="24" y1="86" x2="462" y2="86" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="104" font-size="11.5" font-weight="700">position</text>
<text class="t" x="100" y="104" font-size="10.5">learned, added</text>
<text class="tm mono" x="100" y="120" font-size="9.5">x = tok_emb + pos_emb</text>
<line class="a" x1="236" y1="108" x2="252" y2="108" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="258" y="104" font-size="10.5" font-weight="600">rotary</text>
<text class="ta mono" x="258" y="120" font-size="9.5">turn q, k: m theta_i</text>
<text class="ta mono" x="462" y="104" font-size="11" font-weight="700" text-anchor="end">-0.060</text>
<text class="ta" x="462" y="120" font-size="9.5" text-anchor="end">beyond noise</text>
<line class="m" x1="24" y1="132" x2="462" y2="132" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="150" font-size="11.5" font-weight="700">MLP</text>
<text class="t" x="100" y="150" font-size="10.5">GELU</text>
<text class="tm mono" x="100" y="166" font-size="9.5">W2 gelu(W1 x)</text>
<line class="a" x1="236" y1="154" x2="252" y2="154" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="258" y="150" font-size="10.5" font-weight="600">SwiGLU</text>
<text class="ta mono" x="258" y="166" font-size="9.5">W2 (silu(W1 x) * W3 x)</text>
<text class="ta mono" x="462" y="150" font-size="11" font-weight="700" text-anchor="end">-0.067</text>
<text class="ta" x="462" y="166" font-size="9.5" text-anchor="end">beyond noise</text>
<line class="m" x1="24" y1="178" x2="462" y2="178" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="196" font-size="11.5" font-weight="700">attention</text>
<text class="t" x="100" y="196" font-size="10.5">each head its k, v</text>
<text class="tm mono" x="100" y="212" font-size="9.5">12 q heads, 12 k, v</text>
<line class="a" x1="236" y1="200" x2="252" y2="200" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta" x="258" y="196" font-size="10.5" font-weight="600">grouped-query</text>
<text class="ta mono" x="258" y="212" font-size="9.5">q heads share k, v</text>
<text class="tm mono" x="462" y="196" font-size="11" text-anchor="end">+0.009</text>
<text class="tm" x="462" y="212" font-size="9.5" text-anchor="end">in the noise</text>
<text class="ta" x="24" y="238" font-size="10.5" font-weight="600">all four together: -0.089 bits, the lowest row, with 10% fewer weights</text>
<text class="t" x="488" y="30" font-size="11.5" font-weight="700">rotary, one pair</text>
<circle class="m" cx="564" cy="104" r="46" stroke-width="1.5"/>
<line class="m" x1="512" y1="104" x2="616" y2="104" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="564" y1="52" x2="564" y2="156" stroke-width="1.5" stroke-linecap="round"/>
<line class="a" x1="564" y1="104" x2="606.0" y2="104.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta mono" x="621.0" y="108.0" font-size="10.5" font-weight="600" text-anchor="middle">0</text>
<line class="s" x1="564" y1="104" x2="601.1" y2="84.3" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-ah)"/>
<text class="tm mono" x="614.3" y="81.2" font-size="10.5" font-weight="600" text-anchor="middle">1</text>
<line class="s" x1="564" y1="104" x2="587.5" y2="69.2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-ah)"/>
<text class="tm mono" x="595.9" y="60.7" font-size="10.5" font-weight="600" text-anchor="middle">2</text>
<line class="a" x1="564" y1="104" x2="568.4" y2="62.2" stroke-width="1.5" stroke-linecap="round" marker-end="url(#r10-aa)"/>
<text class="ta mono" x="570.0" y="51.3" font-size="10.5" font-weight="600" text-anchor="middle">3</text>
<path class="s" d="M586 104 A 22 22 0 0 0 583.4 93.7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm mono" x="578" y="120" font-size="9.5">theta</text>
<text class="tm" x="488" y="176" font-size="10">a query at places 0 to 3:</text>
<text class="tm" x="488" y="190" font-size="10">place m turns it by m theta,</text>
<text class="tm" x="488" y="204" font-size="10">so q . k depends only on</text>
<text class="tm" x="488" y="218" font-size="10">how far apart q and k are</text>
<text class="tm" x="24" y="258" font-size="10.5">The recorded ablation: width 128, 2000 steps, 3 seeds a row; the base 2.337 bits per character, all four 2.248.</text>
<text class="tm" x="24" y="274" font-size="10.5">SmolLM2-135M, 9 query heads on 3, in your GPT: the reference&#x27;s logits exactly, and 1.405 bits per character</text>
<text class="tm" x="24" y="290" font-size="10.5">on Shakespeare&#x27;s test text, where GPT-2 small scores 1.851.</text>
</svg>
