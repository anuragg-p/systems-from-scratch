<text class="ta" x="554" y="130" font-size="10.5" font-weight="600" text-anchor="middle">each position alone</text>
<text class="ta" x="460" y="182" font-size="10.5" text-anchor="middle">residual stream: one vector per position</text>
<text class="t mono" x="300" y="214" font-size="10.5">attn(x) = softmax(q k.T / sqrt(d_head) + mask) v</text>
<text class="tm" x="300" y="230" font-size="10.5">mask: -inf above the diagonal, 0 elsewhere</text>
<text class="tm" x="24" y="288" font-size="11">x = x + attn(ln(x)), then x = x + mlp(ln(x)), once per block; the GPT is a stack of these.</text>
</svg>
