<text class="t" x="554" y="89" font-size="12" font-weight="700" text-anchor="middle">MLP</text>
<text class="tm" x="554" y="104" font-size="10" text-anchor="middle">4x wider</text>
<path class="s" d="M596 92 H 606 V 150" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#r08-ah)"/>
