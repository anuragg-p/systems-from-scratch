<text class="t" x="384.0" y="188" font-size="12" font-weight="700" text-anchor="middle">paper</text>
<rect class="s fs" x="436" y="30" width="180" height="140" rx="6" stroke-width="1.5"/>
<text class="t mono" x="446" y="50" font-size="10" font-weight="600">repo/</text>
<text class="tm mono" x="460" y="67" font-size="10">engine/  lab/  data/</text>
<text class="tm mono" x="460" y="84" font-size="10">experiments/&lt;name&gt;.py</text>
<text class="tm mono" x="460" y="101" font-size="10">runs/&lt;name&gt;/seed0/</text>
<text class="ta mono" x="474" y="118" font-size="10">config.json</text>
<text class="ta mono" x="474" y="135" font-size="10">log.jsonl</text>
<text class="ta mono" x="474" y="152" font-size="10">summary.json</text>
<text class="t" x="526.0" y="188" font-size="12" font-weight="700" text-anchor="middle">code, and every run</text>
<text class="t mono" x="346" y="216" font-size="10.5" font-weight="600">$ python3 -m experiments.&lt;name&gt; key=value</text>
<text class="tm" x="346" y="232" font-size="10.5">reruns it; each run&#x27;s config.json records every</text>
<text class="tm" x="346" y="247" font-size="10.5">setting it used and its seed</text>
<text class="tm" x="24" y="284" font-size="11">Small, finished and public beats big and half done.</text>
