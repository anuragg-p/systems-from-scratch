<title>A result that holds up survives four attacks: a baseline tuned as hard, the spread over seeds, a cheat the evaluation must catch, and a prediction made before the run</title>
<defs><marker id="r13-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r13-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="196" font-size="12" font-weight="700">a fair baseline</text>
<text class="tm" x="24" y="213" font-size="10.5">tune the baseline&#x27;s</text>
<text class="tm" x="24" y="227" font-size="10.5">learning rate as hard</text>
<text class="tm" x="24" y="241" font-size="10.5">as your own method&#x27;s</text>
<text class="t" x="178" y="196" font-size="12" font-weight="700">error bars</text>
<text class="tm" x="178" y="213" font-size="10.5">is the gap bigger</text>
<text class="tm" x="178" y="227" font-size="10.5">than the spread</text>
<text class="tm" x="178" y="241" font-size="10.5">between seeds?</text>
<text class="t" x="332" y="196" font-size="12" font-weight="700">an evaluation</text>
<text class="tm" x="332" y="213" font-size="10.5">a cheat that should</text>
<text class="tm" x="332" y="227" font-size="10.5">fail, such as the most</text>
<text class="tm" x="332" y="241" font-size="10.5">common answer, must</text>
<text class="t" x="486" y="196" font-size="12" font-weight="700">predict, then run</text>
<text class="tm" x="486" y="213" font-size="10.5">fit loss against size</text>
<text class="tm" x="486" y="227" font-size="10.5">on small models, then</text>
<text class="tm" x="486" y="241" font-size="10.5">train a bigger one</text>
<text class="tm" x="332" y="255" font-size="10.5">score near chance</text>
