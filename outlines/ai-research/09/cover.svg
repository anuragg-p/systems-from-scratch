<text class="t" x="510.0" y="193.7" font-size="10.5" font-weight="600" text-anchor="middle">the next token</text>
<text class="tm" x="404" y="234" font-size="10">* but for a letter newer than your Python&#x27;s</text>
<text class="tm" x="404" y="247" font-size="10">Unicode tables, followed by &#x27;s</text>
<text class="tm" x="24" y="258" font-size="10.5">GPT-2: 256 bytes + 50,000 merges + &lt;|endoftext|&gt; = 50,257 ids; GPT-2 small, 124,439,808 weights, from its published file.</text>
<text class="tm" x="24" y="274" font-size="10.5">TinyStories: a GPT of 4,273,664 weights, 45 minutes of a laptop&#x27;s CPU, 2 seeds: 0.7367 bits per byte on held-out</text>
<text class="tm" x="24" y="290" font-size="10.5">stories. Its stories end on their own (16 of 16), in paragraphs, and share less with the training text than real unseen stories do.</text>
