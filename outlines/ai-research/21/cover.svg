<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Four phenomena to reproduce: a lottery ticket, distillation, the edge of stability, and a low path between two trained networks</title>
<defs><marker id="r21-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r21-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="196" font-size="12" font-weight="700">a lottery ticket</text>
<text class="tm" x="24" y="213" font-size="10.5">keep the largest 10%,</text>
<text class="tm" x="24" y="227" font-size="10.5">reset them to their first</text>
<text class="tm" x="24" y="241" font-size="10.5">values: it trains as well</text>
<text class="t" x="178" y="196" font-size="12" font-weight="700">distillation</text>
<text class="tm" x="178" y="213" font-size="10.5">the student learns the</text>
<text class="tm" x="178" y="227" font-size="10.5">teacher&#x27;s whole answer,</text>
<text class="tm" x="178" y="241" font-size="10.5">softened by a temperature</text>
<text class="t" x="332" y="196" font-size="12" font-weight="700">edge of stability</text>
<text class="tm" x="332" y="213" font-size="10.5">full-batch descent:</text>
<text class="tm" x="332" y="227" font-size="10.5">sharpness rises to</text>
<text class="tm" x="332" y="241" font-size="10.5">2 / lr, then stays there</text>
<text class="t" x="486" y="196" font-size="12" font-weight="700">a path between</text>
<text class="tm" x="486" y="213" font-size="10.5">two trained networks:</text>
<text class="tm" x="486" y="227" font-size="10.5">the straight line climbs</text>
<text class="tm" x="486" y="241" font-size="10.5">a hill, a curve stays low</text>
