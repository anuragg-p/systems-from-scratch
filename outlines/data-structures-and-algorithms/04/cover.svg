<rect class="s fs" x="456" y="184" width="76" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="494.0" y="201.2" font-size="12" font-weight="600" text-anchor="middle">{7}</text>
<line class="s" x1="494" y1="210" x2="494" y2="224" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d04-ah)"/>
<text class="tm mono" x="504" y="222" font-size="11.5" font-weight="600">b</text>
<rect class="a af" x="456" y="226" width="76" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="494.0" y="243.2" font-size="12" font-weight="600" text-anchor="middle">{8}</text>
<text class="tm" x="542" y="159" font-size="10.5">each set is</text>
<text class="tm" x="542" y="174" font-size="10.5">one DFA state,</text>
<text class="tm" x="542" y="189" font-size="10.5">cached</text>
<text class="tm" x="24" y="270" font-size="11">No backtracking: one pass over the input, so no pattern can make it hang.</text>
<text class="tm" x="24" y="287" font-size="11">Double ring: an accepting state.</text>
</svg>
