<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>A hash table: a word&#x27;s hash picks its slot; when the slot is taken, try the next one</title>
<defs><marker id="d01-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d01-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="30" font-size="10.5">input</text>
<text class="t mono" x="24" y="50" font-size="12.5" font-weight="600">the cat sat on the mat</text>
<text class="t" x="24" y="90" font-size="12" font-weight="700">insert &#x27;sat&#x27;</text>
<text class="t mono" x="24" y="110" font-size="11">fnv1a(&quot;sat&quot;) = 0xd61c92d7</text>
<text class="ta mono" x="24" y="128" font-size="11" font-weight="600">0xd61c92d7 % 8 = 7</text>
<text class="tm" x="24" y="152" font-size="10.5">slot 7 already holds &#x27;cat&#x27;: a collision,</text>
<text class="tm" x="24" y="168" font-size="10.5">so try the next slot; after 7 it wraps to 0</text>
<text class="t" x="24" y="204" font-size="12" font-weight="700">look up &#x27;the&#x27;</text>
<text class="t mono" x="24" y="224" font-size="11">fnv1a(&quot;the&quot;) % 8 = 4: found, n = 2</text>
<text class="tm" x="454" y="30" font-size="10">word</text>
<text class="tm" x="536" y="30" font-size="10" text-anchor="middle">n</text>
<text class="tm" x="590" y="30" font-size="10" text-anchor="end">hash % 8</text>
<rect class="a af" x="424" y="40" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="57" font-size="10.5" text-anchor="end">0</text>
<text class="ta mono" x="454" y="57" font-size="12" font-weight="600">sat</text>
<text class="ta mono" x="536" y="57" font-size="12" text-anchor="middle">1</text>
<text class="ta mono" x="590" y="57" font-size="11" text-anchor="end">7</text>
<rect class="s f" x="424" y="66" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="83" font-size="10.5" text-anchor="end">1</text>
<text class="t mono" x="454" y="83" font-size="12">on</text>
<text class="t mono" x="536" y="83" font-size="12" text-anchor="middle">1</text>
<text class="tm mono" x="590" y="83" font-size="11" text-anchor="end">0</text>
<rect class="m f" x="424" y="92" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="109" font-size="10.5" text-anchor="end">2</text>
<rect class="m f" x="424" y="118" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="135" font-size="10.5" text-anchor="end">3</text>
<rect class="s f" x="424" y="144" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="161" font-size="10.5" text-anchor="end">4</text>
<text class="t mono" x="454" y="161" font-size="12">the</text>
<text class="t mono" x="536" y="161" font-size="12" text-anchor="middle">2</text>
<text class="tm mono" x="590" y="161" font-size="11" text-anchor="end">4</text>
<rect class="s f" x="424" y="170" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="187" font-size="10.5" text-anchor="end">5</text>
<text class="t mono" x="454" y="187" font-size="12">mat</text>
<text class="t mono" x="536" y="187" font-size="12" text-anchor="middle">1</text>
<text class="tm mono" x="590" y="187" font-size="11" text-anchor="end">5</text>
<rect class="m f" x="424" y="196" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="213" font-size="10.5" text-anchor="end">6</text>
<rect class="s f" x="424" y="222" width="176" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="416" y="239" font-size="10.5" text-anchor="end">7</text>
<text class="t mono" x="454" y="239" font-size="12">cat</text>
<text class="t mono" x="536" y="239" font-size="12" text-anchor="middle">1</text>
<text class="tm mono" x="590" y="239" font-size="11" text-anchor="end">7</text>
<path class="a" d="M150.8 124 H 384 C 404 124, 400 235.0, 402 235.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d01-aa)"/>
<path class="a" d="M600 235.0 C 630 235.0, 630 53.0, 602 53.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d01-aa)"/>
<text class="tm" x="24" y="282" font-size="11">5 of 8 slots in use. Past 3/4 full, grow to 16 slots and insert every word again.</text>
</svg>
