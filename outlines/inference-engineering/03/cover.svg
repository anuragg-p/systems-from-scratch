<text class="tm" x="24" y="218" font-size="11">scale</text>
<text class="t mono" x="70" y="218" font-size="11">s = max|w| / 127 = 0.01</text>
<text class="tm" x="24" y="238" font-size="11">store</text>
<text class="t mono" x="70" y="238" font-size="11">q = round(w / s) = 42</text>
