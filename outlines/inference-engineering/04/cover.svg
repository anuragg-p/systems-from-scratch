<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Continuous batching: requests leave the batch when they finish and waiting ones join at the next step</title>
<defs><marker id="i04-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="i04-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="59" font-size="11">slot 1</text>
<rect class="s f" x="114" y="40" width="201" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="124" y="58" font-size="11">R1</text>
<circle class="s" cx="305" cy="54" r="3" stroke-width="1.5"/>
<rect class="s fs" x="319" y="40" width="283" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="329" y="58" font-size="11">R6</text>
<text class="tm mono" x="24" y="97" font-size="11">slot 2</text>
<rect class="s f" x="114" y="78" width="324" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="124" y="96" font-size="11">R2</text>
<circle class="s" cx="428" cy="92" r="3" stroke-width="1.5"/>
<rect class="s fs" x="442" y="78" width="160" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="452" y="96" font-size="11">R8</text>
<text class="tm mono" x="24" y="135" font-size="11">slot 3</text>
<rect class="s f" x="114" y="116" width="119" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="124" y="134" font-size="11">R3</text>
<circle class="s" cx="223" cy="130" r="3" stroke-width="1.5"/>
<rect class="a af" x="237" y="116" width="324" height="28" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="247" y="134" font-size="11" font-weight="600">R5</text>
<circle class="s" cx="551" cy="130" r="3" stroke-width="1.5"/>
<rect class="s fs" x="565" y="116" width="37" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="575" y="134" font-size="11">R9</text>
<text class="tm mono" x="24" y="173" font-size="11">slot 4</text>
<rect class="s f" x="114" y="154" width="283" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="124" y="172" font-size="11">R4</text>
<circle class="s" cx="387" cy="168" r="3" stroke-width="1.5"/>
<rect class="s fs" x="401" y="154" width="201" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="411" y="172" font-size="11">R7</text>
<line class="a" x1="235" y1="30" x2="235" y2="196" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm mono" x="132.5" y="212" font-size="10.5" text-anchor="middle">1</text>
<text class="tm mono" x="173.5" y="212" font-size="10.5" text-anchor="middle">2</text>
<text class="tm mono" x="214.5" y="212" font-size="10.5" text-anchor="middle">3</text>
<text class="tm mono" x="255.5" y="212" font-size="10.5" text-anchor="middle">4</text>
<text class="tm mono" x="296.5" y="212" font-size="10.5" text-anchor="middle">5</text>
<text class="tm mono" x="337.5" y="212" font-size="10.5" text-anchor="middle">6</text>
<text class="tm mono" x="378.5" y="212" font-size="10.5" text-anchor="middle">7</text>
<text class="tm mono" x="419.5" y="212" font-size="10.5" text-anchor="middle">8</text>
<text class="tm mono" x="460.5" y="212" font-size="10.5" text-anchor="middle">9</text>
<text class="tm mono" x="501.5" y="212" font-size="10.5" text-anchor="middle">10</text>
<text class="tm mono" x="542.5" y="212" font-size="10.5" text-anchor="middle">11</text>
<text class="tm mono" x="583.5" y="212" font-size="10.5" text-anchor="middle">12</text>
<text class="tm" x="112" y="232" font-size="11">decode step: one forward pass over every running request</text>
<text class="ta" x="243" y="26" font-size="11" font-weight="600">step 4: R3 is done, R5 joins</text>
<circle class="s" cx="28" cy="254" r="3" stroke-width="1.5"/>
<text class="tm" x="36" y="258" font-size="11">request finished (stop token)</text>
<text class="tm" x="24" y="282" font-size="11">No slot waits for the longest request in the batch, and no new request waits for a whole batch.</text>
</svg>
