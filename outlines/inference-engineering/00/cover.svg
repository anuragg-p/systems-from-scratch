<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>One generation, and the three numbers the benchmark harness measures</title>
<defs><marker id="i00-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="i00-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="30" font-size="11">prompt</text>
<rect class="s f" x="24" y="38" width="120" height="40" rx="8" stroke-width="1.5"/>
<text class="t mono" x="84" y="63" font-size="12" text-anchor="middle">&quot;The cat sat&quot;</text>
<line class="s" x1="144" y1="58" x2="178" y2="58" stroke-width="1.5" stroke-linecap="round" marker-end="url(#i00-ah)"/>
<text class="tm" x="180" y="30" font-size="11">token ids</text>
<rect class="s f" x="180" y="38" width="148" height="40" rx="8" stroke-width="1.5"/>
<text class="t mono" x="254" y="63" font-size="12" text-anchor="middle">[464, 3797, 3332]</text>
<line class="s" x1="328" y1="58" x2="362" y2="58" stroke-width="1.5" stroke-linecap="round" marker-end="url(#i00-ah)"/>
<text class="tm" x="364" y="30" font-size="11">model</text>
<rect class="s fs" x="364" y="38" width="120" height="40" rx="8" stroke-width="1.5"/>
<text class="t" x="424" y="56" font-size="12.5" font-weight="700" text-anchor="middle">GPT-2</text>
<text class="tm" x="424" y="71" font-size="10" text-anchor="middle">124M parameters</text>
<line class="s" x1="484" y1="58" x2="518" y2="58" stroke-width="1.5" stroke-linecap="round" marker-end="url(#i00-ah)"/>
<text class="tm" x="520" y="30" font-size="11">next token</text>
<rect class="s f" x="520" y="38" width="96" height="40" rx="8" stroke-width="1.5"/>
<text class="t mono" x="568" y="63" font-size="12" text-anchor="middle">&quot; on&quot;  319</text>
<path class="m" d="M568 78 V 96 H 254 V 82" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#i00-ah)" stroke-dasharray="4 4"/>
<text class="tm" x="411" y="110" font-size="10.5" text-anchor="middle">append it, run again, until the stop token</text>
<text class="tm" x="24" y="146" font-size="11">one request, measured</text>
<rect class="s fs" x="40" y="158" width="152" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="116" y="177" font-size="11" text-anchor="middle">prefill: whole prompt</text>
<rect class="s f" x="196" y="158" width="58" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="225" y="177" font-size="11" text-anchor="middle">&quot; on&quot;</text>
<rect class="s f" x="258" y="158" width="58" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="287" y="177" font-size="11" text-anchor="middle">&quot; the&quot;</text>
<rect class="s f" x="320" y="158" width="58" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="349" y="177" font-size="11" text-anchor="middle">&quot; mat&quot;</text>
<rect class="s f" x="382" y="158" width="58" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="411" y="177" font-size="11" text-anchor="middle">&quot;.&quot;</text>
<text class="tm" x="450" y="177" font-size="12">...</text>
<line class="m" x1="24" y1="208" x2="616" y2="208" stroke-width="1.5" stroke-linecap="round" marker-end="url(#i00-ah)"/>
<text class="tm" x="616" y="224" font-size="10.5" text-anchor="end">time</text>
<line class="m" x1="40" y1="203" x2="40" y2="213" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="192" y1="203" x2="192" y2="213" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="254" y1="203" x2="254" y2="213" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="316" y1="203" x2="316" y2="213" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="378" y1="203" x2="378" y2="213" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="440" y1="203" x2="440" y2="213" stroke-width="1.5" stroke-linecap="round"/>
<path class="a" d="M40 230 V 236 H 192 V 230" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta mono" x="116" y="254" font-size="11.5" font-weight="600" text-anchor="middle">TTFT</text>
<text class="tm" x="116" y="270" font-size="10.5" text-anchor="middle">time to first token</text>
<path class="s" d="M196 230 V 236 H 254 V 230" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t mono" x="225" y="254" font-size="11.5" font-weight="600" text-anchor="middle">TPOT</text>
<text class="tm" x="225" y="270" font-size="10.5" text-anchor="middle">time per output token</text>
<text class="t mono" x="536" y="254" font-size="11.5" font-weight="600" text-anchor="middle">tokens/s</text>
<text class="tm" x="536" y="270" font-size="10.5" text-anchor="middle">tokens out / total time</text>
</svg>
