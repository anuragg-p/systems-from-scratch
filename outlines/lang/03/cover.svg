<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>One name, two answers: static scope and dynamic scope</title>
<defs><marker id="l03-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l03-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l03-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="24" y="102" width="238" height="98" rx="8" stroke-width="1.5"/>
<text class="t mono" x="36" y="124" font-size="11.5">var x = 1</text>
<text class="t mono" x="36" y="146" font-size="11.5">fn show() { write x }</text>
<text class="t mono" x="36" y="168" font-size="11.5">fn test() { var x = 2; show() }</text>
<text class="t mono" x="36" y="190" font-size="11.5">test()</text>
<rect class="s f" x="284" y="22" width="332" height="120" rx="10" stroke-width="1.5"/>
<text class="t" x="298" y="43" font-size="12.5" font-weight="700">static scope</text>
