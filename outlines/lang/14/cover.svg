<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>A pattern, a table and two lines: what a scripting language is for</title>
<defs><marker id="l14-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l14-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l14-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="24" y="100" width="341" height="60" rx="8" stroke-width="1.5"/>
<rect class="af" x="172" y="136" width="38.5" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="36" y="124" font-size="11.5">for line in lines(&quot;log.txt&quot;)</text>
<text class="t mono" x="36" y="148" font-size="11.5"><tspan x="49.8">if line ~ /error:</tspan><tspan x="174" class="ta">(\w+)</tspan><tspan x="208.5">/ then count[$1] += 1</tspan></text>
<text class="tm mono" x="381" y="86" font-size="11">log.txt</text>
<rect class="s f" x="381" y="94" width="134" height="70" rx="8" stroke-width="1.5"/>
<text class="t mono" x="393" y="116" font-size="11.5">error: disk full</text>
<text class="t mono" x="393" y="135" font-size="11.5">ok: saved</text>
<text class="t mono" x="393" y="154" font-size="11.5">error: disk slow</text>
<rect class="s fs" x="535" y="94" width="76" height="26" rx="0" stroke-width="1.5"/>
<text class="t mono" x="573" y="112" font-size="12" font-weight="700" text-anchor="middle">count</text>
<rect class="s f" x="535" y="120" width="44" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="557" y="139.2" font-size="12" font-weight="600" text-anchor="middle">disk</text>
<rect class="s f" x="579" y="120" width="32" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="595" y="139.2" font-size="12" text-anchor="middle">2</text>
<path class="a" d="M191.25 155 V196 H557 V153" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#l14-aa)"/>
</svg>
