<text class="t mono" x="106" y="186.2" font-size="12" font-weight="600" text-anchor="middle">c</text>
<line class="s" x1="52.61" y1="123" x2="45.39" y2="133" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="71.39" y1="123" x2="78.61" y2="133" stroke-width="1.5" stroke-linecap="round"/>
