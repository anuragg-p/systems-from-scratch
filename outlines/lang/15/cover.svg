<rect class="s fs" x="144" y="118" width="106" height="52" rx="6" stroke-width="1.5"/>
<text class="t mono" x="154" y="139" font-size="11">t1 := b * c</text>
<text class="t mono" x="154" y="157" font-size="11">t2 := a + t1</text>
<text class="t" x="197" y="88" font-size="11.5" font-weight="700" text-anchor="middle">three-address code</text>
