<text class="t mono" x="284" y="139" font-size="11">mul t1, a1, a2</text>
<text class="t mono" x="284" y="157" font-size="11">add t0, a0, t1</text>
<text class="t" x="333" y="88" font-size="11.5" font-weight="700" text-anchor="middle">assembly</text>
