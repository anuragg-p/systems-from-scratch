<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Value numbering: the same work, done once</title>
<defs><marker id="l17-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l17-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l17-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="52" y="96" font-size="12.5" font-weight="700">before</text>
<rect class="s fs" x="52" y="108" width="112" height="82" rx="8" stroke-width="1.5"/>
<text class="t mono" x="64" y="132" font-size="12">t1 := a + b</text>
<text class="t mono" x="64" y="156" font-size="12">t2 := a + b</text>
<text class="t mono" x="64" y="180" font-size="12">c := t1 * t2</text>
<line class="m" x1="168" y1="149" x2="198" y2="149" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l17-am)"/>
<text class="t" x="202" y="96" font-size="12.5" font-weight="700">value numbers</text>
<rect class="s f" x="202" y="108" width="196" height="124" rx="8" stroke-width="1.5"/>
<text class="t mono" x="216" y="132" font-size="12">a -&gt; 1</text>
<text class="t mono" x="216" y="156" font-size="12">b -&gt; 2</text>
<text class="t mono" x="216" y="180" font-size="12">1 + 2 -&gt; 3</text>
<line class="m" x1="212" y1="190" x2="388" y2="190" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="216" y="208" font-size="11">t1 is value 3</text>
<text class="tm" x="216" y="224" font-size="11">t2 is value 3 too</text>
<line class="m" x1="402" y1="149" x2="432" y2="149" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l17-am)"/>
<text class="t" x="436" y="96" font-size="12.5" font-weight="700">after</text>
<rect class="s fs" x="436" y="108" width="112" height="82" rx="8" stroke-width="1.5"/>
<text class="t mono" x="448" y="132" font-size="12">t1 := a + b</text>
<rect class="m" x="442" y="140" width="100" height="20" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="448" y="156" font-size="12">t2 := a + b</text>
<rect class="af" x="518" y="168" width="18.4" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="448" y="180" font-size="12"><tspan x="448">c := t1 *</tspan><tspan x="520" class="ta">t1</tspan></text>
</svg>
