<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>A case statement as a jump table: one index, not three tests</title>
<defs><marker id="l06-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l06-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="l06-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="116" font-size="12">case n of</text>
<text class="t mono" x="24" y="138" font-size="12"><tspan x="38.4">1: a()</tspan></text>
<text class="t mono" x="24" y="160" font-size="12"><tspan x="38.4">2: b()</tspan></text>
<text class="t mono" x="24" y="182" font-size="12"><tspan x="38.4">3: c()</tspan></text>
<text class="tm" x="205" y="66" font-size="11.5" text-anchor="middle">three tests</text>
<rect class="m f" x="160" y="80" width="90" height="28" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="205" y="98.2" font-size="12" text-anchor="middle">n = 1 ?</text>
<rect class="m f" x="160" y="136" width="90" height="28" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="205" y="154.2" font-size="12" text-anchor="middle">n = 2 ?</text>
<rect class="m f" x="160" y="192" width="90" height="28" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="205" y="210.2" font-size="12" text-anchor="middle">n = 3 ?</text>
<line class="m" x1="205" y1="110" x2="205" y2="133" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l06-am)"/>
<line class="m" x1="205" y1="166" x2="205" y2="189" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l06-am)"/>
<rect class="s f" x="446" y="104" width="50" height="30" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="471" y="123.2" font-size="12" text-anchor="middle">1</text>
<line class="s" x1="498" y1="119" x2="532" y2="119" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l06-ah)"/>
<rect class="s fs" x="534" y="107" width="74" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="571" y="123.2" font-size="12" text-anchor="middle">L1: a()</text>
<rect class="a af" x="446" y="134" width="50" height="30" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="471" y="153.2" font-size="12" text-anchor="middle">2</text>
<line class="a" x1="498" y1="149" x2="532" y2="149" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l06-aa)"/>
<rect class="a af" x="534" y="137" width="74" height="24" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="571" y="153.2" font-size="12" font-weight="700" text-anchor="middle">L2: b()</text>
<rect class="s f" x="446" y="164" width="50" height="30" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="471" y="183.2" font-size="12" text-anchor="middle">3</text>
<line class="s" x1="498" y1="179" x2="532" y2="179" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l06-ah)"/>
<rect class="s fs" x="534" y="167" width="74" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="571" y="183.2" font-size="12" text-anchor="middle">L3: c()</text>
<line class="a" x1="296" y1="149" x2="443" y2="149" stroke-width="1.5" stroke-linecap="round" marker-end="url(#l06-aa)"/>
<text class="ta mono" x="370" y="139" font-size="12.5" font-weight="700" text-anchor="middle">n = 2</text>
<text class="ta" x="370" y="171" font-size="12" font-weight="600" text-anchor="middle">one index</text>
