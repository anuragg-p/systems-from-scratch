<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Tokens in, tokens out: the parser never sees a #</title>
<defs><marker id="c08-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c08-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c08-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="24" y="70" width="192" height="74" rx="8" stroke-width="1.5"/>
<rect class="af" x="85.8" y="120" width="65.4" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="36" y="92" font-size="11">#define SQ(x) ((x) * (x))</text>
<text class="t mono" x="36" y="112" font-size="11">#include &quot;defs.h&quot;</text>
<text class="t mono" x="36" y="132" font-size="11" font-weight="600"><tspan x="36.0">int n =</tspan><tspan x="88.8" class="ta">SQ(a + 1)</tspan><tspan x="148.2">;</tspan></text>
<rect class="s f" x="120" y="182" width="96" height="52" rx="8" stroke-width="1.5"/>
<text class="t mono" x="132" y="200" font-size="11" font-weight="700">defs.h</text>
<text class="t mono" x="132" y="220" font-size="11">int a;</text>
<path class="s" d="M190 180 V108 H156.2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c08-ah)"/>
<line class="s" x1="218" y1="107" x2="244" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c08-ah)"/>
<rect class="s f" x="246" y="87" width="100" height="40" rx="8" stroke-width="1.5"/>
<text class="t" x="296" y="111" font-size="12" font-weight="700" text-anchor="middle">preprocessor</text>
<line class="s" x1="348" y1="107" x2="374" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c08-ah)"/>
<rect class="s fs" x="376" y="80" width="240" height="54" rx="8" stroke-width="1.5"/>
<rect class="af" x="439.8" y="110" width="131.4" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="390" y="102" font-size="11">int a;</text>
<text class="t mono" x="390" y="122" font-size="11" font-weight="600"><tspan x="390.0">int n =</tspan><tspan x="442.8" class="ta">((a + 1) * (a + 1))</tspan><tspan x="568.2">;</tspan></text>
<text class="tm" x="296" y="252" font-size="11" text-anchor="middle">a second, smaller language</text>
<text class="tm" x="296" y="267" font-size="11" text-anchor="middle">that runs before the parser</text>
</svg>
