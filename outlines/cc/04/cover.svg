<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>The RISC-V stack frame, and the registers a call uses</title>
<defs><marker id="c04-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c04-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c04-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="76" font-size="11.5" font-weight="600">a0 - a7</text>
<text class="tm" x="96" y="76" font-size="11">arguments 1 to 8</text>
<text class="t mono" x="24" y="102" font-size="11.5" font-weight="600">a0</text>
<text class="tm" x="96" y="102" font-size="11">the return value</text>
<text class="t mono" x="24" y="128" font-size="11.5" font-weight="600">ra</text>
<text class="tm" x="96" y="128" font-size="11">return address</text>
<text class="t mono" x="24" y="154" font-size="11.5" font-weight="600">sp</text>
<text class="tm" x="96" y="154" font-size="11">stack pointer</text>
<text class="t mono" x="24" y="180" font-size="11.5" font-weight="600">s0</text>
<text class="tm" x="96" y="180" font-size="11">frame pointer</text>
<text class="t mono" x="24" y="206" font-size="11.5" font-weight="600">s0 - s11</text>
<text class="tm" x="96" y="206" font-size="11">the callee saves</text>
<text class="t mono" x="24" y="232" font-size="11.5" font-weight="600">t0 - t6</text>
<text class="tm" x="96" y="232" font-size="11">the caller saves</text>
<rect class="m f" x="300" y="40" width="184" height="44" rx="0" stroke-width="1.5"/>
<text class="tm" x="392.0" y="66.0" font-size="11" text-anchor="middle">caller&#x27;s frame</text>
<rect class="m f" x="300" y="84" width="184" height="40" rx="0" stroke-width="1.5"/>
<text class="tm" x="392.0" y="102.0" font-size="11" text-anchor="middle">arguments 9, 10, ...</text>
<text class="tm" x="392.0" y="116.0" font-size="10.5" text-anchor="middle">(on the stack)</text>
<rect class="s f" x="300" y="124" width="184" height="28" rx="0" stroke-width="1.5"/>
<text class="t" x="312" y="142.0" font-size="11">saved ra</text>
<text class="t mono" x="472" y="142.0" font-size="11" text-anchor="end">-8(s0)</text>
<rect class="s f" x="300" y="152" width="184" height="28" rx="0" stroke-width="1.5"/>
<text class="t" x="312" y="170.0" font-size="11">saved s0</text>
<text class="t mono" x="472" y="170.0" font-size="11" text-anchor="end">-16(s0)</text>
<rect class="s f" x="300" y="180" width="184" height="42" rx="0" stroke-width="1.5"/>
<text class="t" x="392.0" y="205.0" font-size="11" text-anchor="middle">local variables</text>
<rect class="s f" x="300" y="222" width="184" height="34" rx="0" stroke-width="1.5"/>
<text class="t" x="392.0" y="243.0" font-size="11" text-anchor="middle">temporaries</text>
<line class="a" x1="256" y1="124" x2="298" y2="124" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c04-aa)"/>
<text class="ta mono" x="250" y="128" font-size="11.5" font-weight="600" text-anchor="end">s0 (fp)</text>
<line class="a" x1="256" y1="256" x2="298" y2="256" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c04-aa)"/>
<text class="ta mono" x="250" y="260" font-size="11.5" font-weight="600" text-anchor="end">sp</text>
<path class="a" d="M490 126 H498 V254 H490" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta" x="508" y="186" font-size="12" font-weight="700">this call&#x27;s</text>
<text class="ta" x="508" y="201" font-size="12" font-weight="700">frame</text>
<line class="m" x1="494" y1="46" x2="494" y2="104" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c04-am)"/>
<text class="tm" x="504" y="70" font-size="10.5">grows toward</text>
<text class="tm" x="504" y="84" font-size="10.5">lower addresses</text>
</svg>
