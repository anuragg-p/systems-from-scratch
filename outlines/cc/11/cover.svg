<text class="t mono" x="198.0" y="104" font-size="10.5" text-anchor="middle">rs1</text>
<text class="tm mono" x="198.0" y="119" font-size="10" text-anchor="middle">a0 = x10</text>
<rect class="s fs" x="228" y="60" width="36" height="28" rx="0" stroke-width="1.5"/>
<text class="t mono" x="246.0" y="79" font-size="11.5" text-anchor="middle">000</text>
<text class="tm mono" x="246.0" y="52" font-size="10" text-anchor="middle">[14:12]</text>
<text class="t mono" x="246.0" y="104" font-size="10.5" text-anchor="middle">funct3</text>
