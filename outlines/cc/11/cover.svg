<text class="tm mono" x="138.0" y="52" font-size="10" text-anchor="middle">[24:20]</text>
<text class="t mono" x="138.0" y="104" font-size="10.5" text-anchor="middle">rs2</text>
<text class="tm mono" x="138.0" y="119" font-size="10" text-anchor="middle">a1 = x11</text>
<rect class="s fs" x="168" y="60" width="60" height="28" rx="0" stroke-width="1.5"/>
<text class="t mono" x="198.0" y="79" font-size="11.5" text-anchor="middle">01010</text>
