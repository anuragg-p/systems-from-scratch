<line class="s" x1="176" y1="174" x2="232" y2="190" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c11-ah)"/>
<line class="s" x1="176" y1="242" x2="232" y2="226" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c11-ah)"/>
<text class="ta" x="494" y="181" font-size="11" font-weight="600">relocation:</text>
