<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Three variables called x, and where each one lives</title>
<defs><marker id="c05-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c05-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="c05-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="96" font-size="11.5">int x = 1;</text>
<text class="t mono" x="24" y="116" font-size="11.5">int f() {</text>
<text class="t mono" x="24" y="136" font-size="11.5"><tspan x="37.8">int x = 2;</tspan></text>
<text class="t mono" x="24" y="156" font-size="11.5"><tspan x="37.8">{ int x = 3; }</tspan></text>
<text class="t mono" x="24" y="176" font-size="11.5"><tspan x="37.8">static int n;</tspan></text>
<text class="t mono" x="24" y="196" font-size="11.5">}</text>
<rect class="s f" x="156" y="36" width="264" height="230" rx="12" stroke-width="1.5"/>
<rect class="s f" x="172" y="72" width="232" height="178" rx="12" stroke-width="1.5"/>
<rect class="s f" x="188" y="108" width="200" height="64" rx="12" stroke-width="1.5"/>
<text class="t" x="168" y="56" font-size="11.5" font-weight="600"><tspan class="t">file scope: </tspan><tspan class="t mono">x</tspan><tspan class="t">, </tspan><tspan class="t mono">f</tspan></text>
<text class="t" x="184" y="92" font-size="11.5" font-weight="600"><tspan class="t">function scope: </tspan><tspan class="t mono">x</tspan><tspan class="t">, </tspan><tspan class="t mono">n</tspan></text>
<text class="t" x="200" y="128" font-size="11.5" font-weight="600"><tspan class="t">block scope: </tspan><tspan class="t mono">x</tspan></text>
<rect class="s f" x="466" y="40" width="150" height="44" rx="8" stroke-width="1.5"/>
<text class="t mono" x="604" y="66" font-size="12" font-weight="700" text-anchor="end">.data</text>
<rect class="s fs" x="476" y="50" width="64" height="24" rx="4" stroke-width="1.5"/>
<text class="t mono" x="508.0" y="66.0" font-size="11.5" text-anchor="middle">x = 1</text>
<rect class="s f" x="466" y="96" width="150" height="44" rx="8" stroke-width="1.5"/>
<text class="t mono" x="604" y="122" font-size="12" font-weight="700" text-anchor="end">.bss</text>
<rect class="a af" x="476" y="106" width="64" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="508.0" y="122.0" font-size="11.5" text-anchor="middle">n</text>
<rect class="s f" x="466" y="152" width="150" height="86" rx="8" stroke-width="1.5"/>
<text class="t mono" x="604" y="178" font-size="12" font-weight="700" text-anchor="end">stack</text>
<rect class="s fs" x="476" y="162" width="64" height="24" rx="4" stroke-width="1.5"/>
<text class="t mono" x="508.0" y="178.0" font-size="11.5" text-anchor="middle">x = 2</text>
<rect class="s fs" x="476" y="198" width="64" height="24" rx="4" stroke-width="1.5"/>
<text class="t mono" x="508.0" y="214.0" font-size="11.5" text-anchor="middle">x = 3</text>
<path class="m" d="M228.0 60 V66 H430 L474 62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c05-am)"/>
<path class="m" d="M271.9 96 V102 H436 L474 174" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c05-am)"/>
<path class="a" d="M292.8 88 H426 L474 118" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c05-aa)"/>
<path class="m" d="M280.6 124 H420 L474 210" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c05-am)"/>
<line class="a" x1="206" y1="146" x2="206" y2="256" stroke-width="1.5" stroke-linecap="round" marker-end="url(#c05-aa)"/>
<text class="ta" x="216" y="214" font-size="11" font-weight="600">lookup walks outward</text>
<text class="tm" x="616" y="258" font-size="10.5" text-anchor="end">n: function scope, but it lives</text>
<text class="tm" x="616" y="273" font-size="10.5" text-anchor="end">as long as the program</text>
</svg>
