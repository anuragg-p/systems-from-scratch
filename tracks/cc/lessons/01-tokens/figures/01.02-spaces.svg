<text class="t mono" x="225" y="232.68" font-size="13" font-weight="600" text-anchor="middle">1</text>
<rect class="s fs" x="246" y="215" width="26" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="259" y="232.68" font-size="13" font-weight="600" text-anchor="middle">-</text>
