<text class="t mono" x="327" y="232.68" font-size="13" font-weight="600" text-anchor="middle">2</text>
<text class="ta" x="354" y="232.5" font-size="12" font-weight="700">the space between them: two minuses</text>
<text class="tm" x="24" y="138" font-size="11.5">1 -&gt; 2 gives the same three tokens as 1-&gt;2: a space between two tokens changes nothing.</text>
<text class="tm" x="24" y="268" font-size="11.5">1--2 scans as 1, --, 2 although 1 - -2 may be what was meant; the parser, in module 02, rejects it.</text>
