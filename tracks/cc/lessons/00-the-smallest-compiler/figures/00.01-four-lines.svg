<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" fill="none">
<title>The four lines the compiler writes, and what each one is for</title>
<defs><marker id="f0001b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0001b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0001b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="24" y="24" width="176" height="166" rx="8" stroke-width="1.5"/>
<text class="t mono" x="38" y="55" font-size="15"><tspan x="56">.globl main</tspan></text>
<line class="m" x1="165" y1="50" x2="222" y2="50" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="m" x1="222" y1="50" x2="236" y2="50" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="244" y="54.5" font-size="13">lets the linker see the name</text>
<text class="t mono" x="38" y="95" font-size="15">main:</text>
<line class="m" x1="93" y1="90" x2="222" y2="90" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="m" x1="222" y1="90" x2="236" y2="90" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="244" y="94.5" font-size="13">a label: the address of the next instruction</text>
<text class="t mono" x="38" y="135" font-size="15" font-weight="600"><tspan x="56">li a0,</tspan><tspan x="119" class="ta">42</tspan></text>
<line class="m" x1="147" y1="130" x2="222" y2="130" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="m" x1="222" y1="130" x2="236" y2="130" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="244" y="134.5" font-size="13">a0 is the register a function leaves its result in</text>
<text class="t mono" x="38" y="175" font-size="15"><tspan x="56">ret</tspan></text>
<line class="m" x1="93" y1="170" x2="222" y2="170" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="m" x1="222" y1="170" x2="236" y2="170" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="244" y="174.5" font-size="13">go back to whoever called main</text>
<text class="ta" x="24" y="216" font-size="12.5" font-weight="600">Only the 42 comes from try.c: the other three lines are the same for every number.</text>
</svg>
