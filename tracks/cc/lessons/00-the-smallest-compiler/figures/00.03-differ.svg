<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" fill="none">
<title>A compiler that is wrong on purpose: the two statuses differ, and same says so</title>
<defs><marker id="f0003b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0003b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0003b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s f" x="24" y="40" width="70" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="59" y="56" font-size="12" font-weight="700" text-anchor="middle">wrongcc</text>
<text class="tm mono" x="59" y="71" font-size="10.5" text-anchor="middle">ours.s</text>
<rect class="s f" x="106" y="40" width="70" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="141" y="56" font-size="12" font-weight="700" text-anchor="middle">build</text>
<text class="tm mono" x="141" y="71" font-size="10.5" text-anchor="middle">ours.elf</text>
<line class="s" x1="95" y1="58" x2="104" y2="58" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0003b-ah)"/>
<rect class="s f" x="188" y="40" width="70" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="223" y="56" font-size="12" font-weight="700" text-anchor="middle">run</text>
<text class="tm mono" x="223" y="71" font-size="10.5" text-anchor="middle">QEMU</text>
<line class="s" x1="177" y1="58" x2="186" y2="58" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0003b-ah)"/>
<rect class="s f" x="24" y="140" width="70" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="59" y="156" font-size="12" font-weight="700" text-anchor="middle">wrap, gcc</text>
<text class="tm mono" x="59" y="171" font-size="10.5" text-anchor="middle">gcc.o</text>
<rect class="s f" x="106" y="140" width="70" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="141" y="156" font-size="12" font-weight="700" text-anchor="middle">build</text>
<text class="tm mono" x="141" y="171" font-size="10.5" text-anchor="middle">gcc.elf</text>
<line class="s" x1="95" y1="158" x2="104" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0003b-ah)"/>
<rect class="s f" x="188" y="140" width="70" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="223" y="156" font-size="12" font-weight="700" text-anchor="middle">run</text>
<text class="tm mono" x="223" y="171" font-size="10.5" text-anchor="middle">QEMU</text>
<line class="s" x1="177" y1="158" x2="186" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0003b-ah)"/>
<text class="t" x="24" y="31" font-size="12" font-weight="700">ours: the compiler CC_UNDER_TEST names</text>
<text class="t" x="24" y="131" font-size="12" font-weight="700">gcc, for the same machine</text>
<rect class="s fs" x="22" y="84" width="112" height="18" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="32" y="97" font-size="11" font-weight="700">li a0, 7</text>
<text class="tm" x="142" y="97" font-size="10.5">a fake: always 7</text>
<line class="s" x1="259" y1="58" x2="272" y2="58" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0003b-ah)"/>
<rect class="s f" x="274" y="46" width="56" height="24" rx="12" stroke-width="1.5"/>
<text class="t mono" x="302" y="63" font-size="13.5" font-weight="700" text-anchor="middle">7</text>
<line class="s" x1="259" y1="158" x2="272" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0003b-ah)"/>
<rect class="s f" x="274" y="146" width="56" height="24" rx="12" stroke-width="1.5"/>
<text class="t mono" x="302" y="163" font-size="13.5" font-weight="700" text-anchor="middle">42</text>
<line class="a" x1="302" y1="71" x2="302" y2="96" stroke-width="1.5" stroke-linecap="round"/>
<line class="a" x1="302" y1="120" x2="302" y2="145" stroke-width="1.5" stroke-linecap="round"/>
<circle class="a af" cx="302" cy="108" r="11" stroke-width="1.5"/>
<path class="a" d="M297 105.0 H307 M297 111.0 H307 M305.5 101.0 L298.5 115.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s fs" x="342" y="44" width="282" height="120" rx="8" stroke-width="1.5"/>
<text class="tm mono" x="354" y="64" font-size="11">$ CC_UNDER_TEST=./wrongcc</text>
<text class="tm mono" x="354" y="79" font-size="11"><tspan x="380.4">./same try.c; echo $?</tspan></text>
<text class="t mono" x="354" y="102" font-size="13">ours: status 7</text>
<text class="t mono" x="354" y="120" font-size="13">gcc: status 42</text>
<text class="ta mono" x="354" y="138" font-size="13" font-weight="700">differ</text>
<text class="t mono" x="354" y="156" font-size="13">1</text>
<line class="a" x1="314" y1="108" x2="340" y2="108" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0003b-aa)"/>
<text class="tm" x="24" y="226" font-size="11">On a file holding 7 the same fake would say same: status 7. One sample can agree by luck.</text>
</svg>
