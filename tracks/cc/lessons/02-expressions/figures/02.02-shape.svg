<circle class="s f" cx="90" cy="134" r="18" stroke-width="1.5"/>
<text class="t mono" x="90" y="139.4" font-size="15" font-weight="600" text-anchor="middle">1</text>
<circle class="s f" cx="160" cy="196" r="18" stroke-width="1.5"/>
<text class="t mono" x="160" y="201.4" font-size="15" font-weight="600" text-anchor="middle">2</text>
