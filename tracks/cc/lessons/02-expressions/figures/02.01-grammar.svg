<rect class="s fs" x="260" y="356" width="364" height="118.8" rx="6" stroke-width="1.5"/>
<text class="t mono" x="268" y="371" font-size="10.5">static Node *primary(Token **rest, Token *tok) {</text>
<text class="t mono" x="268" y="384.6" font-size="10.5"><tspan x="280.6">if (tok-&gt;kind ==</tspan><tspan x="387.7" class="ta">TK_NUM</tspan><tspan x="425.5">) {</tspan></text>
<text class="t mono" x="268" y="398.2" font-size="10.5"><tspan x="293.2">Node *node = new_num(tok-&gt;val, tok);</tspan></text>
<text class="t mono" x="268" y="411.8" font-size="10.5"><tspan x="293.2">*rest = tok-&gt;next;</tspan></text>
<text class="t mono" x="268" y="425.4" font-size="10.5"><tspan x="293.2">return node;</tspan></text>
<text class="t mono" x="268" y="439" font-size="10.5"><tspan x="280.6">}</tspan></text>
<text class="t mono" x="268" y="452.6" font-size="10.5"><tspan x="280.6">error_tok(tok, &quot;expected an expression&quot;);</tspan></text>
<text class="t mono" x="268" y="466.2" font-size="10.5">}</text>
<text class="t mono" x="24" y="371" font-size="12">primary = num</text>
<text class="t mono" x="24" y="371" font-size="12" font-weight="700">primary</text>
