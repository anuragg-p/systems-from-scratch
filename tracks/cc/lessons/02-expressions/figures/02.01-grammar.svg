<line class="a" x1="45.6" y1="136.8" x2="124.8" y2="136.8" stroke-width="1.5" stroke-linecap="round"/>
<path class="a" d="M85.2 137.8 C85.2 220.6 208 220.6 256 220.6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0201a-aa)"/>
