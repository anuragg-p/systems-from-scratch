<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" fill="none">
<title>A node&#x27;s value goes in the register at its depth: left at the same depth, right one higher</title>
<defs><marker id="f0203b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11.5">the rule, for any binary operator</text>
<circle class="a af" cx="150" cy="64" r="22" stroke-width="1.5"/>
<text class="ta mono" x="150" y="69" font-size="14" font-weight="700" text-anchor="middle">op</text>
<line class="s" x1="130.24" y1="84" x2="89.2" y2="138" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="74" cy="160" r="22" stroke-width="1.5"/>
<text class="t" x="74" y="165" font-size="12" font-weight="600" text-anchor="middle">left</text>
<text class="t mono" x="50.6" y="204" font-size="13" font-weight="700">reg[d]</text>
<line class="s" x1="169.76" y1="84" x2="210.8" y2="138" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="226" cy="160" r="22" stroke-width="1.5"/>
<text class="t" x="226" y="165" font-size="12" font-weight="600" text-anchor="middle">right</text>
<text class="ta mono" x="187" y="204" font-size="13" font-weight="700">reg[d + 1]</text>
<text class="ta mono" x="180" y="60" font-size="13" font-weight="700">reg[d]</text>
<text class="tm" x="24" y="238" font-size="11.5">Below reg[d] are values still waiting: gen_expr never writes there.</text>
<text class="tm" x="380" y="20" font-size="11.5">1 + 2 * 3, from ./cc at 02.03</text>
<line class="s" x1="502.2" y1="141.7" x2="482.8" y2="176.3" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="519.8" y1="141.7" x2="539.2" y2="176.3" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="443.92" y1="73.78" x2="411.58" y2="112.22" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="467.08" y1="73.78" x2="499.42" y2="112.22" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="400" cy="126" r="18" stroke-width="1.5"/>
<text class="t mono" x="400" y="131.4" font-size="15" font-weight="600" text-anchor="middle">1</text>
<circle class="s f" cx="474" cy="192" r="18" stroke-width="1.5"/>
<text class="t mono" x="474" y="197.4" font-size="15" font-weight="600" text-anchor="middle">2</text>
<circle class="s f" cx="548" cy="192" r="18" stroke-width="1.5"/>
<text class="t mono" x="548" y="197.4" font-size="15" font-weight="600" text-anchor="middle">3</text>
<circle class="s f" cx="511" cy="126" r="18" stroke-width="1.5"/>
<text class="t mono" x="511" y="131.4" font-size="15" font-weight="600" text-anchor="middle">*</text>
<circle class="s f" cx="455.5" cy="60" r="18" stroke-width="1.5"/>
<text class="t mono" x="455.5" y="65.4" font-size="15" font-weight="600" text-anchor="middle">+</text>
<text class="tm mono" x="422" y="114" font-size="12">t0</text>
<text class="tm mono" x="496" y="180" font-size="12">t1</text>
<text class="tm mono" x="570" y="180" font-size="12">t2</text>
<text class="tm mono" x="533" y="114" font-size="12">t1</text>
<text class="tm mono" x="477.5" y="48" font-size="12">t0</text>
