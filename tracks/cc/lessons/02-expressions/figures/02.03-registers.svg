<circle class="s f" cx="40" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="40" y="133.04" font-size="14" font-weight="600" text-anchor="middle">1</text>
<circle class="a af" cx="104" cy="190" r="17" stroke-width="1.5"/>
<text class="ta mono" x="104" y="195.04" font-size="14" font-weight="600" text-anchor="middle">2</text>
<circle class="s f" cx="168" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="168" y="195.04" font-size="14" font-weight="600" text-anchor="middle">3</text>
<circle class="s f" cx="136" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="136" y="133.04" font-size="14" font-weight="600" text-anchor="middle">*</text>
<circle class="s f" cx="88" cy="66" r="17" stroke-width="1.5"/>
<text class="t mono" x="88" y="71.04" font-size="14" font-weight="600" text-anchor="middle">+</text>
<rect class="a af" x="250" y="67" width="176" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="258" y="84" font-size="13.5" font-weight="700">li t1, 2</text>
<rect class="af" x="481" y="87" width="134" height="32" rx="3"/>
<text class="ta mono" x="548" y="109" font-size="16" font-weight="700" text-anchor="middle">2</text>
<rect class="fs" x="481" y="127" width="134" height="32" rx="3"/>
<text class="t mono" x="548" y="149" font-size="16" font-weight="700" text-anchor="middle">1</text>
</g>
<g class="step"><title>li t2, 3: the number 3 goes into t2, the register at its depth, 2.</title>
<line class="s" x1="128.2" y1="143.11" x2="111.8" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="143.8" y1="143.11" x2="160.2" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="77.59" y1="79.44" x2="50.41" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="98.41" y1="79.44" x2="125.59" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="40" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="40" y="133.04" font-size="14" font-weight="600" text-anchor="middle">1</text>
<circle class="s f" cx="104" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="104" y="195.04" font-size="14" font-weight="600" text-anchor="middle">2</text>
<circle class="a af" cx="168" cy="190" r="17" stroke-width="1.5"/>
<text class="ta mono" x="168" y="195.04" font-size="14" font-weight="600" text-anchor="middle">3</text>
<circle class="s f" cx="136" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="136" y="133.04" font-size="14" font-weight="600" text-anchor="middle">*</text>
<circle class="s f" cx="88" cy="66" r="17" stroke-width="1.5"/>
<text class="t mono" x="88" y="71.04" font-size="14" font-weight="600" text-anchor="middle">+</text>
<rect class="a af" x="250" y="93" width="176" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="258" y="110" font-size="13.5" font-weight="700">li t2, 3</text>
<rect class="af" x="481" y="47" width="134" height="32" rx="3"/>
<text class="ta mono" x="548" y="69" font-size="16" font-weight="700" text-anchor="middle">3</text>
<rect class="fs" x="481" y="87" width="134" height="32" rx="3"/>
<text class="t mono" x="548" y="109" font-size="16" font-weight="700" text-anchor="middle">2</text>
<rect class="fs" x="481" y="127" width="134" height="32" rx="3"/>
<text class="t mono" x="548" y="149" font-size="16" font-weight="700" text-anchor="middle">1</text>
</g>
<g class="step"><title>mul t1, t1, t2: the * node takes its two operands, t1 and t2, and leaves one value, 6, in t1. t2 is free again.</title>
<line class="s" x1="128.2" y1="143.11" x2="111.8" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="143.8" y1="143.11" x2="160.2" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="77.59" y1="79.44" x2="50.41" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="98.41" y1="79.44" x2="125.59" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="40" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="40" y="133.04" font-size="14" font-weight="600" text-anchor="middle">1</text>
<circle class="s f" cx="104" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="104" y="195.04" font-size="14" font-weight="600" text-anchor="middle">2</text>
<circle class="s f" cx="168" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="168" y="195.04" font-size="14" font-weight="600" text-anchor="middle">3</text>
<circle class="a af" cx="136" cy="128" r="17" stroke-width="1.5"/>
<text class="ta mono" x="136" y="133.04" font-size="14" font-weight="600" text-anchor="middle">*</text>
<circle class="s f" cx="88" cy="66" r="17" stroke-width="1.5"/>
<text class="t mono" x="88" y="71.04" font-size="14" font-weight="600" text-anchor="middle">+</text>
<rect class="a af" x="250" y="119" width="176" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="258" y="136" font-size="13.5" font-weight="700">mul t1, t1, t2</text>
<text class="tm mono" x="548" y="68" font-size="12" text-anchor="middle">3, free</text>
<rect class="af" x="481" y="87" width="134" height="32" rx="3"/>
<text class="ta mono" x="548" y="109" font-size="16" font-weight="700" text-anchor="middle">6</text>
<rect class="fs" x="481" y="127" width="134" height="32" rx="3"/>
<text class="t mono" x="548" y="149" font-size="16" font-weight="700" text-anchor="middle">1</text>
</g>
<g class="step"><title>add t0, t0, t1: the + node takes its two operands, t0 and t1, and leaves one value, 7, in t0. t1 is free again. t0 holds 7, the whole expression; mv a0, t0 then hands it to main's caller.</title>
<line class="s" x1="128.2" y1="143.11" x2="111.8" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="143.8" y1="143.11" x2="160.2" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="77.59" y1="79.44" x2="50.41" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="98.41" y1="79.44" x2="125.59" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="40" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="40" y="133.04" font-size="14" font-weight="600" text-anchor="middle">1</text>
<circle class="s f" cx="104" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="104" y="195.04" font-size="14" font-weight="600" text-anchor="middle">2</text>
<circle class="s f" cx="168" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="168" y="195.04" font-size="14" font-weight="600" text-anchor="middle">3</text>
<circle class="s f" cx="136" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="136" y="133.04" font-size="14" font-weight="600" text-anchor="middle">*</text>
<circle class="a af" cx="88" cy="66" r="17" stroke-width="1.5"/>
<text class="ta mono" x="88" y="71.04" font-size="14" font-weight="600" text-anchor="middle">+</text>
<rect class="a af" x="250" y="145" width="176" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="258" y="162" font-size="13.5" font-weight="700">add t0, t0, t1</text>
<text class="tm mono" x="548" y="68" font-size="12" text-anchor="middle">3, free</text>
<text class="tm mono" x="548" y="108" font-size="12" text-anchor="middle">6, free</text>
<rect class="af" x="481" y="127" width="134" height="32" rx="3"/>
<text class="ta mono" x="548" y="149" font-size="16" font-weight="700" text-anchor="middle">7</text>
</g>
