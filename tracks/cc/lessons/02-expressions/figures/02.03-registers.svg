<circle class="s f" cx="136" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="136" y="133.04" font-size="14" font-weight="600" text-anchor="middle">*</text>
<circle class="s f" cx="88" cy="66" r="17" stroke-width="1.5"/>
<text class="t mono" x="88" y="71.04" font-size="14" font-weight="600" text-anchor="middle">+</text>
<rect class="s fs" x="244" y="38" width="188" height="180" rx="6" stroke-width="1.5"/>
<text class="t mono" x="258" y="58" font-size="13.5">li t0, 1</text>
<text class="t mono" x="258" y="84" font-size="13.5">li t1, 2</text>
<text class="t mono" x="258" y="110" font-size="13.5">li t2, 3</text>
<text class="t mono" x="258" y="136" font-size="13.5">mul t1, t1, t2</text>
<text class="t mono" x="258" y="162" font-size="13.5">add t0, t0, t1</text>
<text class="tm mono" x="258" y="192" font-size="12">mv a0, t0</text>
<rect class="s f" x="480" y="46" width="136" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="458.4" y="68" font-size="13">t2</text>
<rect class="s f" x="480" y="86" width="136" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="458.4" y="108" font-size="13">t1</text>
<rect class="s f" x="480" y="126" width="136" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="458.4" y="148" font-size="13">t0</text>
<text class="tm" x="548" y="180" font-size="11" text-anchor="middle">t0 is the bottom</text>
<g class="step"><title>li t0, 1: the number 1 goes into t0, the register at its depth, 0. It waits there while the right side is computed.</title>
<line class="s" x1="128.2" y1="143.11" x2="111.8" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="143.8" y1="143.11" x2="160.2" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="77.59" y1="79.44" x2="50.41" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="98.41" y1="79.44" x2="125.59" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<circle class="a af" cx="40" cy="128" r="17" stroke-width="1.5"/>
<text class="ta mono" x="40" y="133.04" font-size="14" font-weight="600" text-anchor="middle">1</text>
<circle class="s f" cx="104" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="104" y="195.04" font-size="14" font-weight="600" text-anchor="middle">2</text>
<circle class="s f" cx="168" cy="190" r="17" stroke-width="1.5"/>
<text class="t mono" x="168" y="195.04" font-size="14" font-weight="600" text-anchor="middle">3</text>
<circle class="s f" cx="136" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="136" y="133.04" font-size="14" font-weight="600" text-anchor="middle">*</text>
<circle class="s f" cx="88" cy="66" r="17" stroke-width="1.5"/>
<text class="t mono" x="88" y="71.04" font-size="14" font-weight="600" text-anchor="middle">+</text>
<rect class="a af" x="250" y="41" width="176" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="258" y="58" font-size="13.5" font-weight="700">li t0, 1</text>
<rect class="af" x="481" y="127" width="134" height="32" rx="3"/>
<text class="ta mono" x="548" y="149" font-size="16" font-weight="700" text-anchor="middle">1</text>
</g>
<g class="step"><title>li t1, 2: the number 2 goes into t1, the register at its depth, 1. It waits there while the right side is computed.</title>
<line class="s" x1="128.2" y1="143.11" x2="111.8" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="143.8" y1="143.11" x2="160.2" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
