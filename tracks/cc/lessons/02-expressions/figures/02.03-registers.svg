<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" fill="none">
<title>The code for 1 + 2 * 3, one instruction a step: the registers are a stack</title>
<defs><marker id="f0203a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11.5">the tree</text>
<text class="tm" x="250" y="20" font-size="11.5">./cc at 02.03, the expression&#x27;s lines</text>
<text class="tm" x="476" y="20" font-size="11.5">the registers</text>
<line class="s" x1="128.2" y1="143.11" x2="111.8" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="143.8" y1="143.11" x2="160.2" y2="174.89" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="77.59" y1="79.44" x2="50.41" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="98.41" y1="79.44" x2="125.59" y2="114.56" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="40" cy="128" r="17" stroke-width="1.5"/>
<text class="t mono" x="40" y="133.04" font-size="14" font-weight="600" text-anchor="middle">1</text>
