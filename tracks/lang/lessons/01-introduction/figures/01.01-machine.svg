<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" fill="none">
<title>The machine</title>
<defs><marker id="f0101b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0101b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0101b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="16" y="22" font-size="11.5">registers</text>
<text class="t mono" x="46" y="56.5" font-size="12.5" font-weight="600" text-anchor="end">a0</text>
<rect class="s fs" x="54" y="40" width="80" height="24" rx="5" stroke-width="1.5"/>
<text class="t mono" x="94" y="56.5" font-size="12.5" font-weight="600" text-anchor="middle">462</text>
<text class="t mono" x="46" y="88.5" font-size="12.5" font-weight="600" text-anchor="end">s1</text>
<rect class="s fs" x="54" y="72" width="80" height="24" rx="5" stroke-width="1.5"/>
<text class="t mono" x="94" y="88.5" font-size="12.5" font-weight="600" text-anchor="middle">1071</text>
<text class="t mono" x="46" y="120.5" font-size="12.5" font-weight="600" text-anchor="end">s2</text>
<rect class="s fs" x="54" y="104" width="80" height="24" rx="5" stroke-width="1.5"/>
<text class="t mono" x="94" y="120.5" font-size="12.5" font-weight="600" text-anchor="middle">462</text>
<text class="t mono" x="46" y="152.5" font-size="12.5" font-weight="600" text-anchor="end">ra</text>
<rect class="s fs" x="54" y="136" width="80" height="24" rx="5" stroke-width="1.5"/>
<text class="t mono" x="94" y="152.5" font-size="12.5" font-weight="600" text-anchor="middle">12</text>
<text class="tm mono" x="46" y="184.5" font-size="12.5" font-weight="600" text-anchor="end">zero</text>
<rect class="s fs" x="54" y="168" width="80" height="24" rx="5" stroke-width="1.5"/>
<text class="tm mono" x="94" y="184.5" font-size="12.5" font-weight="600" text-anchor="middle">0</text>
<text class="tm" x="94" y="206" font-size="10.5" text-anchor="middle">always 0</text>
<text class="ta mono" x="46" y="242.5" font-size="12.5" font-weight="700" text-anchor="end">pc</text>
<rect class="a af" x="54" y="226" width="80" height="24" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="94" y="242.5" font-size="12.5" font-weight="700" text-anchor="middle">24</text>
<text class="ta" x="16" y="270" font-size="11" font-weight="600">next: pc + 4,</text>
<text class="ta" x="16" y="285" font-size="11" font-weight="600">or where a jump goes</text>
<text class="tm" x="176" y="22" font-size="11.5">gcd.s, as the machine holds it</text>
<rect class="s fs" x="176" y="32" width="248" height="295.5" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="188" y="52" font-size="12">main:</text>
<text class="tm mono" x="210" y="67.5" font-size="11" text-anchor="end">0</text>
<text class="t mono" x="220" y="67.5" font-size="12">call getint</text>
<text class="tm mono" x="210" y="83" font-size="11" text-anchor="end">4</text>
<text class="t mono" x="220" y="83" font-size="12"><tspan x="220">mv</tspan><tspan x="256">s1, a0</tspan></text>
<text class="tm mono" x="210" y="98.5" font-size="11" text-anchor="end">8</text>
<text class="t mono" x="220" y="98.5" font-size="12">call getint</text>
<text class="tm mono" x="210" y="114" font-size="11" text-anchor="end">12</text>
<text class="t mono" x="220" y="114" font-size="12"><tspan x="220">mv</tspan><tspan x="256">s2, a0</tspan></text>
<text class="tm mono" x="188" y="129.5" font-size="12">loop:</text>
<text class="tm mono" x="210" y="145" font-size="11" text-anchor="end">16</text>
<text class="t mono" x="220" y="145" font-size="12"><tspan x="220">beq</tspan><tspan x="256">s1, s2, done</tspan></text>
<text class="tm mono" x="210" y="160.5" font-size="11" text-anchor="end">20</text>
<text class="t mono" x="220" y="160.5" font-size="12"><tspan x="220">ble</tspan><tspan x="256">s1, s2, smaller</tspan></text>
<rect class="a af" x="180" y="165" width="240" height="15" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="210" y="176" font-size="11" text-anchor="end">24</text>
<text class="ta mono" x="220" y="176" font-size="12" font-weight="700"><tspan x="220">sub</tspan><tspan x="256">s1, s1, s2</tspan></text>
<text class="tm mono" x="210" y="191.5" font-size="11" text-anchor="end">28</text>
<text class="t mono" x="220" y="191.5" font-size="12"><tspan x="220">j</tspan><tspan x="256">loop</tspan></text>
<text class="tm mono" x="188" y="207" font-size="12">smaller:</text>
<text class="tm mono" x="210" y="222.5" font-size="11" text-anchor="end">32</text>
<text class="t mono" x="220" y="222.5" font-size="12"><tspan x="220">sub</tspan><tspan x="256">s2, s2, s1</tspan></text>
<text class="tm mono" x="210" y="238" font-size="11" text-anchor="end">36</text>
<text class="t mono" x="220" y="238" font-size="12"><tspan x="220">j</tspan><tspan x="256">loop</tspan></text>
<text class="tm mono" x="188" y="253.5" font-size="12">done:</text>
<text class="tm mono" x="210" y="269" font-size="11" text-anchor="end">40</text>
<text class="t mono" x="220" y="269" font-size="12"><tspan x="220">mv</tspan><tspan x="256">a0, s1</tspan></text>
<text class="tm mono" x="210" y="284.5" font-size="11" text-anchor="end">44</text>
<text class="t mono" x="220" y="284.5" font-size="12">call putint</text>
<text class="tm mono" x="210" y="300" font-size="11" text-anchor="end">48</text>
<text class="t mono" x="220" y="300" font-size="12"><tspan x="220">li</tspan><tspan x="256">a0, 0</tspan></text>
<text class="tm mono" x="210" y="315.5" font-size="11" text-anchor="end">52</text>
<text class="t mono" x="220" y="315.5" font-size="12">call exit</text>
<path class="a" d="M136 238 H156 V172.0 H178" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0101b-aa)"/>
<text class="tm" x="452" y="22" font-size="11.5">routines of the machine</text>
<line class="m" x1="305.2" y1="63.5" x2="450" y2="73.58" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="305.2" y1="94.5" x2="450" y2="84.42" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s f" x="452" y="67" width="72" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="488" y="83.5" font-size="12" font-weight="600" text-anchor="middle">getint</text>
<line class="m" x1="305.2" y1="280.5" x2="450" y2="280.5" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s f" x="452" y="268.5" width="72" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="488" y="285" font-size="12" font-weight="600" text-anchor="middle">putint</text>
<line class="m" x1="290.8" y1="311.5" x2="450" y2="311.5" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s f" x="452" y="299.5" width="72" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="488" y="316" font-size="12" font-weight="600" text-anchor="middle">exit</text>
<text class="tm" x="582" y="59" font-size="10.5" text-anchor="middle">input</text>
<rect class="s fs" x="548" y="67" width="68" height="24" rx="12" stroke-width="1.5"/>
<text class="t mono" x="582" y="83.03" font-size="11.5" text-anchor="middle">1071 462</text>
<line class="s" x1="546" y1="79" x2="527" y2="79" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0101b-ah)"/>
<text class="tm" x="544" y="260.5" font-size="10.5">output, at the end</text>
<rect class="s fs" x="562" y="268.5" width="40" height="24" rx="12" stroke-width="1.5"/>
<text class="t mono" x="582" y="284.52" font-size="11.5" text-anchor="middle">21</text>
<line class="s" x1="525" y1="280.5" x2="560" y2="280.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0101b-ah)"/>
<rect class="s fs" x="546" y="299.5" width="76" height="24" rx="12" stroke-width="1.5"/>
<text class="t mono" x="584" y="315.52" font-size="11.5" text-anchor="middle">status 0</text>
<line class="s" x1="525" y1="311.5" x2="546" y2="311.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0101b-ah)"/>
</svg>
