<line class="m" x1="163.6" y1="201" x2="320" y2="218" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="163.6" y1="218" x2="320" y2="235" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="163.6" y1="235" x2="320" y2="252" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="163.6" y1="252" x2="320" y2="269" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="163.6" y1="269" x2="320" y2="286" stroke-width="1.5" stroke-linecap="round"/>
