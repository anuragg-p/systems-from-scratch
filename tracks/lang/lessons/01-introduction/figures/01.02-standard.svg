<title>The standard: a program, its input, its output</title>
<defs><marker id="f0102c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0102c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0102c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path class="s fs" d="M16 32 H392.4 L402.4 42 V215.5 H16 Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s" d="M392.4 32 V42 H402.4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t mono" x="26" y="22" font-size="12" font-weight="700">gcd.mote</text>
<text class="tm mono" x="26" y="52" font-size="11"># gcd.mote: the greatest common divisor of two numbers</text>
<text class="t mono" x="26" y="66.5" font-size="11">read i</text>
<text class="t mono" x="26" y="81" font-size="11">read j</text>
<text class="t mono" x="26" y="95.5" font-size="11">while i != j do</text>
<text class="t mono" x="26" y="110" font-size="11"><tspan x="52.4">if i &gt; j then</tspan></text>
<text class="t mono" x="26" y="124.5" font-size="11"><tspan x="78.8">i := i - j</tspan></text>
<text class="t mono" x="26" y="139" font-size="11"><tspan x="52.4">else</tspan></text>
<text class="t mono" x="26" y="153.5" font-size="11"><tspan x="78.8">j := j - i</tspan></text>
<text class="t mono" x="26" y="168" font-size="11"><tspan x="52.4">end</tspan></text>
<text class="t mono" x="26" y="182.5" font-size="11">end</text>
<text class="t mono" x="26" y="197" font-size="11">write i</text>
<text class="t mono" x="434.4" y="22" font-size="12" font-weight="700">gcd.in</text>
