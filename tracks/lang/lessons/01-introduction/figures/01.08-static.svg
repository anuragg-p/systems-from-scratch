<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" fill="none">
<title>The static rule</title>
<defs><marker id="f0108c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0108c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0108c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="20" font-size="13" font-weight="700">accepted</text>
<text class="tm mono" x="88.16" y="20" font-size="11">ok.mote</text>
<rect class="s fs" x="24" y="34" width="184" height="84" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="42" y="52" font-size="10.5" text-anchor="end">1</text>
<text class="t mono" x="54" y="52" font-size="13">read n</text>
<text class="tm mono" x="42" y="74" font-size="10.5" text-anchor="end">2</text>
<text class="t mono" x="54" y="74" font-size="13">m := 1</text>
<text class="tm mono" x="42" y="96" font-size="10.5" text-anchor="end">3</text>
<text class="t mono" x="54" y="96" font-size="13">write n + m</text>
<line class="a" x1="93" y1="56" x2="100.8" y2="56" stroke-width="2.5" stroke-linecap="round"/>
<line class="a" x1="54" y1="78" x2="61.8" y2="78" stroke-width="2.5" stroke-linecap="round"/>
<text class="tm" x="24" y="140" font-size="11">--tree:</text>
<text class="t mono" x="24" y="158" font-size="11">read n#1</text>
<text class="t mono" x="24" y="174" font-size="11">:= m#2 1</text>
<text class="t mono" x="24" y="190" font-size="11">write (+ n#1 m#2)</text>
<text class="ta" x="228" y="20" font-size="13" font-weight="700">refused</text>
<text class="tm mono" x="285.14" y="20" font-size="11">early.mote</text>
<rect class="s fs" x="228" y="34" width="184" height="84" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="246" y="52" font-size="10.5" text-anchor="end">1</text>
<text class="t mono" x="258" y="52" font-size="13">read n</text>
<text class="tm mono" x="246" y="74" font-size="10.5" text-anchor="end">2</text>
<text class="t mono" x="258" y="74" font-size="13">write n + m</text>
<text class="tm mono" x="246" y="96" font-size="10.5" text-anchor="end">3</text>
<text class="t mono" x="258" y="96" font-size="13">m := 1</text>
<line class="a" x1="297" y1="56" x2="304.8" y2="56" stroke-width="2.5" stroke-linecap="round"/>
<line class="a" x1="258" y1="100" x2="265.8" y2="100" stroke-width="2.5" stroke-linecap="round"/>
<rect class="a" x="333" y="59" width="13.8" height="21" rx="4" stroke-width="1.5"/>
<path class="a" d="M333.9 90.0 L339.9 83.0 L345.9 90.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta mono" x="228" y="140" font-size="12" font-weight="700">2:11:</text>
<text class="ta" x="271.2" y="140" font-size="12" font-weight="600">m is used</text>
<text class="ta" x="228" y="157" font-size="12" font-weight="600">before anything gives it a value</text>
<text class="tm" x="228" y="180" font-size="11.5">m is given a value only</text>
<text class="tm" x="228" y="195" font-size="11.5">on the line below its use</text>
<text class="t" x="432" y="20" font-size="13" font-weight="700">accepted</text>
<text class="tm mono" x="496.16" y="20" font-size="11">maybe.mote</text>
<rect class="s fs" x="432" y="34" width="184" height="106" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="450" y="52" font-size="10.5" text-anchor="end">1</text>
<text class="t mono" x="462" y="52" font-size="13">if 1 &gt; 2 then</text>
<text class="tm mono" x="450" y="74" font-size="10.5" text-anchor="end">2</text>
<text class="t mono" x="462" y="74" font-size="13"><tspan x="493.2">x := 1</tspan></text>
<text class="tm mono" x="450" y="96" font-size="10.5" text-anchor="end">3</text>
<text class="t mono" x="462" y="96" font-size="13">end</text>
<text class="tm mono" x="450" y="118" font-size="10.5" text-anchor="end">4</text>
<text class="t mono" x="462" y="118" font-size="13">write x</text>
<line class="a" x1="493.2" y1="78" x2="501" y2="78" stroke-width="2.5" stroke-linecap="round"/>
<text class="tm" x="432" y="162" font-size="11">--tree:</text>
<text class="t mono" x="432" y="180" font-size="11">if (&gt; 1 2)</text>
<text class="t mono" x="432" y="196" font-size="11"><tspan x="445.2">:= x#1 1</tspan></text>
<text class="t mono" x="432" y="212" font-size="11">write x#1</text>
<text class="t" x="432" y="236" font-size="11.5" font-weight="600">left for the running program:</text>
<text class="tm" x="432" y="252" font-size="11.5">lesson 01.09 stops it at 4:7,</text>
<text class="tm" x="432" y="267" font-size="11.5">x has no value yet</text>
<line class="a" x1="24" y1="296" x2="52" y2="296" stroke-width="2.5" stroke-linecap="round"/>
<text class="t" x="60" y="300" font-size="11.5">where the text first gives the name a value</text>
</svg>
