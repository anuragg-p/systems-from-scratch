<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 647" fill="none">
<title>gcd.mote compiled twice: on the left every use is a load and every assignment a store; on the right i and j live in s1 and s2</title>
<defs><marker id="ba0111-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ba0111-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ba0111-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="16" y="22" font-size="11.5">gcd.mote</text>
<text class="t" x="166" y="22" font-size="12.5" font-weight="700">./mote -S</text>
<text class="t" x="440" y="22" font-size="12.5" font-weight="700">./mote -S -O</text>
<text class="t mono" x="166" y="46" font-size="11.5">main:</text>
<text class="t mono" x="166" y="61" font-size="11.5"><tspan x="193.6">addi sp, sp, -16</tspan></text>
<text class="t mono" x="440" y="46" font-size="11.5">main:</text>
<rect class="fs" x="8" y="70" width="624" height="34" rx="4"/>
<text class="tm mono" x="16" y="82" font-size="11">read i</text>
<text class="t mono" x="166" y="82" font-size="11.5"><tspan x="193.6">call getint</tspan></text>
<rect class="af" x="189.6" y="86" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="97" font-size="11.5" font-weight="700"><tspan x="193.6">sd</tspan><tspan x="228.1">a0, 0(sp)</tspan><tspan x="345.4"># i</tspan></text>
<text class="t mono" x="440" y="82" font-size="11.5"><tspan x="467.6">call getint</tspan></text>
<text class="t mono" x="440" y="97" font-size="11.5"><tspan x="467.6">mv</tspan><tspan x="502.1" class="ta">s1</tspan><tspan x="515.9">, a0</tspan></text>
<text class="tm mono" x="16" y="118" font-size="11">read j</text>
<text class="t mono" x="166" y="118" font-size="11.5"><tspan x="193.6">call getint</tspan></text>
<rect class="af" x="189.6" y="122" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="133" font-size="11.5" font-weight="700"><tspan x="193.6">sd</tspan><tspan x="228.1">a0, 8(sp)</tspan><tspan x="345.4"># j</tspan></text>
<text class="t mono" x="440" y="118" font-size="11.5"><tspan x="467.6">call getint</tspan></text>
<text class="t mono" x="440" y="133" font-size="11.5"><tspan x="467.6">mv</tspan><tspan x="502.1" class="ta">s2</tspan><tspan x="515.9">, a0</tspan></text>
<rect class="fs" x="8" y="142" width="624" height="64" rx="4"/>
<text class="tm mono" x="16" y="154" font-size="11">while i != j do</text>
<text class="t mono" x="166" y="154" font-size="11.5">.L1:</text>
<rect class="af" x="189.6" y="158" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="169" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t0, 0(sp)</tspan><tspan x="345.4"># i</tspan></text>
<rect class="af" x="189.6" y="173" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="184" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t1, 8(sp)</tspan><tspan x="345.4"># j</tspan></text>
<text class="t mono" x="166" y="199" font-size="11.5"><tspan x="193.6">beq</tspan><tspan x="228.1">t0, t1, .L2</tspan></text>
<text class="t mono" x="440" y="154" font-size="11.5">.L1:</text>
<text class="t mono" x="440" y="169" font-size="11.5"><tspan x="467.6">beq</tspan><tspan x="502.1" class="ta">s1</tspan><tspan x="515.9">,</tspan><tspan x="529.7" class="ta">s2</tspan><tspan x="543.5">, .L2</tspan></text>
<text class="tm mono" x="16" y="220" font-size="11"><tspan x="42.4">if i &gt; j then</tspan></text>
<rect class="af" x="189.6" y="209" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="220" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t0, 0(sp)</tspan><tspan x="345.4"># i</tspan></text>
<rect class="af" x="189.6" y="224" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="235" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t1, 8(sp)</tspan><tspan x="345.4"># j</tspan></text>
<text class="t mono" x="166" y="250" font-size="11.5"><tspan x="193.6">ble</tspan><tspan x="228.1">t0, t1, .L3</tspan></text>
<text class="t mono" x="440" y="220" font-size="11.5"><tspan x="467.6">ble</tspan><tspan x="502.1" class="ta">s1</tspan><tspan x="515.9">,</tspan><tspan x="529.7" class="ta">s2</tspan><tspan x="543.5">, .L3</tspan></text>
<rect class="fs" x="8" y="259" width="624" height="64" rx="4"/>
<text class="tm mono" x="16" y="271" font-size="11"><tspan x="68.8">i := i - j</tspan></text>
<rect class="af" x="189.6" y="260" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="271" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t0, 0(sp)</tspan><tspan x="345.4"># i</tspan></text>
<rect class="af" x="189.6" y="275" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="286" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t1, 8(sp)</tspan><tspan x="345.4"># j</tspan></text>
<text class="t mono" x="166" y="301" font-size="11.5"><tspan x="193.6">sub</tspan><tspan x="228.1">t0, t0, t1</tspan></text>
<rect class="af" x="189.6" y="305" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="316" font-size="11.5" font-weight="700"><tspan x="193.6">sd</tspan><tspan x="228.1">t0, 0(sp)</tspan><tspan x="345.4"># i</tspan></text>
<text class="t mono" x="440" y="271" font-size="11.5"><tspan x="467.6">sub</tspan><tspan x="502.1" class="ta">s1</tspan><tspan x="515.9">,</tspan><tspan x="529.7" class="ta">s1</tspan><tspan x="543.5">,</tspan><tspan x="557.3" class="ta">s2</tspan></text>
<text class="tm mono" x="16" y="337" font-size="11"><tspan x="42.4">else</tspan></text>
<text class="t mono" x="166" y="337" font-size="11.5"><tspan x="193.6">j</tspan><tspan x="228.1">.L4</tspan></text>
<text class="t mono" x="166" y="352" font-size="11.5">.L3:</text>
<text class="t mono" x="440" y="337" font-size="11.5"><tspan x="467.6">j</tspan><tspan x="502.1">.L4</tspan></text>
<text class="t mono" x="440" y="352" font-size="11.5">.L3:</text>
<rect class="fs" x="8" y="361" width="624" height="64" rx="4"/>
<text class="tm mono" x="16" y="373" font-size="11"><tspan x="68.8">j := j - i</tspan></text>
<rect class="af" x="189.6" y="362" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="373" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t0, 8(sp)</tspan><tspan x="345.4"># j</tspan></text>
<rect class="af" x="189.6" y="377" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="388" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t1, 0(sp)</tspan><tspan x="345.4"># i</tspan></text>
<text class="t mono" x="166" y="403" font-size="11.5"><tspan x="193.6">sub</tspan><tspan x="228.1">t0, t0, t1</tspan></text>
<rect class="af" x="189.6" y="407" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="418" font-size="11.5" font-weight="700"><tspan x="193.6">sd</tspan><tspan x="228.1">t0, 8(sp)</tspan><tspan x="345.4"># j</tspan></text>
<text class="t mono" x="440" y="373" font-size="11.5"><tspan x="467.6">sub</tspan><tspan x="502.1" class="ta">s2</tspan><tspan x="515.9">,</tspan><tspan x="529.7" class="ta">s2</tspan><tspan x="543.5">,</tspan><tspan x="557.3" class="ta">s1</tspan></text>
<text class="tm mono" x="16" y="439" font-size="11"><tspan x="42.4">end</tspan></text>
<text class="t mono" x="166" y="439" font-size="11.5">.L4:</text>
<text class="t mono" x="440" y="439" font-size="11.5">.L4:</text>
<rect class="fs" x="8" y="448" width="624" height="34" rx="4"/>
<text class="tm mono" x="16" y="460" font-size="11">end</text>
<text class="t mono" x="166" y="460" font-size="11.5"><tspan x="193.6">j</tspan><tspan x="228.1">.L1</tspan></text>
<text class="t mono" x="166" y="475" font-size="11.5">.L2:</text>
<text class="t mono" x="440" y="460" font-size="11.5"><tspan x="467.6">j</tspan><tspan x="502.1">.L1</tspan></text>
<text class="t mono" x="440" y="475" font-size="11.5">.L2:</text>
<text class="tm mono" x="16" y="496" font-size="11">write i</text>
<rect class="af" x="189.6" y="485" width="180.5" height="14" rx="3"/>
<text class="ta mono" x="166" y="496" font-size="11.5" font-weight="700"><tspan x="193.6">ld</tspan><tspan x="228.1">t0, 0(sp)</tspan><tspan x="345.4"># i</tspan></text>
<text class="t mono" x="166" y="511" font-size="11.5"><tspan x="193.6">mv</tspan><tspan x="228.1">a0, t0</tspan></text>
<text class="t mono" x="166" y="526" font-size="11.5"><tspan x="193.6">call putint</tspan></text>
<text class="t mono" x="440" y="496" font-size="11.5"><tspan x="467.6">mv</tspan><tspan x="502.1">a0,</tspan><tspan x="529.7" class="ta">s1</tspan></text>
<text class="t mono" x="440" y="511" font-size="11.5"><tspan x="467.6">call putint</tspan></text>
<rect class="fs" x="8" y="535" width="624" height="34" rx="4"/>
<text class="t mono" x="166" y="547" font-size="11.5"><tspan x="193.6">li</tspan><tspan x="228.1">a0, 0</tspan></text>
<text class="t mono" x="166" y="562" font-size="11.5"><tspan x="193.6">call exit</tspan></text>
<text class="t mono" x="440" y="547" font-size="11.5"><tspan x="467.6">li</tspan><tspan x="502.1">a0, 0</tspan></text>
<text class="t mono" x="440" y="562" font-size="11.5"><tspan x="467.6">call exit</tspan></text>
<line class="m" x1="166" y1="587" x2="624" y2="587" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="166" y="607" font-size="11.5">26 instructions, 13 of them ld or sd</text>
<text class="ta mono" x="166" y="631" font-size="22" font-weight="700">142</text>
<text class="t" x="218" y="631" font-size="11.5">run on 1071 462</text>
<text class="t" x="440" y="607" font-size="11.5">14 instructions, none ld or sd</text>
<text class="ta mono" x="440" y="631" font-size="22" font-weight="700">61</text>
<text class="t" x="476" y="631" font-size="11.5">run on 1071 462</text>
</svg>
