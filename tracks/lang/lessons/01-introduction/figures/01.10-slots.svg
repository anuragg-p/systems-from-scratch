<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 204" fill="none">
<title>Where the variables of gcd.mote live: a slot each in the machine&#x27;s memory, found from sp</title>
<defs><marker id="s0110-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="s0110-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="s0110-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="300" y="22" font-size="11.5">the machine&#x27;s memory, after the two reads on 6 4</text>
<rect class="m f" x="300" y="36" width="128" height="40" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="364" y="61" font-size="11.5" text-anchor="middle">free</text>
<rect class="a af" x="300" y="76" width="128" height="46" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="312" y="104" font-size="13" font-weight="700">0(sp)</text>
<text class="t mono" x="416" y="104" font-size="13" text-anchor="end">i = 6</text>
<text class="tm mono" x="438" y="80" font-size="11">1048560</text>
<rect class="a af" x="300" y="122" width="128" height="46" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="312" y="150" font-size="13" font-weight="700">8(sp)</text>
<text class="t mono" x="416" y="150" font-size="13" text-anchor="end">j = 4</text>
<text class="tm mono" x="438" y="126" font-size="11">1048568</text>
<text class="tm mono" x="438" y="172" font-size="11">1048576</text>
<line class="s" x1="292" y1="168" x2="428" y2="168" stroke-width="2.5" stroke-linecap="round"/>
<text class="tm" x="364" y="190" font-size="11.5" text-anchor="middle">the end of memory: sp starts here</text>
<text class="tm" x="24" y="66" font-size="11.5">the symbol table</text>
<rect class="s f" x="16" y="76" width="196" height="92" rx="6" stroke-width="1.5"/>
<line class="m" x1="16" y1="122" x2="212" y2="122" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="30" y="104" font-size="12">1</text>
<text class="t mono" x="54" y="104" font-size="14" font-weight="700">i</text>
<text class="t mono" x="200" y="104" font-size="11.5" text-anchor="end">offset 8 * 0 = 0</text>
<line class="s" x1="216" y1="100" x2="296" y2="100" stroke-width="1.5" stroke-linecap="round" marker-end="url(#s0110-ah)"/>
<text class="tm mono" x="30" y="150" font-size="12">2</text>
<text class="t mono" x="54" y="150" font-size="14" font-weight="700">j</text>
<text class="t mono" x="200" y="150" font-size="11.5" text-anchor="end">offset 8 * 1 = 8</text>
<line class="s" x1="216" y1="146" x2="296" y2="146" stroke-width="1.5" stroke-linecap="round" marker-end="url(#s0110-ah)"/>
<line class="a" x1="254" y1="76" x2="296" y2="76" stroke-width="1.5" stroke-linecap="round" marker-end="url(#s0110-aa)"/>
<text class="ta mono" x="248" y="81" font-size="14" font-weight="700" text-anchor="end">sp</text>
<path class="a" d="M496 77 L502 77 L502 167 L496 167" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta mono" x="512" y="120" font-size="11.5" font-weight="700">addi sp, sp, -16</text>
<text class="t" x="512" y="137" font-size="11.5">16 bytes, two slots</text>
</svg>
