<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" fill="none">
<title>i := i - j as the code generator writes it, an instruction a step: two loads, a subtraction, a store</title>
<defs><marker id="st0110-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="st0110-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="st0110-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11.5">the statement&#x27;s tree</text>
<text class="tm" x="212" y="22" font-size="11.5">./mote -S writes</text>
<text class="tm" x="500" y="22" font-size="11.5">after it runs, on 6 4</text>
<line class="s" x1="104" y1="74" x2="104" y2="106" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="104" y1="130" x2="76.3" y2="162" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="104" y1="130" x2="131.7" y2="162" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s fs" x="204" y="32" width="232" height="134" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="514" y="58" font-size="12" text-anchor="end">t0</text>
<text class="tm mono" x="514" y="98" font-size="12" text-anchor="end">t1</text>
<text class="tm mono" x="514" y="138" font-size="12" text-anchor="end">i: 0(sp)</text>
<text class="tm mono" x="514" y="178" font-size="12" text-anchor="end">j: 8(sp)</text>
<g class="step"><title>ld t0, 0(sp): the walk is at i#1, a use of a variable: a load from its slot into t0, the register at its depth.</title>
<rect class="s f" x="73.6" y="50" width="60.8" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="104" y="66.68" font-size="13" font-weight="600" text-anchor="middle">:= i#1</text>
<rect class="s f" x="89" y="106" width="30" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="104" y="122.68" font-size="13" font-weight="600" text-anchor="middle">-</text>
<rect class="a af" x="57.6" y="162" width="37.4" height="24" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="76.3" y="178.68" font-size="13" font-weight="700" text-anchor="middle">i#1</text>
<rect class="s f" x="113" y="162" width="37.4" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="131.7" y="178.68" font-size="13" font-weight="600" text-anchor="middle">j#2</text>
<rect class="a af" x="208" y="36" width="224" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="216" y="52" font-size="13" font-weight="700"><tspan x="216">ld</tspan><tspan x="255">t0, 0(sp)</tspan><tspan x="387.6"># i</tspan></text>
<rect class="a af" x="524" y="36" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="574" y="58" font-size="15" font-weight="700" text-anchor="middle">6</text>
<rect class="s f" x="524" y="76" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="574" y="98" font-size="15" text-anchor="middle">4</text>
<rect class="s f" x="524" y="116" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="574" y="138" font-size="15" text-anchor="middle">6</text>
<rect class="s f" x="524" y="156" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="574" y="178" font-size="15" text-anchor="middle">4</text>
</g>
<g class="step"><title>ld t1, 8(sp): the walk is at j#2, a use of a variable: a load from its slot into t1, the register at its depth.</title>
