<text class="tm mono" x="574" y="178" font-size="15" text-anchor="middle">4</text>
</g>
<g class="step"><title>sd t0, 0(sp): back at := i#1, the value is given to i: a store into its slot. Nothing is kept in a register for the next statement.</title>
<rect class="a af" x="73.6" y="50" width="60.8" height="24" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="104" y="66.68" font-size="13" font-weight="700" text-anchor="middle">:= i#1</text>
<rect class="s f" x="89" y="106" width="30" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="104" y="122.68" font-size="13" font-weight="600" text-anchor="middle">-</text>
<rect class="s f" x="57.6" y="162" width="37.4" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="76.3" y="178.68" font-size="13" font-weight="600" text-anchor="middle">i#1</text>
<rect class="s f" x="113" y="162" width="37.4" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="131.7" y="178.68" font-size="13" font-weight="600" text-anchor="middle">j#2</text>
<text class="t mono" x="216" y="52" font-size="13"><tspan x="216">ld</tspan><tspan x="255">t0, 0(sp)</tspan><tspan x="387.6"># i</tspan></text>
<text class="t mono" x="216" y="82" font-size="13"><tspan x="216">ld</tspan><tspan x="255">t1, 8(sp)</tspan><tspan x="387.6"># j</tspan></text>
<text class="t mono" x="216" y="112" font-size="13"><tspan x="216">sub</tspan><tspan x="255">t0, t0, t1</tspan></text>
<rect class="a af" x="208" y="126" width="224" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="216" y="142" font-size="13" font-weight="700"><tspan x="216">sd</tspan><tspan x="255">t0, 0(sp)</tspan><tspan x="387.6"># i</tspan></text>
<rect class="s f" x="524" y="36" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="574" y="58" font-size="15" text-anchor="middle">2</text>
<rect class="s f" x="524" y="76" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="574" y="98" font-size="15" text-anchor="middle">4</text>
<rect class="a af" x="524" y="116" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="574" y="138" font-size="15" font-weight="700" text-anchor="middle">2</text>
<rect class="s f" x="524" y="156" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="574" y="178" font-size="15" text-anchor="middle">4</text>
</g>
<text class="tm" x="24" y="226" font-size="11.5">t0 and t1 held 6 and 4 already, from the if&#x27;s test</text>
</svg>
