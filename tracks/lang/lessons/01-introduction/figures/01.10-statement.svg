<text class="t mono" x="216" y="82" font-size="13"><tspan x="216">ld</tspan><tspan x="255">t1, 8(sp)</tspan><tspan x="387.6"># j</tspan></text>
<rect class="a af" x="208" y="96" width="224" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="216" y="112" font-size="13" font-weight="700"><tspan x="216">sub</tspan><tspan x="255">t0, t0, t1</tspan></text>
<rect class="a af" x="524" y="36" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="574" y="58" font-size="15" font-weight="700" text-anchor="middle">2</text>
<rect class="s f" x="524" y="76" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="574" y="98" font-size="15" text-anchor="middle">4</text>
