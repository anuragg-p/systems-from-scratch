<text class="t mono" x="76.3" y="178.68" font-size="13" font-weight="600" text-anchor="middle">i#1</text>
<rect class="a af" x="113" y="162" width="37.4" height="24" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="131.7" y="178.68" font-size="13" font-weight="700" text-anchor="middle">j#2</text>
<text class="t mono" x="216" y="52" font-size="13"><tspan x="216">ld</tspan><tspan x="255">t0, 0(sp)</tspan><tspan x="387.6"># i</tspan></text>
<rect class="a af" x="208" y="66" width="224" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="216" y="82" font-size="13" font-weight="700"><tspan x="216">ld</tspan><tspan x="255">t1, 8(sp)</tspan><tspan x="387.6"># j</tspan></text>
<rect class="s f" x="524" y="36" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="574" y="58" font-size="15" text-anchor="middle">6</text>
<rect class="a af" x="524" y="76" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="574" y="98" font-size="15" font-weight="700" text-anchor="middle">4</text>
<rect class="s f" x="524" y="116" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="574" y="138" font-size="15" text-anchor="middle">6</text>
<rect class="s f" x="524" y="156" width="100" height="32" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="574" y="178" font-size="15" text-anchor="middle">4</text>
</g>
<g class="step"><title>sub t0, t0, t1: back at the - node, both operands are in registers: one instruction, result in t0.</title>
<rect class="s f" x="73.6" y="50" width="60.8" height="24" rx="6" stroke-width="1.5"/>
<text class="t mono" x="104" y="66.68" font-size="13" font-weight="600" text-anchor="middle">:= i#1</text>
<rect class="a af" x="89" y="106" width="30" height="24" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="104" y="122.68" font-size="13" font-weight="700" text-anchor="middle">-</text>
