<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" fill="none">
<title>Where the loss is taken: the paper&#x27;s text scores the answer only; the authors&#x27; code scores every token after =, the end token too, which halves the loss of a guess</title>
<defs><marker id="scored1401-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="scored1401-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="scored1401-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="16" y="28" font-size="11.5" font-weight="700">the paper&#x27;s text (appendix A.1.2): &quot;loss and accuracy only on the answer part&quot;; ours</text>
<rect class="s fs" x="30" y="40" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="50" y="58.32" font-size="12" font-weight="600" text-anchor="middle">a</text>
<rect class="s fs" x="78" y="40" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="98" y="58.32" font-size="12" font-weight="600" text-anchor="middle">/</text>
<rect class="s fs" x="126" y="40" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="146" y="58.32" font-size="12" font-weight="600" text-anchor="middle">b</text>
<rect class="s fs" x="174" y="40" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="194" y="58.32" font-size="12" font-weight="600" text-anchor="middle">=</text>
<rect class="a af" x="222" y="40" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="242" y="58.32" font-size="12" font-weight="600" text-anchor="middle">c</text>
<text class="ta" x="242" y="84" font-size="10" text-anchor="middle">scored</text>
<text class="t" x="280" y="59" font-size="11" font-weight="600">a guess: ln 97 = 4.575</text>
<text class="t" x="16" y="124" font-size="11.5" font-weight="700">the authors&#x27; code (openai/grok): every token after =</text>
<rect class="s fs" x="30" y="136" width="52" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="56" y="154.32" font-size="12" font-weight="600" text-anchor="middle">&lt;eos&gt;</text>
<rect class="s fs" x="90" y="136" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="110" y="154.32" font-size="12" font-weight="600" text-anchor="middle">a</text>
<rect class="s fs" x="138" y="136" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="158" y="154.32" font-size="12" font-weight="600" text-anchor="middle">/</text>
<rect class="s fs" x="186" y="136" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="206" y="154.32" font-size="12" font-weight="600" text-anchor="middle">b</text>
<rect class="s fs" x="234" y="136" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="254" y="154.32" font-size="12" font-weight="600" text-anchor="middle">=</text>
<rect class="a af" x="282" y="136" width="40" height="28" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="302" y="154.32" font-size="12" font-weight="600" text-anchor="middle">c</text>
<text class="ta" x="302" y="180" font-size="10" text-anchor="middle">scored</text>
<rect class="a af" x="330" y="136" width="52" height="28" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="356" y="154.32" font-size="12" font-weight="600" text-anchor="middle">&lt;eos&gt;</text>
<text class="ta" x="356" y="180" font-size="10" text-anchor="middle">scored</text>
<text class="ta" x="400" y="155" font-size="11" font-weight="600">a guess: (4.575 + 0) / 2 = 2.287</text>
<text class="tm" x="16" y="226" font-size="10.5">Figure 4&#x27;s chance line is about 2.3: half of ln 97, as the code scores it. Its peak, about 20, is so about 9 times its own</text>
<text class="tm" x="16" y="242" font-size="10.5">chance line; our runs score c alone and set their loss beside 4.575.</text>
</svg>
