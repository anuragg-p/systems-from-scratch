<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" fill="none">
<title>One equation as the model sees it: five tokens, a symbol each; the model reads the first four and is scored on its guess at the fifth</title>
<defs><marker id="tokens1401-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tokens1401-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tokens1401-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="16" y="20" font-size="11.5" font-weight="700">the equation 20 / 15 = 66, as the paper writes it: &lt;x&gt;&lt;op&gt;&lt;y&gt;&lt;=&gt;&lt;x o y&gt;</text>
<rect class="s fs" x="40" y="44" width="70" height="34" rx="6" stroke-width="1.5"/>
<text class="t mono" x="75" y="66.4" font-size="15" font-weight="700" text-anchor="middle">20</text>
<text class="tm mono" x="75" y="96" font-size="10.5" text-anchor="middle">token 20</text>
<rect class="s fs" x="126" y="44" width="70" height="34" rx="6" stroke-width="1.5"/>
<text class="t mono" x="161" y="66.4" font-size="15" font-weight="700" text-anchor="middle">/</text>
<text class="tm mono" x="161" y="96" font-size="10.5" text-anchor="middle">token 100</text>
<rect class="s fs" x="212" y="44" width="70" height="34" rx="6" stroke-width="1.5"/>
<text class="t mono" x="247" y="66.4" font-size="15" font-weight="700" text-anchor="middle">15</text>
<text class="tm mono" x="247" y="96" font-size="10.5" text-anchor="middle">token 15</text>
<rect class="s fs" x="298" y="44" width="70" height="34" rx="6" stroke-width="1.5"/>
<text class="t mono" x="333" y="66.4" font-size="15" font-weight="700" text-anchor="middle">=</text>
<text class="tm mono" x="333" y="96" font-size="10.5" text-anchor="middle">token 97</text>
<rect class="a af" x="384" y="44" width="70" height="34" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="419" y="66.4" font-size="15" font-weight="700" text-anchor="middle">66</text>
<text class="ta mono" x="419" y="96" font-size="10.5" text-anchor="middle">token 66</text>
<path class="s" d="M40 102 L40 108 L368 108 L368 102" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="204" y="126" font-size="11" font-weight="600" text-anchor="middle">what the model reads</text>
<text class="ta" x="419" y="126" font-size="11" font-weight="600" text-anchor="middle">what it must guess</text>
<rect class="s fs" x="16" y="146" width="180" height="34" rx="6" stroke-width="1.5"/>
<text class="t" x="106" y="166.78" font-size="10.5" font-weight="600" text-anchor="middle">the GPT reads 20 / 15 =</text>
<rect class="s f" x="222" y="146" width="186" height="34" rx="6" stroke-width="1.5"/>
<text class="t" x="315" y="166.78" font-size="10.5" font-weight="600" text-anchor="middle">101 scores at its last position</text>
<line class="s" x1="198" y1="163" x2="219" y2="163" stroke-width="1.5" stroke-linecap="round" marker-end="url(#tokens1401-ah)"/>
<rect class="a af" x="434" y="146" width="190" height="34" rx="6" stroke-width="1.5"/>
<text class="ta" x="529" y="161" font-size="10.5" font-weight="600" text-anchor="middle">its guess: the highest</text>
<text class="ta" x="529" y="174" font-size="10" text-anchor="middle">its loss: -ln p(66)</text>
<line class="s" x1="410" y1="163" x2="431" y2="163" stroke-width="1.5" stroke-linecap="round" marker-end="url(#tokens1401-ah)"/>
<text class="t" x="16" y="202" font-size="10.5">Why 66: 66 x 15 = 990 = 10 x 97 + 20, so 66 times 15 is 20 mod 97, and 20 / 15 = 66.</text>
<text class="tm" x="16" y="220" font-size="10.5">Tokens 0 to 96 are the residues; = is 97, + is 98, - is 99, / is 100: nothing says that 5 comes after 4.</text>
</svg>
