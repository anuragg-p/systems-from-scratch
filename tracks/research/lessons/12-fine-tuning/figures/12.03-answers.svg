<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" fill="none">
<title>The same six prompts, greedy, each written until it holds a line break and the end marker or 9 tokens: GPT-2 as it is, which goes on with the user&#x27;s turn; and after 80 LoRA steps (seed 1), which answers in the template and stops</title>
<defs><marker id="answers1203-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="answers1203-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="answers1203-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="20" y="22" font-size="11" font-weight="700">prompt (in the template)</text>
<text class="t" x="258" y="22" font-size="11" font-weight="700">GPT-2 as it is</text>
<text class="ta" x="458" y="22" font-size="11" font-weight="700">after tuning</text>
<text class="t mono" x="20" y="46" font-size="10">Give the larger number: 68 or 17.</text>
<text class="tm" x="20" y="61" font-size="9.5">larger; right: 68</text>
<text class="tm mono" x="258" y="46" font-size="10">Give the smaller number: 0 ...</text>
<text class="ta mono" x="458" y="46" font-size="10" font-weight="700">68\n&lt;|end|&gt;</text>
<text class="ta" x="458" y="61" font-size="9.5" font-weight="600">right</text>
<line class="m" x1="20" y1="76" x2="620" y2="76" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="20" y="92" font-size="10">Make curtsy all capitals.</text>
<text class="tm" x="20" y="107" font-size="9.5">upper; right: CURTSY</text>
<text class="tm mono" x="258" y="92" font-size="10">Make a curtsy all capitals....</text>
<text class="t mono" x="458" y="92" font-size="10">TACHT\n&lt;|end|&gt;</text>
<text class="tm" x="458" y="107" font-size="9.5">wrong</text>
<line class="m" x1="20" y1="122" x2="620" y2="122" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="20" y="138" font-size="10">Of 55 and 81, which is greater?</text>
<text class="tm" x="20" y="153" font-size="9.5">larger; right: 81</text>
<text class="tm mono" x="258" y="138" font-size="10">Of 55 and 81, which is grea...</text>
<text class="ta mono" x="458" y="138" font-size="10" font-weight="700">81\n&lt;|end|&gt;</text>
<text class="ta" x="458" y="153" font-size="9.5" font-weight="600">right</text>
<line class="m" x1="20" y1="168" x2="620" y2="168" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="20" y="184" font-size="10">Convert the word lout to upper case.</text>
<text class="tm" x="20" y="199" font-size="9.5">upper; right: LOUT</text>
<text class="tm mono" x="258" y="184" font-size="10">Convert the word lout to lo...</text>
<text class="t mono" x="458" y="184" font-size="10">lout\n&lt;|end|&gt;</text>
<text class="tm" x="458" y="199" font-size="9.5">wrong</text>
<line class="m" x1="20" y1="214" x2="620" y2="214" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="20" y="230" font-size="10">Which is smaller, 47 or 59?</text>
<text class="tm" x="20" y="245" font-size="9.5">smaller; right: 47</text>
<text class="tm mono" x="258" y="230" font-size="10">Which is larger, 47 or 59?\...</text>
<text class="t mono" x="458" y="230" font-size="10">59\n&lt;|end|&gt;</text>
<text class="tm" x="458" y="245" font-size="9.5">wrong</text>
<line class="m" x1="20" y1="260" x2="620" y2="260" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="20" y="276" font-size="10">What is the lesser of 0 and 55?</text>
<text class="tm" x="20" y="291" font-size="9.5">smaller; right: 0</text>
<text class="tm mono" x="258" y="276" font-size="10">What is the lesser of 0 and...</text>
<text class="t mono" x="458" y="276" font-size="10">55\n&lt;|end|&gt;</text>
<text class="tm" x="458" y="291" font-size="9.5">wrong</text>
<text class="tm" x="20" y="330" font-size="10.5">\n is a line break. Only the first line is scored: the answer, against the right one, exactly.</text>
</svg>
