<text class="t" x="20" y="24" font-size="11.5" font-weight="700">A question, and its intent (one of 77)</text>
<text class="t" x="20" y="46" font-size="11">&quot;How do I locate my card?&quot;</text>
<text class="ta mono" x="620" y="46" font-size="10.5" font-weight="600" text-anchor="end">card_arrival</text>
<text class="t" x="20" y="67" font-size="11">&quot;I&#x27;ve tried my card a bunch of times and it never worked.&quot;</text>
<text class="ta mono" x="620" y="67" font-size="10.5" font-weight="600" text-anchor="end">card_not_working</text>
<text class="t" x="20" y="88" font-size="11">&quot;I payed with a card and was charged an extra fee&quot;</text>
<text class="ta mono" x="620" y="88" font-size="10.5" font-weight="600" text-anchor="end">card_payment_fee_charged</text>
<text class="t" x="20" y="109" font-size="11">&quot;When I made a transfer, there was a fee.  Why?&quot;</text>
<text class="ta mono" x="620" y="109" font-size="10.5" font-weight="600" text-anchor="end">transfer_fee_charged</text>
<text class="t" x="20" y="130" font-size="11">&quot;I see some fees for cash withdraw.&quot;</text>
<text class="ta mono" x="620" y="130" font-size="10.5" font-weight="600" text-anchor="end">cash_withdrawal_charge</text>
<text class="t" x="20" y="151" font-size="11">&quot;What would lead to my top up still pending?&quot;</text>
<text class="ta mono" x="620" y="151" font-size="10.5" font-weight="600" text-anchor="end">pending_top_up</text>
<text class="t" x="20" y="196" font-size="11.5" font-weight="700">The parts</text>
