<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>One weight of GPT-2, W_q of a block (768 x 768), frozen, and LoRA&#x27;s change beside it: B (768 x r) times A (r x 768), started at 0; what it trains at ranks 1, 4 and 8, for one matrix and for W_q and W_v of all 12 blocks</title>
<defs><marker id="adapter1202-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="adapter1202-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="adapter1202-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="30" font-size="11.5" font-weight="700">h = W x + (alpha / r) B A x</text>
<rect class="m fs" x="24" y="52" width="150" height="150" rx="3" stroke-width="1.5"/>
<text class="t mono" x="99" y="123" font-size="16" font-weight="700" text-anchor="middle">W</text>
<text class="tm" x="99" y="141" font-size="10.5" text-anchor="middle">frozen</text>
<text class="tm mono" x="99" y="218" font-size="10.5" text-anchor="middle">768 x 768 = 589,824</text>
<text class="t" x="188" y="133" font-size="18" font-weight="700" text-anchor="middle">+</text>
<rect class="a af" x="204" y="52" width="14" height="150" rx="2" stroke-width="1.5"/>
<text class="ta mono" x="211" y="46" font-size="12" font-weight="700" text-anchor="middle">B</text>
<text class="ta mono" x="211" y="218" font-size="10" text-anchor="middle">768 x r</text>
<text class="t mono" x="228" y="131" font-size="12" text-anchor="middle">x</text>
<rect class="a af" x="238" y="120" width="150" height="14" rx="2" stroke-width="1.5"/>
<text class="ta mono" x="313" y="115" font-size="12" font-weight="700" text-anchor="middle">A</text>
<text class="ta mono" x="313" y="151" font-size="10" text-anchor="middle">r x 768</text>
<text class="tm" x="313" y="171" font-size="10" text-anchor="middle">A: random; B: all 0,</text>
<text class="tm" x="313" y="185" font-size="10" text-anchor="middle">so B A starts at 0</text>
<text class="tm" x="204" y="236" font-size="9.5">(r drawn wider than it is: at r = 8, B is 1 % as wide as W)</text>
<text class="tm" x="384" y="30" font-size="10">r</text>
<text class="tm" x="408" y="30" font-size="10">one matrix</text>
<text class="tm" x="472" y="30" font-size="10">all 24</text>
<text class="tm" x="540" y="30" font-size="10">of GPT-2</text>
<text class="tm" x="590" y="30" font-size="10">and head</text>
<text class="t mono" x="390" y="56" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text class="t mono" x="408" y="56" font-size="11">1,536</text>
<text class="t mono" x="472" y="56" font-size="11">36,864</text>
<text class="t mono" x="540" y="56" font-size="11">0.030%</text>
<text class="t mono" x="590" y="56" font-size="11">0.077%</text>
<text class="t mono" x="390" y="82" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text class="t mono" x="408" y="82" font-size="11">6,144</text>
<text class="t mono" x="472" y="82" font-size="11">147,456</text>
<text class="t mono" x="540" y="82" font-size="11">0.118%</text>
<text class="t mono" x="590" y="82" font-size="11">0.166%</text>
<text class="ta mono" x="390" y="108" font-size="11" font-weight="700" text-anchor="middle">8</text>
<text class="ta mono" x="408" y="108" font-size="11">12,288</text>
<text class="ta mono" x="472" y="108" font-size="11">294,912</text>
<text class="ta mono" x="540" y="108" font-size="11">0.237%</text>
<text class="ta mono" x="590" y="108" font-size="11">0.285%</text>
<text class="tm" x="384" y="150" font-size="10.5">one matrix: 2 x 768 x r (A and B)</text>
<text class="tm" x="384" y="166" font-size="10.5">all 24: W_q and W_v of 12 blocks,</text>
<text class="tm" x="384" y="180" font-size="10.5">2 x 24 x 768 x r, the paper&#x27;s count</text>
<text class="tm" x="384" y="196" font-size="10.5">of GPT-2: of its 124,439,808</text>
<text class="tm" x="384" y="210" font-size="10.5">and head: with the classifier&#x27;s 59,213</text>
<text class="tm" x="24" y="284" font-size="10.5">alpha / r scales the change: alpha = 8 at every rank, so r = 1&#x27;s B A counts 8 times, r = 8&#x27;s once.</text>
</svg>
