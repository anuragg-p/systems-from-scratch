<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" fill="none">
<title>The baseline: a question as a bag of words, one count for each of the 1,527 words of the training questions, read by a Linear layer; the order of the words is gone</title>
<defs><marker id="bag1201-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="bag1201-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="bag1201-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="20" y="24" font-size="11.5" font-weight="700">&quot;My top up says it is still pending&quot;</text>
<rect class="s f" x="20" y="36" width="22.6" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="31.3" y="49.78" font-size="10.5" text-anchor="middle">my</text>
<rect class="s f" x="47.6" y="36" width="28.9" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="62.05" y="49.78" font-size="10.5" text-anchor="middle">top</text>
<rect class="s f" x="81.5" y="36" width="22.6" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="92.8" y="49.78" font-size="10.5" text-anchor="middle">up</text>
<rect class="s f" x="109.1" y="36" width="35.2" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="126.7" y="49.78" font-size="10.5" text-anchor="middle">says</text>
<rect class="s f" x="149.3" y="36" width="22.6" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="160.6" y="49.78" font-size="10.5" text-anchor="middle">it</text>
<rect class="s f" x="176.9" y="36" width="22.6" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="188.2" y="49.78" font-size="10.5" text-anchor="middle">is</text>
<rect class="s f" x="204.5" y="36" width="41.5" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="225.25" y="49.78" font-size="10.5" text-anchor="middle">still</text>
<rect class="s f" x="251" y="36" width="54.1" height="20" rx="3" stroke-width="1.5"/>
<text class="t mono" x="278.05" y="49.78" font-size="10.5" text-anchor="middle">pending</text>
<text class="tm" x="316.1" y="50" font-size="10">words(): letters, digits, &#x27;, in lower case</text>
<text class="tm" x="20" y="84" font-size="10.5">its counts: a row of 1,527 numbers, one for each training word, in the order first seen</text>
<rect class="s fs" x="20" y="92" width="600" height="22" rx="2" stroke-width="1.5"/>
<rect class="a fa" x="26.56" y="92" width="3" height="22" rx="0"/>
<rect class="a fa" x="37.95" y="92" width="3" height="22" rx="0"/>
<rect class="a fa" x="38.34" y="92" width="3" height="22" rx="0"/>
<rect class="a fa" x="38.74" y="92" width="3" height="22" rx="0"/>
<rect class="a fa" x="39.13" y="92" width="3" height="22" rx="0"/>
<rect class="a fa" x="39.52" y="92" width="3" height="22" rx="0"/>
<rect class="a fa" x="32.45" y="92" width="3" height="22" rx="0"/>
<rect class="a fa" x="39.91" y="92" width="3" height="22" rx="0"/>
<text class="ta mono" x="20" y="130" font-size="10">my: 20  top: 49  up: 50  says: 51  it: 52  is: 53  still: 35  pending: 54</text>
<text class="tm" x="620" y="130" font-size="10" text-anchor="end">(word: its column)</text>
<text class="tm" x="20" y="150" font-size="10.5">8 of the 1,527 are 1, the rest 0. The same words in any order make the same row:</text>
<text class="tm mono" x="20" y="166" font-size="10.5">&quot;pending still is it says up top My&quot; too.</text>
<rect class="s f" x="20" y="184" width="236" height="34" rx="5" stroke-width="1.5"/>
<text class="t mono" x="138" y="199" font-size="11" font-weight="700" text-anchor="middle">Linear 1,527 -&gt; 77</text>
<text class="tm mono" x="138" y="212.5" font-size="10.5" text-anchor="middle">117,656 weights, all trained</text>
<line class="s" x1="258" y1="201" x2="290" y2="201" stroke-width="1.5" stroke-linecap="round" marker-end="url(#bag1201-ah)"/>
<text class="t" x="298" y="197" font-size="10.5">77 scores; trained as the head is, at its own rate,</text>
<text class="t" x="298" y="213" font-size="10.5">chosen on valid (AdamW 0.03)</text>
