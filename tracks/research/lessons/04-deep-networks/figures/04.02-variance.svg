<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" fill="none">
<title>One unit of a layer: 64 inputs, each times its weight, summed, then the relu</title>
<defs><marker id="variance0402-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="variance0402-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="variance0402-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle class="s f" cx="40" cy="40" r="13" stroke-width="1.5"/>
<text class="t mono" x="40" y="44" font-size="11" text-anchor="middle">x1</text>
<line class="m" x1="55" y1="40" x2="304" y2="116" stroke-width="1.5" stroke-linecap="round" marker-end="url(#variance0402-am)"/>
<text class="tm mono" x="145" y="60.6" font-size="10.5">w1</text>
<circle class="s f" cx="40" cy="78" r="13" stroke-width="1.5"/>
<text class="t mono" x="40" y="82" font-size="11" text-anchor="middle">x2</text>
<line class="m" x1="55" y1="78" x2="304" y2="116" stroke-width="1.5" stroke-linecap="round" marker-end="url(#variance0402-am)"/>
<text class="tm mono" x="145" y="85.3" font-size="10.5">w2</text>
<circle class="s f" cx="40" cy="116" r="13" stroke-width="1.5"/>
<text class="t mono" x="40" y="120" font-size="11" text-anchor="middle">x3</text>
<line class="m" x1="55" y1="116" x2="304" y2="116" stroke-width="1.5" stroke-linecap="round" marker-end="url(#variance0402-am)"/>
<text class="tm mono" x="145" y="110" font-size="10.5">w3</text>
<circle class="s f" cx="40" cy="182" r="13" stroke-width="1.5"/>
<text class="t mono" x="40" y="186" font-size="11" text-anchor="middle">x64</text>
<line class="m" x1="55" y1="182" x2="304" y2="116" stroke-width="1.5" stroke-linecap="round" marker-end="url(#variance0402-am)"/>
<text class="tm mono" x="145" y="152.9" font-size="10.5">w64</text>
<text class="tm mono" x="40" y="154" font-size="12" text-anchor="middle">...</text>
<circle class="s f" cx="330" cy="116" r="24" stroke-width="1.5"/>
<text class="t" x="330" y="121" font-size="12" font-weight="600" text-anchor="middle">sum</text>
<line class="s" x1="356" y1="116" x2="438" y2="116" stroke-width="1.5" stroke-linecap="round" marker-end="url(#variance0402-ah)"/>
<rect class="s f" x="440" y="100" width="60" height="32" rx="6" stroke-width="1.5"/>
<text class="t mono" x="470" y="120.32" font-size="12" text-anchor="middle">relu</text>
<line class="a" x1="502" y1="116" x2="590" y2="116" stroke-width="1.5" stroke-linecap="round" marker-end="url(#variance0402-aa)"/>
<text class="ta mono" x="560" y="106" font-size="11.5" font-weight="600" text-anchor="middle">out</text>
<text class="tm" x="14" y="216" font-size="11">each input:</text>
<text class="t mono" x="14" y="231" font-size="11.5">E[x^2] = q</text>
<text class="tm" x="177" y="216" font-size="11" text-anchor="middle">each weight: mean 0,</text>
<text class="t mono" x="177" y="231" font-size="11.5" text-anchor="middle">Var(w), apart from x</text>
<text class="t mono" x="340" y="166" font-size="11.5" text-anchor="middle">z = w1 x1 + ... + w64 x64</text>
<text class="ta mono" x="340" y="184" font-size="12" font-weight="600" text-anchor="middle">Var(z) = 64 Var(w) q</text>
<text class="tm" x="520" y="158" font-size="11" text-anchor="middle">z is even about 0; relu</text>
<text class="tm" x="520" y="173" font-size="11" text-anchor="middle">keeps the half above 0:</text>
<text class="ta mono" x="520" y="191" font-size="12" font-weight="600" text-anchor="middle">E[out^2] = Var(z) / 2</text>
<text class="ta mono" x="520" y="231" font-size="12" font-weight="700" text-anchor="middle">same size: Var(w) = 2 / 64</text>
</svg>
