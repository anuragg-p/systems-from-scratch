<path class="s" d="M64.0 109.4 L69.9 111.4 L75.8 113.1 L81.6 113.6 L87.5 115.2 L93.4 116.2 L99.3 118.9 L105.1 121.0 L111.0 121.7 L116.9 124.2 L122.8 126.0 L128.7 127.3 L134.5 129.1 L140.4 132.4 L146.3 133.6 L152.2 135.2 L158.0 136.4 L163.9 137.7 L169.8 139.3 L175.7 141.3 L181.6 142.6 L187.4 144.9 L193.3 145.5 L199.2 146.9 L205.1 149.5 L210.9 152.5 L216.8 154.1 L222.7 155.5 L228.6 158.4 L234.4 159.9 L240.3 163.0 L246.2 165.8 L252.1 167.7 L258.0 170.4 L263.8 172.1 L269.7 174.4 L275.6 175.1 L281.5 177.0 L287.3 180.0 L293.2 181.4 L299.1 182.8 L305.0 184.1 L310.9 185.3 L316.7 186.0 L322.6 189.0 L328.5 189.7 L334.4 191.4 L340.2 193.1 L346.1 196.7 L352.0 199.3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t mono" x="360" y="197.2675955440691" font-size="10.5" font-weight="600">N(0, 1/n)</text>
<text class="tm" x="360" y="211.2675955440691" font-size="10">x0.71 a layer</text>
<text class="t" x="470" y="36" font-size="12" font-weight="700">three fixes</text>
<text class="t" x="470" y="60" font-size="11" font-weight="700">1. the right starting size</text>
<text class="ta mono" x="470" y="76" font-size="10.5">w ~ N(0, 2 / fan_in)</text>
<text class="tm" x="470" y="90" font-size="10">for ReLU: He et al.</text>
<text class="t" x="470" y="122" font-size="11" font-weight="700">2. normalise each layer</text>
<text class="ta mono" x="470" y="138" font-size="10.5">(h - mean) / std</text>
<text class="tm" x="470" y="152" font-size="10">batch norm: over the batch</text>
<text class="tm" x="470" y="166" font-size="10">layer norm: over features</text>
<text class="t" x="470" y="198" font-size="11" font-weight="700">3. a shortcut</text>
<text class="ta mono" x="470" y="214" font-size="10.5">x + F(x)</text>
<text class="tm" x="470" y="228" font-size="10">the gradient has a path</text>
<text class="tm" x="470" y="242" font-size="10">that skips F</text>
<text class="tm" x="24" y="270" font-size="11">Weights in a ReLU network, n inputs a layer: the variance 2/n keeps the size; a little less fades,</text>
<text class="tm" x="24" y="286" font-size="11">a little more explodes. Gradients do the same going back.  (Lines computed here: 64 wide, at init.)</text>
</svg>
