<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Thirty relu layers deep, a signal shrinks at every layer unless the weights start at the right size; normalisation and shortcuts also keep it the same</title>
<defs><marker id="r04-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r04-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line class="m" x1="64" y1="214" x2="352" y2="214" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="64" y1="214" x2="64" y2="38" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="60" y1="214.0" x2="64" y2="214.0" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="56" y="217.5" font-size="9.5" text-anchor="end">1e-8</text>
<line class="m" x1="60" y1="174.0" x2="64" y2="174.0" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="56" y="177.5" font-size="9.5" text-anchor="end">1e-6</text>
<line class="m" x1="60" y1="134.0" x2="64" y2="134.0" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="56" y="137.5" font-size="9.5" text-anchor="end">1e-4</text>
<line class="m" x1="60" y1="93.99999999999999" x2="64" y2="93.99999999999999" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="56" y="97.49999999999999" font-size="9.5" text-anchor="end">1e-2</text>
<line class="m" x1="60" y1="54.0" x2="64" y2="54.0" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="56" y="57.5" font-size="9.5" text-anchor="end">1</text>
<line class="m" x1="64.0" y1="214" x2="64.0" y2="218" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="64.0" y="230" font-size="9.5" text-anchor="middle">1</text>
<line class="m" x1="156.57142857142858" y1="214" x2="156.57142857142858" y2="218" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="156.57142857142858" y="230" font-size="9.5" text-anchor="middle">10</text>
<line class="m" x1="259.42857142857144" y1="214" x2="259.42857142857144" y2="218" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="259.42857142857144" y="230" font-size="9.5" text-anchor="middle">20</text>
<line class="m" x1="352.0" y1="214" x2="352.0" y2="218" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="352.0" y="230" font-size="9.5" text-anchor="middle">29</text>
<text class="tm" x="64" y="30" font-size="10.5">spread of each layer&#x27;s output over a batch, log scale</text>
<text class="tm" x="208.0" y="246" font-size="10.5" text-anchor="middle">relu layer</text>
<path class="s" d="M64.0 63.4 L74.3 73.1 L84.6 83.1 L94.9 92.2 L105.1 101.4 L115.4 108.7 L125.7 115.8 L136.0 124.3 L146.3 131.1 L156.6 140.1 L166.9 149.1 L177.1 155.2 L187.4 163.3 L197.7 171.4 L208.0 179.1 L218.3 187.8 L228.6 195.0 L238.9 202.1 L249.1 211.1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="262.2857142857143" y="188" font-size="10.5" font-weight="600">nn.Linear&#x27;s start</text>
<text class="tm" x="262.2857142857143" y="202" font-size="10">x0.41 a layer, on below 1e-8</text>
<path class="s" d="M64.0 56.1 L74.3 60.9 L84.6 64.9 L94.9 70.0 L105.1 74.4 L115.4 78.3 L125.7 80.7 L136.0 84.2 L146.3 87.6 L156.6 90.4 L166.9 93.6 L177.1 98.7 L187.4 101.0 L197.7 104.7 L208.0 109.2 L218.3 111.9 L228.6 117.5 L238.9 119.6 L249.1 123.3 L259.4 126.9 L269.7 129.1 L280.0 130.3 L290.3 133.7 L300.6 137.8 L310.9 139.7 L321.1 142.2 L331.4 144.1 L341.7 148.7 L352.0 152.6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="360" y="150.60301524385238" font-size="10.5" font-weight="600">Glorot&#x27;s</text>
<text class="tm" x="360" y="164.60301524385238" font-size="10">x0.71 a layer</text>
<path class="a" d="M64.0 55.8 L74.3 57.5 L84.6 58.6 L94.9 60.6 L105.1 62.0 L115.4 62.9 L125.7 62.3 L136.0 62.8 L146.3 63.2 L156.6 63.0 L166.9 63.2 L177.1 65.3 L187.4 64.5 L197.7 65.2 L208.0 66.7 L218.3 66.4 L228.6 69.0 L238.9 68.0 L249.1 68.8 L259.4 69.3 L269.7 68.5 L280.0 66.7 L290.3 67.1 L300.6 68.3 L310.9 67.1 L321.1 66.6 L331.4 65.5 L341.7 67.1 L352.0 68.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta" x="360" y="65.97381856221486" font-size="10.5" font-weight="600">He&#x27;s</text>
<text class="ta" x="360" y="79.97381856221486" font-size="10">x1 a layer</text>
<text class="t" x="470" y="36" font-size="12" font-weight="700">three fixes</text>
<text class="t" x="470" y="60" font-size="11" font-weight="700">1. the right starting size</text>
<text class="ta mono" x="470" y="76" font-size="10.5">w ~ N(0, 2 / fan_in)</text>
<text class="tm" x="470" y="90" font-size="10">for ReLU: He et al.</text>
<text class="t" x="470" y="122" font-size="11" font-weight="700">2. normalise each layer</text>
<text class="ta mono" x="470" y="138" font-size="10.5">(h - mean) / std</text>
<text class="tm" x="470" y="152" font-size="10">batch norm: over the batch</text>
<text class="tm" x="470" y="166" font-size="10">layer norm: over features</text>
<text class="t" x="470" y="198" font-size="11" font-weight="700">3. a shortcut</text>
<text class="ta mono" x="470" y="214" font-size="10.5">x + F(x)</text>
<text class="tm" x="470" y="228" font-size="10">the gradient has a path</text>
<text class="tm" x="470" y="242" font-size="10">that skips F</text>
<text class="tm" x="24" y="270" font-size="10.5">Each relu layer, its units summing n inputs, multiplies the size of the signal by sqrt(n Var(w) / 2):</text>
<text class="tm" x="24" y="286" font-size="10.5">0.41 for nn.Linear&#x27;s start, 0.71 for Glorot&#x27;s, 1 for He&#x27;s.  (Computed here: 30 layers, 64 wide, random inputs.)</text>
</svg>
