<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" fill="none">
<title>What the track&#x27;s project ships, what it fetches by a pinned command, and what it never ships, with their sizes: from the files on disk and from data/fetch.py&#x27;s pins</title>
<defs><marker id="repo1503-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="repo1503-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="repo1503-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="16" y="22" font-size="11.5" font-weight="700">in the repository</text>
<rect class="s f" x="16" y="34" width="300" height="32" rx="6" stroke-width="1.5"/>
<text class="t" x="166" y="48" font-size="10" text-anchor="middle">the code: every .py of the project</text>
<text class="tm" x="166" y="61" font-size="10" text-anchor="middle">0.658 MB</text>
<rect class="s f" x="16" y="74" width="300" height="32" rx="6" stroke-width="1.5"/>
<text class="t" x="166" y="88" font-size="10" text-anchor="middle">data/tinyshakespeare.txt, public domain</text>
<text class="tm" x="166" y="101" font-size="10" text-anchor="middle">1.12 MB</text>
<rect class="s f" x="16" y="114" width="300" height="32" rx="6" stroke-width="1.5"/>
<text class="t" x="166" y="128" font-size="10" text-anchor="middle">experiments/recorded/: every recorded run</text>
<text class="tm" x="166" y="141" font-size="10" text-anchor="middle">0.86 MB</text>
<text class="ta" x="16" y="170" font-size="11.5" font-weight="700">never in it: weights</text>
<rect class="a af" x="16" y="182" width="300" height="44" rx="6" stroke-width="1.5"/>
<text class="ta" x="166" y="202" font-size="10.5" text-anchor="middle">a checkpoint is made again by its run&#x27;s command</text>
<text class="tm" x="166" y="214.5" font-size="9.5" text-anchor="middle">from its config.json and its seed</text>
<text class="t" x="340" y="22" font-size="11.5" font-weight="700">fetched once: python3 -m data.fetch &lt;name&gt;</text>
<rect class="s fs" x="340" y="34" width="284" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="482" y="51.78" font-size="10.5" text-anchor="middle">mnist: 11.6 MB</text>
<rect class="s fs" x="340" y="68" width="284" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="482" y="85.78" font-size="10.5" text-anchor="middle">cifar10: 184 MB</text>
<rect class="s fs" x="340" y="102" width="284" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="482" y="119.78" font-size="10.5" text-anchor="middle">gpt2: 550 MB</text>
<rect class="s fs" x="340" y="136" width="284" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="482" y="153.78" font-size="10.5" text-anchor="middle">tinystories: 86.6 MB</text>
<rect class="s fs" x="340" y="170" width="284" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="482" y="187.78" font-size="10.5" text-anchor="middle">smollm2: 271 MB</text>
<text class="tm" x="340" y="218" font-size="10.5">each file&#x27;s size and SHA-256 pinned; its licence in NOTICE</text>
<text class="tm" x="16" y="250" font-size="10.5">Sizes in MB (a million bytes); the downloads are the files kept, not the archives.</text>
</svg>
