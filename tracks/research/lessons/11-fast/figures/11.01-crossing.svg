<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>bench.time_to on the baseline&#x27;s seed 0: its held-out bits are logged every 10 steps, and the target is crossed between two rows; the crossing is put on the straight line from one to the other, in steps and in seconds alike</title>
<defs><marker id="crossing1101-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="crossing1101-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="crossing1101-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line class="m" x1="70" y1="202.5" x2="430" y2="202.5" stroke-width="0.75" stroke-opacity="0.6"/>
<text class="tm mono" x="64" y="206.01" font-size="10.5" text-anchor="end">3</text>
<line class="m" x1="70" y1="134.9" x2="430" y2="134.9" stroke-width="0.75" stroke-opacity="0.6"/>
<text class="tm mono" x="64" y="138.38" font-size="10.5" text-anchor="end">3.05</text>
<line class="m" x1="70" y1="67.3" x2="430" y2="67.3" stroke-width="0.75" stroke-opacity="0.6"/>
<text class="tm mono" x="64" y="70.75" font-size="10.5" text-anchor="end">3.1</text>
<line class="m" x1="79.73" y1="230" x2="79.73" y2="234" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="79.73" y="246" font-size="10.5" text-anchor="middle">150</text>
<line class="m" x1="177.03" y1="230" x2="177.03" y2="234" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="177.03" y="246" font-size="10.5" text-anchor="middle">170</text>
<line class="m" x1="274.32" y1="230" x2="274.32" y2="234" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="274.32" y="246" font-size="10.5" text-anchor="middle">190</text>
<rect class="m" x="70" y="30" width="360" height="200" rx="0" stroke-width="1.5"/>
<text class="tm" x="250" y="262" font-size="11.5" text-anchor="middle">step (the row&#x27;s step + 1 have been taken)</text>
<text class="tm" x="64" y="22" font-size="11.5">bits, validation</text>
<line class="m" x1="70" y1="202.51" x2="430" y2="202.51" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm" x="426" y="197.51" font-size="10.5" text-anchor="end">target 3.0</text>
<polyline class="m" points="79.7,57.1 128.4,142.0 177.0,116.1 225.7,141.2 274.3,202.9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<polyline class="a" points="225.7,141.2 274.3,202.9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="s f" cx="79.73" cy="57.05" r="3" stroke-width="1.5"/>
<circle class="s f" cx="128.38" cy="141.99" r="3" stroke-width="1.5"/>
<circle class="s f" cx="177.03" cy="116.11" r="3" stroke-width="1.5"/>
<circle class="a fa" cx="225.68" cy="141.2" r="4" stroke-width="1.5"/>
<circle class="a fa" cx="274.32" cy="202.95" r="4" stroke-width="1.5"/>
<circle class="a fa" cx="273.98" cy="202.51" r="5" stroke-width="1.5"/>
<text class="ta" x="233.68" y="133.2" font-size="10.5" font-weight="600">step 180: 3.0453</text>
<text class="ta" x="284.32" y="206.95" font-size="10.5" font-weight="600">step 190: 2.9997</text>
<text class="ta" x="460" y="50" font-size="11.5" font-weight="700">the crossing</text>
<text class="t mono" x="460" y="70" font-size="10.5">f = (3.0453 - 3.0) /</text>
<text class="t mono" x="460" y="85" font-size="10.5">    (3.0453 - 2.9997)</text>
<text class="t mono" x="460" y="100" font-size="10.5">  = 0.993</text>
<text class="t mono" x="460" y="124" font-size="10.5">steps: 180 + 1 + f x 10</text>
<text class="ta mono" x="460" y="139" font-size="10.5" font-weight="700">     = 190.9</text>
<text class="t" x="460" y="163" font-size="10.5">seconds: the same f between</text>
<text class="t" x="460" y="178" font-size="10.5">the clock at the two rows</text>
<text class="ta mono" x="460" y="193" font-size="10.5" font-weight="700">     = 7.16 s</text>
<text class="tm" x="20" y="292" font-size="10.5">A run under the target at its first row counts that row&#x27;s steps; one that never reaches it, None.</text>
</svg>
