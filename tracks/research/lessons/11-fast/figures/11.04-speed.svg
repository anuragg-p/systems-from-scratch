<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Sixteen bits on this CPU, against float32, on a log scale: one matrix product, a training step, the page&#x27;s runs trained alike, and the recorded benchmark&#x27;s step; autocast in bfloat16 makes every one slower</title>
<defs><marker id="speed1104-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="speed1104-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="speed1104-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="220" y="44" font-size="10.5" font-weight="600" text-anchor="end">one product, 2048 x 256 by 256 x 256</text>
<rect class="s f" x="230" y="30" width="18.27" height="16" rx="1" stroke-width="1.5"/>
<text class="t mono" x="253.27" y="42" font-size="10">0.1 ms float32</text>
<rect class="a af" x="230" y="50" width="177.27" height="16" rx="1" stroke-width="1.5"/>
<text class="ta mono" x="412.27" y="62" font-size="10">41.7 bfloat16</text>
<text class="ta" x="220" y="62" font-size="10.5" font-weight="700" text-anchor="end">x416.6 slower</text>
<text class="t" x="220" y="100" font-size="10.5" font-weight="600" text-anchor="end">a training step, the page&#x27;s GPT</text>
<rect class="s f" x="230" y="86" width="166.22" height="16" rx="1" stroke-width="1.5"/>
<text class="t mono" x="401.22" y="98" font-size="10">27.4 ms float32</text>
<rect class="a af" x="230" y="106" width="218.75" height="16" rx="1" stroke-width="1.5"/>
<text class="ta mono" x="453.75" y="118" font-size="10">201 bfloat16</text>
<text class="ta" x="220" y="118" font-size="10.5" font-weight="700" text-anchor="end">x7.3 slower</text>
<text class="t" x="220" y="156" font-size="10.5" font-weight="600" text-anchor="end">trained alike, 60 steps, ms a step</text>
<rect class="s f" x="230" y="142" width="168.96" height="16" rx="1" stroke-width="1.5"/>
<text class="t mono" x="403.96" y="154" font-size="10">30.4 ms float32</text>
<rect class="a af" x="230" y="162" width="225.43" height="16" rx="1" stroke-width="1.5"/>
<text class="ta mono" x="460.43" y="174" font-size="10">259 bfloat16</text>
<text class="ta" x="220" y="174" font-size="10.5" font-weight="700" text-anchor="end">x8.5 slower</text>
<text class="t" x="220" y="212" font-size="10.5" font-weight="600" text-anchor="end">the recorded benchmark, width 128</text>
<rect class="s f" x="230" y="198" width="183.35" height="16" rx="1" stroke-width="1.5"/>
<text class="t mono" x="418.35" y="210" font-size="10">52.5 ms float32</text>
<rect class="a af" x="230" y="218" width="271.11" height="16" rx="1" stroke-width="1.5"/>
<text class="ta mono" x="506.11" y="230" font-size="10">1,465 bfloat16</text>
<text class="ta" x="220" y="230" font-size="10.5" font-weight="700" text-anchor="end">x27.9 slower</text>
<line class="m" x1="230" y1="254" x2="520" y2="254" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="248.27" y1="254" x2="248.27" y2="258" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="248.27" y="270" font-size="10" text-anchor="middle">0.1</text>
<line class="m" x1="308.96" y1="254" x2="308.96" y2="258" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="308.96" y="270" font-size="10" text-anchor="middle">1</text>
<line class="m" x1="369.66" y1="254" x2="369.66" y2="258" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="369.66" y="270" font-size="10" text-anchor="middle">10</text>
<line class="m" x1="430.35" y1="254" x2="430.35" y2="258" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="430.35" y="270" font-size="10" text-anchor="middle">100</text>
<line class="m" x1="491.04" y1="254" x2="491.04" y2="258" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="491.04" y="270" font-size="10" text-anchor="middle">1,000</text>
<text class="tm" x="526" y="258" font-size="10.5">ms</text>
<text class="tm" x="16" y="292" font-size="10.5">This run at load 12.3; this PyTorch build says &quot;MKLDNN not found&quot;: no fast 16-bit products on this CPU.</text>
</svg>
