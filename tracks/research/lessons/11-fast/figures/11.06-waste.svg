<text class="ta" x="24" y="270" font-size="10.5" font-weight="600">SmolLM2 keeps 11,520 numbers a token: keys and values, 3 heads of 64, 30 blocks, 45 KiB in float32;</text>
<text class="ta" x="24" y="286" font-size="10.5" font-weight="600">its full window of 8,192 tokens 360 MiB, where a key and value head for each of its 9 query heads would keep 1,080.</text>
<text class="tm" x="24" y="306" font-size="10.5">GPT-2 small, 12 heads of 64 in 12 blocks, every head its own: 18,432 a token.</text>
