<line class="s" x1="320" y1="65" x2="320" y2="75" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="320" y="88" font-size="10" text-anchor="middle">256</text>
<line class="s" x1="460" y1="65" x2="460" y2="75" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="460" y="88" font-size="10" text-anchor="middle">258</text>
<line class="s" x1="600" y1="65" x2="600" y2="75" stroke-width="1.5" stroke-linecap="round"/>
