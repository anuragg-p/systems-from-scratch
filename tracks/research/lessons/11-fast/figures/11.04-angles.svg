<text class="t" x="40" y="230" font-size="10.5">Place 1001 becomes 1000: from 512 on bfloat16 has every 8th number.</text>
<text class="t" x="40" y="252" font-size="10.5">A query at place 257 was turned as if at 256, and an angle of 60 radians was out by up to an eighth.</text>
<text class="ta" x="40" y="274" font-size="10.5" font-weight="600">From 11.04 Rotary makes the angles in float32 and rounds only their cos and sin.</text>
