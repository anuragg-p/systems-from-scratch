<text class="t" x="40" y="126" font-size="11.5" font-weight="700">angles 60 to 60.875 radians, in eighths: bfloat16 has quarters there</text>
<line class="m" x1="40" y1="160" x2="600" y2="160" stroke-width="1.5" stroke-linecap="round"/>
