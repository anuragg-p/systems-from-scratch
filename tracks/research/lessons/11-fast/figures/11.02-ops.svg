<text class="tm mono" x="144.5" y="256" font-size="10">1.01 ms, 93 calls</text>
<text class="t" x="462" y="40" font-size="10.5" font-weight="700">attention&#x27;s scores and sums:</text>
<text class="t" x="462" y="55" font-size="10.5">32 windows x 4 heads: 128</text>
<text class="t" x="462" y="70" font-size="10.5">matrices of 64 x 16 a block,</text>
<text class="t" x="462" y="85" font-size="10.5">one at a time on this CPU:</text>
<text class="ta" x="462" y="106" font-size="10.5" font-weight="700">3,072 aten::select</text>
<text class="ta" x="462" y="121" font-size="10.5">in attention&#x27;s forward pass,</text>
<text class="ta" x="462" y="142" font-size="10.5" font-weight="700">16,976 operations under</text>
<text class="ta" x="462" y="157" font-size="10.5">BmmBackward0, 4.72 ms,</text>
<text class="ta" x="462" y="172" font-size="10.5">in the backward pass.</text>
<text class="t" x="462" y="193" font-size="10.5" font-weight="700">Next: mul, sum, copy_, add_,</text>
<text class="t" x="462" y="208" font-size="10.5">each a pass over memory:</text>
<text class="t" x="462" y="223" font-size="10.5">the turning, the norms, the</text>
<text class="t" x="462" y="238" font-size="10.5">gate, and their gradients.</text>
<text class="tm" x="20" y="322" font-size="10.5">All operations&#x27; own time: 36.7 ms a step under the profiler.</text>
