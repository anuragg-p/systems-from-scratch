<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" fill="none">
<title>One run: the settings from CONFIG and the command line, one seed, and the three files the run writes</title>
<defs><marker id="run0002-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="run0002-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="run0002-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="16" y="16" font-size="10.5">the command</text>
<rect class="a af" x="16" y="22" width="262" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="147" y="39.14" font-size="11.5" text-anchor="middle">curve lr=0.1 steps=300</text>
<text class="tm" x="16" y="68" font-size="10.5">CONFIG, at the top of curve.py</text>
<rect class="s fs" x="16" y="74" width="234" height="58" rx="6" stroke-width="1.5"/>
<text class="t mono" x="24" y="92" font-size="10.5">n_train=20, n_test=500,</text>
<text class="t mono" x="24" y="107" font-size="10.5">noise=0.2, degree=3, lr=0.5,</text>
<text class="t mono" x="24" y="122" font-size="10.5">steps=2000, seed=0</text>
<line class="s" x1="133" y1="134" x2="133" y2="152" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run0002-ah)"/>
<line class="a" x1="266" y1="48" x2="266" y2="152" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run0002-aa)"/>
<rect class="s f" x="16" y="156" width="262" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="147" y="174" font-size="12" text-anchor="middle">config()</text>
<text class="tm mono" x="147" y="187.5" font-size="10.5" text-anchor="middle">CONFIG, with lr and steps changed</text>
<line class="s" x1="147" y1="196" x2="147" y2="214" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run0002-ah)"/>
<rect class="s f" x="16" y="218" width="262" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="147" y="236" font-size="12" text-anchor="middle">Run(settings, seed 0)</text>
<text class="tm mono" x="147" y="249.5" font-size="10.5" text-anchor="middle">a folder, and rng = default_rng(0)</text>
<line class="s" x1="147" y1="258" x2="147" y2="276" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run0002-ah)"/>
<rect class="s f" x="16" y="280" width="262" height="92" rx="6" stroke-width="1.5"/>
<text class="tm" x="26" y="298" font-size="10.5">rng draws, in this order:</text>
<text class="t mono" x="26" y="316" font-size="11.5">20 training points</text>
<text class="t mono" x="26" y="332" font-size="11.5">500 test points</text>
<text class="tm" x="26" y="352" font-size="10.5">fit: a log line every 100 steps</text>
<text class="tm" x="26" y="366" font-size="10.5">finish: the final losses</text>
<text class="tm" x="16" y="396" font-size="10.5">Same settings and seed: the same draws,</text>
<text class="tm" x="16" y="410" font-size="10.5">the same arithmetic, the same bytes</text>
<text class="tm" x="16" y="424" font-size="10.5">in all three files.</text>
<text class="t mono" x="306" y="16" font-size="12" font-weight="700">runs/curve/seed0/</text>
<rect class="s fs" x="306" y="26" width="326" height="196" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="314" y="42" font-size="11.5" font-weight="700">config.json</text>
<text class="t mono" x="314" y="58" font-size="10">{</text>
<text class="t mono" x="314" y="72" font-size="10"> &quot;degree&quot;: 3,</text>
<text class="t mono" x="314" y="86" font-size="10"> &quot;label&quot;: &quot;&quot;,</text>
<text class="t mono" x="314" y="100" font-size="10"> &quot;lr&quot;: 0.1,</text>
<text class="t mono" x="314" y="114" font-size="10"> &quot;n_test&quot;: 500,</text>
<text class="t mono" x="314" y="128" font-size="10"> &quot;n_train&quot;: 20,</text>
<text class="t mono" x="314" y="142" font-size="10"> &quot;name&quot;: &quot;curve&quot;,</text>
<text class="t mono" x="314" y="156" font-size="10"> &quot;noise&quot;: 0.2,</text>
<text class="t mono" x="314" y="170" font-size="10"> &quot;out&quot;: &quot;runs&quot;,</text>
<text class="t mono" x="314" y="184" font-size="10"> &quot;seed&quot;: 0,</text>
<text class="t mono" x="314" y="198" font-size="10"> &quot;steps&quot;: 300</text>
<text class="t mono" x="314" y="212" font-size="10">}</text>
<rect class="s fs" x="306" y="230" width="326" height="84" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="314" y="246" font-size="11.5" font-weight="700">log.jsonl</text>
<text class="t mono" x="314" y="262" font-size="10">{&quot;step&quot;: 0, &quot;train_loss&quot;: 0.3875222021368206}</text>
<text class="t mono" x="314" y="276" font-size="10">{&quot;step&quot;: 100, &quot;train_loss&quot;: 0.0945808005082261}</text>
<text class="t mono" x="314" y="290" font-size="10">{&quot;step&quot;: 200, &quot;train_loss&quot;: 0.059205598958274354}</text>
<text class="t mono" x="314" y="304" font-size="10">{&quot;step&quot;: 300, &quot;train_loss&quot;: 0.03887749585318795}</text>
<rect class="s fs" x="306" y="322" width="326" height="84" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="314" y="338" font-size="11.5" font-weight="700">summary.json</text>
<text class="t mono" x="314" y="354" font-size="10">{</text>
<text class="t mono" x="314" y="368" font-size="10"> &quot;test_loss&quot;: 0.12262574609888452,</text>
<text class="t mono" x="314" y="382" font-size="10"> &quot;train_loss&quot;: 0.03887749585318795</text>
<text class="t mono" x="314" y="396" font-size="10">}</text>
<line class="m" x1="280" y1="238" x2="302" y2="38" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run0002-am)"/>
<line class="m" x1="280" y1="348" x2="302" y2="242" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run0002-am)"/>
<line class="m" x1="280" y1="362" x2="302" y2="334" stroke-width="1.5" stroke-linecap="round" marker-end="url(#run0002-am)"/>
</svg>
