<text class="t mono" x="584.67" y="203" font-size="10.5">25.1</text>
<text class="tm" x="20" y="256" font-size="10.5">A float64 keeps about 16 digits: a change near 1e-15 is rounding. Moving by 1000 places, the angles&#x27; own rounding shows.</text>
