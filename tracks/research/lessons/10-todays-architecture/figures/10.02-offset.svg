<text class="ta" x="240" y="51" font-size="11" font-weight="600" text-anchor="end">both moved 1 place</text>
<rect class="a af" x="250" y="40" width="38.96" height="16" rx="2" stroke-width="1.5"/>
<text class="ta mono" x="294.96" y="53" font-size="10.5">1.15e-14</text>
<text class="ta" x="240" y="81" font-size="11" font-weight="600" text-anchor="end">both moved 7 places</text>
