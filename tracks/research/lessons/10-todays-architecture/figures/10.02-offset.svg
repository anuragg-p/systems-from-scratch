<text class="tm mono" x="325.56" y="226" font-size="10" text-anchor="middle">1e-12</text>
<line class="m" x1="363.33" y1="30" x2="363.33" y2="210" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm mono" x="363.33" y="226" font-size="10" text-anchor="middle">1e-10</text>
<line class="m" x1="401.11" y1="30" x2="401.11" y2="210" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm mono" x="401.11" y="226" font-size="10" text-anchor="middle">1e-8</text>
