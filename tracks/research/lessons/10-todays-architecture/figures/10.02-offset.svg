<text class="tm mono" x="476.67" y="226" font-size="10" text-anchor="middle">1e-4</text>
<line class="m" x1="514.44" y1="30" x2="514.44" y2="210" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm mono" x="514.44" y="226" font-size="10" text-anchor="middle">1e-2</text>
<line class="m" x1="552.22" y1="30" x2="552.22" y2="210" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
