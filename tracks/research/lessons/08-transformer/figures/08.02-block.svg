<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" fill="none">
<title>One block at the page&#x27;s sizes: the residual stream, 64 numbers per position, runs straight through; attention and the MLP each read a layer-normalised copy and add their result back</title>
<defs><marker id="block0802-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="block0802-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="block0802-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line class="a" x1="22" y1="196" x2="626" y2="196" stroke-width="1.5" stroke-linecap="round" marker-end="url(#block0802-aa)"/>
<text class="ta" x="22" y="220" font-size="11" font-weight="600">x: the residual stream, 64 numbers at each position</text>
<text class="tm" x="626" y="220" font-size="10.5" text-anchor="end">to the next block</text>
<path class="s" d="M52 196 V 96 H 64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#block0802-ah)"/>
<rect class="s f" x="66" y="80" width="80" height="32" rx="6" stroke-width="1.5"/>
<text class="t" x="106" y="99.96" font-size="11" text-anchor="middle">layer norm</text>
<text class="tm mono" x="106" y="126" font-size="9.5" text-anchor="middle">128 weights</text>
<line class="s" x1="148" y1="96" x2="158" y2="96" stroke-width="1.5" stroke-linecap="round" marker-end="url(#block0802-ah)"/>
<rect class="s fs" x="160" y="70" width="146" height="52" rx="6" stroke-width="1.5"/>
<text class="t" x="233" y="94" font-size="12" font-weight="700" text-anchor="middle">attention</text>
<text class="tm" x="233" y="107" font-size="10" text-anchor="middle">4 heads of 16, causal</text>
<text class="tm mono" x="233" y="136" font-size="9.5" text-anchor="middle">16,640 weights</text>
<path class="s" d="M306 96 H 316 V 184" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#block0802-ah)"/>
<circle class="a af" cx="316" cy="196" r="10" stroke-width="1.5"/>
<text class="ta mono" x="316" y="200.5" font-size="14" font-weight="700" text-anchor="middle">+</text>
<text class="ta" x="184" y="40" font-size="11" font-weight="600" text-anchor="middle">between positions</text>
<text class="tm" x="310" y="174" font-size="9" text-anchor="end">dropout, in training</text>
<path class="s" d="M342 196 V 96 H 354" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#block0802-ah)"/>
<rect class="s f" x="356" y="80" width="80" height="32" rx="6" stroke-width="1.5"/>
<text class="t" x="396" y="99.96" font-size="11" text-anchor="middle">layer norm</text>
<text class="tm mono" x="396" y="126" font-size="9.5" text-anchor="middle">128 weights</text>
<line class="s" x1="438" y1="96" x2="448" y2="96" stroke-width="1.5" stroke-linecap="round" marker-end="url(#block0802-ah)"/>
<rect class="s fs" x="450" y="70" width="138" height="52" rx="6" stroke-width="1.5"/>
<text class="t" x="519" y="94" font-size="12" font-weight="700" text-anchor="middle">MLP</text>
<text class="tm" x="519" y="107" font-size="10" text-anchor="middle">64 -&gt; 256 -&gt; 64, GELU</text>
<text class="tm mono" x="519" y="136" font-size="9.5" text-anchor="middle">33,088 weights</text>
<path class="s" d="M588 96 H 598 V 184" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#block0802-ah)"/>
<circle class="a af" cx="598" cy="196" r="10" stroke-width="1.5"/>
<text class="ta mono" x="598" y="200.5" font-size="14" font-weight="700" text-anchor="middle">+</text>
<text class="ta" x="470" y="40" font-size="11" font-weight="600" text-anchor="middle">each position alone</text>
<text class="tm" x="592" y="174" font-size="9" text-anchor="end">dropout, in training</text>
<text class="tm" x="22" y="252" font-size="10.5">x = x + attention(norm1(x)); x = x + mlp(norm2(x)): 49,984 weights in all; the stream itself is only ever added to.</text>
</svg>
