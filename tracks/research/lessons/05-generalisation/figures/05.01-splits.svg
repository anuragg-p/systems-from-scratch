<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" fill="none">
<title>MNIST cut three ways: the first 1,000 training digits to learn from, the last 10,000 to validate on, the test set for the end</title>
<defs><marker id="splits0501-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="splits0501-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="splits0501-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="20" y="22" font-size="12" font-weight="600">MNIST&#x27;s training set: 60,000 digits, in the order the files give them</text>
<rect class="m" x="30" y="34" width="490" height="30" rx="2" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect class="s fs" x="20" y="34" width="10" height="30" rx="2" stroke-width="1.5"/>
<rect class="s fs" x="520" y="34" width="100" height="30" rx="2" stroke-width="1.5"/>
<text class="tm" x="275" y="53" font-size="11" text-anchor="middle">49,000 not used here</text>
<line class="s" x1="25" y1="64" x2="25" y2="78" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="20" y="92" font-size="12" font-weight="600">training: the first 1,000</text>
<text class="tm" x="20" y="108" font-size="11">learned from; labels real,</text>
<text class="tm" x="20" y="122" font-size="11">or replaced by digits drawn at random</text>
<line class="s" x1="570" y1="64" x2="570" y2="78" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="620" y="92" font-size="12" font-weight="600" text-anchor="end">validation: the last 10,000</text>
<text class="tm" x="620" y="108" font-size="11" text-anchor="end">real labels; scored every 5 epochs;</text>
<text class="tm" x="620" y="122" font-size="11" text-anchor="end">anything chosen is chosen here</text>
<text class="t" x="20" y="154" font-size="12" font-weight="600">MNIST&#x27;s test set: 10,000 digits</text>
<rect class="a af" x="20" y="166" width="100" height="30" rx="2" stroke-width="1.5"/>
<text class="ta" x="134" y="179" font-size="11">real labels; scored once, at the end of each run, after every choice is made;</text>
<text class="ta" x="134" y="194" font-size="11">its number is reported, never used to choose anything</text>
<text class="tm" x="20" y="228" font-size="10.5">The same width is the same number of digits in both bars.</text>
</svg>
