<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 206" fill="none">
<title>A Value used twice gets a share of the gradient from each use, and the shares add</title>
<defs><marker id="twice0102-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="twice0102-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="twice0102-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path class="s" d="M160 60 C 210 34, 250 42, 284 62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#twice0102-ah)"/>
<path class="s" d="M160 80 C 210 106, 250 98, 284 78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#twice0102-ah)"/>
<line class="s" x1="316" y1="70" x2="434" y2="70" stroke-width="1.5" stroke-linecap="round" marker-end="url(#twice0102-ah)"/>
<rect class="s f" x="48" y="49" width="128" height="42" rx="6" stroke-width="1.5"/>
<text class="t mono" x="56" y="66" font-size="12" font-weight="700">a</text>
<text class="t mono" x="168" y="66" font-size="11.5" text-anchor="end">3</text>
<text class="tm" x="56" y="83" font-size="10.5">grad</text>
<text class="ta mono" x="168" y="83" font-size="11" font-weight="600" text-anchor="end">6</text>
<circle class="s f" cx="300" cy="70" r="14" stroke-width="1.5"/>
<text class="t mono" x="300" y="74.5" font-size="14" font-weight="600" text-anchor="middle">*</text>
<rect class="s f" x="436" y="49" width="128" height="42" rx="6" stroke-width="1.5"/>
<text class="t mono" x="444" y="66" font-size="12" font-weight="700">b = a * a</text>
<text class="t mono" x="556" y="66" font-size="11.5" text-anchor="end">9</text>
<text class="tm" x="444" y="83" font-size="10.5">grad</text>
<text class="ta mono" x="556" y="83" font-size="11" font-weight="600" text-anchor="end">1</text>
<text class="tm" x="214" y="28" font-size="10.5" text-anchor="middle">a, as self</text>
<text class="tm" x="214" y="124" font-size="10.5" text-anchor="middle">a, as other</text>
<text class="ta mono" x="24" y="152" font-size="11.5">self.grad  += other.data x out.grad:  a.grad += 3 x 1 = 3</text>
<text class="ta mono" x="24" y="170" font-size="11.5">other.grad += self.data x out.grad:   a.grad += 3 x 1, now 6</text>
<text class="t" x="24" y="190" font-size="11.5" font-weight="600">a.grad = 6: the derivative of a^2 is 2a = 6</text>
</svg>
