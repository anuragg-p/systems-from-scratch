<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" fill="none">
<title>A GPU works through a queue while Python goes on: a clock read without waiting times the asking, lab.clock waits for the device first</title>
<defs><marker id="clock0602-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="clock0602-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="clock0602-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="20" y="63" font-size="12" font-weight="700">Python</text>
<text class="ta" x="20" y="123" font-size="12" font-weight="700">the GPU</text>
<line class="m" x1="120" y1="58" x2="610" y2="58" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="120" y1="118" x2="610" y2="118" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s fs" x="130" y="49" width="26" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="143" y="62" font-size="10" text-anchor="middle">k1</text>
<rect class="s fs" x="164" y="49" width="26" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="177" y="62" font-size="10" text-anchor="middle">k2</text>
<rect class="s fs" x="198" y="49" width="26" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="211" y="62" font-size="10" text-anchor="middle">k3</text>
<rect class="s fs" x="232" y="49" width="26" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="245" y="62" font-size="10" text-anchor="middle">k4</text>
<rect class="s fs" x="266" y="49" width="26" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="279" y="62" font-size="10" text-anchor="middle">k5</text>
<rect class="s fs" x="300" y="49" width="26" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="313" y="62" font-size="10" text-anchor="middle">k6</text>
<rect class="a af" x="160" y="108" width="64" height="20" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="192" y="122" font-size="10.5" text-anchor="middle">k1</text>
<line class="m" x1="143" y1="67" x2="170" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#clock0602-am)"/>
<rect class="a af" x="230" y="108" width="64" height="20" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="262" y="122" font-size="10.5" text-anchor="middle">k2</text>
<line class="m" x1="177" y1="67" x2="240" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#clock0602-am)"/>
<rect class="a af" x="300" y="108" width="64" height="20" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="332" y="122" font-size="10.5" text-anchor="middle">k3</text>
<line class="m" x1="211" y1="67" x2="310" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#clock0602-am)"/>
<rect class="a af" x="370" y="108" width="64" height="20" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="402" y="122" font-size="10.5" text-anchor="middle">k4</text>
<line class="m" x1="245" y1="67" x2="380" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#clock0602-am)"/>
<rect class="a af" x="440" y="108" width="64" height="20" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="472" y="122" font-size="10.5" text-anchor="middle">k5</text>
<line class="m" x1="279" y1="67" x2="450" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#clock0602-am)"/>
<rect class="a af" x="510" y="108" width="64" height="20" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="542" y="122" font-size="10.5" text-anchor="middle">k6</text>
<line class="m" x1="313" y1="67" x2="520" y2="107" stroke-width="1.5" stroke-linecap="round" marker-end="url(#clock0602-am)"/>
<line class="m" x1="330" y1="34" x2="330" y2="152" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="a" x1="580" y1="34" x2="580" y2="152" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm" x="326" y="166" font-size="10.5" text-anchor="end">time.perf_counter() here:</text>
<text class="tm" x="326" y="180" font-size="10.5" text-anchor="end">the time to ask, not to do</text>
<text class="ta" x="576" y="166" font-size="10.5" text-anchor="end">torch.mps.synchronize() first,</text>
<text class="ta" x="576" y="180" font-size="10.5" text-anchor="end">then the clock: the work, done</text>
<text class="tm" x="20" y="214" font-size="10.5">k1 ... k6: one training step&#x27;s operations (kernels). On the CPU each is done when its line returns, so there is nothing to wait for.</text>
<text class="tm" x="20" y="230" font-size="10.5">Schematic: the widths are not measured.</text>
</svg>
