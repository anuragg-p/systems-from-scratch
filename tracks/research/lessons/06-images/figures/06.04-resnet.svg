<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" fill="none">
<title>He et al.&#x27;s network for CIFAR-10, 6n + 2 layers with weights: plain, or with a shortcut around every pair of convolutions (the residual network)</title>
<defs><marker id="resnet0604-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="resnet0604-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="resnet0604-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="m f" x="20" y="40" width="62" height="44" rx="6" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="t" x="51" y="57" font-size="11.5" font-weight="700" text-anchor="middle">image</text>
<text class="tm" x="51" y="71" font-size="9.5" text-anchor="middle">3 x 32 x 32</text>
<rect class="s f" x="86.67" y="40" width="70" height="44" rx="6" stroke-width="1.5"/>
<text class="t" x="121.67" y="57" font-size="11.5" font-weight="700" text-anchor="middle">conv 3 x 3</text>
<text class="tm" x="121.67" y="71" font-size="9.5" text-anchor="middle">16 maps</text>
<rect class="a af" x="161.33" y="40" width="104" height="44" rx="6" stroke-width="1.5"/>
<text class="ta" x="213.33" y="57" font-size="11.5" font-weight="700" text-anchor="middle">stage 1</text>
<text class="tm" x="213.33" y="71" font-size="9.5" text-anchor="middle">n blocks: 16 maps,</text>
<text class="tm" x="213.33" y="82" font-size="9.5" text-anchor="middle">32 by 32</text>
<rect class="a af" x="270" y="40" width="104" height="44" rx="6" stroke-width="1.5"/>
<text class="ta" x="322" y="57" font-size="11.5" font-weight="700" text-anchor="middle">stage 2</text>
<text class="tm" x="322" y="71" font-size="9.5" text-anchor="middle">n blocks: 32 maps,</text>
<text class="tm" x="322" y="82" font-size="9.5" text-anchor="middle">16 by 16</text>
<rect class="a af" x="378.67" y="40" width="104" height="44" rx="6" stroke-width="1.5"/>
<text class="ta" x="430.67" y="57" font-size="11.5" font-weight="700" text-anchor="middle">stage 3</text>
<text class="tm" x="430.67" y="71" font-size="9.5" text-anchor="middle">n blocks: 64 maps,</text>
<text class="tm" x="430.67" y="82" font-size="9.5" text-anchor="middle">8 by 8</text>
<rect class="s f" x="487.33" y="40" width="70" height="44" rx="6" stroke-width="1.5"/>
<text class="t" x="522.33" y="57" font-size="11.5" font-weight="700" text-anchor="middle">mean</text>
<text class="tm" x="522.33" y="71" font-size="9.5" text-anchor="middle">of each map:</text>
<text class="tm" x="522.33" y="82" font-size="9.5" text-anchor="middle">64 numbers</text>
<rect class="s f" x="562" y="40" width="58" height="44" rx="6" stroke-width="1.5"/>
<text class="t" x="591" y="57" font-size="11.5" font-weight="700" text-anchor="middle">Linear</text>
<text class="tm" x="591" y="71" font-size="9.5" text-anchor="middle">10 scores</text>
<line class="s" x1="83" y1="62" x2="85.67" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<line class="s" x1="157.67" y1="62" x2="160.33" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<line class="s" x1="266.33" y1="62" x2="269" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<line class="s" x1="375" y1="62" x2="377.67" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<line class="s" x1="483.67" y1="62" x2="486.33" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<line class="s" x1="558.33" y1="62" x2="561" y2="62" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<text class="tm" x="20" y="26" font-size="10.5">batch norm after every convolution, then relu; the first convolution of stages 2 and 3 steps 2 pixels, halving the maps</text>
<text class="t" x="20" y="126" font-size="11.5" font-weight="700">a block: two 3 by 3 convolutions</text>
<text class="t" x="20" y="150" font-size="11" font-weight="700">plain</text>
<text class="t mono" x="26" y="188" font-size="12" font-weight="700">x</text>
<line class="s" x1="42" y1="184" x2="50" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<rect class="s f" x="52" y="171" width="96" height="26" rx="5" stroke-width="1.5"/>
<text class="t" x="100" y="188" font-size="10.5" text-anchor="middle">conv, BN, relu</text>
<line class="s" x1="150" y1="184" x2="158" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<rect class="s f" x="160" y="171" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="t" x="193" y="188" font-size="10.5" text-anchor="middle">conv, BN</text>
<line class="s" x1="228" y1="184" x2="236" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<rect class="s f" x="238" y="171" width="40" height="26" rx="5" stroke-width="1.5"/>
<text class="t" x="258" y="188" font-size="10.5" text-anchor="middle">relu</text>
<text class="ta" x="332" y="150" font-size="11" font-weight="700">residual</text>
<text class="t mono" x="338" y="188" font-size="12" font-weight="700">x</text>
<line class="s" x1="354" y1="184" x2="362" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<rect class="s f" x="364" y="171" width="96" height="26" rx="5" stroke-width="1.5"/>
<text class="t" x="412" y="188" font-size="10.5" text-anchor="middle">conv, BN, relu</text>
<line class="s" x1="462" y1="184" x2="470" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<rect class="s f" x="472" y="171" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="t" x="505" y="188" font-size="10.5" text-anchor="middle">conv, BN</text>
<line class="s" x1="540" y1="184" x2="548" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<circle class="a af" cx="562" cy="184" r="11" stroke-width="1.5"/>
<text class="ta mono" x="562" y="189" font-size="14" font-weight="700" text-anchor="middle">+</text>
<line class="s" x1="576" y1="184" x2="584" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#resnet0604-ah)"/>
<rect class="s f" x="586" y="171" width="40" height="26" rx="5" stroke-width="1.5"/>
<text class="t" x="606" y="188" font-size="10.5" text-anchor="middle">relu</text>
<path class="a" d="M341 175 L341 158 L562 158 L562 172" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#resnet0604-aa)"/>
<text class="ta" x="471.5" y="153" font-size="10.5" font-weight="600" text-anchor="middle">the shortcut: x itself</text>
<text class="t" x="20" y="236" font-size="11">Where a block halves the maps and doubles their number, the shortcut is the paper&#x27;s option A, with no weights:</text>
<text class="tm" x="20" y="253" font-size="10.5">every second pixel of every second row, x[:, :, ::2, ::2], then 16 maps of zeros after the 16 it has. So plain and residual</text>
<text class="tm" x="20" y="268" font-size="10.5">networks of one depth have exactly the same weights:</text>
<text class="t mono" x="20" y="292" font-size="11">n = 1: 8 layers, 75,290 weights</text>
<text class="ta mono" x="20" y="308" font-size="11">n = 3: 20 layers, 269,722 weights (paper: 0.27M)</text>
<text class="ta mono" x="20" y="324" font-size="11">n = 9: 56 layers, 853,018 weights (paper: 0.85M)</text>
</svg>
