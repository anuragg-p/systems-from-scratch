<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" fill="none">
<title>The same script on either library: one line names it, and every name after that line is the same on both</title>
<defs><marker id="import0602-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="import0602-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="import0602-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="20" y="34" width="372" height="178" rx="6" stroke-width="1.5"/>
<text class="tm" x="20" y="24" font-size="11">a training step, as the scripts of modules 00 to 06.01 write it</text>
<text class="ta mono" x="32" y="56" font-size="11" font-weight="700">import engine as torch</text>
<text class="t mono" x="32" y="75" font-size="11">nn = torch.nn</text>
<text class="t mono" x="32" y="94" font-size="11">F = torch.nn.functional</text>
<text class="t mono" x="32" y="113" font-size="11">model = nn.Sequential(nn.Conv2d(3, 32, 3), ...)</text>
<text class="t mono" x="32" y="132" font-size="11">opt = torch.optim.SGD(model.parameters(), lr=0.01)</text>
<text class="t mono" x="32" y="151" font-size="11">loss = F.cross_entropy(model(x), y)</text>
<text class="t mono" x="32" y="170" font-size="11">loss.backward()</text>
<text class="t mono" x="32" y="189" font-size="11">opt.step()</text>
<rect class="s f" x="430" y="30" width="190" height="62" rx="6" stroke-width="1.5"/>
<text class="t" x="525" y="59" font-size="12.5" font-weight="700" text-anchor="middle">the engine</text>
<text class="tm" x="525" y="72.5" font-size="10.5" text-anchor="middle">numpy, on the CPU only</text>
<rect class="a af" x="430" y="118" width="190" height="62" rx="6" stroke-width="1.5"/>
<text class="ta" x="525" y="147" font-size="12.5" font-weight="700" text-anchor="middle">PyTorch</text>
<text class="tm" x="525" y="160.5" font-size="10.5" text-anchor="middle">the CPU, or a GPU: cuda, mps</text>
<path class="s" d="M185.2 52 L422 61.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#import0602-ah)"/>
<path class="a" d="M185.2 56 L422 149.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#import0602-aa)" stroke-dasharray="4 4"/>
<text class="ta mono" x="525" y="198" font-size="11.5" font-weight="700" text-anchor="middle">import torch</text>
<text class="tm" x="20" y="232" font-size="11">Built by one function from the same weights and fed the same batch, the two take a training step that agrees to 1.3e-16</text>
<text class="tm" x="20" y="248" font-size="11">in the loss and to 4.7e-17 in every gradient and weight, in float64: the same arithmetic, added up in another order.</text>
</svg>
