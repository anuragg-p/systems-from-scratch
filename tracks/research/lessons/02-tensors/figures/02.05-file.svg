<text class="ta" x="14" y="130" font-size="10.5">8 bytes: the header&#x27;s length</text>
<text class="t" x="157.06" y="130" font-size="10.5">data: 1416 bytes, 354 float32 numbers</text>
<text class="t" x="14" y="162" font-size="12" font-weight="700">the first bytes of each part, as they are in the file</text>
<text class="ta mono" x="14" y="186" font-size="11">a8 01 00 00 00 00 00 00</text>
<text class="tm" x="179.8" y="186" font-size="10.5">-&gt; 424, little-endian</text>
<text class="t mono" x="14" y="208" font-size="11">{&quot;__metadata__&quot;:{&quot;steps&quot;:&quot;500&quot;},&quot;0.bias&quot;:{&quot;dtype&quot;:&quot;F32 ...</text>
<text class="tm" x="14" y="226" font-size="10.5">... ending in 1 space, so the numbers start at byte 432, a multiple of 8</text>
<text class="t mono" x="14" y="252" font-size="11">f3 1b 04 bf 48 44 ca 3f</text>
<text class="tm" x="179.8" y="252" font-size="10.5">-&gt; 0.bias[0] = -0.5161, 0.bias[1] = 1.5802: 4 bytes a number, little-endian</text>
<text class="tm" x="14" y="280" font-size="10.5">names in the header are in sorted order, so 0.bias comes before 0.weight; metadata: {&quot;steps&quot;: &quot;500&quot;}</text>
<text class="tm" x="14" y="298" font-size="10.5">nothing in the file is code: loading it reads numbers, and runs nothing</text>
