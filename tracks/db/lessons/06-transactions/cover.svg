<text class="ta" x="316" y="88" font-size="11" font-weight="600">crash</text>
<text class="t" x="24" y="88" font-size="11">without a journal: half new, half old</text>
<rect class="s fs" x="24" y="120" width="280" height="140" rx="12" stroke-width="1.5"/>
<text class="t" x="40" y="144" font-size="13" font-weight="600">rollback journal</text>
<text class="t" x="40" y="166" font-size="11.5">1 save the old pages aside</text>
<text class="t" x="40" y="186" font-size="11.5">2 overwrite in place</text>
<text class="ta" x="40" y="206" font-size="11.5" font-weight="600">3 delete the journal</text>
<text class="tm" x="40" y="236" font-size="11">a crash: copy the old pages back</text>
<rect class="a af" x="336" y="120" width="280" height="140" rx="12" stroke-width="1.5"/>
<text class="ta" x="352" y="144" font-size="13" font-weight="600">write-ahead log</text>
<text class="t" x="352" y="166" font-size="11.5">1 append the new pages</text>
<text class="ta" x="352" y="186" font-size="11.5" font-weight="600">2 mark the last one: commit</text>
<text class="t" x="352" y="206" font-size="11.5">3 later, copy them home</text>
<text class="tm" x="352" y="236" font-size="11">a crash: ignore an unmarked tail</text>
<text class="ta" x="320" y="288" font-size="12" font-weight="600" text-anchor="middle">either way the file holds all of a commit or none of it</text>
</svg>
