<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" fill="none">
<title>A torn page: the new page&#x27;s first half over the old page&#x27;s second half</title>
<defs><marker id="f0601b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0601b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0601b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">page 47 after DB_CRASH=db-torn (UPDATE t SET b = &#x27;new&#x27;): 4096 bytes, drawn to scale</text>
<rect class="a af" x="40" y="60" width="280" height="46" rx="0" stroke-width="1.5"/>
<rect class="s fs" x="320" y="60" width="280" height="46" rx="0" stroke-width="1.5"/>
<rect class="a fa" x="40" y="60" width="7.11" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="40" y="52" font-size="10.5" text-anchor="None">0</text>
<text class="tm mono" x="320" y="52" font-size="10.5" text-anchor="middle">2048</text>
<text class="tm mono" x="600" y="52" font-size="10.5" text-anchor="end">4096</text>
<text class="ta" x="56.41" y="80" font-size="11" font-weight="600" text-anchor="None">written: the new page&#x27;s first half</text>
<text class="t" x="56.41" y="96" font-size="10.5">header: 22 cells, content starts at 3898</text>
<text class="t" x="332.58" y="80" font-size="11" font-weight="600" text-anchor="None">never written: the old page</text>
<text class="tm" x="332.58" y="96" font-size="10.5" text-anchor="None">old cells, &#x27;old oooooooo...&#x27;</text>
<path class="a" d="M44.1015625 106 C 44.1015625 160, 598.76953125 160, 598.76953125 110" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0601b-aa)"/>
<text class="ta mono" x="190.39" y="156" font-size="11" font-weight="600" text-anchor="middle">cell 0&#x27;s pointer: 4087</text>
<rect class="s f" x="390" y="172" width="210" height="54" rx="6" stroke-width="1.5"/>
<text class="t mono" x="400" y="190" font-size="11" text-anchor="None">at 4087: 6f 6f 6f 6f 6f ...</text>
<text class="t" x="400" y="206" font-size="11">&#x27;ooo&#x27;: size 111, rowid 111</text>
<text class="tm" x="400" y="220" font-size="10.5">(0x6f = 111 = &#x27;o&#x27;)</text>
<text class="t" x="24" y="190" font-size="11">the new cells were meant for 3898-4096,</text>
<text class="t" x="24" y="206" font-size="11">in the half that never reached the disk</text>
<line class="m" x1="24" y1="242" x2="616" y2="242" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="24" y="262" font-size="10.5" text-anchor="None">sqlite3: Tree 2 page 47 cell 20: Rowid 111 out of order</text>
<text class="t mono" x="24" y="278" font-size="10.5" text-anchor="None">./db:    database is corrupt: bad record in table t, rowid 111</text>
</svg>
