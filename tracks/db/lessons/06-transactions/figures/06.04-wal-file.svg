<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" fill="none">
<title>The log after a crash in the middle of a checkpoint</title>
<defs><marker id="f0604b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0604b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0604b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">demo.db-wal: 20632 bytes = 32 + 5 x (24 + 4096)</text>
<rect class="a af" x="24" y="34" width="80" height="30" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="64" y="53" font-size="10" text-anchor="middle">37 7f 06 83</text>
<text class="tm" x="64" y="78" font-size="10.5" text-anchor="middle">magic</text>
<rect class="s f" x="104" y="34" width="80" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="144" y="53" font-size="10" text-anchor="middle">00 2d e2 18</text>
<text class="tm" x="144" y="78" font-size="10.5" text-anchor="middle">3007000</text>
<rect class="s f" x="184" y="34" width="80" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="224" y="53" font-size="10" text-anchor="middle">00 00 10 00</text>
<text class="tm" x="224" y="78" font-size="10.5" text-anchor="middle">page 4096</text>
<rect class="s fs" x="264" y="34" width="60" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="294" y="53" font-size="10" text-anchor="middle">00..00</text>
<text class="tm" x="294" y="78" font-size="10.5" text-anchor="middle">ckpt 0</text>
<rect class="s fs" x="324" y="34" width="60" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="354" y="53" font-size="10" text-anchor="middle">00..01</text>
<text class="tm" x="354" y="78" font-size="10.5" text-anchor="middle">salt-1</text>
<rect class="s fs" x="384" y="34" width="80" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="424" y="53" font-size="10" text-anchor="middle">22 80 94 d4</text>
<text class="tm" x="424" y="78" font-size="10.5" text-anchor="middle">salt-2</text>
<rect class="s fs" x="464" y="34" width="152" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="540" y="53" font-size="10" text-anchor="middle">16 04 e6 d8 df 5e 63 65</text>
<text class="tm" x="540" y="78" font-size="10.5" text-anchor="middle">checksum</text>
<text class="tm" x="24" y="98" font-size="10.5">header, 32 bytes. Then each frame: 24 bytes of header, then the page</text>
<rect class="a f" x="24" y="114" width="111" height="68" rx="6" stroke-width="1.5"/>
<text class="t" x="34" y="132" font-size="11.5" font-weight="600" text-anchor="None">frame 1</text>
<text class="t mono" x="34" y="150" font-size="10.5" text-anchor="None">page: 4</text>
<text class="tm mono" x="34" y="166" font-size="10.5" text-anchor="None">mark: 0</text>
<rect class="a f" x="143.2" y="114" width="111" height="68" rx="6" stroke-width="1.5"/>
<text class="t" x="153.2" y="132" font-size="11.5" font-weight="600" text-anchor="None">frame 2</text>
<text class="t mono" x="153.2" y="150" font-size="10.5" text-anchor="None">page: 5</text>
<text class="tm mono" x="153.2" y="166" font-size="10.5" text-anchor="None">mark: 0</text>
<rect class="a f" x="262.4" y="114" width="111" height="68" rx="6" stroke-width="1.5"/>
<text class="t" x="272.4" y="132" font-size="11.5" font-weight="600" text-anchor="None">frame 3</text>
<text class="t mono" x="272.4" y="150" font-size="10.5" text-anchor="None">page: 6</text>
<text class="tm mono" x="272.4" y="166" font-size="10.5" text-anchor="None">mark: 0</text>
<rect class="a f" x="381.6" y="114" width="111" height="68" rx="6" stroke-width="1.5"/>
<text class="t" x="391.6" y="132" font-size="11.5" font-weight="600" text-anchor="None">frame 4</text>
<text class="t mono" x="391.6" y="150" font-size="10.5" text-anchor="None">page: 7</text>
<text class="tm mono" x="391.6" y="166" font-size="10.5" text-anchor="None">mark: 0</text>
<rect class="a af" x="500.8" y="114" width="111" height="68" rx="6" stroke-width="1.5"/>
<text class="t" x="510.8" y="132" font-size="11.5" font-weight="600" text-anchor="None">frame 5</text>
<text class="t mono" x="510.8" y="150" font-size="10.5" text-anchor="None">page: 8</text>
<text class="t mono" x="510.8" y="166" font-size="10.5" font-weight="600" text-anchor="None">mark: 92</text>
<text class="t" x="24" y="204" font-size="11">a commit mark is the database&#x27;s size in pages after the commit; only the last frame of a commit has one</text>
<text class="t" x="24" y="220" font-size="11">salts and checksums chain every frame to the header: a torn or stale frame does not check out</text>
<line class="m" x1="24" y1="236" x2="616" y2="236" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="256" font-size="11">demo.db alone: 22 rows changed (page 4 was copied home before the crash)</text>
<text class="ta" x="24" y="274" font-size="11" font-weight="600" text-anchor="None">demo.db with its log: 100 rows changed, the whole commit</text>
</svg>
