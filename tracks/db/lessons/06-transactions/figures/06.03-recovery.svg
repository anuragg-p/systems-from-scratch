<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
<title>What the next open does with a journal</title>
<defs><marker id="f0603a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0603a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0603a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">journal_recover, called before anything reads the database</text>
<rect class="s f" x="24" y="40" width="210" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="34" y="59" font-size="11">demo.db-journal exists?</text>
<rect class="s f" x="24" y="100" width="210" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="34" y="119" font-size="11">starts with the magic?</text>
<rect class="a af" x="24" y="160" width="260" height="40" rx="6" stroke-width="1.5"/>
<text class="ta" x="34" y="177" font-size="11">copy each record&#x27;s page back</text>
<text class="tm" x="34" y="192" font-size="10.5">stop at a record cut short</text>
<rect class="a af" x="24" y="222" width="260" height="40" rx="6" stroke-width="1.5"/>
<text class="ta" x="34" y="239" font-size="11">cut demo.db to the old page count,</text>
<text class="tm" x="34" y="254" font-size="10.5">fsync it</text>
<rect class="a af" x="24" y="284" width="260" height="30" rx="6" stroke-width="1.5"/>
<text class="ta" x="34" y="303" font-size="11">delete the journal</text>
<line class="s" x1="129" y1="70" x2="129" y2="98" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-ah)"/>
<line class="s" x1="129" y1="130" x2="129" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-ah)"/>
<line class="a" x1="129" y1="200" x2="129" y2="220" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-aa)"/>
<line class="a" x1="129" y1="262" x2="129" y2="282" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-aa)"/>
<text class="tm" x="136" y="88" font-size="10.5">yes</text>
<text class="ta" x="136" y="148" font-size="10.5">yes: hot</text>
<line class="s" x1="234" y1="55" x2="330" y2="55" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-ah)"/>
<text class="tm" x="240" y="50" font-size="10.5">no</text>
<rect class="s fs" x="332" y="40" width="284" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="342" y="59" font-size="11">the last commit finished: nothing to do</text>
<line class="s" x1="234" y1="115" x2="330" y2="115" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-ah)"/>
<text class="tm" x="240" y="110" font-size="10.5">no</text>
<rect class="s fs" x="332" y="100" width="284" height="40" rx="6" stroke-width="1.5"/>
<text class="t" x="342" y="117" font-size="11">it never became hot, so demo.db was</text>
<text class="t" x="342" y="132" font-size="11">never touched: just delete it</text>
<text class="t" x="310" y="182" font-size="11">a crash anywhere in the shaded steps leaves</text>
<text class="t" x="310" y="198" font-size="11">the journal in place, and the next open does</text>
<text class="t" x="310" y="214" font-size="11">it all again: copying the same originals over</text>
<text class="t" x="310" y="230" font-size="11">the same pages twice changes nothing</text>
</svg>
