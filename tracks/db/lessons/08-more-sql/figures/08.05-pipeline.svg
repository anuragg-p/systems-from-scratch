<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none">
<title>GROUP BY, HAVING and ORDER BY as operators, with the rows each one hands up</title>
<defs><marker id="f0805b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0805b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0805b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="20" font-size="10">SELECT city, count(*), sum(total) FROM customers c JOIN orders o ON o.customer_id = c.id</text>
<text class="tm mono" x="24" y="35" font-size="10">  GROUP BY city HAVING count(*) &gt; 1 ORDER BY 3 DESC;</text>
<rect class="s f" x="138.3" y="474" width="151.4" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214" y="492.5" font-size="11" text-anchor="middle">Scan customers AS c</text>
<rect class="s f" x="187.8" y="410" width="52.4" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214" y="428.5" font-size="11" text-anchor="middle">Join</text>
<rect class="s f" x="105.3" y="346" width="217.4" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214" y="364.5" font-size="11" text-anchor="middle">Filter (o.customer_id = c.id)</text>
<rect class="s f" x="144.9" y="282" width="138.2" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214" y="300.5" font-size="11" text-anchor="middle">Sort by city DESC</text>
<rect class="s f" x="75.6" y="218" width="276.8" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214" y="236.5" font-size="11" font-weight="600" text-anchor="middle">Aggregate count(*), sum(total) by city</text>
<rect class="s f" x="131.7" y="154" width="164.6" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214" y="172.5" font-size="11" font-weight="600" text-anchor="middle">Filter (count(*) &gt; 1)</text>
<rect class="s f" x="125.1" y="90" width="177.8" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214" y="108.5" font-size="11" text-anchor="middle">Sort by sum(total) DESC</text>
<rect class="a af" x="454.2" y="410" width="131.6" height="28" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="520" y="428.5" font-size="11" text-anchor="middle">Scan orders AS o</text>
<line class="s" x1="214" y1="472" x2="214" y2="441" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-ah)"/>
<text class="tm" x="222" y="460" font-size="10.5">4 rows</text>
<line class="s" x1="214" y1="408" x2="214" y2="377" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-ah)"/>
<text class="tm" x="222" y="396" font-size="10.5">24 rows</text>
<line class="s" x1="214" y1="344" x2="214" y2="313" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-ah)"/>
<text class="tm" x="222" y="332" font-size="10.5">5 rows</text>
<line class="s" x1="214" y1="280" x2="214" y2="249" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-ah)"/>
<text class="tm" x="222" y="268" font-size="10.5">5 rows</text>
<line class="s" x1="214" y1="216" x2="214" y2="185" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-ah)"/>
<text class="tm" x="222" y="204" font-size="10.5">2 rows</text>
<line class="s" x1="214" y1="152" x2="214" y2="121" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-ah)"/>
<text class="tm" x="222" y="140" font-size="10.5">1 row</text>
<rect class="s f" x="280" y="190" width="56" height="20" rx="0" stroke-width="1.5"/>
<text class="t mono" x="308" y="203.6" font-size="10" text-anchor="middle">Paris</text>
<rect class="a af" x="336" y="190" width="24" height="20" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="348" y="203.6" font-size="10" text-anchor="middle">1</text>
<rect class="a af" x="360" y="190" width="34" height="20" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="377" y="203.6" font-size="10" text-anchor="middle">20</text>
<rect class="s f" x="404" y="190" width="56" height="20" rx="0" stroke-width="1.5"/>
<text class="t mono" x="432" y="203.6" font-size="10" text-anchor="middle">London</text>
<rect class="a af" x="460" y="190" width="24" height="20" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="472" y="203.6" font-size="10" text-anchor="middle">4</text>
<rect class="a af" x="484" y="190" width="34" height="20" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="501" y="203.6" font-size="10" text-anchor="middle">100</text>
<line class="a" x1="454" y1="424" x2="254" y2="424" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-aa)"/>
<text class="tm" x="354" y="418" font-size="10.5" text-anchor="middle">24 rows</text>
<text class="tm" x="520" y="453" font-size="10" text-anchor="middle">6 rows for each of 4 customers</text>
<line class="s" x1="214" y1="88" x2="214" y2="52" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0805b-ah)"/>
<text class="t" x="222" y="70" font-size="11" font-weight="600">1 row out</text>
<rect class="s f" x="298" y="56" width="62" height="22" rx="0" stroke-width="1.5"/>
<text class="t mono" x="329" y="70.96" font-size="11" text-anchor="middle">London</text>
<rect class="a af" x="360" y="56" width="26" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="373" y="70.96" font-size="11" text-anchor="middle">4</text>
<rect class="a af" x="386" y="56" width="36" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="404" y="70.96" font-size="11" text-anchor="middle">100</text>
<text class="tm mono" x="303.7" y="492.5" font-size="10">FROM customers c</text>
<text class="tm mono" x="336.7" y="358" font-size="10">ON o.customer_id = c.id</text>
<text class="tm" x="336.7" y="372" font-size="10.5">5 of the 24 pairs match</text>
<text class="tm mono" x="297.1" y="294" font-size="10">GROUP BY city, sorted first</text>
<text class="tm" x="297.1" y="308" font-size="10.5">DESC: the direction of ORDER BY 3 DESC</text>
<text class="tm mono" x="366.4" y="230" font-size="10">GROUP BY city</text>
<text class="tm" x="366.4" y="244" font-size="10.5">a row each time city changes</text>
<text class="tm mono" x="310.3" y="166" font-size="10">HAVING count(*) &gt; 1</text>
<text class="tm" x="310.3" y="180" font-size="10.5">WHERE, but over the groups&#x27; rows</text>
<text class="tm mono" x="316.9" y="108.5" font-size="10">ORDER BY 3 DESC</text>
<line class="m" x1="24" y1="518" x2="616" y2="518" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="24" y="538" font-size="10.5">Each operator pulls rows from the one below it: the Aggregate reads all 5 joined rows, sorted, and hands up 2.</text>
</svg>
