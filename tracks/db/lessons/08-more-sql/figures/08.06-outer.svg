<line class="m" x1="24" y1="470" x2="616" y2="470" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="490" font-size="11">The count names c.id: 4 customers, 4 runs, answers 2, 1, 2 and 0.</text>
<text class="tm" x="24" y="507" font-size="10.5">Order 13&#x27;s query names nothing outside: it runs the first time it is needed, and its answer is kept.</text>
