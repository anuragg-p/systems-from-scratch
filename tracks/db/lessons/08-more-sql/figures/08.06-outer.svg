<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 518" fill="none">
<title>A correlated subquery runs under each row of the query outside; one that names nothing outside runs once</title>
<defs><marker id="f0806b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0806b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0806b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line class="m" x1="400" y1="10" x2="400" y2="456" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="20" font-size="11.5" font-weight="600">it names c.id, outside: it runs for every row</text>
<text class="tm mono" x="24" y="38" font-size="10">SELECT name,</text>
<text class="ta mono" x="102" y="38" font-size="10">(SELECT count(*) FROM orders o</text>
<text class="ta mono" x="102" y="52" font-size="10">WHERE o.customer_id =</text>
<text class="t mono" x="234" y="52" font-size="10" font-weight="700">c.id</text>
<text class="ta mono" x="258" y="52" font-size="10">)</text>
<text class="tm mono" x="270" y="52" font-size="10">FROM customers c;</text>
<text class="t" x="40" y="86" font-size="11" font-weight="600">customers c: row 1 of 4, stopped</text>
<text class="tm" x="300" y="86" font-size="10.5">its result row</text>
