<text class="tm" x="412" y="20" font-size="11.5" font-weight="600">it names nothing outside: it runs once</text>
<text class="tm mono" x="412" y="38" font-size="10">SELECT name, (SELECT customer_id</text>
<text class="tm mono" x="496" y="52" font-size="10">FROM orders</text>
<text class="tm mono" x="496" y="66" font-size="10">WHERE id = 13)</text>
<text class="tm mono" x="412" y="80" font-size="10">FROM customers c;</text>
<rect class="m fs" x="412" y="94" width="50" height="24" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="437" y="109.78" font-size="10.5" text-anchor="middle">Ada</text>
