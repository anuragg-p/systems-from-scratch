<text class="tm mono" x="437" y="423.78" font-size="10.5" text-anchor="middle">Chen</text>
<rect class="m fs" x="462" y="410" width="30" height="20" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="477" y="423.78" font-size="10.5" text-anchor="middle">2</text>
<text class="tm" x="502" y="424" font-size="10.5">no run</text>
<rect class="m fs" x="412" y="434" width="50" height="20" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="437" y="447.78" font-size="10.5" text-anchor="middle">Dee</text>
<rect class="m fs" x="462" y="434" width="30" height="20" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="477" y="447.78" font-size="10.5" text-anchor="middle">2</text>
