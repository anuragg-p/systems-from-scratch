<text class="t mono" x="52" y="258.96" font-size="11" text-anchor="middle">Dee</text>
<rect class="m f" x="80" y="244" width="40" height="22" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="100" y="258.96" font-size="9.5" text-anchor="middle">NULL</text>
<rect class="m f" x="120" y="244" width="52" height="22" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="146" y="258.96" font-size="9.5" text-anchor="middle">NULL</text>
<text class="tm mono" x="182" y="258.5" font-size="10">no orders</text>
<rect class="s f" x="336" y="156" width="56" height="22" rx="0" stroke-width="1.5"/>
<text class="t mono" x="364" y="170.96" font-size="11" text-anchor="middle">Ada</text>
<rect class="a af" x="392" y="156" width="40" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="412" y="170.96" font-size="11" text-anchor="middle">10</text>
<rect class="a af" x="432" y="156" width="52" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="458" y="170.96" font-size="11" text-anchor="middle">30</text>
<text class="t mono" x="494" y="170.5" font-size="10">true</text>
<rect class="s f" x="336" y="178" width="56" height="22" rx="0" stroke-width="1.5"/>
<text class="t mono" x="364" y="192.96" font-size="11" text-anchor="middle">Ada</text>
<rect class="a af" x="392" y="178" width="40" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="412" y="192.96" font-size="11" text-anchor="middle">12</text>
<rect class="a af" x="432" y="178" width="52" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="458" y="192.96" font-size="11" text-anchor="middle">50</text>
<text class="t mono" x="494" y="192.5" font-size="10">true</text>
<text class="tm" x="336" y="222" font-size="10.5">the Left join&#x27;s other 4 rows, dropped:</text>
<rect class="m fs" x="336" y="230" width="56" height="22" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="364" y="245" font-size="11" text-anchor="middle">Brook</text>
<rect class="m fs" x="392" y="230" width="40" height="22" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="412" y="245" font-size="11" text-anchor="middle">13</text>
<rect class="m fs" x="432" y="230" width="52" height="22" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="458" y="245" font-size="11" text-anchor="middle">20</text>
<text class="tm mono" x="494" y="244.5" font-size="10">false</text>
