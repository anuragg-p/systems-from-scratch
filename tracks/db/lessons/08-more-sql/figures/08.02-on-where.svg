<text class="tm mono" x="364" y="289" font-size="11" text-anchor="middle">Chen</text>
<rect class="m fs" x="392" y="274" width="40" height="22" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="412" y="289" font-size="11" text-anchor="middle">14</text>
<rect class="m fs" x="432" y="274" width="52" height="22" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="458" y="289" font-size="11" text-anchor="middle">5</text>
<text class="tm mono" x="494" y="288.5" font-size="10">false</text>
