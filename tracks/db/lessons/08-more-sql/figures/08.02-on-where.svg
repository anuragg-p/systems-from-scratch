<text class="tm mono" x="412" y="310.5" font-size="9.5" text-anchor="middle">NULL</text>
<rect class="m f" x="432" y="296" width="52" height="22" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="458" y="310.5" font-size="9.5" text-anchor="middle">NULL</text>
<text class="tm mono" x="494" y="310.5" font-size="10">NULL</text>
<text class="t" x="24" y="342" font-size="11.5" font-weight="600">5 rows: every customer</text>
