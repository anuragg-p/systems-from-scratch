<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" fill="none">
<title>The same LEFT JOIN with o.total &gt; 25 in ON, then in WHERE: what comes out</title>
<defs><marker id="f0802b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0802b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0802b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line class="m" x1="320" y1="10" x2="320" y2="362" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="24" y="22" font-size="12" font-weight="700">o.total &gt; 25</text>
<text class="t" x="116.4" y="22" font-size="12" font-weight="700">in ON</text>
<text class="tm mono" x="24" y="44" font-size="10">SELECT c.name, o.id, o.total</text>
<text class="tm mono" x="24" y="58" font-size="10">FROM customers c LEFT JOIN orders o</text>
<text class="ta mono" x="336" y="22" font-size="12" font-weight="700">o.total &gt; 25</text>
<text class="t" x="428.4" y="22" font-size="12" font-weight="700">in WHERE</text>
<text class="tm mono" x="336" y="44" font-size="10">SELECT c.name, o.id, o.total</text>
<text class="tm mono" x="336" y="58" font-size="10">FROM customers c LEFT JOIN orders o</text>
<text class="tm mono" x="24" y="72" font-size="10">ON o.customer_id = c.id AND </text>
<text class="ta mono" x="192" y="72" font-size="10" font-weight="700">o.total &gt; 25</text>
<text class="tm mono" x="264" y="72" font-size="10">;</text>
<text class="tm mono" x="336" y="72" font-size="10">ON o.customer_id = c.id</text>
<text class="tm mono" x="336" y="86" font-size="10">WHERE </text>
<text class="ta mono" x="372" y="86" font-size="10" font-weight="700">o.total &gt; 25</text>
<text class="tm mono" x="444" y="86" font-size="10">;</text>
<text class="t" x="24" y="112" font-size="11">checked inside the Left join, on each pair:</text>
<text class="tm" x="24" y="127" font-size="10.5">it decides what counts as a match</text>
<text class="t" x="336" y="112" font-size="11">checked in a Filter above the Left join:</text>
<text class="tm" x="336" y="127" font-size="10.5">it decides which rows survive</text>
<text class="tm mono" x="52" y="150" font-size="10" text-anchor="middle">c.name</text>
<text class="tm mono" x="100" y="150" font-size="10" text-anchor="middle">o.id</text>
<text class="tm mono" x="146" y="150" font-size="10" text-anchor="middle">o.total</text>
<text class="ta mono" x="182" y="150" font-size="10">o.total &gt; 25?</text>
<text class="tm mono" x="364" y="150" font-size="10" text-anchor="middle">c.name</text>
<text class="tm mono" x="412" y="150" font-size="10" text-anchor="middle">o.id</text>
<text class="tm mono" x="458" y="150" font-size="10" text-anchor="middle">o.total</text>
<text class="ta mono" x="494" y="150" font-size="10">o.total &gt; 25</text>
<rect class="s f" x="24" y="156" width="56" height="22" rx="0" stroke-width="1.5"/>
<text class="t mono" x="52" y="170.96" font-size="11" text-anchor="middle">Ada</text>
<rect class="a af" x="80" y="156" width="40" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="100" y="170.96" font-size="11" text-anchor="middle">10</text>
