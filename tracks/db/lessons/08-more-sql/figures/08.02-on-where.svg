<text class="ta mono" x="146" y="170.96" font-size="11" text-anchor="middle">30</text>
<text class="t mono" x="182" y="170.5" font-size="10">30: match</text>
<rect class="s f" x="24" y="178" width="56" height="22" rx="0" stroke-width="1.5"/>
<text class="t mono" x="52" y="192.96" font-size="11" text-anchor="middle">Ada</text>
<rect class="a af" x="80" y="178" width="40" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="100" y="192.96" font-size="11" text-anchor="middle">12</text>
<rect class="a af" x="120" y="178" width="52" height="22" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="146" y="192.96" font-size="11" text-anchor="middle">50</text>
<text class="t mono" x="182" y="192.5" font-size="10">50: match</text>
<rect class="s f" x="24" y="200" width="56" height="22" rx="0" stroke-width="1.5"/>
<text class="t mono" x="52" y="214.96" font-size="11" text-anchor="middle">Brook</text>
<rect class="m f" x="80" y="200" width="40" height="22" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="100" y="214.96" font-size="9.5" text-anchor="middle">NULL</text>
<rect class="m f" x="120" y="200" width="52" height="22" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="146" y="214.96" font-size="9.5" text-anchor="middle">NULL</text>
<text class="tm mono" x="182" y="214.5" font-size="10">20: no match</text>
<rect class="s f" x="24" y="222" width="56" height="22" rx="0" stroke-width="1.5"/>
<text class="t mono" x="52" y="236.96" font-size="11" text-anchor="middle">Chen</text>
