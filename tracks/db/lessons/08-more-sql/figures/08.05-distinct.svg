<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" fill="none">
<title>SELECT DISTINCT: a row goes on only if its city is not in the set yet</title>
<defs><marker id="f0805c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0805c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0805c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="22" font-size="10.5">SELECT DISTINCT city FROM customers;</text>
<text class="tm" x="266.8" y="22" font-size="10.5">EXPLAIN: Distinct city over Scan customers</text>
<text class="t" x="40" y="52" font-size="11.5" font-weight="600">customers (Scan)</text>
<text class="tm mono" x="53" y="70" font-size="10" text-anchor="middle">id</text>
<text class="tm mono" x="92" y="70" font-size="10" text-anchor="middle">name</text>
<text class="tm mono" x="149" y="70" font-size="10" text-anchor="middle">city</text>
<text class="t" x="226" y="52" font-size="11.5" font-weight="600">is the city in the set?</text>
<text class="t" x="532" y="52" font-size="11.5" font-weight="600">out</text>
