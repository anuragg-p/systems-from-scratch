<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" fill="none">
<title>The joined row: both tables&#x27; values side by side, each name bound to one slot</title>
<defs><marker id="f0801b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">the row Join hands up for Ada and order 10: customers c&#x27;s slots, then orders o&#x27;s</text>
<rect class="a af" x="467" y="40" width="76" height="24" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="505" y="56.5" font-size="12" font-weight="600" text-anchor="middle">o.total</text>
<line class="a" x1="505" y1="66" x2="505" y2="92" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801b-aa)"/>
<text class="t" x="457" y="50" font-size="11.5" font-weight="600" text-anchor="end">base 4 + column 2 = slot 6</text>
<text class="tm" x="457" y="66" font-size="10.5" text-anchor="end">bound once, when the names are resolved</text>
<rect class="s f" x="24" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="61" y="111" font-size="10" text-anchor="middle">id</text>
<text class="t mono" x="61" y="131" font-size="13" font-weight="600" text-anchor="middle">1</text>
<text class="tm mono" x="61" y="158" font-size="10.5" text-anchor="middle">slot 0</text>
<rect class="s f" x="98" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="135" y="111" font-size="10" text-anchor="middle">name</text>
<text class="t mono" x="135" y="131" font-size="13" font-weight="600" text-anchor="middle">Ada</text>
<text class="tm mono" x="135" y="158" font-size="10.5" text-anchor="middle">slot 1</text>
<rect class="s f" x="172" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="209" y="111" font-size="10" text-anchor="middle">city</text>
<text class="t mono" x="209" y="131" font-size="13" font-weight="600" text-anchor="middle">London</text>
<text class="tm mono" x="209" y="158" font-size="10.5" text-anchor="middle">slot 2</text>
<rect class="s f" x="246" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="283" y="111" font-size="10" text-anchor="middle">rowid</text>
<text class="t mono" x="283" y="131" font-size="13" font-weight="600" text-anchor="middle">1</text>
<text class="tm mono" x="283" y="158" font-size="10.5" text-anchor="middle">slot 3</text>
<rect class="a af" x="320" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="357" y="111" font-size="10" text-anchor="middle">id</text>
<text class="ta mono" x="357" y="131" font-size="13" font-weight="600" text-anchor="middle">10</text>
<text class="tm mono" x="357" y="158" font-size="10.5" text-anchor="middle">slot 4</text>
<rect class="a af" x="394" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="431" y="111" font-size="10" text-anchor="middle">customer_id</text>
<text class="ta mono" x="431" y="131" font-size="13" font-weight="600" text-anchor="middle">1</text>
<text class="tm mono" x="431" y="158" font-size="10.5" text-anchor="middle">slot 5</text>
<rect class="a af" x="468" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="505" y="111" font-size="10" text-anchor="middle">total</text>
<text class="ta mono" x="505" y="131" font-size="13" font-weight="600" text-anchor="middle">30</text>
<text class="tm mono" x="505" y="158" font-size="10.5" text-anchor="middle">slot 6</text>
<rect class="a af" x="542" y="96" width="74" height="46" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="579" y="111" font-size="10" text-anchor="middle">rowid</text>
<text class="ta mono" x="579" y="131" font-size="13" font-weight="600" text-anchor="middle">10</text>
<text class="tm mono" x="579" y="158" font-size="10.5" text-anchor="middle">slot 7</text>
<path class="s" d="M26 164 L26 170 L318 170 L318 164" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="a" d="M322 164 L322 170 L614 170 L614 164" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="172" y="188" font-size="11.5" font-weight="600" text-anchor="middle">customers c: base 0</text>
<text class="ta" x="468" y="188" font-size="11.5" font-weight="600" text-anchor="middle">orders o: base 4</text>
<text class="tm" x="172" y="203" font-size="10.5" text-anchor="middle">3 columns, then its rowid</text>
<text class="tm" x="468" y="203" font-size="10.5" text-anchor="middle">3 columns, then its rowid</text>
<line class="m" x1="24" y1="214" x2="616" y2="214" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="234" font-size="11">c.name is slot 1, o.customer_id slot 5: eval() reads row-&gt;cols[slot], as it does for one table.</text>
<text class="tm" x="24" y="252" font-size="10.5">A scan&#x27;s row carries its rowid beside its values, not in one; the join copies it into slot 3 or 7.</text>
</svg>
