<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" fill="none">
<title>The same join three ways on shop.py&#x27;s file: page requests, and time beside them</title>
<defs><marker id="f0803c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0803c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0803c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="22" font-size="10.5">SELECT c.name, o.id, o.total FROM ... ON o.customer_id = c.id;</text>
<text class="tm" x="24" y="38" font-size="10.5">on shop.py&#x27;s file, 20000 rows out each way</text>
<text class="t mono" x="202" y="70" font-size="10.5" text-anchor="end">customers c JOIN orders o</text>
<text class="tm" x="202" y="85" font-size="10.5" text-anchor="end">scan orders, per customer</text>
<rect class="s fs" x="214" y="58" width="240" height="24" rx="3" stroke-width="1.5"/>
<text class="t" x="462" y="74" font-size="11" font-weight="600">60,239,036 page requests</text>
<text class="tm" x="462" y="90" font-size="10.5">about 860 ms</text>
<text class="t mono" x="202" y="128" font-size="10.5" text-anchor="end">customers c JOIN orders o</text>
<text class="tm" x="202" y="143" font-size="10.5" text-anchor="end">index lookup, per customer</text>
<rect class="a fa" x="214" y="116" width="3" height="24" rx="3" stroke-width="1.5"/>
<text class="ta" x="225" y="132" font-size="11" font-weight="600">147,241 page requests</text>
<text class="tm" x="225" y="148" font-size="10.5">about 12 ms</text>
<text class="t mono" x="202" y="186" font-size="10.5" text-anchor="end">orders o JOIN customers c</text>
<text class="tm" x="202" y="201" font-size="10.5" text-anchor="end">rowid lookup, per order</text>
<rect class="a fa" x="214" y="174" width="3" height="24" rx="3" stroke-width="1.5"/>
<text class="ta" x="225" y="190" font-size="11" font-weight="600">200,724 page requests</text>
<text class="tm" x="225" y="206" font-size="10.5">about 11 ms</text>
<line class="m" x1="24" y1="228" x2="616" y2="228" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="246" font-size="11">The nested loop asks for every page of orders once per customer: 1000 scans of 20000 rows.</text>
<text class="tm" x="24" y="263" font-size="10.5">To scale, the two lower bars would be under a pixel long: 1/409 and 1/300 of the first.</text>
<text class="tm" x="24" y="280" font-size="10.5">Page requests are cache hits plus misses; from the file each way reads 69 pages (134 with the index).</text>
</svg>
