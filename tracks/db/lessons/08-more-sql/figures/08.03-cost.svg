<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" fill="none">
<title>The same join three ways on shop.py&#x27;s file: page requests, and time beside them</title>
<defs><marker id="f0803c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0803c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0803c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="22" font-size="10.5">SELECT c.name, o.id, o.total FROM ... ON ...;</text>
<text class="tm" x="24" y="38" font-size="10.5">on shop.py&#x27;s file, 20000 rows out each way, in this order: no index, then CREATE INDEX orders_customer</text>
<text class="t mono" x="202" y="66" font-size="10.5" text-anchor="end">customers c JOIN orders o</text>
<text class="tm mono" x="202" y="80" font-size="10" text-anchor="end">ON o.customer_id = c.id</text>
<text class="tm" x="202" y="95" font-size="10.5" text-anchor="end">scan orders, per customer</text>
<rect class="s fs" x="214" y="58" width="240" height="24" rx="3" stroke-width="1.5"/>
<text class="t" x="462" y="74" font-size="11" font-weight="600">60,239,036 page requests</text>
<text class="tm" x="462" y="90" font-size="10.5">about 860 ms</text>
<text class="t mono" x="202" y="126" font-size="10.5" text-anchor="end">customers c JOIN orders o</text>
<text class="tm mono" x="202" y="140" font-size="10" text-anchor="end">ON o.customer_id = c.id</text>
<text class="tm" x="202" y="155" font-size="10.5" text-anchor="end">index lookup, per customer</text>
<rect class="a fa" x="214" y="118" width="3" height="24" rx="3" stroke-width="1.5"/>
<text class="ta" x="225" y="134" font-size="11" font-weight="600">147,241 page requests</text>
<text class="tm" x="225" y="150" font-size="10.5">about 12 ms</text>
<text class="t mono" x="202" y="186" font-size="10.5" text-anchor="end">orders o JOIN customers c</text>
<text class="tm mono" x="202" y="200" font-size="10" text-anchor="end">ON c.id = o.customer_id</text>
<text class="tm" x="202" y="215" font-size="10.5" text-anchor="end">rowid lookup, per order</text>
<rect class="a fa" x="214" y="178" width="3" height="24" rx="3" stroke-width="1.5"/>
<text class="ta" x="225" y="194" font-size="11" font-weight="600">200,727 page requests</text>
<text class="tm" x="225" y="210" font-size="10.5">about 10 ms</text>
<line class="m" x1="24" y1="240" x2="616" y2="240" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="258" font-size="11">The nested loop scans all of orders once per customer: 1000 x 60,236 requests, about three a row.</text>
<text class="tm" x="24" y="275" font-size="10.5">To scale, the two lower bars would be under a pixel long: 1/409 and 1/300 of the first.</text>
<text class="tm" x="24" y="292" font-size="10.5">Page requests are cache hits plus misses. Pages read from the file: 69, 134 and 69, each page once.</text>
</svg>
