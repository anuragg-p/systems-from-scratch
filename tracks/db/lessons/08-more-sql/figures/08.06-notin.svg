<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" fill="none">
<title>NOT IN against a set that holds a NULL: no customer&#x27;s answer is true, so no row comes out</title>
<defs><marker id="f0806c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0806c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0806c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="22" font-size="10.5">SELECT name FROM customers WHERE id NOT IN</text>
<text class="ta mono" x="294.9" y="22" font-size="10.5">(SELECT customer_id FROM orders)</text>
<text class="tm mono" x="496.5" y="22" font-size="10.5">;</text>
<text class="t" x="616" y="22" font-size="11.5" font-weight="600" text-anchor="end">prints nothing</text>
<text class="t" x="24" y="52" font-size="11" font-weight="600">customer_id, as the subquery reads orders</text>
<rect class="a af" x="24" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="38" y="75.96" font-size="11" text-anchor="middle">1</text>
<rect class="a af" x="52" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="66" y="75.96" font-size="11" text-anchor="middle">3</text>
<rect class="a af" x="80" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="94" y="75.96" font-size="11" text-anchor="middle">1</text>
<rect class="a af" x="108" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="122" y="75.96" font-size="11" text-anchor="middle">2</text>
<rect class="a af" x="136" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="150" y="75.96" font-size="11" text-anchor="middle">3</text>
<rect class="m f" x="164" y="60" width="40" height="24" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="184" y="75.96" font-size="9.5" text-anchor="middle">NULL</text>
<text class="tm" x="24" y="100" font-size="10.5">orders 10 to 15, in rowid order</text>
<line class="a" x1="214" y1="72" x2="290" y2="72" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0806c-aa)"/>
<text class="tm" x="252" y="64" font-size="10.5" text-anchor="middle">run once</text>
<text class="t" x="300" y="52" font-size="11" font-weight="600">the set kept on the node</text>
<rect class="a af" x="300" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="314" y="75.96" font-size="11" text-anchor="middle">1</text>
<rect class="a af" x="328" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="342" y="75.96" font-size="11" text-anchor="middle">1</text>
<rect class="a af" x="356" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="370" y="75.96" font-size="11" text-anchor="middle">2</text>
<rect class="a af" x="384" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="398" y="75.96" font-size="11" text-anchor="middle">3</text>
<rect class="a af" x="412" y="60" width="28" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="426" y="75.96" font-size="11" text-anchor="middle">3</text>
<text class="tm" x="300" y="100" font-size="10.5">sorted, duplicates kept</text>
<rect class="m f" x="454" y="60" width="40" height="24" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="474" y="75.96" font-size="9.5" text-anchor="middle">NULL</text>
<text class="t mono" x="502" y="77" font-size="10.5">has_null = 1</text>
<text class="tm" x="454" y="100" font-size="10.5">the NULL: a flag, not a value</text>
<line class="m" x1="24" y1="116" x2="616" y2="116" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="138" font-size="11" font-weight="600">customers</text>
<text class="t" x="140" y="138" font-size="11" font-weight="600">is id in the set?</text>
<text class="t mono" x="392" y="138" font-size="10.5" font-weight="600" text-anchor="middle">IN</text>
<text class="t mono" x="446" y="138" font-size="10.5" font-weight="600" text-anchor="middle">NOT IN</text>
<text class="t" x="484" y="138" font-size="11" font-weight="600">does WHERE keep it?</text>
<rect class="s f" x="24" y="150" width="26" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="37" y="165.96" font-size="11" text-anchor="middle">1</text>
<rect class="s f" x="50" y="150" width="56" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="78" y="165.96" font-size="11" text-anchor="middle">Ada</text>
<line class="s" x1="112" y1="162" x2="132" y2="162" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0806c-ah)"/>
<text class="t" x="140" y="160" font-size="11" font-weight="600">1: found</text>
<text class="tm" x="140" y="175" font-size="10.5">the bisection meets a 1</text>
<rect class="s f" x="372" y="150" width="40" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="392" y="165.96" font-size="11" text-anchor="middle">1</text>
<rect class="s f" x="420" y="150" width="52" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="446" y="165.96" font-size="11" text-anchor="middle">0</text>
<text class="t" x="484" y="160" font-size="11" font-weight="600">no</text>
<text class="tm" x="484" y="175" font-size="10.5">0 is false</text>
<rect class="s f" x="24" y="186" width="26" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="37" y="201.96" font-size="11" text-anchor="middle">2</text>
<rect class="s f" x="50" y="186" width="56" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="78" y="201.96" font-size="11" text-anchor="middle">Brook</text>
<line class="s" x1="112" y1="198" x2="132" y2="198" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0806c-ah)"/>
<text class="t" x="140" y="196" font-size="11" font-weight="600">2: found</text>
<text class="tm" x="140" y="211" font-size="10.5">the bisection meets a 2</text>
<rect class="s f" x="372" y="186" width="40" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="392" y="201.96" font-size="11" text-anchor="middle">1</text>
<rect class="s f" x="420" y="186" width="52" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="446" y="201.96" font-size="11" text-anchor="middle">0</text>
<text class="t" x="484" y="196" font-size="11" font-weight="600">no</text>
<text class="tm" x="484" y="211" font-size="10.5">0 is false</text>
<rect class="s f" x="24" y="222" width="26" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="37" y="237.96" font-size="11" text-anchor="middle">3</text>
<rect class="s f" x="50" y="222" width="56" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="78" y="237.96" font-size="11" text-anchor="middle">Chen</text>
<line class="s" x1="112" y1="234" x2="132" y2="234" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0806c-ah)"/>
<text class="t" x="140" y="232" font-size="11" font-weight="600">3: found</text>
<text class="tm" x="140" y="247" font-size="10.5">the bisection meets a 3</text>
<rect class="s f" x="372" y="222" width="40" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="392" y="237.96" font-size="11" text-anchor="middle">1</text>
<rect class="s f" x="420" y="222" width="52" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="446" y="237.96" font-size="11" text-anchor="middle">0</text>
<text class="t" x="484" y="232" font-size="11" font-weight="600">no</text>
<text class="tm" x="484" y="247" font-size="10.5">0 is false</text>
<rect class="s f" x="24" y="258" width="26" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="37" y="273.96" font-size="11" text-anchor="middle">4</text>
<rect class="s f" x="50" y="258" width="56" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="78" y="273.96" font-size="11" text-anchor="middle">Dee</text>
<line class="s" x1="112" y1="270" x2="132" y2="270" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0806c-ah)"/>
<text class="t" x="140" y="268" font-size="11" font-weight="600">4: not found</text>
<text class="tm" x="140" y="283" font-size="10.5">but the NULL might be a 4: unknown</text>
<rect class="m f" x="372" y="258" width="40" height="24" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="392" y="273.96" font-size="9.5" text-anchor="middle">NULL</text>
<rect class="m f" x="420" y="258" width="52" height="24" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="446" y="273.96" font-size="9.5" text-anchor="middle">NULL</text>
<text class="t" x="484" y="268" font-size="11" font-weight="600">no</text>
<text class="tm" x="484" y="283" font-size="10.5">NULL is not true</text>
<line class="m" x1="24" y1="298" x2="616" y2="298" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="318" font-size="11">No row survives: x NOT IN a set that holds a NULL is never true.</text>
<text class="tm mono" x="24" y="338" font-size="10">SELECT id, name, id IN (SELECT customer_id FROM orders),</text>
<text class="tm mono" x="66" y="352" font-size="10">id NOT IN (SELECT customer_id FROM orders) FROM customers;</text>
<text class="t mono" x="470" y="338" font-size="10">1|Ada|1|0</text>
<text class="t mono" x="470" y="352" font-size="10">2|Brook|1|0</text>
<text class="t mono" x="470" y="366" font-size="10">3|Chen|1|0</text>
<text class="t mono" x="470" y="380" font-size="10">4|Dee||</text>
<text class="tm" x="24" y="402" font-size="10.5">With WHERE customer_id IS NOT NULL inside the subquery the set has no NULL, and the query gives Dee.</text>
</svg>
