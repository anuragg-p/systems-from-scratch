<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" fill="none">
<title>One table&#x27;s plan and a join&#x27;s: what each edge carries is one row</title>
<defs><marker id="f0801c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="22" font-size="11.5" font-weight="600">one table, as in 04.02</text>
<rect class="s f" x="24" y="40" width="176" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="112" y="57" font-size="10.5" text-anchor="middle">Filter (city = &#x27;London&#x27;)</text>
<rect class="s f" x="52" y="234" width="120" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="112" y="251" font-size="10.5" text-anchor="middle">Scan customers</text>
<line class="s" x1="112" y1="232" x2="112" y2="68" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801c-ah)"/>
<rect class="s f" x="122" y="140" width="18" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="131" y="152.6" font-size="10" text-anchor="middle">1</text>
<rect class="s f" x="140" y="140" width="30" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="155" y="152.6" font-size="10" text-anchor="middle">Ada</text>
<rect class="s f" x="170" y="140" width="46" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="193" y="152.6" font-size="10" text-anchor="middle">London</text>
<text class="tm mono" x="122" y="171" font-size="10">+ rowid 1</text>
<text class="tm mono" x="24" y="290" font-size="10">SELECT name FROM customers</text>
<text class="tm mono" x="24" y="304" font-size="10">WHERE city = &#x27;London&#x27;;</text>
<text class="t" x="252" y="22" font-size="11.5" font-weight="600">two tables, joined (08.01)</text>
<rect class="s f" x="328" y="40" width="212" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="434" y="57" font-size="10.5" text-anchor="middle">Filter (c.id = o.customer_id)</text>
<rect class="s f" x="402" y="146" width="64" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="434" y="163" font-size="10.5" text-anchor="middle">Join</text>
<rect class="s f" x="256" y="234" width="148" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="330" y="251" font-size="10.5" text-anchor="middle">Scan customers AS c</text>
<rect class="a af" x="473" y="234" width="130" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="538" y="251" font-size="10.5" text-anchor="middle">Scan orders AS o</text>
<line class="s" x1="434" y1="144" x2="434" y2="68" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801c-ah)"/>
<rect class="s f" x="444" y="97" width="16" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="452" y="109.6" font-size="10" text-anchor="middle">1</text>
<rect class="s f" x="460" y="97" width="28" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="474" y="109.6" font-size="10" text-anchor="middle">Ada</text>
<rect class="s f" x="488" y="97" width="44" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="510" y="109.6" font-size="10" text-anchor="middle">London</text>
<rect class="s f" x="532" y="97" width="16" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="540" y="109.6" font-size="10" text-anchor="middle">1</text>
<rect class="a af" x="548" y="97" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="558" y="109.6" font-size="10" text-anchor="middle">10</text>
<rect class="a af" x="568" y="97" width="16" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="576" y="109.6" font-size="10" text-anchor="middle">1</text>
<rect class="a af" x="584" y="97" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="594" y="109.6" font-size="10" text-anchor="middle">30</text>
<rect class="a af" x="604" y="97" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="614" y="109.6" font-size="10" text-anchor="middle">10</text>
<text class="tm" x="534" y="92" font-size="10" text-anchor="middle">8 values</text>
<line class="s" x1="352" y1="232" x2="420" y2="174" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801c-ah)"/>
<line class="a" x1="516" y1="232" x2="448" y2="174" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801c-aa)"/>
<rect class="s f" x="242" y="188" width="18" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="251" y="200.6" font-size="10" text-anchor="middle">1</text>
<rect class="s f" x="260" y="188" width="30" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="275" y="200.6" font-size="10" text-anchor="middle">Ada</text>
<rect class="s f" x="290" y="188" width="46" height="18" rx="0" stroke-width="1.5"/>
<text class="t mono" x="313" y="200.6" font-size="10" text-anchor="middle">London</text>
<text class="tm mono" x="336" y="219" font-size="10" text-anchor="end">+ rowid 1</text>
<rect class="a af" x="532" y="188" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="542" y="200.6" font-size="10" text-anchor="middle">10</text>
<rect class="a af" x="552" y="188" width="16" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="560" y="200.6" font-size="10" text-anchor="middle">1</text>
<rect class="a af" x="568" y="188" width="20" height="18" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="578" y="200.6" font-size="10" text-anchor="middle">30</text>
<text class="tm mono" x="532" y="219" font-size="10">+ rowid 10</text>
<text class="tm mono" x="252" y="290" font-size="10">SELECT c.name, o.total FROM customers c JOIN orders o</text>
<text class="tm mono" x="252" y="304" font-size="10">ON c.id = o.customer_id;</text>
