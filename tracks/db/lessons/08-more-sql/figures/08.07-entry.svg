<text class="t" x="24" y="222" font-size="11">Nothing in an entry, or in its page, says unique: page 3 is the same in both files, as sqlite3 writes it.</text>
<text class="tm" x="24" y="240" font-size="10.5">Unique is a check made before each write. The files differ only on page 1, in sqlite_schema: the CREATE</text>
<text class="tm" x="24" y="255" font-size="10.5">TABLE text, and the index&#x27;s row (its name, and NULL here where users_email&#x27;s row has its CREATE INDEX).</text>
