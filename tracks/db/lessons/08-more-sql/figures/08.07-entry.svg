<text class="t" x="24" y="242" font-size="11">Nothing in an entry, or in its page, says unique: page 3 is the same bytes in both files.</text>
<text class="tm" x="24" y="260" font-size="10.5">cmp users.db plain.db 4096 4096 finds them the same from page 2 on, as sqlite3 writes them too.</text>
<text class="tm" x="24" y="276" font-size="10.5">Only page 1 differs: one CREATE TABLE says UNIQUE, and the other file has a CREATE INDEX.</text>
