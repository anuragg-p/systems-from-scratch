<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" fill="none">
<title>Row 1 of table p as stored, and as decode_row() hands it back</title>
<defs><marker id="f0401b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0401b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0401b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="20" font-size="10.5">INSERT INTO p(n, s) VALUES (&#x27;42&#x27;, 7);   p is (id INTEGER PRIMARY KEY, n INTEGER, s TEXT)</text>
<text class="tm" x="24" y="44" font-size="11">its cell on the leaf page, from xxd</text>
<rect class="s fs" x="70" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="101" y="75" font-size="14" font-weight="600" text-anchor="middle">06</text>
<text class="tm" x="101" y="102" font-size="10.5" text-anchor="middle">size</text>
<rect class="a af" x="132" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="163" y="75" font-size="14" font-weight="600" text-anchor="middle">01</text>
<text class="ta" x="163" y="102" font-size="10.5" text-anchor="middle">rowid</text>
<rect class="s f" x="194" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="225" y="75" font-size="14" font-weight="600" text-anchor="middle">04</text>
<text class="tm" x="225" y="102" font-size="10.5" text-anchor="middle">hdr</text>
<rect class="s f" x="256" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="287" y="75" font-size="14" font-weight="600" text-anchor="middle">00</text>
<text class="tm" x="287" y="102" font-size="10.5" text-anchor="middle">NULL</text>
<rect class="s f" x="318" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="349" y="75" font-size="14" font-weight="600" text-anchor="middle">01</text>
<text class="tm" x="349" y="102" font-size="10.5" text-anchor="middle">int8</text>
<rect class="s f" x="380" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="411" y="75" font-size="14" font-weight="600" text-anchor="middle">0f</text>
<text class="tm" x="411" y="102" font-size="10.5" text-anchor="middle">text 1</text>
<rect class="s fs" x="442" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="473" y="75" font-size="14" font-weight="600" text-anchor="middle">2a</text>
<text class="tm" x="473" y="102" font-size="10.5" text-anchor="middle">42</text>
<rect class="s fs" x="504" y="54" width="62" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="535" y="75" font-size="14" font-weight="600" text-anchor="middle">37</text>
<text class="tm" x="535" y="102" font-size="10.5" text-anchor="middle">&#x27;7&#x27;</text>
<path class="m" d="M196 112 L196 118 L440 118 L440 112" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="318" y="134" font-size="10.5" text-anchor="middle">record header: one serial type per column</text>
<path class="m" d="M444 112 L444 118 L564 118 L564 112" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="504" y="134" font-size="10.5" text-anchor="middle">record body</text>
<text class="tm" x="24" y="168" font-size="11">decoded into a row</text>
<rect class="a af" x="70" y="178" width="168" height="34" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="82" y="200" font-size="11">id</text>
<text class="ta mono" x="154" y="201" font-size="14" font-weight="600" text-anchor="middle">1</text>
<text class="ta" x="154" y="230" font-size="10.5" text-anchor="middle">the rowid, put back</text>
<rect class="s f" x="254" y="178" width="168" height="34" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="266" y="200" font-size="11">n</text>
<text class="t mono" x="338" y="201" font-size="14" font-weight="600" text-anchor="middle">42</text>
<text class="tm" x="338" y="230" font-size="10.5" text-anchor="middle">&#x27;42&#x27; became an integer</text>
<rect class="s f" x="438" y="178" width="168" height="34" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="450" y="200" font-size="11">s</text>
<text class="t mono" x="522" y="201" font-size="14" font-weight="600" text-anchor="middle">&#x27;7&#x27;</text>
<text class="tm" x="522" y="230" font-size="10.5" text-anchor="middle">7 became text</text>
<path class="a" d="M163.0 108 L163.0 176" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0401b-aa)" stroke-dasharray="4 4"/>
<text class="tm" x="24" y="256" font-size="10.5">The record keeps NULL where id is: the rowid already holds it. Affinity changed the other two on the way in.</text>
</svg>
