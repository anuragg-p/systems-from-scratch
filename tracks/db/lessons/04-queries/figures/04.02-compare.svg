<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 238" fill="none">
<title>The order of values, and affinity applied before a comparison</title>
<defs><marker id="f0402c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0402c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0402c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">every value has a place in one order</text>
<rect class="s fs" x="24" y="30" width="70" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="59" y="56" font-size="12.5" text-anchor="middle">NULL</text>
<text class="tm" x="59" y="88" font-size="10.5" text-anchor="middle">NULL</text>
<rect class="s fs" x="108" y="30" width="210" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="143" y="56" font-size="12.5" text-anchor="middle">-2</text>
<text class="t mono" x="213" y="56" font-size="12.5" text-anchor="middle">2.5</text>
<text class="t mono" x="283" y="56" font-size="12.5" text-anchor="middle">3</text>
<text class="tm" x="213" y="88" font-size="10.5" text-anchor="middle">numbers, by value</text>
<text class="ta mono" x="101" y="55" font-size="14" font-weight="700" text-anchor="middle">&lt;</text>
<rect class="s fs" x="332" y="30" width="210" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="367" y="56" font-size="12.5" text-anchor="middle">&#x27;10&#x27;</text>
<text class="t mono" x="437" y="56" font-size="12.5" text-anchor="middle">&#x27;9&#x27;</text>
<text class="t mono" x="507" y="56" font-size="12.5" text-anchor="middle">&#x27;a&#x27;</text>
<text class="tm" x="437" y="88" font-size="10.5" text-anchor="middle">text, bytewise</text>
<text class="ta mono" x="325" y="55" font-size="14" font-weight="700" text-anchor="middle">&lt;</text>
<rect class="s fs" x="556" y="30" width="70" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="591" y="56" font-size="12.5" text-anchor="middle">x&#x27;00&#x27;</text>
<text class="tm" x="591" y="88" font-size="10.5" text-anchor="middle">blobs</text>
<text class="ta mono" x="549" y="55" font-size="14" font-weight="700" text-anchor="middle">&lt;</text>
<text class="tm" x="24" y="128" font-size="11">before comparing, a column&#x27;s affinity converts the other side</text>
<rect class="s f" x="24" y="140" width="120" height="24" rx="5" stroke-width="1.5"/>
<text class="t mono" x="84" y="156.5" font-size="12" text-anchor="middle">n = &#x27;5&#x27;</text>
<text class="t" x="156" y="156.5" font-size="11">n is an INTEGER column holding 5: &#x27;5&#x27; becomes 5</text>
<text class="ta mono" x="616" y="156.5" font-size="13" font-weight="700" text-anchor="end">1</text>
<rect class="s f" x="24" y="170" width="120" height="24" rx="5" stroke-width="1.5"/>
<text class="t mono" x="84" y="186.5" font-size="12" text-anchor="middle">1 = &#x27;1&#x27;</text>
<text class="t" x="156" y="186.5" font-size="11">two literals, no affinity: a number is never text</text>
<text class="ta mono" x="616" y="186.5" font-size="13" font-weight="700" text-anchor="end">0</text>
<rect class="s f" x="24" y="200" width="120" height="24" rx="5" stroke-width="1.5"/>
<text class="t mono" x="84" y="216.5" font-size="12" text-anchor="middle">&#x27;10&#x27; &lt; &#x27;9&#x27;</text>
<text class="t" x="156" y="216.5" font-size="11">text compares byte by byte: &#x27;1&#x27; &lt; &#x27;9&#x27;</text>
<text class="ta mono" x="616" y="216.5" font-size="13" font-weight="700" text-anchor="end">1</text>
</svg>
