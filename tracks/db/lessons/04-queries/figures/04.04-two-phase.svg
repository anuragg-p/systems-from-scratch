<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>UPDATE t SET id = id + 100: collect the rowids, then change the rows</title>
<defs><marker id="f0404a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0404a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0404a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="22" font-size="12" font-weight="600">UPDATE t SET id = id + 100;   rows 1, 2, 3</text>
<text class="t" x="24" y="52" font-size="12" font-weight="600">as written</text>
<text class="tm" x="24" y="70" font-size="11">1. find the rows, keep only their rowids</text>
<rect class="a af" x="270" y="58" width="36" height="22" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="288" y="73" font-size="12" font-weight="600" text-anchor="middle">1</text>
<rect class="a af" x="310" y="58" width="36" height="22" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="328" y="73" font-size="12" font-weight="600" text-anchor="middle">2</text>
<rect class="a af" x="350" y="58" width="36" height="22" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="368" y="73" font-size="12" font-weight="600" text-anchor="middle">3</text>
<text class="tm" x="24" y="96" font-size="11">2. for each: read it, compute, delete the old row, insert the new</text>
<text class="tm" x="24" y="129" font-size="10.5">leaf after</text>
<rect class="s fs" x="110" y="108" width="54" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="137" y="129" font-size="12.5" text-anchor="middle">101</text>
<rect class="s fs" x="164" y="108" width="54" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="191" y="129" font-size="12.5" text-anchor="middle">102</text>
<rect class="s fs" x="218" y="108" width="54" height="32" rx="0" stroke-width="1.5"/>
<text class="t mono" x="245" y="129" font-size="12.5" text-anchor="middle">103</text>
<text class="t" x="290" y="129" font-size="11">each row visited once: 101|10 102|20 103|30</text>
<line class="m" x1="24" y1="160" x2="616" y2="160" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="t" x="24" y="186" font-size="12" font-weight="600">if the scan changed rows as it went (not what the code does)</text>
<rect class="s f" x="24" y="202" width="62" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="55" y="222" font-size="12.5" text-anchor="middle">1</text>
<line class="m" x1="88" y1="217" x2="94" y2="217" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s f" x="96" y="202" width="62" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="127" y="222" font-size="12.5" text-anchor="middle">2</text>
<line class="m" x1="160" y1="217" x2="166" y2="217" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s f" x="168" y="202" width="62" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="199" y="222" font-size="12.5" text-anchor="middle">3</text>
<line class="m" x1="232" y1="217" x2="238" y2="217" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="240" y="202" width="62" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="271" y="222" font-size="12.5" text-anchor="middle">101</text>
<line class="m" x1="304" y1="217" x2="310" y2="217" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="312" y="202" width="62" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="343" y="222" font-size="12.5" text-anchor="middle">102</text>
<line class="m" x1="376" y1="217" x2="382" y2="217" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="384" y="202" width="62" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="415" y="222" font-size="12.5" text-anchor="middle">103</text>
<line class="m" x1="448" y1="217" x2="454" y2="217" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="456" y="202" width="62" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="487" y="222" font-size="12.5" text-anchor="middle">201</text>
<line class="m" x1="520" y1="217" x2="526" y2="217" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="528" y="202" width="62" height="30" rx="6" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="ta mono" x="559" y="222" font-size="12.5" text-anchor="middle">...</text>
<text class="tm" x="24" y="254" font-size="11">Row 1 moves to 101, which lies ahead of the cursor in rowid order, so the scan meets it again</text>
<text class="tm" x="24" y="270" font-size="11">and moves it to 201, then 301: the update never ends. Collecting the rowids first is what</text>
<text class="tm" x="24" y="286" font-size="11">stops it, and it is what SQL means: SET is worked out from the rows as they were.</text>
</svg>
