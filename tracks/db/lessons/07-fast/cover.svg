<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Measure, find where the time goes, change one thing, measure again</title>
<defs><marker id="m07db-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m07db-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="28" font-size="11">./db against sqlite3, one run of the benchmark</text>
<text class="t" x="220" y="56" font-size="11" text-anchor="end">insert, autocommit</text>
<rect class="s fs" x="230" y="45" width="86.1" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="324.1" y="57" font-size="10.5">1.23x</text>
<text class="t" x="220" y="82" font-size="11" text-anchor="end">insert, one transaction</text>
<rect class="s fs" x="230" y="71" width="63.7" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="308" y="83" font-size="10.5">0.91x</text>
<text class="t" x="220" y="108" font-size="11" text-anchor="end">point lookup by primary key</text>
<rect class="s fs" x="230" y="97" width="300.3" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="538.3" y="109" font-size="10.5">4.29x</text>
<text class="t" x="220" y="134" font-size="11" text-anchor="end">range scan, 100 rows each</text>
<rect class="s fs" x="230" y="123" width="95.2" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="333.2" y="135" font-size="10.5">1.36x</text>
<text class="t" x="220" y="160" font-size="11" text-anchor="end">lookup by secondary index</text>
<rect class="s fs" x="230" y="149" width="216.3" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="454.3" y="161" font-size="10.5">3.09x</text>
<text class="ta" x="220" y="186" font-size="11" text-anchor="end">update by key</text>
<rect class="a fa" x="230" y="175" width="57.4" height="16" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="308" y="187" font-size="10.5">0.82x</text>
<text class="ta" x="220" y="212" font-size="11" text-anchor="end">delete by key</text>
<rect class="a fa" x="230" y="201" width="53.2" height="16" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="308" y="213" font-size="10.5">0.76x</text>
<line class="s" x1="300" y1="36" x2="300" y2="230" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm mono" x="300" y="248" font-size="10.5" text-anchor="middle">1.0</text>
<text class="tm" x="24" y="282" font-size="11.5">faster where it skips work sqlite3 does; slower where it rewrites whole pages</text>
