<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>The benchmark as ratios: ./db&#x27;s speed over sqlite3&#x27;s, one run</title>
<defs><marker id="f0701a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0701a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0701a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">./learn bench db --at 07.01: ops/s of ./db divided by ops/s of sqlite3 (above 1: ./db is faster)</text>
<text class="t" x="204" y="55" font-size="11" text-anchor="end">insert, autocommit</text>
<rect class="s fs" x="214" y="43" width="100.86" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="322.86" y="56" font-size="11" font-weight="600" text-anchor="None">1.23x</text>
<text class="t" x="204" y="85" font-size="11" text-anchor="end">insert, one transaction</text>
<rect class="s fs" x="214" y="73" width="74.62" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="304" y="86" font-size="11" font-weight="600" text-anchor="None">0.91x</text>
<text class="tm" x="350" y="86" font-size="10.5">(another run: 1.05x)</text>
<text class="t" x="204" y="115" font-size="11" text-anchor="end">point lookup by primary key</text>
<rect class="s fs" x="214" y="103" width="351.78" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="573.78" y="116" font-size="11" font-weight="600" text-anchor="None">4.29x</text>
<text class="t" x="204" y="145" font-size="11" text-anchor="end">range scan, 100 rows each</text>
<rect class="s fs" x="214" y="133" width="111.52" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="333.52" y="146" font-size="11" font-weight="600" text-anchor="None">1.36x</text>
<text class="t" x="204" y="175" font-size="11" text-anchor="end">lookup by secondary index</text>
<rect class="s fs" x="214" y="163" width="253.38" height="18" rx="3" stroke-width="1.5"/>
<text class="t mono" x="475.38" y="176" font-size="11" font-weight="600" text-anchor="None">3.09x</text>
<text class="ta" x="204" y="205" font-size="11" font-weight="600" text-anchor="end">update by key</text>
<rect class="a fa" x="214" y="193" width="67.24" height="18" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="304" y="206" font-size="11" font-weight="600" text-anchor="None">0.82x</text>
<text class="ta" x="204" y="235" font-size="11" font-weight="600" text-anchor="end">delete by key</text>
<rect class="a fa" x="214" y="223" width="62.32" height="18" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="304" y="236" font-size="11" font-weight="600" text-anchor="None">0.76x</text>
<line class="s" x1="296" y1="34" x2="296" y2="250" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm" x="296" y="264" font-size="10.5" text-anchor="middle">1.0: as fast as sqlite3</text>
<line class="m" x1="24" y1="270" x2="616" y2="270" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta" x="24" y="290" font-size="11" font-weight="600" text-anchor="None">file size: 11,505,664 bytes against 5,914,624, 1.95x bigger</text>
