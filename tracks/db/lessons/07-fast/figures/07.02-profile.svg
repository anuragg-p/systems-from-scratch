<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" fill="none">
<title>Where the time of a delete and an update goes, from a sampling profiler</title>
<defs><marker id="f0702a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0702a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0702a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">sample(1) on six rounds of 100000 deletes, and of 100000 updates; share of samples</text>
<text class="t" x="24" y="50" font-size="11.5" font-weight="600" text-anchor="None">deletes (1714 samples)</text>
<rect class="a fa" x="24" y="58" width="270.44" height="24" rx="0" stroke-width="1.5"/>
<rect class="a af" x="294.44" y="58" width="144.03" height="24" rx="0" stroke-width="1.5"/>
<rect class="s fs" x="438.47" y="58" width="22.8" height="24" rx="0" stroke-width="1.5"/>
<rect class="s f" x="461.26" y="58" width="51.12" height="24" rx="0" stroke-width="1.5"/>
<rect class="s fs" x="512.38" y="58" width="22.45" height="24" rx="0" stroke-width="1.5"/>
<rect class="m" x="534.83" y="58" width="81.17" height="24" rx="0" stroke-width="1.5"/>
<text class="t" x="24" y="100" font-size="11">rebuild the page 46% | walk down 24% | plan 4% | savepoint 9% | parse 4% | other 14%</text>
<text class="t" x="24" y="130" font-size="11.5" font-weight="600" text-anchor="None">updates (1005 samples)</text>
<rect class="a fa" x="24" y="138" width="178.48" height="24" rx="0" stroke-width="1.5"/>
<rect class="a af" x="202.48" y="138" width="131.95" height="24" rx="0" stroke-width="1.5"/>
<rect class="s fs" x="334.43" y="138" width="40.06" height="24" rx="0" stroke-width="1.5"/>
<rect class="s f" x="374.49" y="138" width="30.63" height="24" rx="0" stroke-width="1.5"/>
<rect class="s fs" x="405.12" y="138" width="46.54" height="24" rx="0" stroke-width="1.5"/>
<rect class="m" x="451.65" y="138" width="164.35" height="24" rx="0" stroke-width="1.5"/>
<text class="t" x="24" y="180" font-size="11">rebuild the page 30% | walk down 22% | plan 7% | savepoint 5% | parse 8% | other 28%</text>
<text class="t" x="24" y="210" font-size="11">rebuild the page: removing one cell copies every cell out and lays the page out again</text>
<text class="tm" x="24" y="228" font-size="10.5">walk down: seeks from the root, three or four per row; savepoint: a copy of each page a statement changes</text>
<text class="tm" x="24" y="246" font-size="10.5">(an update removes the old cell and inserts the new one, so it rebuilds the page too)</text>
</svg>
