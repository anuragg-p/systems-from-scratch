<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" fill="none">
<title>Autocommit inserts per second, by how a commit is flushed</title>
<defs><marker id="f0002c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0002c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0002c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">1,000 INSERTs, each its own transaction: median of 5 runs, operations per second</text>
<line class="m" x1="240.0" y1="38" x2="240.0" y2="196" stroke-width="1"/>
<text class="tm mono" x="240" y="212" font-size="10.5" text-anchor="middle">0</text>
<line class="m" x1="315.0" y1="38" x2="315.0" y2="196" stroke-width="1"/>
<text class="tm mono" x="315" y="212" font-size="10.5" text-anchor="middle">2,000</text>
<line class="m" x1="390.0" y1="38" x2="390.0" y2="196" stroke-width="1"/>
<text class="tm mono" x="390" y="212" font-size="10.5" text-anchor="middle">4,000</text>
<line class="m" x1="465.0" y1="38" x2="465.0" y2="196" stroke-width="1"/>
<text class="tm mono" x="465" y="212" font-size="10.5" text-anchor="middle">6,000</text>
<line class="m" x1="540.0" y1="38" x2="540.0" y2="196" stroke-width="1"/>
<text class="tm mono" x="540" y="212" font-size="10.5" text-anchor="middle">8,000</text>
<text class="t" x="228" y="58" font-size="11.5" text-anchor="end">./db, fsync(2) at every commit</text>
<path class="fa" d="M240.0 44.0 H353.2 Q357.2 44.0 357.2 48.0 V60.0 Q357.2 64.0 353.2 64.0 H240.0 Z"/>
<text class="t mono" x="365.23" y="59" font-size="12" font-weight="600">3,126</text>
<text class="tm mono" x="228" y="73" font-size="10" text-anchor="end">4,561 3,146 2,984 3,002 3,126</text>
<text class="t" x="228" y="98" font-size="11.5" text-anchor="end">./db, sys_fsync() made a no-op</text>
<path class="fa" d="M240.0 84.0 H462.6 Q466.6 84.0 466.6 88.0 V100.0 Q466.6 104.0 462.6 104.0 H240.0 Z"/>
<text class="t mono" x="474.57" y="99" font-size="12" font-weight="600">6,042</text>
<text class="tm mono" x="228" y="113" font-size="10" text-anchor="end">3,513 5,910 6,042 7,544 7,803</text>
<text class="t" x="228" y="138" font-size="11.5" text-anchor="end">sqlite3, fullfsync=OFF</text>
<path class="fa" d="M240.0 124.0 H360.9 Q364.9 124.0 364.9 128.0 V140.0 Q364.9 144.0 360.9 144.0 H240.0 Z"/>
<text class="t mono" x="372.95" y="139" font-size="12" font-weight="600">3,332</text>
<text class="tm mono" x="228" y="153" font-size="10" text-anchor="end">3,605 2,737 1,770 4,040 3,332</text>
<text class="t" x="228" y="178" font-size="11.5" text-anchor="end">sqlite3, fullfsync=ON</text>
<path class="fa" d="M240.0 164.0 H241.5 Q242.9 164.0 242.9 165.5 V182.5 Q242.9 184.0 241.5 184.0 H240.0 Z"/>
<text class="t mono" x="250.93" y="179" font-size="12" font-weight="600">78</text>
<text class="tm mono" x="228" y="193" font-size="10" text-anchor="end">79 77 78 78 78</text>
<text class="tm" x="24" y="226" font-size="11">fsync(2) on macOS leaves the data in the drive&#x27;s cache; F_FULLFSYNC (fullfsync=ON) flushes it</text>
</svg>
