<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" fill="none">
<title>One SELECT through the engine, file by file</title>
<defs><marker id="f0001a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0001a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0001a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="24" y="12" width="592" height="34" rx="8" stroke-width="1.5"/>
<text class="t mono" x="40" y="34" font-size="13">db&gt; SELECT name FROM users WHERE id = 7;</text>
<rect class="s f" x="48" y="62" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="79" font-size="12" font-weight="600">main.c</text>
<rect class="a af" x="530" y="65" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="79" font-size="11" font-weight="600" text-anchor="middle">module 00</text>
<text class="tm" x="196" y="79" font-size="11.5">the shell: read text until a ;  then hand it over</text>
<rect class="s f" x="48" y="93" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="110" font-size="12" font-weight="600">tokenize.c</text>
<rect class="a af" x="530" y="96" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="110" font-size="11" font-weight="600" text-anchor="middle">module 03</text>
<rect class="m fs" x="196" y="98" width="45.8" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="218.9" y="110" font-size="10.5" text-anchor="middle">SELECT</text>
<rect class="m fs" x="244.8" y="98" width="33.2" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="261.4" y="110" font-size="10.5" text-anchor="middle">name</text>
<rect class="m fs" x="281" y="98" width="33.2" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="297.6" y="110" font-size="10.5" text-anchor="middle">FROM</text>
<rect class="m fs" x="317.2" y="98" width="39.5" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="336.95" y="110" font-size="10.5" text-anchor="middle">users</text>
<rect class="m fs" x="359.7" y="98" width="39.5" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="379.45" y="110" font-size="10.5" text-anchor="middle">WHERE</text>
<rect class="m fs" x="402.2" y="98" width="20.6" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="412.5" y="110" font-size="10.5" text-anchor="middle">id</text>
<rect class="m fs" x="425.8" y="98" width="14.3" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="432.95" y="110" font-size="10.5" text-anchor="middle">=</text>
<rect class="m fs" x="443.1" y="98" width="14.3" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="450.25" y="110" font-size="10.5" text-anchor="middle">7</text>
<rect class="m fs" x="460.4" y="98" width="14.3" height="16" rx="3" stroke-width="1.5"/>
<text class="t mono" x="467.55" y="110" font-size="10.5" text-anchor="middle">;</text>
<rect class="s f" x="48" y="124" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="141" font-size="12" font-weight="600">parse.c</text>
<rect class="a af" x="530" y="127" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="141" font-size="11" font-weight="600" text-anchor="middle">module 03</text>
<text class="tm" x="196" y="141" font-size="11.5">a SELECT tree: column name, table users, id = 7</text>
<rect class="s f" x="48" y="155" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="172" font-size="12" font-weight="600">schema.c</text>
<rect class="a af" x="530" y="158" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="172" font-size="11" font-weight="600" text-anchor="middle">module 03</text>
<text class="tm" x="196" y="172" font-size="11.5">the catalog: users has columns id, name; data at page 2</text>
<rect class="s f" x="48" y="186" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="203" font-size="12" font-weight="600">plan.c</text>
<rect class="a af" x="530" y="189" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="203" font-size="11" font-weight="600" text-anchor="middle">module 05</text>
<text class="tm" x="196" y="203" font-size="11.5">id is the key: look up row 7, do not read every row</text>
<rect class="s f" x="48" y="217" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="234" font-size="12" font-weight="600">exec.c, expr.c</text>
<rect class="a af" x="530" y="220" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="234" font-size="11" font-weight="600" text-anchor="middle">module 04</text>
<text class="tm" x="196" y="234" font-size="11.5">run the plan: keep the column name, print it</text>
<rect class="s f" x="48" y="248" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="265" font-size="12" font-weight="600">btree.c</text>
<rect class="a af" x="530" y="251" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="265" font-size="11" font-weight="600" text-anchor="middle">module 02</text>
<text class="tm" x="196" y="265" font-size="11.5">search page 2, the root of users&#x27; tree, for key 7</text>
<rect class="s f" x="48" y="279" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="296" font-size="12" font-weight="600">record.c</text>
<rect class="a af" x="530" y="282" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="296" font-size="11" font-weight="600" text-anchor="middle">module 01</text>
<text class="tm" x="196" y="296" font-size="11.5">the row&#x27;s bytes become the values 7 and &#x27;ken&#x27;</text>
<rect class="s f" x="48" y="310" width="470" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="60" y="327" font-size="12" font-weight="600">pager.c</text>
<rect class="a af" x="530" y="313" width="86" height="20" rx="10" stroke-width="1.5"/>
<text class="ta" x="573" y="327" font-size="11" font-weight="600" text-anchor="middle">module 01</text>
<text class="tm" x="196" y="327" font-size="11.5">page 2 from memory, or 4096 bytes read at offset 4096</text>
<rect class="m f" x="48" y="341" width="470" height="26" rx="6" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="60" y="358" font-size="12" font-weight="600">journal.c, wal.c</text>
<rect class="m f" x="530" y="344" width="86" height="20" rx="10" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="573" y="358" font-size="11" font-weight="600" text-anchor="middle">module 06</text>
<text class="tm" x="196" y="358" font-size="11.5">not used: a SELECT changes nothing</text>
<line class="m" x1="32" y1="50" x2="32" y2="376" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0001a-am)"/>
<text class="t mono" x="24" y="398" font-size="12" font-weight="600">learn.db</text>
<rect class="s f" x="100" y="382" width="140" height="24" rx="4" stroke-width="1.5"/>
<text class="t" x="170" y="398" font-size="11" text-anchor="middle">page 1: the catalog</text>
<rect class="a af" x="250" y="382" width="140" height="24" rx="4" stroke-width="1.5"/>
<text class="ta" x="320" y="398" font-size="11" text-anchor="middle">page 2: users&#x27; rows</text>
<text class="tm" x="400" y="398" font-size="11">two pages of 4096 bytes</text>
</svg>
