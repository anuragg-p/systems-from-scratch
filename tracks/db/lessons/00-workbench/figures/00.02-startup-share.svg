<text class="tm mono" x="236" y="266" font-size="10.5" text-anchor="middle">0%</text>
<line class="m" x1="338.8571428571429" y1="40" x2="338.8571428571429" y2="250" stroke-width="1"/>
<text class="tm mono" x="338.86" y="266" font-size="10.5" text-anchor="middle">20%</text>
<line class="m" x1="441.7142857142857" y1="40" x2="441.7142857142857" y2="250" stroke-width="1"/>
<text class="tm mono" x="441.71" y="266" font-size="10.5" text-anchor="middle">40%</text>
