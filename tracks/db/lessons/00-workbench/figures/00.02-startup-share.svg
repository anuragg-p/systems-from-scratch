<circle class="a fa" cx="236.92" cy="54" r="4.5" stroke-width="1.5"/>
<text class="t" x="224" y="88" font-size="11.5" text-anchor="end">insert, one transaction</text>
<line class="m" x1="262.82" y1="84" x2="426.33" y2="84" stroke-width="1.5" stroke-linecap="round"/>
<circle class="a f" cx="426.33" cy="84" r="4.5" stroke-width="1.5"/>
<circle class="a fa" cx="262.82" cy="84" r="4.5" stroke-width="1.5"/>
<text class="t" x="224" y="118" font-size="11.5" text-anchor="end">point lookup by primary key</text>
<line class="m" x1="252.91" y1="114" x2="443.31" y2="114" stroke-width="1.5" stroke-linecap="round"/>
