<circle class="a fa" cx="270.23" cy="234" r="4.5" stroke-width="1.5"/>
<text class="tm" x="24" y="288" font-size="11">start-up 2.8 ms in the quick run, 5.4 ms in the full run; time per run = ops / (ops/s)</text>
