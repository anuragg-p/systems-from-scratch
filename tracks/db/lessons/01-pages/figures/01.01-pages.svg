<line class="m" x1="500" y1="240" x2="500" y2="246" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="500" y="258" font-size="10.5" text-anchor="middle">8183</text>
<line class="m" x1="600" y1="240" x2="600" y2="246" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="600" y="258" font-size="10.5" text-anchor="middle">8192</text>
<path class="a" d="M130.0 204 C 130.0 184, 550.0 184, 550.0 203" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0101a-aa)"/>
<text class="ta mono" x="355" y="185" font-size="10.5" text-anchor="middle">pointer 0ff7 = 4087</text>
<text class="tm" x="24" y="294" font-size="11">A page is found by arithmetic alone. Inside it, rows fill from the end and the pointers to them</text>
<text class="tm" x="24" y="310" font-size="11">from the front; page 1 is the same, but after the 100-byte database header.</text>
</svg>
