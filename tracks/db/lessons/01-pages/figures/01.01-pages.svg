<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" fill="none">
<title>demo.db: two pages of 4096 bytes</title>
<defs><marker id="f0101a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0101a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0101a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">demo.db after CREATE TABLE t(a); INSERT INTO t VALUES (&#x27;hello&#x27;): 8192 bytes (not to scale)</text>
<text class="t" x="24" y="42" font-size="12.5" font-weight="700">page 1</text>
<text class="tm mono" x="84" y="42" font-size="11">starts at (n - 1) x 4096 = 0</text>
<rect class="a fa" x="40" y="80" width="120" height="34" rx="0" stroke-width="1.5"/>
