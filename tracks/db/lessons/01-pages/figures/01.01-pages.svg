<rect class="s fs" x="110" y="206" width="40" height="34" rx="0" stroke-width="1.5"/>
<text class="t" x="130" y="227" font-size="11" text-anchor="middle">ptr</text>
<line class="m" x1="110" y1="240" x2="110" y2="246" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="110" y="258" font-size="10.5" text-anchor="middle">4104</text>
<rect class="s f" x="150" y="206" width="350" height="34" rx="0" stroke-width="1.5"/>
<text class="tm" x="325" y="227" font-size="11" text-anchor="middle">free space</text>
<line class="m" x1="150" y1="240" x2="150" y2="246" stroke-width="1.5" stroke-linecap="round"/>
