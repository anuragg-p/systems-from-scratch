<path class="a" d="M250.0 78 C 250.0 58, 550.0 58, 550.0 77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0101a-aa)"/>
<text class="ta mono" x="415" y="59" font-size="10.5" text-anchor="middle">pointer 0fdf = 4063</text>
<text class="t" x="24" y="168" font-size="12.5" font-weight="700">page 2</text>
<text class="tm mono" x="84" y="168" font-size="11">starts at (n - 1) x 4096 = 4096</text>
