<line class="m" x1="160" y1="114" x2="160" y2="120" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="160" y="132" font-size="10.5" text-anchor="middle">100</text>
<rect class="s fs" x="230" y="80" width="40" height="34" rx="0" stroke-width="1.5"/>
<text class="t" x="250" y="101" font-size="11" text-anchor="middle">ptr</text>
<line class="m" x1="230" y1="114" x2="230" y2="120" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="230" y="132" font-size="10.5" text-anchor="middle">108</text>
<rect class="s f" x="270" y="80" width="230" height="34" rx="0" stroke-width="1.5"/>
<text class="tm" x="385" y="101" font-size="11" text-anchor="middle">free space</text>
<line class="m" x1="270" y1="114" x2="270" y2="120" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="270" y="132" font-size="10.5" text-anchor="middle">110</text>
<rect class="a af" x="500" y="80" width="100" height="34" rx="0" stroke-width="1.5"/>
<text class="ta" x="550" y="101" font-size="11" font-weight="600" text-anchor="middle">row: table t</text>
<line class="m" x1="500" y1="114" x2="500" y2="120" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="500" y="132" font-size="10.5" text-anchor="middle">4063</text>
