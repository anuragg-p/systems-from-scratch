<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>The cache after lookup 10, kept in LRU order and in FIFO order</title>
<defs><marker id="f0102c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0102c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0102c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">ten slots; each lookup reads the root, page 2, then one leaf; the newest page is on the left</text>
<text class="t" x="24" y="56" font-size="13" font-weight="700">LRU</text>
<text class="ta" x="616" y="56" font-size="12" font-weight="700" text-anchor="end">2,001 pages read in 2,000 lookups</text>
<rect class="s f" x="24" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="49" y="91" font-size="12" text-anchor="middle">210</text>
<rect class="a af" x="78" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="103" y="91" font-size="12" font-weight="600" text-anchor="middle">2</text>
<rect class="s f" x="132" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="157" y="91" font-size="12" text-anchor="middle">229</text>
<rect class="s f" x="186" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="211" y="91" font-size="12" text-anchor="middle">248</text>
<rect class="s f" x="240" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="265" y="91" font-size="12" text-anchor="middle">267</text>
<rect class="s f" x="294" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="319" y="91" font-size="12" text-anchor="middle">286</text>
<rect class="s f" x="348" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="373" y="91" font-size="12" text-anchor="middle">305</text>
<rect class="s f" x="402" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="427" y="91" font-size="12" text-anchor="middle">324</text>
<rect class="s f" x="456" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="481" y="91" font-size="12" text-anchor="middle">343</text>
<rect class="s f" x="510" y="70" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="535" y="91" font-size="12" text-anchor="middle">362</text>
<rect class="m f" x="564" y="70" width="50" height="32" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="589" y="91" font-size="12" text-anchor="middle">3</text>
<text class="tm" x="589" y="118" font-size="10.5" text-anchor="middle">evicted</text>
<text class="t" x="24" y="118" font-size="11">every lookup touches the root, so it stays near the front; leaf 3 goes</text>
<text class="t" x="24" y="164" font-size="13" font-weight="700">FIFO</text>
<text class="t" x="616" y="164" font-size="12" font-weight="700" text-anchor="end">2,200 pages read</text>
<rect class="s f" x="24" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="49" y="199" font-size="12" text-anchor="middle">210</text>
<rect class="s f" x="78" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="103" y="199" font-size="12" text-anchor="middle">229</text>
<rect class="s f" x="132" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="157" y="199" font-size="12" text-anchor="middle">248</text>
<rect class="s f" x="186" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="211" y="199" font-size="12" text-anchor="middle">267</text>
<rect class="s f" x="240" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="265" y="199" font-size="12" text-anchor="middle">286</text>
<rect class="s f" x="294" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="319" y="199" font-size="12" text-anchor="middle">305</text>
<rect class="s f" x="348" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="373" y="199" font-size="12" text-anchor="middle">324</text>
<rect class="s f" x="402" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="427" y="199" font-size="12" text-anchor="middle">343</text>
<rect class="s f" x="456" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="481" y="199" font-size="12" text-anchor="middle">362</text>
<rect class="s f" x="510" y="178" width="50" height="32" rx="4" stroke-width="1.5"/>
<text class="t mono" x="535" y="199" font-size="12" text-anchor="middle">3</text>
<rect class="m f" x="564" y="178" width="50" height="32" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="589" y="199" font-size="12" font-weight="600" text-anchor="middle">2</text>
<text class="tm" x="589" y="226" font-size="10.5" text-anchor="middle">evicted</text>
<text class="t" x="24" y="226" font-size="11">the root sits where it was first read and reaches the end; lookup 11 reads it again</text>
<text class="tm" x="24" y="284" font-size="11">Pages by number; 2 is the root. Eleven are cached after lookup 10; the shrink after it trims to ten.</text>
</svg>
