<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" fill="none">
<title>The life of a page in the cache</title>
<defs><marker id="f0102b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0102b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0102b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="24" y="92" width="120" height="44" rx="8" stroke-width="1.5"/>
<text class="t" x="84" y="119" font-size="12.5" font-weight="600" text-anchor="middle">in the file only</text>
<rect class="s f" x="260" y="92" width="120" height="44" rx="8" stroke-width="1.5"/>
<text class="t" x="320" y="119" font-size="12.5" font-weight="600" text-anchor="middle">clean, cached</text>
<rect class="a af" x="496" y="92" width="120" height="44" rx="8" stroke-width="1.5"/>
<text class="ta" x="556" y="119" font-size="12.5" font-weight="600" text-anchor="middle">dirty</text>
<line class="s" x1="146" y1="104" x2="258" y2="104" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0102b-ah)"/>
<text class="t mono" x="202" y="96" font-size="10.5" text-anchor="middle">page_get(): miss</text>
<line class="m" x1="258" y1="124" x2="146" y2="124" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0102b-am)"/>
<text class="tm mono" x="202" y="146" font-size="10.5" text-anchor="middle">pager_shrink():</text>
<text class="tm" x="202" y="160" font-size="10.5" text-anchor="middle">the cold end goes</text>
<line class="a" x1="382" y1="104" x2="494" y2="104" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0102b-aa)"/>
<text class="ta mono" x="438" y="96" font-size="10.5" text-anchor="middle">pager_write()</text>
<line class="s" x1="494" y1="124" x2="382" y2="124" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0102b-ah)"/>
<text class="t" x="438" y="146" font-size="10.5" text-anchor="middle">COMMIT writes it</text>
<text class="tm" x="438" y="160" font-size="10.5" text-anchor="middle">to the file</text>
<path class="s" d="M298 90 C 298 48, 342 48, 342 88" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0102b-ah)"/>
<text class="t" x="320" y="42" font-size="10.5" text-anchor="middle">page_get(): hit, to the front of the list</text>
<text class="tm" x="24" y="186" font-size="11">Clean pages can be thrown away: the file has the same bytes. A dirty page is the only copy of a change.</text>
</svg>
