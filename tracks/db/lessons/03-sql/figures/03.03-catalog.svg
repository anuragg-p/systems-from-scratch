<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" fill="none">
<title>schema_load(): the catalog in memory, rebuilt from the rows of page 1</title>
<defs><marker id="f0303c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">rows of sqlite_schema, on page 1</text>
<text class="tm" x="334" y="20" font-size="11">the catalog in memory (after the built-in sqlite_schema)</text>
<rect class="s fs" x="24" y="32" width="230" height="64" rx="6" stroke-width="1.5"/>
<text class="t mono" x="36" y="50" font-size="11" font-weight="600">table  fruit  root 2</text>
<text class="t mono" x="36" y="70" font-size="10.5">CREATE TABLE fruit(id INTEGER</text>
<text class="t mono" x="36" y="86" font-size="10.5">PRIMARY KEY, name TEXT)</text>
<line class="a" x1="258" y1="64" x2="330" y2="64" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0303c-aa)"/>
<text class="ta" x="294" y="56" font-size="10.5" font-weight="600" text-anchor="middle">parse</text>
<rect class="s f" x="334" y="32" width="282" height="64" rx="6" stroke-width="1.5"/>
<text class="t mono" x="346" y="50" font-size="12" font-weight="700">fruit</text>
<text class="tm" x="604" y="50" font-size="10.5" text-anchor="end">root 2; id is the rowid</text>
<text class="t mono" x="346" y="70" font-size="10.5">id</text>
<text class="t mono" x="392" y="70" font-size="10.5">INTEGER</text>
<text class="tm mono" x="460" y="70" font-size="10.5">affinity INTEGER</text>
<text class="t mono" x="346" y="86" font-size="10.5">name</text>
<text class="t mono" x="392" y="86" font-size="10.5">TEXT</text>
<text class="tm mono" x="460" y="86" font-size="10.5">affinity TEXT</text>
<rect class="s fs" x="24" y="118" width="230" height="48" rx="6" stroke-width="1.5"/>
<text class="t mono" x="36" y="136" font-size="11" font-weight="600">table  veg  root 3</text>
<text class="t mono" x="36" y="156" font-size="10.5">CREATE TABLE veg(name)</text>
<line class="a" x1="258" y1="142" x2="330" y2="142" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0303c-aa)"/>
<text class="ta" x="294" y="134" font-size="10.5" font-weight="600" text-anchor="middle">parse</text>
<rect class="s f" x="334" y="118" width="282" height="48" rx="6" stroke-width="1.5"/>
<text class="t mono" x="346" y="136" font-size="12" font-weight="700">veg</text>
<text class="tm" x="604" y="136" font-size="10.5" text-anchor="end">root 3; no rowid column</text>
<text class="t mono" x="346" y="156" font-size="10.5">name</text>
<text class="t mono" x="392" y="156" font-size="10.5">(none)</text>
<text class="tm mono" x="460" y="156" font-size="10.5">affinity BLOB</text>
<text class="tm" x="24" y="206" font-size="11">Every open does this, and so does every CREATE and DROP: the column names, types and</text>
<text class="tm" x="24" y="222" font-size="11">affinities are stored nowhere but in the CREATE text, so the engine parses it again.</text>
</svg>
