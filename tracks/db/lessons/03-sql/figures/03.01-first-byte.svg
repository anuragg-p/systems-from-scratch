<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 323" fill="none">
<title>How next_token() decides what a token is from its first byte</title>
<defs><marker id="f0301b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0301b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0301b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">switch (u[0]) in next_token(): the first byte (sometimes two) picks the rule</text>
<text class="tm" x="30" y="46" font-size="10.5" font-weight="600">first byte</text>
<text class="tm" x="176" y="46" font-size="10.5" font-weight="600">what next_token() does</text>
<text class="tm" x="430" y="46" font-size="10.5" font-weight="600">token type</text>
<rect class="s fs" x="24" y="56" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="69" font-size="11">\0  (NUL)</text>
<line class="m" x1="164" y1="65" x2="172" y2="65" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="69" font-size="11">the end of the text</text>
<text class="t mono" x="430" y="69" font-size="10.5">TK_EOF, length 0</text>
<rect class="s fs" x="24" y="79" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="92" font-size="11">space \t \n \r</text>
<line class="m" x1="164" y1="88" x2="172" y2="88" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="92" font-size="11">the whole run of white space</text>
<text class="t mono" x="430" y="92" font-size="10.5">TK_SPACE</text>
<rect class="s fs" x="24" y="102" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="115" font-size="11">--   /*</text>
<line class="m" x1="164" y1="111" x2="172" y2="111" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="115" font-size="11">a comment, to the newline or the */</text>
<text class="t mono" x="430" y="115" font-size="10.5">TK_SPACE</text>
<rect class="s fs" x="24" y="125" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="138" font-size="11">; ( ) , * + %</text>
<line class="m" x1="164" y1="134" x2="172" y2="134" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="138" font-size="11">one byte</text>
<text class="t mono" x="430" y="138" font-size="10.5">TK_SEMI TK_LP TK_RP ...</text>
<rect class="s fs" x="24" y="148" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="161" font-size="11">-   /</text>
<line class="m" x1="164" y1="157" x2="172" y2="157" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="161" font-size="11">one byte, unless a comment starts</text>
<text class="t mono" x="430" y="161" font-size="10.5">TK_MINUS TK_SLASH</text>
<rect class="s fs" x="24" y="171" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="184" font-size="11">= ! &lt; &gt; |</text>
<line class="m" x1="164" y1="180" x2="172" y2="180" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="184" font-size="11">look at the next byte as well</text>
<text class="t mono" x="430" y="184" font-size="10.5">TK_EQ TK_NE TK_LE ...</text>
<rect class="a af" x="24" y="194" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="32" y="207" font-size="11">&#x27; &quot; ` [</text>
<line class="m" x1="164" y1="203" x2="172" y2="203" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="207" font-size="11">scan_quoted(): to the closing quote</text>
<text class="t mono" x="430" y="207" font-size="10.5">TK_STRING (&#x27;) or TK_ID</text>
<rect class="a af" x="24" y="217" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="32" y="230" font-size="11">0-9, or . 0-9</text>
<line class="m" x1="164" y1="226" x2="172" y2="226" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="230" font-size="11">scan_number(): digits, then . and e parts</text>
<text class="t mono" x="430" y="230" font-size="10.5">TK_INTEGER or TK_FLOAT</text>
<rect class="s fs" x="24" y="240" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="253" font-size="11">x&#x27;  X&#x27;</text>
<line class="m" x1="164" y1="249" x2="172" y2="249" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="253" font-size="11">hex digits, an even number, then &#x27;</text>
<text class="t mono" x="430" y="253" font-size="10.5">TK_BLOB</text>
<rect class="a af" x="24" y="263" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="32" y="276" font-size="11">a-z A-Z _</text>
<line class="m" x1="164" y1="272" x2="172" y2="272" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="276" font-size="11">letters, digits, _ $, then keyword_type()</text>
<text class="tm" x="430" y="276" font-size="10.5">a keyword, or TK_ID</text>
<rect class="s fs" x="24" y="286" width="136" height="18" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="299" font-size="11">anything else</text>
<line class="m" x1="164" y1="295" x2="172" y2="295" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="176" y="299" font-size="11">one byte (a lone ! or | too)</text>
<text class="t mono" x="430" y="299" font-size="10.5">TK_ILLEGAL</text>
</svg>
