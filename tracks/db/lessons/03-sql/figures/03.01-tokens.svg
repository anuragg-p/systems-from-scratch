<text class="tm" x="24" y="186" font-size="11">Each dot is a one-byte TK_SPACE token, and so is the comment: every byte belongs to some token.</text>
<text class="tm" x="24" y="202" font-size="11">The parser&#x27;s advance() skips TK_SPACE, so it sees 11 tokens and then TK_EOF (length 0, at byte 54).</text>
