<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" fill="none">
<title>Two plans for the same WHERE: the index&#x27;s order makes the sort unnecessary</title>
<defs><marker id="f0503b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0503b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0503b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm mono" x="24" y="24" font-size="10.5" text-anchor="None">... WHERE a &gt; 5 ORDER BY a LIMIT 3</text>
<rect class="s f" x="24" y="38" width="272" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="57" font-size="11" text-anchor="None">Limit 3 offset 0</text>
<rect class="s f" x="38" y="82" width="258" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="48" y="101" font-size="11" text-anchor="None">Filter (a &gt; 5)</text>
<line class="m" x1="34" y1="68" x2="34" y2="96" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="34" y1="96" x2="40" y2="96" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="52" y="126" width="244" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="62" y="145" font-size="11" text-anchor="None">Index range t using t_a (a &gt; ?)</text>
<line class="m" x1="48" y1="112" x2="48" y2="140" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="48" y1="140" x2="54" y2="140" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="330" y="24" font-size="10.5" text-anchor="None">... WHERE a &gt; 5 ORDER BY b LIMIT 3</text>
<rect class="s f" x="330" y="38" width="272" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="340" y="57" font-size="11" text-anchor="None">Limit 3 offset 0</text>
<rect class="s fs" x="344" y="82" width="258" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="354" y="101" font-size="11" text-anchor="None">Sort by b</text>
<line class="m" x1="340" y1="68" x2="340" y2="96" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="340" y1="96" x2="346" y2="96" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s f" x="358" y="126" width="244" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="368" y="145" font-size="11" text-anchor="None">Filter (a &gt; 5)</text>
<line class="m" x1="354" y1="112" x2="354" y2="140" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="354" y1="140" x2="360" y2="140" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="372" y="170" width="230" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="382" y="189" font-size="11" text-anchor="None">Index range t using t_a (a &gt; ?)</text>
<line class="m" x1="368" y1="156" x2="368" y2="184" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="368" y1="184" x2="374" y2="184" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="186" font-size="11">rows flow up one at a time; Limit</text>
<text class="t" x="24" y="202" font-size="11">stops asking after 3, so only a few</text>
<text class="t" x="24" y="218" font-size="11">index entries are ever read</text>
<text class="t" x="330" y="226" font-size="11">Sort must pull every row before it</text>
<text class="t" x="330" y="242" font-size="11">can hand out the first</text>
<text class="tm" x="24" y="242" font-size="10.5">(our EXPLAIN, outermost first)</text>
</svg>
