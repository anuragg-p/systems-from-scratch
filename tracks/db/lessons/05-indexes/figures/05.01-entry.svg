<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" fill="none">
<title>One row of the table and its entry in the index, byte by byte</title>
<defs><marker id="f0501a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0501a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0501a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">row 2062 of demo.db, as stored in the table: leaf page 53, 47 bytes</text>
<rect class="s f" x="24" y="34" width="40" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="44" y="53" font-size="11.5" text-anchor="middle">2c</text>
<text class="tm" x="44" y="78" font-size="10.5" text-anchor="middle">size 44</text>
<rect class="a af" x="64" y="34" width="58" height="30" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="93" y="53" font-size="11.5" text-anchor="middle">90 0e</text>
<text class="tm" x="93" y="78" font-size="10.5" text-anchor="middle">rowid</text>
<rect class="s fs" x="122" y="34" width="34" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="139" y="53" font-size="11.5" text-anchor="middle">04</text>
<text class="tm" x="139" y="78" font-size="10.5" text-anchor="middle">hdr</text>
<rect class="s fs" x="156" y="34" width="34" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="173" y="53" font-size="11.5" text-anchor="middle">00</text>
<text class="tm" x="173" y="78" font-size="10.5" text-anchor="middle">id</text>
<rect class="s fs" x="190" y="34" width="34" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="207" y="53" font-size="11.5" text-anchor="middle">01</text>
<text class="tm" x="207" y="78" font-size="10.5" text-anchor="middle">a</text>
<rect class="s fs" x="224" y="34" width="34" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="241" y="53" font-size="11.5" text-anchor="middle">5b</text>
<text class="tm" x="241" y="78" font-size="10.5" text-anchor="middle">b</text>
<rect class="a af" x="258" y="34" width="40" height="30" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="278" y="53" font-size="11.5" text-anchor="middle">02</text>
<text class="tm" x="278" y="78" font-size="10.5" text-anchor="middle">a = 2</text>
<rect class="s f" x="298" y="34" width="318" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="457" y="53" font-size="11.5" text-anchor="middle">72 6f 77 20 32 30 36 32 20 78 ...</text>
<text class="tm" x="457" y="78" font-size="10.5" text-anchor="middle">b: &#x27;row 2062 xxx...&#x27;, 39 bytes</text>
<text class="tm" x="508" y="162" font-size="11">its entry in the index</text>
<text class="tm" x="508" y="178" font-size="11">t_a: leaf 537, 7 bytes</text>
<rect class="s f" x="250" y="150" width="40" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="270" y="169" font-size="11.5" text-anchor="middle">06</text>
<text class="tm" x="270" y="194" font-size="10.5" text-anchor="middle">size 6</text>
<rect class="s fs" x="290" y="150" width="34" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="307" y="169" font-size="11.5" text-anchor="middle">03</text>
<text class="tm" x="307" y="194" font-size="10.5" text-anchor="middle">hdr</text>
<rect class="s fs" x="324" y="150" width="34" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="341" y="169" font-size="11.5" text-anchor="middle">01</text>
<text class="tm" x="341" y="194" font-size="10.5" text-anchor="middle">a</text>
<rect class="s fs" x="358" y="150" width="34" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="375" y="169" font-size="11.5" text-anchor="middle">02</text>
<text class="tm" x="375" y="194" font-size="10.5" text-anchor="middle">rowid</text>
<rect class="a af" x="392" y="150" width="40" height="30" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="412" y="169" font-size="11.5" text-anchor="middle">02</text>
<text class="tm" x="412" y="194" font-size="10.5" text-anchor="middle">a = 2</text>
<rect class="a af" x="432" y="150" width="64" height="30" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="464" y="169" font-size="11.5" text-anchor="middle">08 0e</text>
<text class="tm" x="464" y="194" font-size="10.5" text-anchor="middle">rowid 2062</text>
<path class="a" d="M278.0 86 C 278.0 110, 412.0 110, 412.0 148" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0501a-aa)"/>
<path class="a" d="M93.0 86 C 93.0 124, 464.0 104, 464.0 148" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0501a-aa)" stroke-dasharray="4 4"/>
<text class="t" x="24" y="166" font-size="11.5">the key: the indexed</text>
<text class="t" x="24" y="182" font-size="11.5">value, then the rowid,</text>
<text class="t" x="24" y="198" font-size="11.5">as one record (2, 2062)</text>
<line class="m" x1="24" y1="222" x2="616" y2="222" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="24" y="244" font-size="10.5">in the table the rowid is the cell&#x27;s key, outside the record (id is stored as NULL there);</text>
<text class="tm" x="24" y="260" font-size="10.5">in the index it is the last field of the record, so equal values of a still sort by rowid</text>
<text class="t" x="24" y="284" font-size="11">an entry carries no other column: to read b, a lookup goes back to the table with the rowid</text>
</svg>
