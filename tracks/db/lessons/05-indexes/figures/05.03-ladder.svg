<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" fill="none">
<title>The planner&#x27;s five rules, tried in order; the first that matches wins</title>
<defs><marker id="f0503a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0503a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0503a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">on demo.db: t(id INTEGER PRIMARY KEY, a, b) with an index t_a on a</text>
<rect class="a af" x="24" y="38" width="592" height="38" rx="6" stroke-width="1.5"/>
<circle class="a fa" cx="44" cy="57" r="10" stroke-width="1.5"/>
<text class="t" x="44" y="61" font-size="11.5" font-weight="700" text-anchor="middle">1</text>
<text class="t" x="62" y="54" font-size="11.5" font-weight="600" text-anchor="None">the rowid equals a constant</text>
<text class="tm mono" x="62" y="69" font-size="10.5" text-anchor="None">WHERE id = 42</text>
<text class="ta mono" x="606" y="62" font-size="10.5" text-anchor="end">SEARCH t USING INTEGER PRIMARY KEY (rowid=?)</text>
<rect class="a af" x="24" y="84" width="592" height="38" rx="6" stroke-width="1.5"/>
<circle class="a fa" cx="44" cy="103" r="10" stroke-width="1.5"/>
<text class="t" x="44" y="107" font-size="11.5" font-weight="700" text-anchor="middle">2</text>
<text class="t" x="62" y="100" font-size="11.5" font-weight="600" text-anchor="None">an index&#x27;s first column equals one</text>
<text class="tm mono" x="62" y="115" font-size="10.5" text-anchor="None">WHERE a = 7919</text>
<text class="ta mono" x="606" y="108" font-size="10.5" text-anchor="end">SEARCH t USING INDEX t_a (a=?)</text>
<rect class="a af" x="24" y="130" width="592" height="38" rx="6" stroke-width="1.5"/>
<circle class="a fa" cx="44" cy="149" r="10" stroke-width="1.5"/>
<text class="t" x="44" y="153" font-size="11.5" font-weight="700" text-anchor="middle">3</text>
<text class="t" x="62" y="146" font-size="11.5" font-weight="600" text-anchor="None">the rowid has a bound</text>
<text class="tm mono" x="62" y="161" font-size="10.5" text-anchor="None">WHERE id BETWEEN 10 AND 20</text>
<text class="ta mono" x="606" y="154" font-size="10.5" text-anchor="end">... INTEGER PRIMARY KEY (rowid&gt;? AND rowid&lt;?)</text>
<rect class="a af" x="24" y="176" width="592" height="38" rx="6" stroke-width="1.5"/>
<circle class="a fa" cx="44" cy="195" r="10" stroke-width="1.5"/>
<text class="t" x="44" y="199" font-size="11.5" font-weight="700" text-anchor="middle">4</text>
<text class="t" x="62" y="192" font-size="11.5" font-weight="600" text-anchor="None">an index&#x27;s first column has a bound</text>
<text class="tm mono" x="62" y="207" font-size="10.5" text-anchor="None">WHERE a &gt; 5</text>
<text class="ta mono" x="606" y="200" font-size="10.5" text-anchor="end">SEARCH t USING INDEX t_a (a&gt;?)</text>
<rect class="s fs" x="24" y="222" width="592" height="38" rx="6" stroke-width="1.5"/>
<circle class="s f" cx="44" cy="241" r="10" stroke-width="1.5"/>
<text class="t" x="44" y="245" font-size="11.5" font-weight="700" text-anchor="middle">5</text>
<text class="t" x="62" y="238" font-size="11.5" font-weight="600" text-anchor="None">anything else</text>
<text class="tm mono" x="62" y="253" font-size="10.5" text-anchor="None">WHERE b = &#x27;x&#x27;</text>
<text class="t mono" x="606" y="246" font-size="10.5" text-anchor="end">SCAN t</text>
<text class="t" x="24" y="284" font-size="11">WHERE id = 2 AND a = 6 matches rules 1 and 2: rule 1 is tried first, so the rowid wins</text>
<text class="tm" x="24" y="300" font-size="10.5">a + 0 &gt; 5 and a &gt; 5 OR id = 3 fit no rule: they scan</text>
</svg>
