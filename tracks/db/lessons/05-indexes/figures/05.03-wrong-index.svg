<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" fill="none">
<title>A rule that is usually right: an index range that matches every row</title>
<defs><marker id="f0503c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0503c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0503c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">SELECT b FROM t WHERE a &gt;= 0 on the benchmark&#x27;s file: 100000 rows, all of them match</text>
<text class="t" x="180" y="68" font-size="11.5" text-anchor="end">through t_a (rule 4)</text>
<rect class="a fa" x="190" y="52" width="300" height="24" rx="3" stroke-width="1.5"/>
<text class="t" x="498" y="68" font-size="11" font-weight="600" text-anchor="None">100,530 page reads</text>
<text class="tm" x="180" y="84" font-size="10.5" text-anchor="end">80 ms (median of 7)</text>
<text class="t" x="180" y="122" font-size="11.5" text-anchor="end">scan (a + 0 &gt;= 0)</text>
<rect class="s fs" x="190" y="106" width="6.84" height="24" rx="3" stroke-width="1.5"/>
<text class="t" x="204.84" y="122" font-size="11" font-weight="600" text-anchor="None">2,293 page reads</text>
<text class="tm" x="180" y="138" font-size="10.5" text-anchor="end">12 ms (median of 7)</text>
<text class="t" x="24" y="172" font-size="11">the index hands out rows in a order, which is no order at all for the table: almost every row is a</text>
<text class="t" x="24" y="188" font-size="11">fresh table leaf, and the 500-page cache cannot hold the 2292-page table, so leaves are read again and again</text>
<text class="tm" x="24" y="214" font-size="10.5">sqlite3 picks the index too, until ANALYZE gives it statistics: then it plans SCAN t</text>
</svg>
