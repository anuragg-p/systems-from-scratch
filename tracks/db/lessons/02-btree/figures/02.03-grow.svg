<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>The root of g.db (and of s.db in 02.02) grows a level and keeps its page number</title>
<defs><marker id="f0203a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="22" font-size="12" font-weight="600">1. page 2 is full</text>
<text class="tm" x="24" y="38" font-size="10.5">37 rows, rowids 10-370;</text>
<text class="tm" x="24" y="52" font-size="10.5">rowid 15 does not fit</text>
<text class="t" x="230" y="22" font-size="12" font-weight="600">2. the root moves down</text>
<text class="tm" x="230" y="38" font-size="10.5">a new page takes all of it;</text>
<text class="tm" x="230" y="52" font-size="10.5">page 2 just points there</text>
<text class="t" x="436" y="22" font-size="12" font-weight="600">3. page 3 splits</text>
<text class="tm" x="436" y="38" font-size="10.5">as in 02.02; the divider</text>
<text class="tm" x="436" y="52" font-size="10.5">lands in the root</text>
<line class="m" x1="214" y1="64" x2="214" y2="262" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="m" x1="420" y1="64" x2="420" y2="262" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="a af" x="34" y="120" width="160" height="50" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="114" y="140" font-size="11.5" font-weight="600" text-anchor="middle">page 2: table leaf</text>
<text class="ta" x="114" y="158" font-size="10.5" text-anchor="middle">37 cells, 67 bytes free</text>
<rect class="a af" x="84" y="210" width="60" height="26" rx="13" stroke-width="1.5"/>
<text class="ta mono" x="114" y="227.32" font-size="12" font-weight="600" text-anchor="middle">15</text>
<line class="a" x1="114" y1="208" x2="114" y2="174" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0203a-aa)"/>
<rect class="a af" x="246" y="88" width="156" height="46" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="324" y="106" font-size="11.5" font-weight="600" text-anchor="middle">page 2: interior</text>
<text class="ta mono" x="324" y="124" font-size="10.5" text-anchor="middle">0 cells, -&gt; 3</text>
<rect class="s f" x="246" y="186" width="156" height="50" rx="6" stroke-width="1.5"/>
<text class="t mono" x="324" y="206" font-size="11.5" font-weight="600" text-anchor="middle">page 3: table leaf</text>
<text class="tm" x="324" y="224" font-size="10.5" text-anchor="middle">the same 37 cells</text>
<line class="s" x1="324" y1="136" x2="324" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0203a-ah)"/>
<text class="tm" x="334" y="164" font-size="10">a new page</text>
<rect class="a af" x="452" y="88" width="150" height="46" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="527" y="106" font-size="11.5" font-weight="600" text-anchor="middle">page 2: interior</text>
<text class="ta mono" x="527" y="124" font-size="10.5" text-anchor="middle">4 | 180, -&gt; 3</text>
<rect class="s f" x="446" y="186" width="80" height="50" rx="6" stroke-width="1.5"/>
<text class="t mono" x="486" y="206" font-size="11.5" font-weight="600" text-anchor="middle">page 4</text>
<text class="tm" x="486" y="224" font-size="10.5" text-anchor="middle">10-180</text>
<rect class="s f" x="532" y="186" width="80" height="50" rx="6" stroke-width="1.5"/>
<text class="t mono" x="572" y="206" font-size="11.5" font-weight="600" text-anchor="middle">page 3</text>
<text class="tm" x="572" y="224" font-size="10.5" text-anchor="middle">190-370</text>
<line class="s" x1="500" y1="136" x2="486" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0203a-ah)"/>
<line class="s" x1="556" y1="136" x2="572" y2="184" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0203a-ah)"/>
<text class="tm" x="486" y="252" font-size="10" text-anchor="middle">19 cells</text>
<text class="tm" x="572" y="252" font-size="10" text-anchor="middle">19 cells</text>
<text class="t" x="24" y="288" font-size="11">sqlite_schema still says rootpage 2 for t: nothing outside the tree had to change</text>
</svg>
