<text class="t" x="24" y="222" font-size="10.5">1. The entry just before it in key order, the last one in the leaf under its left child,</text>
<text class="t" x="24" y="238" font-size="10.5">takes its place, so the root keeps a cell. 2. That leaf&#x27;s copy is then deleted, an easy leaf delete.</text>
