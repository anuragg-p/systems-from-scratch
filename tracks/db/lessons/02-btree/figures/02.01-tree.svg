<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" fill="none">
<title>Module 02 in one picture: a table as a tree of pages</title>
<defs><marker id="f0201a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0201a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0201a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">the table t of s.db (built in 02.02): four pages of one file</text>
<rect class="a af" x="92" y="52" width="196" height="34" rx="6" stroke-width="1.5"/>
<rect class="s f" x="100" y="58" width="54" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="127" y="72.96" font-size="11" text-anchor="middle">5 | 19</text>
<rect class="s f" x="160" y="58" width="62" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="191" y="72.96" font-size="11" text-anchor="middle">4 | 180</text>
<rect class="m f" x="228" y="58" width="52" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="254" y="72.96" font-size="11" text-anchor="middle">-&gt; 3</text>
<text class="ta" x="190" y="44" font-size="10.5" font-weight="600" text-anchor="middle">root: page 2, interior</text>
<rect class="s f" x="24" y="140" width="100" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="74" y="158" font-size="11.5" font-weight="600" text-anchor="middle">page 5</text>
<text class="tm" x="74" y="174" font-size="10.5" text-anchor="middle">rowids 1-19</text>
<line class="s" x1="127" y1="80" x2="74" y2="138" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0201a-ah)"/>
<rect class="s f" x="140" y="140" width="100" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="190" y="158" font-size="11.5" font-weight="600" text-anchor="middle">page 4</text>
<text class="tm" x="190" y="174" font-size="10.5" text-anchor="middle">rowids 20-180</text>
<line class="s" x1="191" y1="80" x2="190" y2="138" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0201a-ah)"/>
<rect class="s f" x="256" y="140" width="100" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="306" y="158" font-size="11.5" font-weight="600" text-anchor="middle">page 3</text>
<text class="tm" x="306" y="174" font-size="10.5" text-anchor="middle">rowids 190-370</text>
<line class="s" x1="254" y1="80" x2="306" y2="138" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0201a-ah)"/>
<path class="a" d="M74 196 C 110 216, 150 216, 186 196" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0201a-aa)" stroke-dasharray="4 4"/>
<path class="a" d="M196 196 C 232 216, 272 216, 300 196" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0201a-aa)" stroke-dasharray="4 4"/>
<text class="tm" x="24" y="238" font-size="10.5">leaves hold the rows, in rowid order; the root holds</text>
<text class="tm" x="24" y="252" font-size="10.5">signposts: (child page | the largest rowid in it)</text>
<line class="m" x1="386" y1="40" x2="386" y2="256" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="404" y="48" font-size="11.5" font-weight="600">what each lesson adds</text>
<text class="ta mono" x="404" y="76" font-size="11" font-weight="600">02.01</text>
<text class="t" x="452" y="76" font-size="11">a leaf page: its cells,</text>
<text class="t" x="452" y="90" font-size="11">and a search inside it</text>
<text class="ta mono" x="404" y="114" font-size="11" font-weight="600">02.02</text>
<text class="t" x="452" y="114" font-size="11">insert; a full page</text>
<text class="t" x="452" y="128" font-size="11">splits in two</text>
<text class="ta mono" x="404" y="152" font-size="11" font-weight="600">02.03</text>
<text class="t" x="452" y="152" font-size="11">interior pages; the root</text>
<text class="t" x="452" y="166" font-size="11">grows but stays page 2</text>
<text class="ta mono" x="404" y="190" font-size="11" font-weight="600">02.04</text>
<text class="t" x="452" y="190" font-size="11">a cursor that walks</text>
<text class="t" x="452" y="204" font-size="11">the leaves in order</text>
<text class="ta mono" x="404" y="228" font-size="11" font-weight="600">02.05</text>
<text class="t" x="452" y="228" font-size="11">delete, and pages</text>
<text class="t" x="452" y="242" font-size="11">handed back for reuse</text>
</svg>
