<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" fill="none">
<title>The insert&#x27;s path before and after grow_root, and without the shift</title>
<defs><marker id="f0203d-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203d-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203d-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">inserting rowid 15 into g.db: the path the descent left, at three moments</text>
<text class="t" x="24" y="50" font-size="11" font-weight="600">1. before: page 2 is the full leaf</text>
<text class="tm" x="24" y="84" font-size="10.5">level 0</text>
<rect class="a af" x="74" y="64" width="126" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="84" y="83" font-size="11" font-weight="600">page 2</text>
<text class="ta mono" x="192" y="83" font-size="11" text-anchor="end">idx 1</text>
<text class="tm" x="137" y="108" font-size="10" text-anchor="middle">full leaf</text>
<text class="tm mono" x="24" y="196" font-size="10.5">depth 1</text>
<text class="t" x="232" y="50" font-size="11" font-weight="600">2. after grow_root</text>
<text class="tm" x="232" y="84" font-size="10.5">level 0</text>
<rect class="s f" x="282" y="64" width="126" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="292" y="83" font-size="11" font-weight="600">page 2</text>
<text class="t mono" x="400" y="83" font-size="11" text-anchor="end">idx 0</text>
<text class="tm" x="345" y="108" font-size="10" text-anchor="middle">interior, 0 cells</text>
<text class="tm" x="232" y="142" font-size="10.5">level 1</text>
<rect class="a af" x="282" y="122" width="126" height="30" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="292" y="141" font-size="11" font-weight="600">page 3</text>
<text class="ta mono" x="400" y="141" font-size="11" text-anchor="end">idx 1</text>
<text class="tm" x="345" y="166" font-size="10" text-anchor="middle">full leaf</text>
<text class="tm mono" x="232" y="196" font-size="10.5">depth 2</text>
<text class="ta" x="440" y="50" font-size="11" font-weight="600">without the shift</text>
<text class="tm" x="440" y="84" font-size="10.5">level 0</text>
<rect class="s f" x="490" y="64" width="126" height="30" rx="6" stroke-width="1.5"/>
<text class="t mono" x="500" y="83" font-size="11" font-weight="600">page 2</text>
<text class="t mono" x="608" y="83" font-size="11" text-anchor="end">idx 1</text>
<text class="tm" x="553" y="108" font-size="10" text-anchor="middle">interior now</text>
<text class="tm" x="440" y="142" font-size="10.5">level 1</text>
<rect class="m f" x="490" y="122" width="126" height="30" rx="6" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="500" y="141" font-size="11" font-weight="600">page 0</text>
<text class="tm" x="553" y="166" font-size="10" text-anchor="middle">never set</text>
<text class="tm mono" x="440" y="196" font-size="10.5">depth 1</text>
<line class="m" x1="214" y1="60" x2="214" y2="200" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="m" x1="422" y1="60" x2="422" y2="200" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="t" x="24" y="224" font-size="10.5">The split runs at level 1 and puts its divider in level 0. Without the shift, level 1 is page 0.</text>
</svg>
