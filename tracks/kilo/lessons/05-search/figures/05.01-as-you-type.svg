<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" fill="none">
<title>Each key typed at the search prompt searches hello.c again from the first row</title>
<defs><marker id="f0501a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0501a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0501a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">hello.c, and the rows strstr() tries for each query, top down, until one holds it</text>
<text class="tm" x="24" y="54" font-size="10">row</text>
<text class="tm mono" x="34" y="85" font-size="10.5" text-anchor="middle">1</text>
<rect class="s fs" x="48" y="70" width="186" height="22" rx="3" stroke-width="1.5"/>
<text class="t mono" x="54" y="85" font-size="10.5">#include &lt;stdio.h&gt;</text>
<text class="tm mono" x="34" y="115" font-size="10.5" text-anchor="middle">2</text>
<rect class="s fs" x="48" y="100" width="186" height="22" rx="3" stroke-width="1.5"/>
<text class="t mono" x="54" y="115" font-size="10.5"></text>
<text class="tm mono" x="34" y="145" font-size="10.5" text-anchor="middle">3</text>
<rect class="s fs" x="48" y="130" width="186" height="22" rx="3" stroke-width="1.5"/>
<text class="t mono" x="54" y="145" font-size="10.5">int main(void) {</text>
<text class="tm mono" x="34" y="175" font-size="10.5" text-anchor="middle">4</text>
<rect class="s fs" x="48" y="160" width="186" height="22" rx="3" stroke-width="1.5"/>
<text class="t mono" x="54" y="175" font-size="10.5">\tprintf(&quot;hello\n&quot;);</text>
<text class="tm mono" x="34" y="205" font-size="10.5" text-anchor="middle">5</text>
<rect class="s fs" x="48" y="190" width="186" height="22" rx="3" stroke-width="1.5"/>
<text class="t mono" x="54" y="205" font-size="10.5">\treturn 0;</text>
<text class="tm mono" x="34" y="235" font-size="10.5" text-anchor="middle">6</text>
<rect class="s fs" x="48" y="220" width="186" height="22" rx="3" stroke-width="1.5"/>
<text class="t mono" x="54" y="235" font-size="10.5">}</text>
<text class="t mono" x="306" y="54" font-size="11.5" font-weight="600" text-anchor="middle">&quot;r&quot;</text>
<circle class="m f" cx="306" cy="81" r="4.5" stroke-width="1.5"/>
