<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Escape puts four numbers back: the view and the cursor on the screen</title>
<defs><marker id="f0502b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0502b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0502b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">f.txt (30 rows) and the 8 rows of the screen, as rowoff and cy place them</text>
<text class="t" x="24" y="42" font-size="11.5" font-weight="600">before Ctrl-F</text>
<rect class="s fs" x="54" y="56" width="40" height="156" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="38" y="64" font-size="9" text-anchor="end">1</text>
<text class="tm mono" x="38" y="212" font-size="9" text-anchor="end">30</text>
<rect class="s" x="46" y="139.2" width="56" height="41.6" rx="3" stroke-width="1.5"/>
<line class="a" x1="50" y1="178.2" x2="108" y2="178.2" stroke-width="1.5" stroke-linecap="round"/>
<circle class="a fa" cx="110" cy="178.2" r="3" stroke-width="1.5"/>
<text class="tm" x="24" y="254" font-size="10.5">rowoff 16, cy 7</text>
<text class="t" x="24" y="270" font-size="10.5">row 24: 24/30</text>
<text class="t" x="176" y="42" font-size="11.5" font-weight="600">at a match</text>
<rect class="s fs" x="206" y="56" width="40" height="156" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="190" y="64" font-size="9" text-anchor="end">1</text>
<text class="tm mono" x="190" y="212" font-size="9" text-anchor="end">30</text>
<rect class="m" x="206" y="214" width="40" height="29.2" rx="2" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="270" y="230.6" font-size="9">past the end</text>
<rect class="s" x="198" y="201.6" width="56" height="41.6" rx="3" stroke-width="1.5"/>
<line class="a" x1="202" y1="204.2" x2="260" y2="204.2" stroke-width="1.5" stroke-linecap="round"/>
<circle class="a fa" cx="262" cy="204.2" r="3" stroke-width="1.5"/>
<text class="tm" x="176" y="254" font-size="10.5">rowoff 28, cy 0</text>
<text class="t" x="176" y="270" font-size="10.5">row 29: 29/30</text>
<text class="ta" x="328" y="42" font-size="11.5" font-weight="600">Escape</text>
<rect class="s fs" x="358" y="56" width="40" height="156" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="342" y="64" font-size="9" text-anchor="end">1</text>
<text class="tm mono" x="342" y="212" font-size="9" text-anchor="end">30</text>
<rect class="a af" x="350" y="139.2" width="56" height="41.6" rx="3" stroke-width="1.5"/>
<line class="a" x1="354" y1="178.2" x2="412" y2="178.2" stroke-width="1.5" stroke-linecap="round"/>
<circle class="a fa" cx="414" cy="178.2" r="3" stroke-width="1.5"/>
<text class="tm" x="328" y="254" font-size="10.5">all four put back</text>
<text class="ta" x="328" y="270" font-size="10.5" font-weight="600">row 24: 24/30</text>
<text class="t" x="480" y="42" font-size="11.5" font-weight="600">only cx, cy back</text>
<rect class="s fs" x="510" y="56" width="40" height="156" rx="2" stroke-width="1.5"/>
<text class="tm mono" x="494" y="64" font-size="9" text-anchor="end">1</text>
<text class="tm mono" x="494" y="212" font-size="9" text-anchor="end">30</text>
<rect class="m" x="510" y="214" width="40" height="29.2" rx="2" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="574" y="230.6" font-size="9">past the end</text>
<rect class="m" x="502" y="201.6" width="56" height="41.6" rx="3" stroke-width="1.5" stroke-dasharray="4 4"/>
<line class="s" x1="506" y1="240.6" x2="564" y2="240.6" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="566" cy="240.6" r="3" stroke-width="1.5"/>
<text class="tm" x="480" y="254" font-size="10.5">rowoff stays 28</text>
<text class="tm" x="480" y="270" font-size="10.5" font-weight="600">row 36: 36/30</text>
<text class="tm" x="24" y="294" font-size="10.5">The cursor is on file row rowoff + cy: the view and the cursor move together, or not at all.</text>
</svg>
