<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" fill="none">
<title>kilo&#x27;s first screen, as bytes and as the terminal draws it</title>
<defs><marker id="f0002b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0002b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0002b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">./kilo ab.txt on a 6 x 20 terminal, the file holding ab: 108 bytes in one write()</text>
<rect class="s fs" x="382" y="65" width="158" height="182" rx="6" stroke-width="1.5"/>
<rect class="s f" x="24" y="40" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="55" font-size="10.5">ESC[?25l ESC[H</text>
<text class="tm" x="382" y="55" font-size="10.5">hide the cursor; go to row 1, column 1</text>
<rect class="s f" x="24" y="70" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="85" font-size="10.5">ab ESC[0K \r\n</text>
<line class="m" x1="334" y1="81" x2="376" y2="81" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0002b-am)"/>
<rect class="a" x="392" y="73" width="6.9" height="16" rx="1" stroke-width="1.5"/>
<text class="t mono" x="392" y="85" font-size="11.5">ab</text>
<rect class="s f" x="24" y="100" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="115" font-size="10.5">~ ESC[0K \r\n</text>
<line class="m" x1="334" y1="111" x2="376" y2="111" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0002b-am)"/>
<text class="t mono" x="392" y="115" font-size="11.5">~</text>
<rect class="s f" x="24" y="130" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="145" font-size="10.5">~ ESC[0K \r\n</text>
<line class="m" x1="334" y1="141" x2="376" y2="141" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0002b-am)"/>
<text class="t mono" x="392" y="145" font-size="11.5">~</text>
<rect class="s f" x="24" y="160" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="175" font-size="10.5">~ ESC[0K \r\n</text>
<line class="m" x1="334" y1="171" x2="376" y2="171" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0002b-am)"/>
<text class="t mono" x="392" y="175" font-size="11.5">~</text>
<rect class="s f" x="24" y="190" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="205" font-size="10.5">ESC[0K ESC[7m ab.txt - 1 lines 1/1 ESC[0m \r\n</text>
<line class="m" x1="334" y1="201" x2="376" y2="201" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0002b-am)"/>
<rect class="af" x="392" y="192" width="138" height="18" rx="0"/>
<text class="ta mono" x="392" y="205" font-size="11.5">ab.txt - 1 lines 1/1</text>
<rect class="s f" x="24" y="220" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="235" font-size="10.5">ESC[0K HELP: Ctrl-S = save </text>
<line class="m" x1="334" y1="231" x2="376" y2="231" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0002b-am)"/>
<text class="t mono" x="392" y="235" font-size="11.5">HELP: Ctrl-S = save</text>
<rect class="s f" x="24" y="250" width="306" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="32" y="265" font-size="10.5">ESC[1;1H ESC[?25h</text>
<text class="tm" x="382" y="265" font-size="10.5">the cursor to row 1, column 1; show it</text>
<text class="tm" x="24" y="294" font-size="11">ESC is the one byte 27, so ESC[0K is four bytes: 27 [ 0 K. Everything that is not part of an escape</text>
<text class="tm" x="24" y="310" font-size="11">sequence is printed where the cursor is. ESC[?25l and ESC[?25h hide and show the cursor; ESC[H and</text>
<text class="tm" x="24" y="326" font-size="11">ESC[1;1H move it to row 1, column 1; ESC[0K erases from it to the end of the line; ESC[7m and ESC[0m</text>
<text class="tm" x="24" y="342" font-size="11">turn reverse video on and off; \r\n, carriage return and line feed, start the next row at column 1.</text>
</svg>
