<text class="t mono" x="76.8" y="56" font-size="11">printf(&quot;%d\n&quot;,</text>
<text class="t mono" x="175.8" y="56" font-size="11">totl);</text>
<text class="ta mono" x="220.4" y="56" font-size="11">ESC[0K</text>
<text class="ta mono" x="265" y="56" font-size="11" font-weight="700">\r</text>
<text class="ta mono" x="283.2" y="56" font-size="11" font-weight="700">ESC[23C</text>
<text class="ta mono" x="334.4" y="56" font-size="11" font-weight="700">ESC[4m</text>
<text class="ta mono" x="379" y="56" font-size="11" font-weight="700">totl</text>
<text class="ta mono" x="410.4" y="56" font-size="11" font-weight="700">ESC[0m</text>
<text class="tm mono" x="455" y="56" font-size="11">\r\n</text>
