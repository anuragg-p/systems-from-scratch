<text class="t mono" x="186" y="205" font-size="10">version</text>
<text class="t mono" x="234" y="205" font-size="10">21.0.0</text>
<text class="t mono" x="276" y="205" font-size="10">(...)&quot;}}}</text>
<text class="tm" x="24" y="230" font-size="10">&quot;version&quot; is all of &quot;Apple clangd version 21.0.0</text>
<text class="tm" x="24" y="243" font-size="10">(clang-2100.1.1.101) mac+xpc</text>
<text class="tm" x="24" y="256" font-size="10">arm64-apple-darwin25.6.0&quot;</text>
