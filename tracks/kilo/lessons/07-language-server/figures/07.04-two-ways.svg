<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" fill="none">
<title>One second of kilo with a key and a message from the server: before 07.04 it wakes every 0.1 s to look, and the message waits for the next look; with poll() it sleeps until one of them comes</title>
<defs><marker id="f0704a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0704a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0704a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">the same second twice, a key and then a message; each dot is kilo waking up, the open ones for the key</text>
<text class="t" x="24" y="50" font-size="12" font-weight="700">07.02, 07.03</text>
<text class="tm" x="117.98" y="50" font-size="10.5">read() on the keyboard waits 0.1 s at most; then kilo looks at the server</text>
<line class="m" x1="70" y1="100" x2="616" y2="100" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="70" y1="97" x2="70" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="124.6" y1="97" x2="124.6" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="179.2" y1="97" x2="179.2" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="233.8" y1="97" x2="233.8" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="288.4" y1="97" x2="288.4" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="343" y1="97" x2="343" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="397.6" y1="97" x2="397.6" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="452.2" y1="97" x2="452.2" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="506.8" y1="97" x2="506.8" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="561.4" y1="97" x2="561.4" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="616" y1="97" x2="616" y2="103" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="70" y="116" font-size="9.5" text-anchor="middle">0 s</text>
<text class="tm" x="343" y="116" font-size="9.5" text-anchor="middle">0.5 s</text>
<text class="tm" x="616" y="116" font-size="9.5" text-anchor="middle">1 s</text>
<text class="tm" x="62" y="104" font-size="10" text-anchor="end">kilo</text>
<circle class="s fa" cx="70" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="124.6" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="179.2" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s f" cx="206.5" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="261.1" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="315.7" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="370.3" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="424.9" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="479.5" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="534.1" cy="100" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="588.7" cy="100" r="3.2" stroke-width="1.5"/>
<line class="s" x1="206.5" y1="78" x2="206.5" y2="94" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0704a-ah)"/>
<text class="t" x="206.5" y="74" font-size="10.5" font-weight="600" text-anchor="middle">a key</text>
<line class="a" x1="400.06" y1="78" x2="400.06" y2="94" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0704a-aa)"/>
<text class="ta" x="396.06" y="74" font-size="10.5" font-weight="600" text-anchor="end">the server&#x27;s message</text>
<path class="a" d="M400.06 108 L400.06 112 L424.9 112 L424.9 108" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta" x="430.9" y="130" font-size="10.5" text-anchor="end">seen at the next look: 45.5 ms later (the median of 20 runs), up to 100.3 ms</text>
<text class="t" x="24" y="152" font-size="11">idle, it wakes about 10 times a second, with nothing to do: 53 times in a run left idle for 5 s</text>
<text class="t" x="24" y="190" font-size="12" font-weight="700">07.04</text>
<text class="tm" x="68.99" y="190" font-size="10.5">poll() sleeps until the keyboard or the server has something</text>
<line class="m" x1="70" y1="240" x2="616" y2="240" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="70" y1="237" x2="70" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="124.6" y1="237" x2="124.6" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="179.2" y1="237" x2="179.2" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="233.8" y1="237" x2="233.8" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="288.4" y1="237" x2="288.4" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="343" y1="237" x2="343" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="397.6" y1="237" x2="397.6" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="452.2" y1="237" x2="452.2" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="506.8" y1="237" x2="506.8" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="561.4" y1="237" x2="561.4" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="616" y1="237" x2="616" y2="243" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="70" y="256" font-size="9.5" text-anchor="middle">0 s</text>
<text class="tm" x="343" y="256" font-size="9.5" text-anchor="middle">0.5 s</text>
<text class="tm" x="616" y="256" font-size="9.5" text-anchor="middle">1 s</text>
<text class="tm" x="62" y="244" font-size="10" text-anchor="end">kilo</text>
<circle class="s f" cx="206.5" cy="240" r="3.2" stroke-width="1.5"/>
<circle class="s fa" cx="400.17" cy="240" r="3.2" stroke-width="1.5"/>
<line class="s" x1="206.5" y1="218" x2="206.5" y2="234" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0704a-ah)"/>
<text class="t" x="206.5" y="214" font-size="10.5" font-weight="600" text-anchor="middle">a key</text>
<line class="a" x1="400.06" y1="218" x2="400.06" y2="234" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0704a-aa)"/>
<text class="ta" x="396.06" y="214" font-size="10.5" font-weight="600" text-anchor="end">the server&#x27;s message</text>
<text class="ta" x="402.06" y="270" font-size="10.5" text-anchor="middle">seen at once: 0.2 ms later (the median), up to 0.7 ms</text>
<text class="t" x="24" y="292" font-size="11">idle, it does not wake; in the whole run, 2 wake-ups: the server&#x27;s answer to initialize, and the Ctrl-Q that ended it</text>
</svg>
