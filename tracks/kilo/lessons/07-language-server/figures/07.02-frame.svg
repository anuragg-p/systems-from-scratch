<text class="ta mono" x="518" y="51.5" font-size="10.5" font-weight="700" text-anchor="middle">\n</text>
<path class="m" d="M24 62 L24 68 L484 68 L484 62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="24" y="86" font-size="10.5">the header: one line, Content-Length: 108, ended by \r\n</text>
<path class="a" d="M486 62 L486 68 L528 68 L528 62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta" x="528" y="86" font-size="10.5" font-weight="600" text-anchor="end">an empty line:</text>
<text class="ta" x="528" y="100" font-size="10.5" font-weight="600" text-anchor="end">the header ends</text>
<rect class="s fs" x="24" y="112" width="372.4" height="46" rx="5" stroke-width="1.5"/>
<text class="t mono" x="32" y="128" font-size="11">{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;id&quot;:1,&quot;method&quot;:&quot;initialize&quot;,&quot;params&quot;</text>
<text class="t mono" x="32" y="146" font-size="11">:{&quot;processId&quot;:28896,&quot;rootUri&quot;:null,&quot;capabilities&quot;:{}}}</text>
<path class="m" d="M24 160 L24 166 L396.4 166 L396.4 160" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="24" y="184" font-size="10.5">the body: exactly 108 bytes of JSON, the count the header gave; then the next message&#x27;s header</text>
<text class="t" x="24" y="216" font-size="12" font-weight="700">a request</text>
<rect class="s f" x="24" y="224" width="186" height="76" rx="5" stroke-width="1.5"/>
<text class="t mono" x="34" y="242" font-size="10">&quot;jsonrpc&quot;:&quot;2.0&quot;</text>
<text class="ta mono" x="34" y="258" font-size="10" font-weight="700">&quot;id&quot;:1</text>
<text class="ta mono" x="34" y="274" font-size="10" font-weight="700">&quot;method&quot;:&quot;initialize&quot;</text>
<text class="t mono" x="34" y="290" font-size="10">&quot;params&quot;:{...}</text>
<text class="tm" x="24" y="318" font-size="10">kilo&#x27;s initialize: answered, with</text>
<text class="tm" x="24" y="331" font-size="10">its id</text>
<text class="t" x="227" y="216" font-size="12" font-weight="700">a response</text>
<rect class="s f" x="227" y="224" width="186" height="60" rx="5" stroke-width="1.5"/>
<text class="t mono" x="237" y="242" font-size="10">&quot;jsonrpc&quot;:&quot;2.0&quot;</text>
<text class="ta mono" x="237" y="258" font-size="10" font-weight="700">&quot;id&quot;:1</text>
<text class="t mono" x="237" y="274" font-size="10">&quot;result&quot;:{...}</text>
<text class="tm" x="227" y="302" font-size="10">the server&#x27;s answer: the request&#x27;s</text>
<text class="tm" x="227" y="315" font-size="10">id, and a result (or an error); no</text>
<text class="tm" x="227" y="328" font-size="10">method</text>
<text class="t" x="430" y="216" font-size="12" font-weight="700">a notification</text>
<rect class="s f" x="430" y="224" width="186" height="60" rx="5" stroke-width="1.5"/>
<text class="t mono" x="440" y="242" font-size="10">&quot;jsonrpc&quot;:&quot;2.0&quot;</text>
<text class="ta mono" x="440" y="258" font-size="10" font-weight="700">&quot;method&quot;:&quot;initialized&quot;</text>
<text class="t mono" x="440" y="274" font-size="10">&quot;params&quot;:{}</text>
<text class="tm" x="430" y="302" font-size="10">kilo&#x27;s initialized, at 07.05: no</text>
<text class="tm" x="430" y="315" font-size="10">id, so never answered</text>
</svg>
