<rect class="s f" x="68" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="78" y="52" font-size="12.5" text-anchor="middle">n</text>
<rect class="s f" x="90" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="100" y="52" font-size="12.5" text-anchor="middle">t</text>
<rect class="s f" x="112" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="122" y="52" font-size="12.5" text-anchor="middle">e</text>
<rect class="s f" x="134" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="144" y="52" font-size="12.5" text-anchor="middle">n</text>
<rect class="s f" x="156" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="166" y="52" font-size="12.5" text-anchor="middle">t</text>
<rect class="s f" x="178" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="188" y="52" font-size="12.5" text-anchor="middle">-</text>
<rect class="s f" x="200" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="210" y="52" font-size="12.5" text-anchor="middle">L</text>
<rect class="s f" x="222" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="232" y="52" font-size="12.5" text-anchor="middle">e</text>
<rect class="s f" x="244" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="254" y="52" font-size="12.5" text-anchor="middle">n</text>
<rect class="s f" x="266" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="276" y="52" font-size="12.5" text-anchor="middle">g</text>
<rect class="s f" x="288" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="298" y="52" font-size="12.5" text-anchor="middle">t</text>
<rect class="s f" x="310" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="320" y="52" font-size="12.5" text-anchor="middle">h</text>
<rect class="s f" x="332" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="342" y="52" font-size="12.5" text-anchor="middle">:</text>
