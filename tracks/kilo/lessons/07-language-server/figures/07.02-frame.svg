<text class="t mono" x="386" y="52" font-size="12.5" text-anchor="middle">1</text>
<rect class="s f" x="398" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="408" y="52" font-size="12.5" text-anchor="middle">0</text>
<rect class="s f" x="420" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="t mono" x="430" y="52" font-size="12.5" text-anchor="middle">8</text>
<rect class="a af" x="442" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="452" y="51.5" font-size="10.5" font-weight="700" text-anchor="middle">\r</text>
<rect class="a af" x="464" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="474" y="51.5" font-size="10.5" font-weight="700" text-anchor="middle">\n</text>
<rect class="a af" x="486" y="34" width="20" height="26" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="496" y="51.5" font-size="10.5" font-weight="700" text-anchor="middle">\r</text>
