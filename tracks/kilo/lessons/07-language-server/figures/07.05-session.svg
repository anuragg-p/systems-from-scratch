<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" fill="none">
<title>kilo at 07.05 and clangd, every message of a session: the handshake, the file opened, one didChange for nine keys, and shutdown and exit at Ctrl-Q; the size of each body</title>
<defs><marker id="f0705a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0705a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0705a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo at 07.05 and clangd 21 on sum.c, through a relay that logged every message</text>
<text class="t" x="200" y="44" font-size="12.5" font-weight="700" text-anchor="middle">kilo</text>
<text class="t" x="520" y="44" font-size="12.5" font-weight="700" text-anchor="middle">clangd</text>
<text class="tm" x="24" y="44" font-size="10">s</text>
<line class="m" x1="200" y1="52" x2="200" y2="392" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="520" y1="52" x2="520" y2="392" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="202" y1="70" x2="517" y2="70" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="65" font-size="10.5" text-anchor="middle">initialize, id 1 (processId 29210)</text>
<text class="ta mono" x="532" y="74" font-size="10.5" font-weight="600">160 bytes</text>
<text class="tm mono" x="24" y="74" font-size="9.5">0.000</text>
<line class="s" x1="518" y1="96" x2="203" y2="96" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="91" font-size="10.5" text-anchor="middle">the answer to id 1</text>
<text class="ta mono" x="188" y="100" font-size="10.5" font-weight="600" text-anchor="end">2008 bytes</text>
<text class="tm mono" x="24" y="100" font-size="9.5">0.021</text>
<line class="s" x1="202" y1="122" x2="517" y2="122" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="117" font-size="10.5" text-anchor="middle">initialized</text>
<text class="ta mono" x="532" y="126" font-size="10.5" font-weight="600">52 bytes</text>
<text class="tm mono" x="24" y="126" font-size="9.5">0.021</text>
<line class="s" x1="202" y1="148" x2="517" y2="148" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="143" font-size="10.5" text-anchor="middle">didOpen, version 1</text>
<text class="ta mono" x="532" y="152" font-size="10.5" font-weight="600">361 bytes</text>
<text class="tm mono" x="24" y="152" font-size="9.5">0.021</text>
<line class="m" x1="518" y1="174" x2="203" y2="174" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-am)" stroke-dasharray="4 4"/>
<text class="tm" x="360" y="169" font-size="10.5" text-anchor="middle">publishDiagnostics (kilo reads these at 07.06)</text>
<text class="tm mono" x="188" y="178" font-size="10.5" text-anchor="end">214 bytes</text>
<text class="tm mono" x="24" y="178" font-size="9.5">0.048</text>
<text class="tm" x="360" y="202" font-size="10.5" text-anchor="middle">the nine keys &quot; /* ok */&quot; typed on row 3</text>
<line class="s" x1="202" y1="224" x2="517" y2="224" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="219" font-size="10.5" text-anchor="middle">didChange, version 2</text>
<text class="ta mono" x="532" y="228" font-size="10.5" font-weight="600">376 bytes</text>
<text class="tm mono" x="24" y="228" font-size="9.5">1.600</text>
<line class="m" x1="518" y1="250" x2="203" y2="250" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-am)" stroke-dasharray="4 4"/>
<text class="tm" x="360" y="245" font-size="10.5" text-anchor="middle">publishDiagnostics (kilo reads these at 07.06)</text>
<text class="tm mono" x="188" y="254" font-size="10.5" text-anchor="end">214 bytes</text>
<text class="tm mono" x="24" y="254" font-size="9.5">1.657</text>
<line class="m" x1="518" y1="276" x2="203" y2="276" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-am)" stroke-dasharray="4 4"/>
<text class="tm" x="360" y="271" font-size="10.5" text-anchor="middle">publishDiagnostics (kilo reads these at 07.06)</text>
<text class="tm mono" x="188" y="280" font-size="10.5" text-anchor="end">214 bytes</text>
<text class="tm mono" x="24" y="280" font-size="9.5">1.672</text>
<text class="tm" x="360" y="304" font-size="10.5" text-anchor="middle">Ctrl-Q, four times: the file is modified</text>
<line class="s" x1="202" y1="326" x2="517" y2="326" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="321" font-size="10.5" text-anchor="middle">shutdown</text>
<text class="ta mono" x="532" y="330" font-size="10.5" font-weight="600">44 bytes</text>
<text class="tm mono" x="24" y="330" font-size="9.5">2.698</text>
<line class="s" x1="518" y1="352" x2="203" y2="352" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="347" font-size="10.5" text-anchor="middle">the answer to id 2, result null</text>
<text class="ta mono" x="188" y="356" font-size="10.5" font-weight="600" text-anchor="end">38 bytes</text>
<text class="tm mono" x="24" y="356" font-size="9.5">2.698</text>
<line class="s" x1="202" y1="378" x2="517" y2="378" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0705a-ah)"/>
<text class="t" x="360" y="373" font-size="10.5" text-anchor="middle">exit</text>
<text class="ta mono" x="532" y="382" font-size="10.5" font-weight="600">33 bytes</text>
<text class="tm mono" x="24" y="382" font-size="9.5">2.698</text>
<text class="tm" x="24" y="404" font-size="10.5">times from kilo&#x27;s first message; the didChange left 302 ms after the last of the nine keys</text>
</svg>
