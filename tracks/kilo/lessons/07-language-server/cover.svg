<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>kilo and clangd, two processes joined by two pipes: the text goes to clangd in a didChange, the diagnostics come back, and kilo underlines what they point at</title>
<defs><marker id="k07-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="k07-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="23" y="56" font-size="11">kilo, on a terminal 10 x 38</text>
<rect class="s fs" x="23" y="70" width="219.2" height="158" rx="8" stroke-width="1.5"/>
<text class="t mono" x="30" y="84.8" font-size="9">#include</text>
<text class="t mono" x="78.6" y="84.8" font-size="9">&lt;stdio.h&gt;</text>
<text class="t mono" x="30" y="99.8" font-size="9">#include</text>
<text class="t mono" x="78.6" y="99.8" font-size="9">&quot;add.h&quot;</text>
<text class="t mono" x="30" y="129.8" font-size="9">int</text>
<text class="t mono" x="51.6" y="129.8" font-size="9">main(void)</text>
<text class="t mono" x="111" y="129.8" font-size="9">{</text>
<text class="t mono" x="73.2" y="144.8" font-size="9">int</text>
<text class="t mono" x="94.8" y="144.8" font-size="9">total</text>
<text class="t mono" x="127.2" y="144.8" font-size="9">=</text>
<text class="t mono" x="138" y="144.8" font-size="9">add(2,</text>
<text class="t mono" x="175.8" y="144.8" font-size="9">3);</text>
<line class="s" x1="95.3" y1="147.3" x2="121.3" y2="147.3" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="73.2" y="159.8" font-size="9">printf(&quot;%d\n&quot;,</text>
<text class="t mono" x="154.2" y="159.8" font-size="9">totl);</text>
<line class="s" x1="154.7" y1="162.3" x2="175.3" y2="162.3" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="73.2" y="174.8" font-size="9">return</text>
<text class="t mono" x="111" y="174.8" font-size="9">0;</text>
<text class="t mono" x="30" y="189.8" font-size="9">}</text>
<rect class="t" x="29" y="195" width="207.2" height="13" rx="1.5"/>
<text class="f mono" x="30" y="204.8" font-size="9">sam</text>
<text class="f mono" x="51.6" y="204.8" font-size="9">ple/sum.c</text>
<text class="f mono" x="105.6" y="204.8" font-size="9">-</text>
<text class="f mono" x="116.4" y="204.8" font-size="9">8</text>
<text class="f mono" x="127.2" y="204.8" font-size="9">lines</text>
<text class="f mono" x="159.6" y="204.8" font-size="9">(modified)</text>
<text class="f mono" x="219" y="204.8" font-size="9">6/8</text>
<text class="t mono" x="30" y="219.8" font-size="9">6:</text>
<text class="t mono" x="46.2" y="219.8" font-size="9">error:</text>
<text class="t mono" x="84" y="219.8" font-size="9">Use</text>
<text class="t mono" x="105.6" y="219.8" font-size="9">of</text>
<text class="t mono" x="121.8" y="219.8" font-size="9">undeclared</text>
<text class="t mono" x="181.2" y="219.8" font-size="9">identifier</text>
<rect class="s f" x="524" y="104" width="92" height="72" rx="10" stroke-width="1.5"/>
<text class="t mono" x="570" y="130" font-size="15" font-weight="700" text-anchor="middle">clangd</text>
<text class="tm" x="570" y="148" font-size="10.5" text-anchor="middle">another process:</text>
<text class="tm" x="570" y="163" font-size="10.5" text-anchor="middle">fork, exec</text>
<path class="m" d="M252 40 L516 40 M252 112 L516 112" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line class="a" x1="496" y1="76" x2="518" y2="76" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k07-aa)"/>
<rect class="a af" x="280" y="47" width="196" height="60" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="288" y="62" font-size="8.6">Content-Length:</text>
<text class="ta mono" x="370.56" y="62" font-size="8.6">366</text>
<text class="t mono" x="288" y="75" font-size="8.6">{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;method&quot;:</text>
<text class="t mono" x="288" y="88" font-size="8.6">&quot;textDocument/didChange&quot;,...</text>
<text class="tm mono" x="288" y="101" font-size="8.6">the</text>
<text class="tm mono" x="308.64" y="101" font-size="8.6">whole</text>
<text class="tm mono" x="339.6" y="101" font-size="8.6">text,</text>
<text class="tm mono" x="370.56" y="101" font-size="8.6">version</text>
<text class="tm mono" x="411.84" y="101" font-size="8.6">2</text>
<path class="m" d="M252 120 L516 120 M252 220 L516 220" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line class="a" x1="272" y1="170" x2="250" y2="170" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k07-aa)"/>
<rect class="a af" x="280" y="127" width="234" height="86" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="288" y="142" font-size="8.6">Content-Length:</text>
<text class="ta mono" x="370.56" y="142" font-size="8.6">691</text>
<text class="t mono" x="288" y="155" font-size="8.6">{&quot;jsonrpc&quot;:&quot;2.0&quot;,&quot;method&quot;:</text>
<text class="t mono" x="288" y="168" font-size="8.6">&quot;textDocument/publishDiagnostics&quot;,</text>
<text class="t mono" x="288" y="181" font-size="8.6">&quot;params&quot;:{&quot;diagnostics&quot;:[{...</text>
<text class="ta mono" x="288" y="194" font-size="8.6">&quot;range&quot;:{&quot;end&quot;:{&quot;character&quot;:20,&quot;line&quot;:5},</text>
<text class="ta mono" x="288" y="207" font-size="8.6">&quot;start&quot;:{&quot;character&quot;:16,&quot;line&quot;:5}},...</text>
<path class="a" d="M278 191 C248 194, 195 176.3, 165 165.3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#k07-aa)"/>
<text class="ta" x="252" y="32" font-size="10.5" font-weight="600">the text, as typed</text>
<text class="ta" x="252" y="236" font-size="10.5" font-weight="600">what is wrong with it</text>
<text class="tm" x="24" y="288" font-size="11.5">kilo never waits for the server: poll() watches the keyboard and the pipe together.</text>
</svg>
