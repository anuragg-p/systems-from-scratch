<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" fill="none">
<title>The Makefile after Page Down, with tabs sent to the terminal as they are and with tabs rendered</title>
<defs><marker id="f0303b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">the project&#x27;s Makefile on a terminal 10 rows by 44 columns, after Page Down</text>
<text class="ta" x="38" y="54" font-size="11.5" font-weight="600">at 03.02: the tab byte goes to the terminal</text>
<rect class="s fs" x="38" y="64" width="258.4" height="178" rx="6" stroke-width="1.5"/>
<text class="t mono" x="44" y="79.56" font-size="9.33">kilo:</text>
<text class="t mono" x="77.6" y="79.56" font-size="9.33">kilo.c</text>
<text class="tm mono" x="32" y="79.56" font-size="9.5" text-anchor="end">1</text>
<text class="ta mono" x="44" y="96.56" font-size="9.33">#</text>
<text class="ta mono" x="66.4" y="96.56" font-size="9.33">make$(CC)</text>
<text class="ta mono" x="122.4" y="96.56" font-size="9.33">-o</text>
<text class="ta mono" x="139.2" y="96.56" font-size="9.33">kilo</text>
<text class="ta mono" x="167.2" y="96.56" font-size="9.33">kilo.c</text>
<text class="ta mono" x="206.4" y="96.56" font-size="9.33">-Wall</text>
<text class="ta mono" x="240" y="96.56" font-size="9.33">-W</text>
<text class="ta mono" x="256.8" y="96.56" font-size="9.33">-pedan</text>
<text class="tm mono" x="32" y="96.56" font-size="9.5" text-anchor="end">2</text>
<text class="ta mono" x="44" y="113.56" font-size="9.33">tic</text>
<text class="ta mono" x="66.4" y="113.56" font-size="9.33">-st</text>
<text class="tm mono" x="32" y="113.56" font-size="9.5" text-anchor="end">3</text>
<text class="tm mono" x="32" y="130.56" font-size="9.5" text-anchor="end">4</text>
<text class="t mono" x="44" y="147.56" font-size="9.33">clean:</text>
<text class="tm mono" x="32" y="147.56" font-size="9.5" text-anchor="end">5</text>
<text class="t mono" x="88.8" y="164.56" font-size="9.33">rm</text>
<text class="t mono" x="105.6" y="164.56" font-size="9.33">-f</text>
<text class="t mono" x="122.4" y="164.56" font-size="9.33">kilo</text>
<text class="tm mono" x="32" y="164.56" font-size="9.5" text-anchor="end">6</text>
<text class="tm mono" x="32" y="181.56" font-size="9.5" text-anchor="end">7</text>
<text class="t mono" x="44" y="198.56" font-size="9.33">.PHONY:</text>
<text class="t mono" x="88.8" y="198.56" font-size="9.33">all</text>
<text class="t mono" x="111.2" y="198.56" font-size="9.33">clean</text>
<text class="tm mono" x="32" y="198.56" font-size="9.5" text-anchor="end">8</text>
<text class="t mono" x="44" y="215.56" font-size="9.33">~</text>
<text class="tm mono" x="32" y="215.56" font-size="9.5" text-anchor="end">9</text>
<text class="tm mono" x="32" y="232.56" font-size="9.5" text-anchor="end">10</text>
<text class="t" x="354" y="54" font-size="11.5" font-weight="600">at 03.03: the row is drawn from render</text>
<rect class="s fs" x="354" y="64" width="258.4" height="178" rx="6" stroke-width="1.5"/>
<text class="tm mono" x="348" y="79.56" font-size="9.5" text-anchor="end">1</text>
<text class="t mono" x="360" y="96.56" font-size="9.33">kilo:</text>
<text class="t mono" x="393.6" y="96.56" font-size="9.33">kilo.c</text>
<text class="tm mono" x="348" y="96.56" font-size="9.5" text-anchor="end">2</text>
<text class="t mono" x="404.8" y="113.56" font-size="9.33">$(CC)</text>
<text class="t mono" x="438.4" y="113.56" font-size="9.33">-o</text>
<text class="t mono" x="455.2" y="113.56" font-size="9.33">kilo</text>
<text class="t mono" x="483.2" y="113.56" font-size="9.33">kilo.c</text>
<text class="t mono" x="522.4" y="113.56" font-size="9.33">-Wall</text>
<text class="t mono" x="556" y="113.56" font-size="9.33">-W</text>
<text class="t mono" x="572.8" y="113.56" font-size="9.33">-peda</text>
<text class="tm mono" x="348" y="113.56" font-size="9.5" text-anchor="end">3</text>
<text class="tm mono" x="348" y="130.56" font-size="9.5" text-anchor="end">4</text>
<text class="t mono" x="360" y="147.56" font-size="9.33">clean:</text>
<text class="tm mono" x="348" y="147.56" font-size="9.5" text-anchor="end">5</text>
<text class="t mono" x="404.8" y="164.56" font-size="9.33">rm</text>
<text class="t mono" x="421.6" y="164.56" font-size="9.33">-f</text>
<text class="t mono" x="438.4" y="164.56" font-size="9.33">kilo</text>
<text class="tm mono" x="348" y="164.56" font-size="9.5" text-anchor="end">6</text>
<text class="tm mono" x="348" y="181.56" font-size="9.5" text-anchor="end">7</text>
<text class="t mono" x="360" y="198.56" font-size="9.33">.PHONY:</text>
<text class="t mono" x="404.8" y="198.56" font-size="9.33">all</text>
<text class="t mono" x="427.2" y="198.56" font-size="9.33">clean</text>
<text class="tm mono" x="348" y="198.56" font-size="9.5" text-anchor="end">8</text>
<text class="t mono" x="360" y="215.56" font-size="9.33">~</text>
<text class="tm mono" x="348" y="215.56" font-size="9.5" text-anchor="end">9</text>
<text class="tm mono" x="348" y="232.56" font-size="9.5" text-anchor="end">10</text>
<text class="tm" x="24" y="268" font-size="10.5">Left: the tab moved the cursor 8 columns without erasing them, and what was there before stays;</text>
<text class="tm" x="24" y="284" font-size="10.5">the row, cut at 44 bytes, is 51 columns wide on the screen and wraps onto the next line, and the frame,</text>
<text class="tm" x="24" y="300" font-size="10.5">one line too long, scrolls the screen up: the Makefile&#x27;s empty line 9 has gone off the top.</text>
</svg>
