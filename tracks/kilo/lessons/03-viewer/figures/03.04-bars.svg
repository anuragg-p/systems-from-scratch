<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 414" fill="none">
<title>The status bar and the message line: the screen, and the bytes of its last two lines</title>
<defs><marker id="f0304a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0304a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0304a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">hello.c at 03.04 on a terminal 10 rows by 44 columns: 8 rows of text, then the two bars</text>
<rect class="s fs" x="38" y="40" width="293.6" height="188" rx="6" stroke-width="1.5"/>
<rect class="a af" x="43.5" y="46" width="7.4" height="14" rx="1" stroke-width="1.5"/>
<text class="t mono" x="44" y="56.24" font-size="10.67">#include</text>
<text class="t mono" x="101.6" y="56.24" font-size="10.67">&lt;stdio.h&gt;</text>
<text class="tm mono" x="32" y="56.24" font-size="9.5" text-anchor="end">1</text>
<text class="tm mono" x="32" y="74.24" font-size="9.5" text-anchor="end">2</text>
<text class="t mono" x="44" y="92.24" font-size="10.67">int</text>
<text class="t mono" x="69.6" y="92.24" font-size="10.67">main(void)</text>
<text class="t mono" x="140" y="92.24" font-size="10.67">{</text>
<text class="tm mono" x="32" y="92.24" font-size="9.5" text-anchor="end">3</text>
<text class="t mono" x="95.2" y="110.24" font-size="10.67">printf(&quot;hello\n&quot;);</text>
<text class="tm mono" x="32" y="110.24" font-size="9.5" text-anchor="end">4</text>
<text class="t mono" x="95.2" y="128.24" font-size="10.67">return</text>
<text class="t mono" x="140" y="128.24" font-size="10.67">0;</text>
<text class="tm mono" x="32" y="128.24" font-size="9.5" text-anchor="end">5</text>
<text class="t mono" x="44" y="146.24" font-size="10.67">}</text>
<text class="tm mono" x="32" y="146.24" font-size="9.5" text-anchor="end">6</text>
<text class="t mono" x="44" y="164.24" font-size="10.67">~</text>
<text class="tm mono" x="32" y="164.24" font-size="9.5" text-anchor="end">7</text>
<text class="t mono" x="44" y="182.24" font-size="10.67">~</text>
<text class="tm mono" x="32" y="182.24" font-size="9.5" text-anchor="end">8</text>
<text class="tm mono" x="32" y="200.24" font-size="9.5" text-anchor="end">9</text>
<text class="tm mono" x="32" y="218.24" font-size="9.5" text-anchor="end">10</text>
<rect class="fa" x="44" y="190" width="281.6" height="15" rx="0"/>
<text class="f mono" x="44" y="200.24" font-size="10.67">hello.c</text>
<text class="f mono" x="95.2" y="200.24" font-size="10.67">-</text>
<text class="f mono" x="108" y="200.24" font-size="10.67">6</text>
<text class="f mono" x="120.8" y="200.24" font-size="10.67">lines</text>
<text class="f mono" x="306.4" y="200.24" font-size="10.67">1/6</text>
<text class="t mono" x="44" y="218.24" font-size="10.67">HELP:</text>
<text class="t mono" x="82.4" y="218.24" font-size="10.67">Ctrl-Q</text>
<text class="t mono" x="127.2" y="218.24" font-size="10.67">=</text>
<text class="t mono" x="140" y="218.24" font-size="10.67">quit</text>
<line class="m" x1="331.6" y1="53" x2="345.6" y2="53" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="351.6" y="57" font-size="11">rows 1 to 8: the file</text>
<line class="m" x1="331.6" y1="179" x2="345.6" y2="179" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="351.6" y="183" font-size="11">E.screenrows = 10 - 2 = 8</text>
<line class="m" x1="331.6" y1="197" x2="345.6" y2="197" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta" x="351.6" y="201" font-size="11" font-weight="600">row 9: the status bar</text>
<line class="m" x1="331.6" y1="215" x2="345.6" y2="215" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="351.6" y="219" font-size="11">row 10: the message line</text>
<text class="t" x="24" y="260" font-size="11.5" font-weight="600">the end of the frame, after row 8&#x27;s \r\n</text>
<text class="ta mono" x="24" y="300" font-size="10.5">ESC[0K ESC[7m</text>
<rect class="af" x="110.2" y="288" width="281.2" height="17" rx="2"/>
<text class="t mono" x="112.2" y="300" font-size="10.5">hello.c</text>
<text class="t mono" x="162.6" y="300" font-size="10.5">-</text>
<text class="t mono" x="175.2" y="300" font-size="10.5">6</text>
<text class="t mono" x="187.8" y="300" font-size="10.5">lines</text>
<text class="t mono" x="370.5" y="300" font-size="10.5">1/6</text>
<text class="ta mono" x="395.4" y="300" font-size="10.5">ESC[0m \r\n</text>
<path class="m" d="M112.2 302 L112.2 308 L219.3 308 L219.3 302" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm mono" x="112.2" y="326" font-size="10">&quot;%.20s - %d lines&quot;</text>
<path class="m" d="M221.3 302 L221.3 308 L368.5 308 L368.5 302" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="294.9" y="326" font-size="10" text-anchor="middle">24 spaces</text>
<path class="m" d="M370.5 302 L370.5 308 L389.4 308 L389.4 302" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="391.4" y="282" font-size="10" text-anchor="end">&quot;%d/%d&quot;, ending at column 44</text>
<text class="ta mono" x="24" y="352" font-size="10.5">ESC[0K</text>
<text class="t mono" x="68.1" y="352" font-size="10.5">HELP:</text>
<text class="t mono" x="105.9" y="352" font-size="10.5">Ctrl-Q</text>
<text class="t mono" x="150" y="352" font-size="10.5">=</text>
<text class="t mono" x="162.6" y="352" font-size="10.5">quit</text>
<text class="tm" x="194.1" y="352" font-size="10.5">no \r\n: the frame ends on the bottom line</text>
<text class="ta mono" x="24" y="376" font-size="10.5">ESC[1;1H ESC[?25h</text>
<text class="tm" x="137.4" y="376" font-size="10.5">the cursor back to the file, at row 1, column 1, and shown</text>
</svg>
