<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" fill="none">
<title>The bytes the history holds after a line of 60 characters is typed into an empty row: 57 as one step of one record, 5190 as 60 steps</title>
<defs><marker id="f0803b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0803b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0803b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">the bytes kilo&#x27;s history holds after the last key, a line of 60 characters typed into an empty row</text>
<text class="t" x="24" y="56" font-size="11.5" font-weight="700">60 characters as one step: a run of typing (08.03)</text>
<rect class="a af" x="24" y="64" width="6.15" height="22" rx="2" stroke-width="1.5"/>
<text class="ta mono" x="40.15" y="79" font-size="12" font-weight="700">57 bytes</text>
<text class="tm" x="112.15" y="79" font-size="10.5">one step (32), one record (24), the empty row it kept (1)</text>
<text class="t" x="24" y="120" font-size="11.5" font-weight="700">the same 60 with Ctrl-L after each: 60 steps (and any typing at 08.01 and 08.02)</text>
<rect class="s fs" x="24" y="128" width="362.54" height="22" rx="2" stroke-width="1.5"/>
<rect class="a af" x="386.54" y="128" width="197.46" height="22" rx="2" stroke-width="1.5"/>
<text class="t" x="205.27" y="143" font-size="10.5" text-anchor="middle">60 steps and records: 3360</text>
<text class="ta" x="485.27" y="143" font-size="10.5" text-anchor="middle">the rows: 1830</text>
<text class="ta mono" x="590" y="143" font-size="12" font-weight="700">5190</text>
<text class="tm" x="24" y="168" font-size="10.5">the row kept before each character: 1 byte (its &#x27;\0&#x27;), then 2, ... up to 60: 1 + 2 + ... + 60 = 1830</text>
<text class="tm" x="24" y="196" font-size="10.5">One record a run: the row is kept once, before its first change; undoSave() leaves the rest out.</text>
</svg>
