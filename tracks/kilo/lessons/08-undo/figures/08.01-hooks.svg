<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" fill="none">
<title>The three key functions that edit, the five row functions they call, and the six places a record is made: one in each row function, and the cut in editorInsertNewline</title>
<defs><marker id="f0801b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo.c at 08.01: who calls whom, and where undoSave() keeps a record (each accent mark)</text>
<rect class="s f" x="31.45" y="160" width="124.3" height="42" rx="6" stroke-width="1.5"/>
<text class="t mono" x="93.6" y="177" font-size="9.5" font-weight="600" text-anchor="middle">editorRowInsertChar</text>
<circle class="a fa" cx="77.35" cy="189.7" r="2.6" stroke-width="1.5"/>
<text class="ta mono" x="83.85" y="193" font-size="9.5" font-weight="700">U_CHG</text>
<rect class="s f" x="161.75" y="160" width="101.5" height="42" rx="6" stroke-width="1.5"/>
<text class="t mono" x="212.5" y="177" font-size="9.5" font-weight="600" text-anchor="middle">editorInsertRow</text>
<circle class="a fa" cx="196.25" cy="189.7" r="2.6" stroke-width="1.5"/>
<text class="ta mono" x="202.75" y="193" font-size="9.5" font-weight="700">U_INS</text>
<rect class="s f" x="269.25" y="160" width="84.4" height="42" rx="6" stroke-width="1.5"/>
<text class="t mono" x="311.45" y="177" font-size="9.5" font-weight="600" text-anchor="middle">editorDelRow</text>
<circle class="a fa" cx="295.2" cy="189.7" r="2.6" stroke-width="1.5"/>
<text class="ta mono" x="301.7" y="193" font-size="9.5" font-weight="700">U_DEL</text>
<rect class="s f" x="359.65" y="160" width="135.7" height="42" rx="6" stroke-width="1.5"/>
<text class="t mono" x="427.5" y="177" font-size="9.5" font-weight="600" text-anchor="middle">editorRowAppendString</text>
<circle class="a fa" cx="411.25" cy="189.7" r="2.6" stroke-width="1.5"/>
<text class="ta mono" x="417.75" y="193" font-size="9.5" font-weight="700">U_CHG</text>
<rect class="s f" x="501.35" y="160" width="107.2" height="42" rx="6" stroke-width="1.5"/>
<text class="t mono" x="554.95" y="177" font-size="9.5" font-weight="600" text-anchor="middle">editorRowDelChar</text>
<circle class="a fa" cx="538.7" cy="189.7" r="2.6" stroke-width="1.5"/>
<text class="ta mono" x="545.2" y="193" font-size="9.5" font-weight="700">U_CHG</text>
<rect class="s fs" x="79.55" y="50" width="135.6" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="147.35" y="67" font-size="11" font-weight="700" text-anchor="middle">editorInsertChar</text>
<text class="tm" x="147.35" y="81" font-size="9.5" text-anchor="middle">the default case</text>
<line class="s" x1="132.35" y1="91" x2="93.6" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801b-ah)"/>
<line class="s" x1="162.35" y1="91" x2="212.5" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801b-ah)"/>
<rect class="s fs" x="229.15" y="50" width="155.4" height="54" rx="6" stroke-width="1.5"/>
<text class="t mono" x="306.85" y="67" font-size="11" font-weight="700" text-anchor="middle">editorInsertNewline</text>
<text class="tm" x="306.85" y="81" font-size="9.5" text-anchor="middle">Enter</text>
<circle class="a fa" cx="267.8" cy="92.7" r="2.6" stroke-width="1.5"/>
<text class="ta mono" x="274.3" y="96" font-size="9.5" font-weight="700">U_CHG the cut</text>
<line class="s" x1="306.85" y1="105" x2="212.5" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801b-ah)"/>
<rect class="s fs" x="398.55" y="50" width="115.8" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="456.45" y="67" font-size="11" font-weight="700" text-anchor="middle">editorDelChar</text>
<text class="tm" x="456.45" y="81" font-size="9.5" text-anchor="middle">Backspace, Ctrl-H, Delete</text>
<line class="s" x1="426.45" y1="91" x2="311.45" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801b-ah)"/>
<line class="s" x1="456.45" y1="91" x2="427.5" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801b-ah)"/>
<line class="s" x1="486.45" y1="91" x2="554.95" y2="158" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0801b-ah)"/>
<text class="tm" x="24" y="226" font-size="10.5">Each keeps its record first, then changes the row. Enter in the middle of a row makes two records (U_INS</text>
<text class="tm" x="24" y="240" font-size="10.5">of the new row, then U_CHG at the cut), a join two (U_CHG of the row above, then U_DEL).</text>
<text class="tm" x="24" y="260" font-size="10.5">editorOpen() reads the file through editorInsertRow() too, with U.off = 1: no record of that.</text>
</svg>
