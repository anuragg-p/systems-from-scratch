<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" fill="none">
<title>The history against its bound: with a bound of 560 bytes, twelve one-record steps keep the newest ten, the two oldest dropped and the saved point taken down with them; and kilo&#x27;s own 8 MB against a row bigger than all of it</title>
<defs><marker id="f0804b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0804b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0804b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo with UNDO_MAX_BYTES made 560: Enter six times, Ctrl-S, Enter six times more, on an empty file</text>
<rect class="m f" x="90" y="92" width="40" height="30" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="110" y="105" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
<text class="tm mono" x="110" y="117" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="m f" x="134" y="92" width="40" height="30" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="154" y="105" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
<text class="tm mono" x="154" y="117" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="178" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="198" y="87" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
<text class="tm mono" x="198" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="222" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="242" y="87" font-size="10.5" font-weight="700" text-anchor="middle">4</text>
<text class="tm mono" x="242" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="266" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="286" y="87" font-size="10.5" font-weight="700" text-anchor="middle">5</text>
<text class="tm mono" x="286" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="310" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="330" y="87" font-size="10.5" font-weight="700" text-anchor="middle">6</text>
<text class="tm mono" x="330" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="354" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="374" y="87" font-size="10.5" font-weight="700" text-anchor="middle">7</text>
<text class="tm mono" x="374" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="398" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="418" y="87" font-size="10.5" font-weight="700" text-anchor="middle">8</text>
<text class="tm mono" x="418" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="442" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="462" y="87" font-size="10.5" font-weight="700" text-anchor="middle">9</text>
<text class="tm mono" x="462" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="486" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="506" y="87" font-size="10.5" font-weight="700" text-anchor="middle">10</text>
<text class="tm mono" x="506" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="530" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="550" y="87" font-size="10.5" font-weight="700" text-anchor="middle">11</text>
<text class="tm mono" x="550" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<rect class="s f" x="574" y="74" width="40" height="30" rx="4" stroke-width="1.5"/>
<text class="t" x="594" y="87" font-size="10.5" font-weight="700" text-anchor="middle">12</text>
<text class="tm mono" x="594" y="99" font-size="8.5" text-anchor="middle">U_INS</text>
<text class="tm" x="82" y="104" font-size="10" text-anchor="end">dropped,</text>
<text class="tm" x="82" y="117" font-size="10" text-anchor="end">oldest first</text>
<path class="a" d="M178 72 L178 66 L614 66 L614 72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta" x="398" y="58" font-size="10.5" font-weight="700" text-anchor="middle">kept: 10 steps x 56 bytes (32 + 24) = 560, the bound</text>
<line class="a" x1="352" y1="72" x2="352" y2="118" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta" x="358" y="120" font-size="10.5">saved after step 6: U.saved was 6, now 4</text>
<text class="tm" x="24" y="156" font-size="10.5">Each new record past the bound drops the oldest steps first; the bytes held never pass 560.</text>
<text class="t" x="24" y="196" font-size="11.5" font-weight="700">kilo&#x27;s own bound, UNDO_MAX_BYTES: 8 MB</text>
<rect class="s fs" x="24" y="206" width="521.95" height="16" rx="2" stroke-width="1.5"/>
<text class="t mono" x="30" y="218" font-size="10.5">8388608 bytes</text>
<rect class="a af" x="24" y="228" width="560" height="16" rx="2" stroke-width="1.5"/>
<text class="ta" x="30" y="240" font-size="10.5">9000057: X on a row of 9 000 000 w&#x27;s needs its record and a step</text>
<text class="ta mono" x="24" y="268" font-size="11" font-weight="700">undo:</text>
<text class="ta mono" x="63.6" y="268" font-size="11" font-weight="700">change</text>
<text class="ta mono" x="109.8" y="268" font-size="11" font-weight="700">too</text>
<text class="ta mono" x="136.2" y="268" font-size="11" font-weight="700">big</text>
<text class="ta mono" x="162.6" y="268" font-size="11" font-weight="700">to</text>
<text class="ta mono" x="182.4" y="268" font-size="11" font-weight="700">remember</text>
<text class="tm" x="247.2" y="268" font-size="10.5">the change is made, and not remembered; Ctrl-Z: Nothing to undo</text>
<text class="tm" x="24" y="292" font-size="10.5">So the history is emptied: no undo can lead back past a change it did not keep.</text>
</svg>
