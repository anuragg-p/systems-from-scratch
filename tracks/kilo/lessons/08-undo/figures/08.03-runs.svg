<text class="tm" x="24" y="266" font-size="10.5">undoKey(c), before each key acts, closes the open step when the key is &quot;other&quot; or of another kind than</text>
<text class="tm" x="24" y="280" font-size="10.5">the keys before it. A key that closes it and changes nothing makes no step.</text>
