<g class="step"><title>Ctrl-Z, then C: a new edit below the saved point. The redo stack, the way back to it, is freed, and U.saved is -1: out of reach. Modified until the next save, though the stack is 1 high again.</title>
<rect class="a af" x="24" y="44" width="66.92" height="22" rx="5" stroke-width="1.5"/>
<text class="ta" x="57.46" y="59" font-size="10.5" font-weight="600" text-anchor="middle">Ctrl-Z, C</text>
<rect class="s f" x="148" y="116" width="210" height="30" rx="5" stroke-width="1.5"/>
<text class="t mono" x="156" y="129" font-size="9.5" font-weight="700">U_CHG at 0</text>
<text class="t mono" x="156" y="141" font-size="9.5">&quot;undo</text>
<text class="t mono" x="190.2" y="141" font-size="9.5">keeps&quot;</text>
<path class="m" d="M126 110 L136 116 L126 122 Z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="120" y="114" font-size="10" font-weight="600" text-anchor="end">saved point</text>
<text class="tm mono" x="120" y="127" font-size="10" text-anchor="end">U.saved -1</text>
<text class="tm" x="120" y="140" font-size="10" text-anchor="end">out of reach</text>
<text class="tm" x="400" y="98" font-size="10.5">E.row[0]</text>
<text class="t mono" x="460" y="98" font-size="11">Cundo</text>
<text class="t mono" x="499.6" y="98" font-size="11">keeps</text>
<text class="t mono" x="400" y="122" font-size="10.5">U.numundo 1, U.saved -1</text>
<text class="ta" x="400" y="140" font-size="10.5" font-weight="600">E.dirty: modified</text>
<rect class="s fs" x="23" y="186" width="267.44" height="38" rx="6" stroke-width="1.5"/>
<rect class="t" x="29" y="191" width="255.44" height="13" rx="1.5"/>
<text class="f mono" x="30" y="200.8" font-size="9.6">notes.txt</text>
<text class="f mono" x="87.6" y="200.8" font-size="9.6">-</text>
<text class="f mono" x="99.12" y="200.8" font-size="9.6">3</text>
<text class="f mono" x="110.64" y="200.8" font-size="9.6">lines</text>
<text class="f mono" x="145.2" y="200.8" font-size="9.6">(modified)</text>
<text class="f mono" x="266.16" y="200.8" font-size="9.6">1/3</text>
<text class="t mono" x="30" y="215.8" font-size="9.6">49</text>
<text class="t mono" x="47.28" y="215.8" font-size="9.6">bytes</text>
<text class="t mono" x="81.84" y="215.8" font-size="9.6">written</text>
<text class="t mono" x="127.92" y="215.8" font-size="9.6">on</text>
<text class="t mono" x="145.2" y="215.8" font-size="9.6">disk</text>
<text class="tm" x="299.44" y="201" font-size="10">the status bar</text>
<text class="tm" x="299.44" y="216" font-size="10">and the message line</text>
</g>
<text class="tm" x="24" y="252" font-size="10.5">After every undo and redo, E.dirty = (U.numundo != U.saved). Between them it counts changes, as in the</text>
<text class="tm" x="24" y="266" font-size="10.5">core.</text>
</svg>
