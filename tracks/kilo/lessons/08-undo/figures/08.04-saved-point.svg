<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" fill="none">
<title>The undo stack and the saved point after typing A, saving, Ctrl-Z, Ctrl-R, and Ctrl-Z with C typed: the file is unmodified exactly when the stack stands at a saved point it can reach</title>
<defs><marker id="f0804a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0804a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0804a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo at 08.04 on notes.txt, row 0: the stacks, U.saved, and the status bar kilo drew</text>
