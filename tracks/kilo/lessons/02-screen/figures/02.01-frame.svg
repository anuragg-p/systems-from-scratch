<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" fill="none">
<title>One frame on a 10 x 44 terminal: the bytes kilo writes, and the screen they draw</title>
<defs><marker id="f0201a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0201a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0201a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo at 02.01 on a terminal 10 rows by 44 columns: its first frame, 116 bytes, one write()</text>
<text class="t" x="24" y="52" font-size="11.5" font-weight="600">the bytes, in the order they are written</text>
<text class="t" x="340" y="52" font-size="11.5" font-weight="600">the screen they draw</text>
<text class="ta mono" x="24" y="74" font-size="10">ESC[?25l</text>
<text class="ta mono" x="78" y="74" font-size="10">ESC[H</text>
<text class="tm" x="114" y="74" font-size="10.5">hide the cursor; go to row 1, column 1</text>
<text class="t mono" x="24" y="103" font-size="10">~</text>
<text class="ta mono" x="36" y="103" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="103" font-size="10">\r\n</text>
<text class="tm" x="112" y="103" font-size="10.5">erase to the end of the line, next line</text>
<text class="t mono" x="24" y="123" font-size="10">~</text>
<text class="ta mono" x="36" y="123" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="123" font-size="10">\r\n</text>
<text class="t mono" x="24" y="143" font-size="10">~</text>
<text class="ta mono" x="36" y="143" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="143" font-size="10">\r\n</text>
<text class="t mono" x="24" y="163" font-size="10">~</text>
<text class="t mono" x="54" y="163" font-size="10">Kilo</text>
<text class="t mono" x="84" y="163" font-size="10">editor</text>
<text class="t mono" x="126" y="163" font-size="10">--</text>
<text class="t mono" x="144" y="163" font-size="10">version</text>
<text class="t mono" x="192" y="163" font-size="10">0.0.1</text>
<text class="ta mono" x="228" y="163" font-size="10">ESC[0K</text>
<text class="ta mono" x="270" y="163" font-size="10">\r\n</text>
<text class="t mono" x="24" y="183" font-size="10">~</text>
<text class="ta mono" x="36" y="183" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="183" font-size="10">\r\n</text>
<text class="tm" x="112" y="183" font-size="10.5">every line the same way</text>
<text class="t mono" x="24" y="203" font-size="10">~</text>
<text class="ta mono" x="36" y="203" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="203" font-size="10">\r\n</text>
<text class="t mono" x="24" y="223" font-size="10">~</text>
<text class="ta mono" x="36" y="223" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="223" font-size="10">\r\n</text>
<text class="t mono" x="24" y="243" font-size="10">~</text>
<text class="ta mono" x="36" y="243" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="243" font-size="10">\r\n</text>
<text class="t mono" x="24" y="263" font-size="10">~</text>
<text class="ta mono" x="36" y="263" font-size="10">ESC[0K</text>
<text class="ta mono" x="78" y="263" font-size="10">\r\n</text>
<text class="tm" x="24" y="283" font-size="10.5">row 10: nothing. A \r\n here would scroll the screen up</text>
<text class="ta mono" x="24" y="308" font-size="10">ESC[1;1H</text>
<text class="ta mono" x="78" y="308" font-size="10">ESC[?25h</text>
<text class="tm" x="132" y="308" font-size="10.5">cursor to row 1, column 1; show it</text>
<text class="tm" x="24" y="330" font-size="10.5">ESC is the one byte 27; \r\n are the two bytes 13 and 10.</text>
<text class="tm" x="24" y="346" font-size="10.5">9 + 8 x 7 + 39 + 6 + 6 = 116 bytes, handed to write() once.</text>
<rect class="s fs" x="340" y="86" width="276" height="208" rx="6" stroke-width="1.5"/>
<rect class="a af" x="345.5" y="92" width="7" height="16" rx="1" stroke-width="1.5"/>
<text class="t mono" x="346" y="103.6" font-size="10">~</text>
<text class="tm mono" x="334" y="103.6" font-size="9.5" text-anchor="end">1</text>
<text class="t mono" x="346" y="123.6" font-size="10">~</text>
<text class="tm mono" x="334" y="123.6" font-size="9.5" text-anchor="end">2</text>
<text class="t mono" x="346" y="143.6" font-size="10">~</text>
<text class="tm mono" x="334" y="143.6" font-size="9.5" text-anchor="end">3</text>
<text class="t mono" x="346" y="163.6" font-size="10">~</text>
<text class="t mono" x="376" y="163.6" font-size="10">Kilo</text>
<text class="t mono" x="406" y="163.6" font-size="10">editor</text>
<text class="t mono" x="448" y="163.6" font-size="10">--</text>
<text class="t mono" x="466" y="163.6" font-size="10">version</text>
<text class="t mono" x="514" y="163.6" font-size="10">0.0.1</text>
<text class="tm mono" x="334" y="163.6" font-size="9.5" text-anchor="end">4</text>
<text class="t mono" x="346" y="183.6" font-size="10">~</text>
<text class="tm mono" x="334" y="183.6" font-size="9.5" text-anchor="end">5</text>
<text class="t mono" x="346" y="203.6" font-size="10">~</text>
<text class="tm mono" x="334" y="203.6" font-size="9.5" text-anchor="end">6</text>
<text class="t mono" x="346" y="223.6" font-size="10">~</text>
<text class="tm mono" x="334" y="223.6" font-size="9.5" text-anchor="end">7</text>
<text class="t mono" x="346" y="243.6" font-size="10">~</text>
<text class="tm mono" x="334" y="243.6" font-size="9.5" text-anchor="end">8</text>
<text class="t mono" x="346" y="263.6" font-size="10">~</text>
<text class="tm mono" x="334" y="263.6" font-size="9.5" text-anchor="end">9</text>
<text class="tm mono" x="334" y="283.6" font-size="9.5" text-anchor="end">10</text>
<text class="ta" x="610" y="308" font-size="10.5" text-anchor="end">the cursor: row 1, column 1</text>
</svg>
