<rect class="m f" x="516.3" y="303" width="86.5" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="521.3" y="313.5" font-size="8.5">clear_namespace</text>
<rect class="m f" x="436" y="320" width="45.7" height="14" rx="3" stroke-width="1.5"/>
