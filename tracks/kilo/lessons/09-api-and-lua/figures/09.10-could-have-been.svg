<rect class="m f" x="540.5" y="269" width="55.9" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="545.5" y="279.5" font-size="8.5">get_lines</text>
<rect class="m f" x="436" y="286" width="61" height="14" rx="3" stroke-width="1.5"/>
