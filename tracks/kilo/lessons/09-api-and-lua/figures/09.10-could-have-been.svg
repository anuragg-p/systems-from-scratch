<rect class="m f" x="230" y="371" width="96.7" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="235" y="381.5" font-size="8.5">event CursorMoved</text>
<text class="tm" x="436" y="261" font-size="9.5" font-weight="600">the API it calls</text>
<rect class="m f" x="436" y="269" width="35.5" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="441" y="279.5" font-size="8.5">input</text>
<rect class="m f" x="475.5" y="269" width="61" height="14" rx="3" stroke-width="1.5"/>
