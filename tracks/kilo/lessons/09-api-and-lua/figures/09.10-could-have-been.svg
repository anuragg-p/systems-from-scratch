<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 397" fill="none">
<title>Three features as scripts: what each is or would be in C, the plugin that does it in Lua, and the API functions the plugin calls</title>
<defs><marker id="f0910a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0910a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0910a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">09.10&#x27;s three plugins, each only Lua, each standing in for C</text>
<text class="t" x="24" y="50" font-size="12" font-weight="700">vi&#x27;s keys</text>
<text class="tm" x="24" y="68" font-size="9.5" font-weight="600">in C</text>
<rect class="s fs" x="24" y="74" width="180" height="38" rx="5" stroke-width="1.5"/>
<text class="t" x="32" y="89" font-size="10">none in the track:</text>
<text class="tm" x="32" y="103" font-size="10">kilo&#x27;s keys have no modes</text>
<line class="a" x1="114" y1="114" x2="114" y2="128" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0910a-aa)"/>
<text class="tm" x="24" y="142" font-size="9.5" font-weight="600">as a script</text>
<rect class="a af" x="24" y="148" width="180" height="22" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="32" y="163" font-size="9.5" font-weight="700">plugins/vi.lua</text>
<text class="t" x="24" y="186" font-size="10">A KeyPress function takes normal</text>
<text class="t" x="24" y="199" font-size="10">mode&#x27;s keys: moves with feed_key</text>
<text class="t" x="24" y="212" font-size="10">or set_cursor, edits with</text>
<text class="t" x="24" y="225" font-size="10">set_lines; Escape and i switch</text>
<text class="t" x="24" y="238" font-size="10">modes, shown in the status bar.</text>
<text class="t" x="230" y="50" font-size="12" font-weight="700">colour for C and Lua</text>
<text class="tm" x="230" y="68" font-size="9.5" font-weight="600">in C</text>
<rect class="s fs" x="230" y="74" width="180" height="38" rx="5" stroke-width="1.5"/>
<text class="t" x="238" y="89" font-size="10">module 06: editorUpdateSyntax()</text>
<text class="tm" x="238" y="103" font-size="10">and the HLDB table, in kilo.c</text>
<line class="a" x1="320" y1="114" x2="320" y2="128" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0910a-aa)"/>
<text class="tm" x="230" y="142" font-size="9.5" font-weight="600">as a script</text>
<rect class="a af" x="230" y="148" width="180" height="22" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="238" y="163" font-size="9.5" font-weight="700">plugins/colour.lua</text>
<text class="t" x="230" y="186" font-size="10">Highlights over the rows on the</text>
<text class="t" x="230" y="199" font-size="10">screen, put again on BufReadPost,</text>
<text class="t" x="230" y="212" font-size="10">TextChanged and CursorMoved.</text>
<text class="t" x="436" y="50" font-size="12" font-weight="700">go to a line, and find</text>
<text class="tm" x="436" y="68" font-size="9.5" font-weight="600">in C</text>
<rect class="s fs" x="436" y="74" width="180" height="38" rx="5" stroke-width="1.5"/>
<text class="t" x="444" y="89" font-size="10">module 05: editorFind(),</text>
<text class="tm" x="444" y="103" font-size="10">in kilo.c</text>
<line class="a" x1="526" y1="114" x2="526" y2="128" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0910a-aa)"/>
<text class="tm" x="436" y="142" font-size="9.5" font-weight="600">as a script</text>
<rect class="a af" x="436" y="148" width="180" height="22" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="444" y="163" font-size="9.5" font-weight="700">plugins/find.lua</text>
<text class="t" x="436" y="186" font-size="10">input() asks; set_cursor goes</text>
<text class="t" x="436" y="199" font-size="10">there; a highlight shows the</text>
<text class="t" x="436" y="212" font-size="10">match.</text>
<text class="tm" x="24" y="261" font-size="9.5" font-weight="600">the API it calls</text>
<rect class="m f" x="24" y="269" width="81.4" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="29" y="279.5" font-size="8.5">create_autocmd</text>
<rect class="m f" x="109.4" y="269" width="50.8" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="114.4" y="279.5" font-size="8.5">feed_key</text>
<rect class="m f" x="24" y="286" width="61" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="29" y="296.5" font-size="8.5">set_cursor</text>
<rect class="m f" x="89" y="286" width="61" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="94" y="296.5" font-size="8.5">get_cursor</text>
<rect class="m f" x="24" y="303" width="55.9" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="29" y="313.5" font-size="8.5">get_lines</text>
<rect class="m f" x="83.9" y="303" width="55.9" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="88.9" y="313.5" font-size="8.5">set_lines</text>
<rect class="m f" x="24" y="320" width="81.4" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="29" y="330.5" font-size="8.5">set_statusline</text>
<rect class="m f" x="109.4" y="320" width="81.4" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="114.4" y="330.5" font-size="8.5">event KeyPress</text>
<text class="tm" x="230" y="261" font-size="9.5" font-weight="600">the API it calls</text>
<rect class="m f" x="230" y="269" width="50.8" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="235" y="279.5" font-size="8.5">get_name</text>
<rect class="m f" x="284.8" y="269" width="91.6" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="289.8" y="279.5" font-size="8.5">create_namespace</text>
<rect class="m f" x="230" y="286" width="86.5" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="235" y="296.5" font-size="8.5">clear_namespace</text>
<rect class="m f" x="320.5" y="286" width="76.3" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="325.5" y="296.5" font-size="8.5">add_highlight</text>
<rect class="m f" x="230" y="303" width="50.8" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="235" y="313.5" font-size="8.5">get_view</text>
<rect class="m f" x="284.8" y="303" width="50.8" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="289.8" y="313.5" font-size="8.5">get_size</text>
<rect class="m f" x="339.6" y="303" width="55.9" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="344.6" y="313.5" font-size="8.5">get_lines</text>
<rect class="m f" x="230" y="320" width="81.4" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="235" y="330.5" font-size="8.5">create_autocmd</text>
<rect class="m f" x="230" y="337" width="96.7" height="14" rx="3" stroke-width="1.5"/>
<text class="t mono" x="235" y="347.5" font-size="8.5">event BufReadPost</text>
<rect class="m f" x="230" y="354" width="96.7" height="14" rx="3" stroke-width="1.5"/>
