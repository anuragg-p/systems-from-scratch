<text class="t" x="101" y="126" font-size="10" font-weight="600" text-anchor="middle">100000 instructions</text>
<text class="tm" x="101" y="139" font-size="10" text-anchor="middle">about 0.2 ms</text>
<text class="tm" x="194" y="126" font-size="10">each look: poll() with no wait;</text>
<text class="tm" x="194" y="139" font-size="10">nothing there: the script goes on</text>
<text class="t mono" x="380" y="56" font-size="10.5" font-weight="700" text-anchor="middle">a b c</text>
