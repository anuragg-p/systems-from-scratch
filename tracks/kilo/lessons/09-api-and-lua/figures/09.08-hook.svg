<line class="a" x1="442" y1="62" x2="442" y2="86" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f09-08a-aa)"/>
<text class="t" x="478" y="92" font-size="10">a b c: read by a look,</text>
<text class="t" x="478" y="105" font-size="10">and dropped</text>
<text class="ta" x="478" y="122" font-size="10" font-weight="700">Ctrl-C: the last look</text>
<text class="ta" x="478" y="135" font-size="10" font-weight="700">finds a 3</text>
<text class="tm" x="24" y="50" font-size="10">Lua&#x27;s instructions (not to scale: a second is some 5000 looks)</text>
<text class="tm" x="24" y="172" font-size="10.5">then the error goes up the stack, to the protected call</text>
<rect class="a af" x="24" y="182" width="330" height="19" rx="3" stroke-width="1.5"/>
<text class="ta" x="32" y="195" font-size="9.5" font-weight="700">scriptHook: the count set to 1; where + &quot;interrupted&quot;; lua_error</text>
<rect class="m f" x="24" y="205" width="330" height="19" rx="3" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="32" y="218" font-size="9.5">init.lua:1, the function mapped to &lt;C-t&gt;: unwound</text>
<rect class="m f" x="24" y="228" width="330" height="19" rx="3" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="32" y="241" font-size="9.5">scriptCallIn, and Lua&#x27;s own frames: unwound</text>
<rect class="s f" x="24" y="251" width="330" height="19" rx="3" stroke-width="1.5"/>
<text class="t" x="32" y="264" font-size="9.5">scriptProtected: lua_pcall returns the error; scriptReport()</text>
<rect class="s f" x="24" y="274" width="330" height="19" rx="3" stroke-width="1.5"/>
<text class="t" x="32" y="287" font-size="9.5">at depth 0: a full collection, the hook&#x27;s count back</text>
<path class="a" d="M358 191.5 C384 191.5, 384 260.5, 360 260.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f09-08a-aa)"/>
<text class="ta mono" x="386" y="230.5" font-size="10" font-weight="700">longjmp</text>
<text class="tm" x="440" y="176" font-size="10">the screen after: row 0, and</text>
<text class="tm" x="440" y="189" font-size="10">the message line</text>
<rect class="s fs" x="440" y="196" width="176" height="40" rx="4" stroke-width="1.5"/>
<text class="t mono" x="448" y="210" font-size="10">unsaved</text>
<text class="t mono" x="496" y="210" font-size="10">the</text>
<text class="t mono" x="520" y="210" font-size="10">first</text>
<text class="t mono" x="556" y="210" font-size="10">line</text>
<text class="ta mono" x="448" y="228" font-size="10" font-weight="700">init.lua:1:</text>
<text class="ta mono" x="520" y="228" font-size="10" font-weight="700">interrupted</text>
<text class="t" x="440" y="254" font-size="10">The a b c never reached the</text>
<text class="t" x="440" y="267" font-size="10">text. Then Ctrl-S: &quot;23 bytes</text>
<text class="t" x="440" y="280" font-size="10">written on disk&quot;.</text>
<text class="tm" x="24" y="312" font-size="10">Redis sets the same kind of hook: lua_sethook(lua,luaMaskCountHook,LUA_MASKCOUNT,100000) (src/script_lua.c).</text>
<text class="tm" x="24" y="326" font-size="10">Neovim&#x27;s Lua glue (src/nvim/lua/executor.c and the files beside it) calls no lua_sethook.</text>
