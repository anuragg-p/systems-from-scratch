<text class="tm" x="24" y="290" font-size="10.5">Inside the range, column 4 was past the end of &#x27;y&#x27;, so it is cut to 1. Neovim&#x27;s nvim_buf_set_lines leaves a</text>
<text class="tm" x="24" y="304" font-size="10.5">cursor inside the range on its own line number (fix_cursor).</text>
