<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" fill="none">
<title>Lua&#x27;s stack in scriptEvalIn() as kilo at 09.01 runs the line 1+1 typed at Ctrl-E: empty; the compiled chunk; its result, 2; print under the 2, which reads it as the text &quot;2&quot;; empty again</title>
<defs><marker id="f0901a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo at 09.01: Ctrl-E, then 1+1 and Enter. scriptProtected() pushed scriptEvalIn and the line and called</text>
<text class="tm" x="24" y="37" font-size="11">lua_pcall(L,1,0,0); this is the stack inside it, after each call.</text>
<text class="t" x="137" y="166" font-size="12" font-weight="700" text-anchor="middle">scriptEvalIn&#x27;s stack</text>
<text class="tm" x="44" y="272" font-size="9.5" text-anchor="middle">from the bottom</text>
<text class="tm" x="236" y="272" font-size="9.5" text-anchor="middle">from the top</text>
<g class="step"><title>Inside lua_pcall(), scriptEvalIn finds the typed line at index 1, a light userdata, and empties its stack: lua_settop(L, 0).</title>
<rect class="m f" x="52" y="228" width="170" height="28" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="137" y="246" font-size="10" text-anchor="middle">empty: lua_gettop(L) is 0</text>
<text class="tm" x="280" y="66" font-size="10.5">what ran</text>
<rect class="af" x="276" y="74" width="96.32" height="16" rx="3"/>
<text class="ta mono" x="280" y="86" font-size="9.2" font-weight="600">lua_settop(L,0);</text>
<text class="tm" x="280" y="166" font-size="10.5">it began with one value: the line &quot;1+1&quot; (a light</text>
<text class="tm" x="280" y="180" font-size="10.5">userdata)</text>
</g>
<g class="step"><title>lua_pushfstring() pushes "return 1+1;", luaL_loadbuffer() compiles it and pushes the chunk, a Lua function, on top of it; lua_remove(L, 1) takes the string out from under the chunk.</title>
<rect class="a af" x="52" y="228" width="170" height="28" rx="4" stroke-width="1.5"/>
<text class="ta" x="60" y="245.5" font-size="10">function (Lua)</text>
<text class="ta mono" x="214" y="246" font-size="11" font-weight="700" text-anchor="end">the chunk</text>
<text class="t mono" x="44" y="246" font-size="11" font-weight="600" text-anchor="end">1</text>
<text class="tm mono" x="230" y="246" font-size="11">-1</text>
<text class="tm" x="280" y="66" font-size="10.5">what ran</text>
<rect class="af" x="276" y="74" width="212.24" height="16" rx="3"/>
<text class="ta mono" x="280" y="86" font-size="9.2" font-weight="600">lua_pushfstring(L,&quot;return</text>
<text class="ta mono" x="423.52" y="86" font-size="9.2" font-weight="600">%s;&quot;,line);</text>
<rect class="af" x="276" y="94" width="333.68" height="16" rx="3"/>
<text class="ta mono" x="280" y="106" font-size="9.2" font-weight="600">luaL_loadbuffer(L,lua_tostring(L,1),lua_rawlen(L,1),&quot;=lua&quot;)</text>
<rect class="af" x="276" y="114" width="96.32" height="16" rx="3"/>
<text class="ta mono" x="280" y="126" font-size="9.2" font-weight="600">lua_remove(L,1);</text>
<text class="tm" x="280" y="166" font-size="10.5">the string &quot;return 1+1;&quot; was under it until</text>
<text class="tm" x="280" y="180" font-size="10.5">lua_remove(L,1)</text>
</g>
<g class="step"><title>lua_call(L, 0, LUA_MULTRET) pops the chunk and runs it: its one result, the integer 2, is left at index 1, which is also -1, the top.</title>
<rect class="a af" x="52" y="228" width="170" height="28" rx="4" stroke-width="1.5"/>
<text class="ta" x="60" y="245.5" font-size="10">integer</text>
<text class="ta mono" x="214" y="246" font-size="11" font-weight="700" text-anchor="end">2</text>
<text class="t mono" x="44" y="246" font-size="11" font-weight="600" text-anchor="end">1</text>
<text class="tm mono" x="230" y="246" font-size="11">-1</text>
<text class="tm" x="280" y="66" font-size="10.5">what ran</text>
<rect class="af" x="276" y="74" width="151.52" height="16" rx="3"/>
<text class="ta mono" x="280" y="86" font-size="9.2" font-weight="600">lua_call(L,0,LUA_MULTRET);</text>
<text class="tm" x="280" y="166" font-size="10.5">the chunk is gone; what it returned is in its place</text>
</g>
<g class="step"><title>lua_getglobal() pushes print, and lua_insert(L, 1) moves it under the 2; lua_call(L, 1, 0) calls it. Inside print, luaL_tolstring() reads the 2 as the text "2", which goes to the message line.</title>
<rect class="a af" x="52" y="228" width="170" height="28" rx="4" stroke-width="1.5"/>
<text class="ta" x="60" y="245.5" font-size="10">function (C)</text>
<text class="ta mono" x="214" y="246" font-size="11" font-weight="700" text-anchor="end">print</text>
<text class="t mono" x="44" y="246" font-size="11" font-weight="600" text-anchor="end">1</text>
<text class="tm mono" x="230" y="246" font-size="11">-2</text>
<rect class="s f" x="52" y="196" width="170" height="28" rx="4" stroke-width="1.5"/>
<text class="tm" x="60" y="213.5" font-size="10">integer</text>
<text class="t mono" x="214" y="214" font-size="11" font-weight="600" text-anchor="end">2</text>
<text class="t mono" x="44" y="214" font-size="11" font-weight="600" text-anchor="end">2</text>
<text class="tm mono" x="230" y="214" font-size="11">-1</text>
<text class="tm" x="280" y="66" font-size="10.5">what ran</text>
<rect class="af" x="276" y="74" width="146" height="16" rx="3"/>
<text class="ta mono" x="280" y="86" font-size="9.2" font-weight="600">lua_getglobal(L,&quot;print&quot;);</text>
<rect class="af" x="276" y="94" width="96.32" height="16" rx="3"/>
<text class="ta mono" x="280" y="106" font-size="9.2" font-weight="600">lua_insert(L,1);</text>
<rect class="af" x="276" y="114" width="96.32" height="16" rx="3"/>
<text class="ta mono" x="280" y="126" font-size="9.2" font-weight="600">lua_call(L,n,0);</text>
<text class="t" x="440" y="166" font-size="12" font-weight="700" text-anchor="middle">inside print</text>
<rect class="s f" x="350" y="232" width="180" height="24" rx="4" stroke-width="1.5"/>
<text class="tm" x="358" y="247.5" font-size="9.5">integer</text>
<text class="t mono" x="522" y="248" font-size="10.5" font-weight="600" text-anchor="end">2</text>
<text class="t mono" x="342" y="248" font-size="10.5" font-weight="600" text-anchor="end">1</text>
<text class="tm mono" x="538" y="248" font-size="10.5">-3</text>
<rect class="s f" x="350" y="204" width="180" height="24" rx="4" stroke-width="1.5"/>
<text class="tm" x="358" y="219.5" font-size="9.5">light userdata</text>
<text class="t mono" x="522" y="220" font-size="10.5" font-weight="600" text-anchor="end">the buffer</text>
<text class="t mono" x="342" y="220" font-size="10.5" font-weight="600" text-anchor="end">2</text>
<text class="tm mono" x="538" y="220" font-size="10.5">-2</text>
<rect class="a af" x="350" y="176" width="180" height="24" rx="4" stroke-width="1.5"/>
<text class="ta" x="358" y="191.5" font-size="9.5">string</text>
<text class="ta mono" x="522" y="192" font-size="10.5" font-weight="700" text-anchor="end">&quot;2&quot;</text>
<text class="t mono" x="342" y="192" font-size="10.5" font-weight="600" text-anchor="end">3</text>
<text class="tm mono" x="538" y="192" font-size="10.5">-1</text>
<text class="tm" x="24" y="302" font-size="10.5">the message line:</text>
<rect class="s fs" x="118" y="288" width="60" height="20" rx="4" stroke-width="1.5"/>
<text class="t mono" x="126" y="302" font-size="11" font-weight="600">2</text>
</g>
<g class="step"><title>lua_call() popped print and its argument: the stack is empty, as scriptProtected() left it, and lua_pcall() gives back 0, LUA_OK. The message line shows 2.</title>
<rect class="m f" x="52" y="228" width="170" height="28" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="137" y="246" font-size="10" text-anchor="middle">empty: lua_gettop(L) is 0</text>
<text class="tm" x="280" y="66" font-size="10.5">what ran</text>
<rect class="af" x="276" y="74" width="96.32" height="16" rx="3"/>
<text class="ta mono" x="280" y="86" font-size="9.2" font-weight="600">lua_call(L,n,0);</text>
<rect class="af" x="276" y="94" width="57.68" height="16" rx="3"/>
<text class="ta mono" x="280" y="106" font-size="9.2" font-weight="600">return</text>
<text class="ta mono" x="318.64" y="106" font-size="9.2" font-weight="600">0;</text>
<rect class="af" x="276" y="114" width="162.56" height="16" rx="3"/>
<text class="ta mono" x="280" y="126" font-size="9.2" font-weight="600">status</text>
<text class="ta mono" x="318.64" y="126" font-size="9.2" font-weight="600">=</text>
<text class="ta mono" x="329.68" y="126" font-size="9.2" font-weight="600">lua_pcall(L,1,0,0);</text>
<text class="tm" x="280" y="166" font-size="10.5">lua_pcall() returns LUA_OK: no error on the stack</text>
<text class="tm" x="24" y="302" font-size="10.5">the message line:</text>
<rect class="s fs" x="118" y="288" width="60" height="20" rx="4" stroke-width="1.5"/>
<text class="t mono" x="126" y="302" font-size="11" font-weight="600">2</text>
</g>
</svg>
