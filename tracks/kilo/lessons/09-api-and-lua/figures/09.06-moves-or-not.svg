<text class="tm" x="404" y="196" font-size="10">nvim_buf_set_lines calls extmark_splice:</text>
<text class="tm" x="404" y="209" font-size="10">the marks are adjusted in the same edit</text>
<text class="tm" x="404" y="222" font-size="10">(buffer.c).</text>
<text class="tm" x="404" y="241" font-size="10">They sit in a tree (marktree.c), with</text>
<text class="tm" x="404" y="254" font-size="10">&quot;adjustment to text changes&quot;</text>
<text class="tm" x="404" y="267" font-size="10">(extmark.c).</text>
<text class="t" x="24" y="300" font-size="10.5">kilo: the script pays, again after every change. Neovim: the editor pays, once, in every edit; every plugin gains.</text>
