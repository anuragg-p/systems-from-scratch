<text class="tm" x="24" y="186" font-size="10">the line typed at the prompt, before Enter:</text>
<text class="t mono" x="24" y="202" font-size="8.6">ns</text>
<text class="t mono" x="39.48" y="202" font-size="8.6">=</text>
<text class="t mono" x="49.8" y="202" font-size="8.6">kilo.api.create_namespace(&#x27;&#x27;)</text>
<text class="t mono" x="24" y="215" font-size="8.6">kilo.api.add_highlight(ns,</text>
<text class="t mono" x="163.32" y="215" font-size="8.6">1,</text>
<text class="t mono" x="178.8" y="215" font-size="8.6">0,</text>
<text class="t mono" x="194.28" y="215" font-size="8.6">6,</text>
<text class="t mono" x="209.76" y="215" font-size="8.6">&#x27;green&#x27;)</text>
<text class="t" x="24" y="240" font-size="10">The yellow and the reverse are put again by the scripts on</text>
<text class="t" x="24" y="253" font-size="10">TextChanged, so they follow their rows. The green was put once:</text>
<text class="t" x="24" y="266" font-size="10">it stays on row 1, now over width.</text>
