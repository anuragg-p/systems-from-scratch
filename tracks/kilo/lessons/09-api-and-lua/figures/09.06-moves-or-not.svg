<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" fill="none">
<title>A row put in above a highlighted word: kilo&#x27;s highlight stays on its row number, over the row that moved there; Neovim&#x27;s extmark moves down with the word</title>
