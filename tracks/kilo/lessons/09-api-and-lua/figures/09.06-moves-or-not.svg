<line class="m" x1="501.2" y1="120" x2="511.2" y2="120" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f09-06c-am)"/>
<text class="tm" x="404" y="196" font-size="10">nvim_buf_set_lines calls</text>
<text class="tm" x="404" y="209" font-size="10">extmark_splice, and &quot;Marks are moved</text>
<text class="tm" x="404" y="222" font-size="10">by calls to extmark_splice&quot;</text>
<text class="tm" x="404" y="235" font-size="10">(extmark.c).</text>
<text class="tm" x="404" y="254" font-size="10">They sit in a tree (marktree.c), with</text>
<text class="tm" x="404" y="267" font-size="10">&quot;adjustment to text changes&quot;.</text>
<text class="t" x="24" y="304" font-size="10.5">kilo: the script pays, again after every change. Neovim: the editor pays, once, in every edit; every plugin gains.</text>
</svg>
