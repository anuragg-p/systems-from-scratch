<text class="ta mono" x="52.5" y="282" font-size="9.5" font-weight="700">kilo.api.clear_namespace(kilo.api.create_namespace(&#x27;numbers&#x27;))</text>
<text class="tm" x="24" y="298" font-size="10.5">The same name gives the same id, 1: clear_namespace() takes that namespace&#x27;s highlights, and no other.</text>
