<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" fill="none">
<title>Two scripts draw on the same rows, each in a namespace of its own: numbers in yellow in namespace 1, spaces at a row&#x27;s end in reverse in namespace 2; clearing namespace 2 leaves every yellow</title>
