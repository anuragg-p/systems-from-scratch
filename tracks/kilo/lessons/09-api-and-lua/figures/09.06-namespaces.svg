<rect class="af" x="24" y="160" width="23.4" height="13" rx="2"/>
<text class="ta mono" x="27" y="170" font-size="10" font-weight="700">640</text>
<text class="t mono" x="56" y="170" font-size="9.5">local</text>
<text class="t mono" x="90.2" y="170" font-size="9.5">numbers</text>
<text class="t mono" x="135.8" y="170" font-size="9.5">=</text>
<text class="t mono" x="147.2" y="170" font-size="9.5">kilo.api.create_namespace(&#x27;numbers&#x27;)</text>
<text class="tm" x="56" y="185" font-size="10">namespace 1: every number on the screen, in yellow</text>
<rect class="t" x="24" y="200" width="23.4" height="13" rx="2"/>
<text class="f mono" x="27" y="210" font-size="10" font-weight="700">   </text>
<text class="t mono" x="56" y="210" font-size="9.5">local</text>
<text class="t mono" x="90.2" y="210" font-size="9.5">spaces</text>
<text class="t mono" x="130.1" y="210" font-size="9.5">=</text>
<text class="t mono" x="141.5" y="210" font-size="9.5">kilo.api.create_namespace(&#x27;spaces&#x27;)</text>
<text class="tm" x="56" y="225" font-size="10">namespace 2: the spaces at the end of a row, in reverse</text>
<text class="ta mono" x="24" y="256" font-size="9.5" font-weight="700">lua:</text>
<text class="ta mono" x="52.5" y="256" font-size="9.5" font-weight="700">kilo.api.clear_namespace(kilo.api.create_namespace(&#x27;spaces&#x27;))</text>
<text class="tm" x="24" y="272" font-size="10.5">The same name gives the same number, 2: clear_namespace() takes that namespace&#x27;s highlights, and no other&#x27;s.</text>
<text class="tm" x="24" y="288" font-size="10.5">Both scripts clear and draw again on every event, so the next one that fires brings the spaces back.</text>
</svg>
