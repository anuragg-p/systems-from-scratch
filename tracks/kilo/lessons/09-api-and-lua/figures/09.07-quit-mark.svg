<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" fill="none">
<title>quit() inside a mapped function, in kilo at 09.07: the mark is set, the function returns to C, and only then does kilo leave and close Lua</title>
<defs><marker id="f09-07b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f09-07b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f09-07b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo at 09.07 on add.c with the lesson&#x27;s init.lua: x typed and taken back, then Ctrl-X</text>
<rect class="m fs" x="24" y="32" width="244" height="65.1" rx="5" stroke-width="1.5"/>
<text class="t mono" x="32" y="47.33" font-size="9.5">--</text>
<text class="t mono" x="49.1" y="47.33" font-size="9.5">Ctrl-X:</text>
<text class="t mono" x="94.7" y="47.33" font-size="9.5">save,</text>
<text class="t mono" x="128.9" y="47.33" font-size="9.5">and</text>
<text class="t mono" x="151.7" y="47.33" font-size="9.5">leave.</text>
<text class="t mono" x="32" y="61.11" font-size="9.5">api.set_keymap(&#x27;&lt;C-x&gt;&#x27;,</text>
<text class="t mono" x="168.8" y="61.11" font-size="9.5">function()</text>
<text class="t mono" x="43.4" y="74.88" font-size="9.5">if</text>
<text class="t mono" x="60.5" y="74.88" font-size="9.5">api.save()</text>
<text class="t mono" x="123.2" y="74.88" font-size="9.5">then</text>
<text class="t mono" x="151.7" y="74.88" font-size="9.5">api.quit(false)</text>
<text class="t mono" x="242.9" y="74.88" font-size="9.5">end</text>
<text class="t mono" x="32" y="88.66" font-size="9.5">end)</text>
<text class="tm" x="24" y="118" font-size="10.5">the stack</text>
<text class="tm" x="306" y="118" font-size="10.5">the state</text>
<g class="step"><title>Ctrl-X: the function mapped to it saves the file, then calls quit(false), which only sets a mark, editorQuit = 1, and returns to the Lua function: it is still running.</title>
<rect class="a" x="27" y="64.55" width="238" height="14.46" rx="2" stroke-width="1.5"/>
<rect class="s f" x="24" y="271" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="283" font-size="9.5">main: while(1)</text>
<rect class="s f" x="24" y="252" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="264" font-size="9.5">editorProcessKeypress</text>
<rect class="s f" x="24" y="233" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="245" font-size="9.5">editorScriptKey</text>
<rect class="s f" x="24" y="214" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="226" font-size="9.5">scriptCall</text>
<rect class="s f" x="24" y="195" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="207" font-size="9.5">scriptProtected: lua_pcall</text>
<rect class="s f" x="24" y="176" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="188" font-size="9.5">Lua: the function mapped to &lt;C-x&gt;</text>
<rect class="a af" x="24" y="157" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="32" y="169" font-size="9.5" font-weight="700">api.quit(false): apiQuit</text>
<text class="tm" x="306" y="140" font-size="10.5">editorQuit</text>
<text class="ta" x="400" y="140" font-size="10.5" font-weight="700">1: the mark</text>
<text class="tm" x="306" y="159" font-size="10.5">calls into Lua</text>
<text class="t" x="400" y="159" font-size="10.5">1, still running</text>
<text class="tm" x="306" y="178" font-size="10.5">add.c</text>
<text class="t" x="400" y="178" font-size="10.5">saved by api.save()</text>
<text class="tm" x="306" y="197" font-size="10.5">the Lua state</text>
<text class="t" x="400" y="197" font-size="10.5">open</text>
<text class="tm" x="306" y="216" font-size="10.5">the terminal</text>
<text class="t" x="400" y="216" font-size="10.5">raw</text>
<text class="tm" x="306" y="235" font-size="10.5">kilo</text>
<text class="t" x="400" y="235" font-size="10.5">running</text>
<text class="tm" x="306" y="262" font-size="9.5">the line of kilo&#x27;s that does it:</text>
<text class="ta mono" x="306" y="277" font-size="8.6" font-weight="700">editorQuit</text>
<text class="ta mono" x="362.76" y="277" font-size="8.6" font-weight="700">=</text>
<text class="ta mono" x="373.08" y="277" font-size="8.6" font-weight="700">1;</text>
</g>
<g class="step"><title>The function ends: the protected call returns, and the stack is C alone. No frame is drawn: the main loop comes round first.</title>
<rect class="a" x="27" y="78.33" width="238" height="14.46" rx="2" stroke-width="1.5"/>
<rect class="s f" x="24" y="271" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="283" font-size="9.5">main: while(1)</text>
<rect class="s f" x="24" y="252" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="264" font-size="9.5">editorProcessKeypress</text>
<rect class="s f" x="24" y="233" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="245" font-size="9.5">editorScriptKey</text>
<rect class="s f" x="24" y="214" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="226" font-size="9.5">scriptCall</text>
<rect class="a af" x="24" y="195" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="32" y="207" font-size="9.5" font-weight="700">scriptProtected: lua_pcall returned</text>
<rect class="m f" x="24" y="176" width="270" height="17" rx="3" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="32" y="188" font-size="9.5">Lua: the function mapped to &lt;C-x&gt;</text>
<rect class="m f" x="24" y="157" width="270" height="17" rx="3" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="32" y="169" font-size="9.5">api.quit(false): apiQuit</text>
<text class="tm" x="306" y="140" font-size="10.5">editorQuit</text>
<text class="t" x="400" y="140" font-size="10.5">1</text>
<text class="tm" x="306" y="159" font-size="10.5">calls into Lua</text>
<text class="ta" x="400" y="159" font-size="10.5" font-weight="700">0</text>
<text class="tm" x="306" y="178" font-size="10.5">add.c</text>
<text class="t" x="400" y="178" font-size="10.5">saved</text>
<text class="tm" x="306" y="197" font-size="10.5">the Lua state</text>
<text class="t" x="400" y="197" font-size="10.5">open</text>
<text class="tm" x="306" y="216" font-size="10.5">the terminal</text>
<text class="t" x="400" y="216" font-size="10.5">raw</text>
<text class="tm" x="306" y="235" font-size="10.5">kilo</text>
<text class="t" x="400" y="235" font-size="10.5">running</text>
<text class="tm" x="306" y="262" font-size="9.5">the line of kilo&#x27;s that does it:</text>
<text class="ta mono" x="306" y="277" font-size="8.6" font-weight="700">status</text>
<text class="ta mono" x="342.12" y="277" font-size="8.6" font-weight="700">=</text>
<text class="ta mono" x="352.44" y="277" font-size="8.6" font-weight="700">lua_pcall(L,1,0,0);</text>
<text class="ta mono" x="306" y="290" font-size="8.6" font-weight="700">S.depth--;</text>
</g>
<g class="step"><title>At the top of main's loop, editorAfterKey() reads the mark and calls exit(0). The functions registered with atexit() put the terminal back, and scriptStop() closes the Lua state: no Lua function is on the stack.</title>
<rect class="s f" x="24" y="271" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="283" font-size="9.5">main: while(1)</text>
<rect class="s f" x="24" y="252" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="t mono" x="32" y="264" font-size="9.5">editorAfterKey: exit(0)</text>
<rect class="a af" x="24" y="233" width="270" height="17" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="32" y="245" font-size="9.5" font-weight="700">atexit: scriptStop</text>
<text class="tm" x="306" y="140" font-size="10.5">editorQuit</text>
<text class="t" x="400" y="140" font-size="10.5">1</text>
<text class="tm" x="306" y="159" font-size="10.5">calls into Lua</text>
<text class="t" x="400" y="159" font-size="10.5">0</text>
<text class="tm" x="306" y="178" font-size="10.5">add.c</text>
<text class="t" x="400" y="178" font-size="10.5">saved</text>
<text class="tm" x="306" y="197" font-size="10.5">the Lua state</text>
<text class="ta" x="400" y="197" font-size="10.5" font-weight="700">closed: lua_close</text>
<text class="tm" x="306" y="216" font-size="10.5">the terminal</text>
<text class="ta" x="400" y="216" font-size="10.5" font-weight="700">put back (ECHO on)</text>
<text class="tm" x="306" y="235" font-size="10.5">kilo</text>
<text class="ta" x="400" y="235" font-size="10.5" font-weight="700">gone, status 0</text>
<text class="tm" x="306" y="262" font-size="9.5">the line of kilo&#x27;s that does it:</text>
<text class="ta mono" x="306" y="277" font-size="8.6" font-weight="700">if</text>
<text class="ta mono" x="321.48" y="277" font-size="8.6" font-weight="700">(editorQuit)</text>
<text class="ta mono" x="388.56" y="277" font-size="8.6" font-weight="700">exit(0);</text>
<text class="ta mono" x="306" y="290" font-size="8.6" font-weight="700">disableRawMode(STDIN_FILENO);</text>
<text class="ta mono" x="306" y="303" font-size="8.6" font-weight="700">if</text>
<text class="ta mono" x="321.48" y="303" font-size="8.6" font-weight="700">(S.L</text>
<text class="ta mono" x="347.28" y="303" font-size="8.6" font-weight="700">&amp;&amp;</text>
<text class="ta mono" x="362.76" y="303" font-size="8.6" font-weight="700">S.depth</text>
<text class="ta mono" x="404.04" y="303" font-size="8.6" font-weight="700">==</text>
<text class="ta mono" x="419.52" y="303" font-size="8.6" font-weight="700">0)</text>
<text class="ta mono" x="435" y="303" font-size="8.6" font-weight="700">lua_close(S.L);</text>
</g>
</svg>
