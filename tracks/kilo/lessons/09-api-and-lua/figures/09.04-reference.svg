<g class="step"><title>kilo.keymap.set('&lt;C-d&gt;', print) at the prompt: print is kept first, as 7, then apiSetKeymap() gives 4 back with luaL_unref. Nothing holds Ctrl-D's old function now, and 4 is free for the next luaL_ref.</title>
<rect class="s f" x="236" y="90" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="246" y="105" font-size="10.5" font-weight="700">1</text>
