<rect class="s f" x="236" y="194" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="246" y="209" font-size="10.5" font-weight="700">6</text>
<text class="t" x="264" y="209" font-size="10">Ctrl-S&#x27;s function</text>
<rect class="a af" x="456" y="90" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="466" y="105" font-size="10">[4] &lt;C-d&gt;</text>
<text class="ta mono" x="606" y="105" font-size="10.5" font-weight="700" text-anchor="end">ref 4</text>
<rect class="s f" x="456" y="116" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="131" font-size="10">[20] &lt;C-t&gt;</text>
<text class="t mono" x="606" y="131" font-size="10.5" font-weight="700" text-anchor="end">ref 5</text>
<rect class="s f" x="456" y="142" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="157" font-size="10">[19] &lt;C-s&gt;</text>
<text class="t mono" x="606" y="157" font-size="10.5" font-weight="700" text-anchor="end">ref 6</text>
<path class="a" d="M415 153 C 436 153, 432 101, 453 101" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0904a-aa)"/>
</g>
<g class="step"><title>Ctrl-D pressed: scriptCall(4) runs scriptCallIn, whose lua_rawgeti(L, LUA_REGISTRYINDEX, 4) pushes the function back onto its stack; lua_call() runs it, and the line is doubled.</title>
