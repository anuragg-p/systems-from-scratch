<rect class="a af" x="236" y="220" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="246" y="235" font-size="10.5" font-weight="700">7</text>
<text class="ta" x="264" y="235" font-size="10">print</text>
<rect class="a af" x="456" y="90" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="466" y="105" font-size="10">[4] &lt;C-d&gt;</text>
<text class="ta mono" x="606" y="105" font-size="10.5" font-weight="700" text-anchor="end">ref 7</text>
<rect class="s f" x="456" y="116" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="131" font-size="10">[20] &lt;C-t&gt;</text>
<text class="t mono" x="606" y="131" font-size="10.5" font-weight="700" text-anchor="end">ref 5</text>
<rect class="s f" x="456" y="142" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="157" font-size="10">[19] &lt;C-s&gt;</text>
<text class="t mono" x="606" y="157" font-size="10.5" font-weight="700" text-anchor="end">ref 6</text>
<text class="ta mono" x="24" y="140" font-size="10" font-weight="700">luaL_unref(L,</text>
<text class="ta mono" x="24" y="156" font-size="10" font-weight="700">LUA_REGISTRYINDEX,4)</text>
</g>
<text class="tm" x="24" y="306" font-size="10.5">Neovim keeps the same integer, a LuaRef (typedef int LuaRef;), made by luaL_ref in nlua_ref().</text>
</svg>
