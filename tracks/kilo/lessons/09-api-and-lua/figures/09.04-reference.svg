<rect class="s f" x="236" y="142" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="246" y="157" font-size="10.5" font-weight="700">4</text>
<text class="t" x="264" y="157" font-size="10">Ctrl-D&#x27;s function</text>
<rect class="s f" x="236" y="168" width="176" height="22" rx="4" stroke-width="1.5"/>
