<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" fill="none">
<title>A Lua function kept by C: luaL_ref puts it in Lua&#x27;s registry under an integer, kilo keeps the integer in its table of keys, the key fetches the function by it, and mapping the key again gives it back</title>
<defs><marker id="f0904a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0904a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0904a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">kilo at 09.04 with this lesson&#x27;s init.lua (Ctrl-D, Ctrl-T, Ctrl-S) on demo.lua; Ctrl-D, then</text>
<text class="tm" x="24" y="35" font-size="11">kilo.keymap.set(&#x27;&lt;C-d&gt;&#x27;, print) at the prompt</text>
<text class="t" x="115" y="66" font-size="11.5" font-weight="700" text-anchor="middle">a stack</text>
<text class="t" x="324" y="66" font-size="11.5" font-weight="700" text-anchor="middle">Lua&#x27;s registry</text>
<text class="tm" x="324" y="80" font-size="9.5" text-anchor="middle">a Lua table: integer -&gt; value</text>
<text class="t" x="536" y="66" font-size="11.5" font-weight="700" text-anchor="middle">kilo&#x27;s table of keys</text>
<text class="tm" x="536" y="80" font-size="9.5" text-anchor="middle">editorKeymap[], in kilo.c</text>
<g class="step"><title>kilo.keymap.set('&lt;C-d&gt;', fn) calls set_keymap: on the dispatcher's stack, the key's name and the function, a Lua value that C has no type for.</title>
<text class="tm" x="115" y="82" font-size="9.5" text-anchor="middle">the dispatcher&#x27;s stack</text>
<rect class="s f" x="40" y="140" width="150" height="24" rx="4" stroke-width="1.5"/>
<text class="tm" x="48" y="155.5" font-size="9.5">string</text>
<text class="t mono" x="182" y="156" font-size="10.5" font-weight="600" text-anchor="end">&quot;&lt;C-d&gt;&quot;</text>
<text class="t mono" x="32" y="156" font-size="10.5" font-weight="600" text-anchor="end">1</text>
<text class="tm mono" x="198" y="156" font-size="10.5">-2</text>
<rect class="a af" x="40" y="112" width="150" height="24" rx="4" stroke-width="1.5"/>
<text class="ta" x="48" y="127.5" font-size="9.5">function</text>
<text class="ta mono" x="182" y="128" font-size="10.5" font-weight="700" text-anchor="end">fn</text>
<text class="t mono" x="32" y="128" font-size="10.5" font-weight="600" text-anchor="end">2</text>
<text class="tm mono" x="198" y="128" font-size="10.5">-1</text>
<rect class="s f" x="236" y="90" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="246" y="105" font-size="10.5" font-weight="700">1</text>
<text class="tm" x="264" y="105" font-size="10">the main thread</text>
<rect class="s f" x="236" y="116" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="246" y="131" font-size="10.5" font-weight="700">2</text>
<text class="tm" x="264" y="131" font-size="10">the globals</text>
<rect class="s f" x="456" y="90" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="105" font-size="10">[4] &lt;C-d&gt;</text>
<text class="tm" x="606" y="105" font-size="9.5" text-anchor="end">0, none</text>
<rect class="s f" x="456" y="116" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="131" font-size="10">[20] &lt;C-t&gt;</text>
<text class="tm" x="606" y="131" font-size="9.5" text-anchor="end">0, none</text>
<rect class="s f" x="456" y="142" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="157" font-size="10">[19] &lt;C-s&gt;</text>
<text class="tm" x="606" y="157" font-size="9.5" text-anchor="end">0, none</text>
</g>
<g class="step"><title>scriptTake() pushes the function again, and luaL_ref(L, LUA_REGISTRYINDEX) pops it into the registry under a free integer and returns it: 4, an int that C can keep.</title>
<text class="tm" x="115" y="82" font-size="9.5" text-anchor="middle">the dispatcher&#x27;s stack</text>
<rect class="s f" x="40" y="140" width="150" height="24" rx="4" stroke-width="1.5"/>
<text class="tm" x="48" y="155.5" font-size="9.5">string</text>
<text class="t mono" x="182" y="156" font-size="10.5" font-weight="600" text-anchor="end">&quot;&lt;C-d&gt;&quot;</text>
<text class="t mono" x="32" y="156" font-size="10.5" font-weight="600" text-anchor="end">1</text>
<text class="tm mono" x="198" y="156" font-size="10.5">-2</text>
<rect class="s f" x="40" y="112" width="150" height="24" rx="4" stroke-width="1.5"/>
<text class="tm" x="48" y="127.5" font-size="9.5">function</text>
<text class="t mono" x="182" y="128" font-size="10.5" font-weight="600" text-anchor="end">fn</text>
<text class="t mono" x="32" y="128" font-size="10.5" font-weight="600" text-anchor="end">2</text>
<text class="tm mono" x="198" y="128" font-size="10.5">-1</text>
<rect class="s f" x="236" y="90" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="246" y="105" font-size="10.5" font-weight="700">1</text>
<text class="tm" x="264" y="105" font-size="10">the main thread</text>
<rect class="s f" x="236" y="116" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="246" y="131" font-size="10.5" font-weight="700">2</text>
<text class="tm" x="264" y="131" font-size="10">the globals</text>
<rect class="a af" x="236" y="142" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="246" y="157" font-size="10.5" font-weight="700">4</text>
<text class="ta" x="264" y="157" font-size="10">Ctrl-D&#x27;s function</text>
<rect class="s f" x="456" y="90" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="105" font-size="10">[4] &lt;C-d&gt;</text>
<text class="tm" x="606" y="105" font-size="9.5" text-anchor="end">0, none</text>
<rect class="s f" x="456" y="116" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="131" font-size="10">[20] &lt;C-t&gt;</text>
<text class="tm" x="606" y="131" font-size="9.5" text-anchor="end">0, none</text>
<rect class="s f" x="456" y="142" width="160" height="22" rx="4" stroke-width="1.5"/>
<text class="t mono" x="466" y="157" font-size="10">[19] &lt;C-s&gt;</text>
<text class="tm" x="606" y="157" font-size="9.5" text-anchor="end">0, none</text>
<path class="a" d="M218 124 C 240 124, 206 153, 233 153" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0904a-aa)"/>
<text class="ta mono" x="232" y="183" font-size="10.5" font-weight="700" text-anchor="end">luaL_ref: 4</text>
</g>
<g class="step"><title>apiSetKeymap() stores 4 in Ctrl-D's slot, 4, since Ctrl-D is byte 4. The init file's next two mappings do the same: Ctrl-T's function is 5, in slot 20, and Ctrl-S's is 6, in slot 19.</title>
<rect class="s f" x="236" y="90" width="176" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="246" y="105" font-size="10.5" font-weight="700">1</text>
