<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" fill="none">
<title>The same init.lua with an error, run two ways: through lua_pcall(), as kilo is built, the error comes back as a message and the file opens; through lua_call(), Lua panics, kilo aborts, and the terminal is left raw</title>
<defs><marker id="f0901b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">kilo at 09.01 on notes.txt, a terminal 8 x 80, and an init.lua with a typo in its second line</text>
<rect class="s fs" x="24" y="34" width="240" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="52" font-size="10.5">local</text>
<text class="t mono" x="71.8" y="52" font-size="10.5">name</text>
<text class="t mono" x="103.3" y="52" font-size="10.5">=</text>
<text class="t mono" x="115.9" y="52" font-size="10.5">&#x27;kilo&#x27;</text>
<text class="t mono" x="34" y="69" font-size="10.5">print(&#x27;hello</text>
<text class="t mono" x="115.9" y="69" font-size="10.5">&#x27;</text>
<text class="t mono" x="128.5" y="69" font-size="10.5">..</text>
<text class="t mono" x="147.4" y="69" font-size="10.5">nme)</text>
<text class="tm" x="272" y="60" font-size="10.5">init.lua</text>
<text class="t mono" x="24" y="104" font-size="12" font-weight="700">lua_pcall(L,1,0,0)</text>
<text class="tm" x="24" y="120" font-size="10.5">as kilo is built</text>
<text class="t" x="180" y="104" font-size="10.5">It gives back 2, LUA_ERRRUN, with the message on the stack; scriptReport()</text>
<text class="t" x="180" y="118" font-size="10.5">puts its first line in the message line and pops it. The file is open and</text>
<text class="t" x="180" y="132" font-size="10.5">kilo goes on.</text>
<rect class="s fs" x="24" y="148" width="462" height="112" rx="6" stroke-width="1.5"/>
<text class="t mono" x="31" y="161.36" font-size="9.33">hello</text>
<text class="t mono" x="64.6" y="161.36" font-size="9.33">world</text>
<text class="t mono" x="31" y="174.36" font-size="9.33">second</text>
<text class="t mono" x="70.2" y="174.36" font-size="9.33">line</text>
<text class="t mono" x="31" y="187.36" font-size="9.33">~</text>
<text class="t mono" x="31" y="200.36" font-size="9.33">~</text>
<text class="t mono" x="31" y="213.36" font-size="9.33">~</text>
<text class="t mono" x="31" y="226.36" font-size="9.33">~</text>
<rect class="t" x="30" y="231" width="450" height="11" rx="1.5"/>
<text class="f mono" x="31" y="239.36" font-size="9.33">notes.txt</text>
<text class="f mono" x="87" y="239.36" font-size="9.33">-</text>
<text class="f mono" x="98.2" y="239.36" font-size="9.33">2</text>
<text class="f mono" x="109.4" y="239.36" font-size="9.33">lines</text>
<text class="f mono" x="462.2" y="239.36" font-size="9.33">1/2</text>
<text class="t mono" x="31" y="252.36" font-size="9.33">init.lua:2:</text>
<text class="t mono" x="98.2" y="252.36" font-size="9.33">attempt</text>
<text class="t mono" x="143" y="252.36" font-size="9.33">to</text>
<text class="t mono" x="159.8" y="252.36" font-size="9.33">concatenate</text>
<text class="t mono" x="227" y="252.36" font-size="9.33">a</text>
<text class="t mono" x="238.2" y="252.36" font-size="9.33">nil</text>
<text class="t mono" x="260.6" y="252.36" font-size="9.33">value</text>
<text class="t mono" x="294.2" y="252.36" font-size="9.33">(global</text>
<text class="t mono" x="339" y="252.36" font-size="9.33">&#x27;nme&#x27;)</text>
<rect class="a" x="30.5" y="153.5" width="6.6" height="10" rx="1" stroke-width="1.5"/>
<line class="m" x1="24" y1="272" x2="616" y2="272" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="ta mono" x="24" y="292" font-size="12" font-weight="700">lua_call(L,1,0)</text>
<text class="tm" x="24" y="308" font-size="10.5">the same error, unprotected</text>
<rect class="s fs" x="180" y="278" width="436" height="42" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="188" y="294" font-size="9.6">PANIC:</text>
<text class="ta mono" x="228.32" y="294" font-size="9.6">unprotected</text>
<text class="ta mono" x="297.44" y="294" font-size="9.6">error</text>
<text class="ta mono" x="332" y="294" font-size="9.6">in</text>
<text class="ta mono" x="349.28" y="294" font-size="9.6">call</text>
<text class="ta mono" x="378.08" y="294" font-size="9.6">to</text>
<text class="ta mono" x="395.36" y="294" font-size="9.6">Lua</text>
<text class="ta mono" x="418.4" y="294" font-size="9.6">API</text>
<text class="ta mono" x="441.44" y="294" font-size="9.6">(init.lua:2:</text>
<text class="ta mono" x="516.32" y="294" font-size="9.6">attempt</text>
<text class="ta mono" x="562.4" y="294" font-size="9.6">to</text>
<text class="t mono" x="188" y="309" font-size="9.6">concatenate</text>
<text class="t mono" x="257.12" y="309" font-size="9.6">a</text>
<text class="t mono" x="268.64" y="309" font-size="9.6">nil</text>
<text class="t mono" x="291.68" y="309" font-size="9.6">value</text>
<text class="t mono" x="326.24" y="309" font-size="9.6">(global</text>
<text class="t mono" x="372.32" y="309" font-size="9.6">&#x27;nme&#x27;))</text>
<text class="t" x="180" y="340" font-size="10.5">Lua&#x27;s panic function wrote this line, then abort() ended kilo before its</text>
<text class="t" x="180" y="354" font-size="10.5">first screen: exit status 134, signal 6, SIGABRT. No file was shown.</text>
<text class="tm" x="180" y="380" font-size="10.5">stty -a after it:</text>
<text class="ta mono" x="272" y="380" font-size="9.6" font-weight="600">-icanon</text>
<text class="ta mono" x="318.08" y="380" font-size="9.6" font-weight="600">-isig</text>
<text class="ta mono" x="352.64" y="380" font-size="9.6" font-weight="600">-echo</text>
<text class="ta mono" x="387.2" y="380" font-size="9.6" font-weight="600">-icrnl</text>
<text class="ta mono" x="427.52" y="380" font-size="9.6" font-weight="600">-ixon</text>
<text class="ta mono" x="462.08" y="380" font-size="9.6" font-weight="600">-opost</text>
<text class="t" x="180" y="398" font-size="10.5">raw mode is still on: nothing ran disableRawMode().</text>
</svg>
