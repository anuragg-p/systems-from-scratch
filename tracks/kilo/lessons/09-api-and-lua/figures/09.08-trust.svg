<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 439" fill="none">
<title>Where extension code runs in Neovim, VS Code and Zed, what stops a loop that never ends, and what it may reach, as their sources and docs say</title>
<defs><marker id="f09-08c-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f09-08c-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f09-08c-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">from each project&#x27;s source and documentation, at the versions named; not run here</text>
<text class="t" x="24" y="52" font-size="13" font-weight="700">Neovim</text>
<text class="tm" x="79.17" y="52" font-size="9.5">v0.12.6</text>
<text class="t" x="230" y="52" font-size="13" font-weight="700">VS Code</text>
<text class="tm" x="293.04" y="52" font-size="9.5">vscode-docs</text>
<text class="t" x="436" y="52" font-size="13" font-weight="700">Zed</text>
<text class="tm" x="467.59" y="52" font-size="9.5">v0.233.10</text>
<rect class="s fs" x="24" y="62" width="180" height="70" rx="6" stroke-width="1.5"/>
<text class="t" x="32" y="77" font-size="10" font-weight="600">nvim: one process</text>
<rect class="s f" x="34" y="86" width="72" height="36" rx="4" stroke-width="1.5"/>
<text class="t" x="70" y="108" font-size="9.5" text-anchor="middle">the editor</text>
<rect class="a af" x="116" y="86" width="78" height="36" rx="4" stroke-width="1.5"/>
<text class="ta" x="155" y="102" font-size="9.5" font-weight="700" text-anchor="middle">Lua: one</text>
<text class="ta mono" x="155" y="114" font-size="9.5" font-weight="700" text-anchor="middle">lua_State</text>
<rect class="s fs" x="230" y="62" width="76" height="70" rx="6" stroke-width="1.5"/>
<text class="t" x="268" y="92" font-size="9.5" font-weight="600" text-anchor="middle">VS Code:</text>
<text class="t" x="268" y="105" font-size="9.5" text-anchor="middle">the window</text>
<rect class="a af" x="330" y="62" width="80" height="70" rx="6" stroke-width="1.5"/>
<text class="ta" x="370" y="86" font-size="9.5" font-weight="700" text-anchor="middle">Extension</text>
<text class="ta" x="370" y="99" font-size="9.5" font-weight="700" text-anchor="middle">Host: a</text>
<text class="ta" x="370" y="112" font-size="9.5" font-weight="700" text-anchor="middle">process</text>
<line class="m" x1="308" y1="97" x2="328" y2="97" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="s fs" x="436" y="62" width="120" height="70" rx="6" stroke-width="1.5"/>
<text class="t" x="444" y="77" font-size="10" font-weight="600">Zed: one process</text>
<rect class="s f" x="446" y="84" width="100" height="40" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="452" y="96" font-size="9">wasmtime</text>
<rect class="a af" x="454" y="100" width="84" height="18" rx="3" stroke-width="1.5"/>
<text class="ta mono" x="496" y="113" font-size="8.5" font-weight="700" text-anchor="middle">extension.wasm</text>
<path class="s" d="M568 84 l0 -6 l14 0 l4 5 l26 0 l0 30 l-44 0 z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="590" y="124" font-size="9" text-anchor="middle">its work dir</text>
<line class="a" x1="538" y1="109" x2="566" y2="102" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f09-08c-aa)"/>
<text class="tm" x="24" y="156" font-size="9.5" font-weight="600">where it runs</text>
<text class="t" x="24" y="171" font-size="10">In Nvim&#x27;s process: nlua_init()</text>
<text class="t" x="24" y="184" font-size="10">makes one lua_State (executor.c).</text>
<text class="tm" x="230" y="156" font-size="9.5" font-weight="600">where it runs</text>
<text class="t" x="230" y="171" font-size="10">&quot;in an Extension Host process&quot;,</text>
<text class="t" x="230" y="184" font-size="10">with no direct access to the DOM;</text>
<text class="t" x="230" y="197" font-size="10">local, remote, or web.</text>
<text class="tm" x="436" y="156" font-size="9.5" font-weight="600">where it runs</text>
<text class="t" x="436" y="171" font-size="10">Rust compiled to WebAssembly, run</text>
<text class="t" x="436" y="184" font-size="10">by wasmtime inside Zed&#x27;s process</text>
<text class="t" x="436" y="197" font-size="10">(wasm_host.rs).</text>
<text class="tm" x="24" y="222" font-size="9.5" font-weight="600">a loop that never ends</text>
<text class="t" x="24" y="237" font-size="10">No count hook: its Lua glue calls</text>
<text class="t" x="24" y="250" font-size="10">no lua_sethook. Issue #6800,</text>
<text class="t" x="24" y="263" font-size="10">open: &quot;if you write an endless</text>
<text class="t" x="24" y="276" font-size="10">loop inside :lua then it can&#x27;t be</text>
<text class="t" x="24" y="289" font-size="10">interrupted&quot;.</text>
<text class="tm" x="230" y="222" font-size="9.5" font-weight="600">a loop that never ends</text>
<text class="t" x="230" y="237" font-size="10">Run there &quot;To ensure that</text>
<text class="t" x="230" y="250" font-size="10">extensions cannot interfere with</text>
<text class="t" x="230" y="263" font-size="10">the stability and performance of</text>
<text class="t" x="230" y="276" font-size="10">VS Code&quot;.</text>
<text class="tm" x="436" y="222" font-size="9.5" font-weight="600">a loop that never ends</text>
<text class="t" x="436" y="237" font-size="10">Not in what was read.</text>
<text class="tm" x="24" y="314" font-size="9.5" font-weight="600">what it may reach</text>
<text class="t" x="24" y="329" font-size="10">luaL_openlibs(): Lua&#x27;s libraries,</text>
<text class="t" x="24" y="342" font-size="10">io and os among them.</text>
<text class="tm" x="230" y="314" font-size="9.5" font-weight="600">what it may reach</text>
<text class="t" x="230" y="329" font-size="10">&quot;the same permissions as&quot; VS</text>
<text class="t" x="230" y="342" font-size="10">Code: &quot;read and write files ...,</text>
<text class="t" x="230" y="355" font-size="10">make network requests, run</text>
<text class="t" x="230" y="368" font-size="10">external processes&quot;.</text>
<text class="tm" x="436" y="314" font-size="9.5" font-weight="600">what it may reach</text>
<text class="t" x="436" y="329" font-size="10">Files: its own work dir only</text>
<text class="t" x="436" y="342" font-size="10">(preopened_dir). Operations go by</text>
<text class="t" x="436" y="355" font-size="10">capabilities: process:exec,</text>
<text class="t" x="436" y="368" font-size="10">download_file, npm:install.</text>
<line class="m" x1="24" y1="389" x2="616" y2="389" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="24" y="405" font-size="10.5">kilo (this module): in the editor&#x27;s process, as Neovim, with a script trusted as the user; two guards of its</text>
<text class="t" x="24" y="419" font-size="10.5">own: the count hook (Redis sets the same kind) and the 64 MB allocator.</text>
</svg>
