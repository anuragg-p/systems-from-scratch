<circle class="s f" cx="510" cy="112" r="4.5" stroke-width="1.5"/>
<text class="ta mono" x="510" y="146" font-size="13" font-weight="700" text-anchor="middle">5</text>
<text class="ta" x="510" y="162" font-size="10" font-weight="700" text-anchor="middle">+2</text>
<text class="tm" x="510" y="176" font-size="8.5" text-anchor="middle">editorInsertRow, and the cut</text>
<line class="a" x1="510" y1="184" x2="510" y2="191" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="466" y="192" width="88" height="22" rx="11" stroke-width="1.5"/>
<text class="ta" x="510" y="207" font-size="10" font-weight="700" text-anchor="middle">TextChanged</text>
<text class="t mono" x="460" y="236" font-size="9">ah</text>
<text class="t mono" x="460" y="249" font-size="9">ello</text>
<text class="t mono" x="487" y="249" font-size="9">world</text>
<text class="tm mono" x="460" y="266" font-size="9">5</text>
<text class="tm mono" x="470.8" y="266" font-size="9">words</text>
<text class="tm" x="24" y="236" font-size="9">rows 0, 1</text>
<text class="tm" x="24" y="266" font-size="9">message</text>
<text class="tm" x="24" y="294" font-size="10.5">TextChanged is fired by editorAfterKey(), at the top of main()&#x27;s loop after the key&#x27;s work: once per key,</text>
<text class="tm" x="24" y="308" font-size="10.5">whatever the tick went up by.</text>
</svg>
