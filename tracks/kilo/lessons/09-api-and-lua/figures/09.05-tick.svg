<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" fill="none">
<title>Keys on a time line and the changed tick under them: a letter +1, an arrow +0, Enter in the middle of a row +2; TextChanged fires after each key that moved it, and only there</title>
<defs><marker id="f0905b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0905b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0905b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">kilo at 09.05 with this lesson&#x27;s init.lua, on notes.txt: a, Right, then Enter</text>
<line class="m" x1="24" y1="112" x2="616" y2="112" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="24" y="76" font-size="9.5">keys</text>
<text class="tm" x="24" y="146" font-size="9.5">tick</text>
<text class="t mono" x="70" y="146" font-size="13" font-weight="700" text-anchor="middle">2</text>
<text class="tm" x="70" y="162" font-size="8.5" text-anchor="middle">the file read:</text>
<text class="tm" x="70" y="174" font-size="8.5" text-anchor="middle">two rows put in</text>
<rect class="s f" x="116" y="60" width="68" height="24" rx="5" stroke-width="1.5"/>
<text class="t" x="150" y="76" font-size="11" font-weight="700" text-anchor="middle">a</text>
<circle class="s f" cx="150" cy="112" r="4.5" stroke-width="1.5"/>
<text class="ta mono" x="150" y="146" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text class="ta" x="150" y="162" font-size="10" font-weight="700" text-anchor="middle">+1</text>
<text class="tm" x="150" y="176" font-size="8.5" text-anchor="middle">editorRowInsertChar</text>
<line class="a" x1="150" y1="184" x2="150" y2="191" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="106" y="192" width="88" height="22" rx="11" stroke-width="1.5"/>
<text class="ta" x="150" y="207" font-size="10" font-weight="700" text-anchor="middle">TextChanged</text>
<text class="t mono" x="100" y="236" font-size="9">ahello</text>
<text class="t mono" x="137.8" y="236" font-size="9">world</text>
<text class="t mono" x="100" y="249" font-size="9">second</text>
<text class="t mono" x="137.8" y="249" font-size="9">line</text>
<text class="tm mono" x="100" y="266" font-size="9">4</text>
<text class="tm mono" x="110.8" y="266" font-size="9">words</text>
<rect class="s f" x="296" y="60" width="68" height="24" rx="5" stroke-width="1.5"/>
<text class="t" x="330" y="76" font-size="11" font-weight="700" text-anchor="middle">Right</text>
<circle class="s f" cx="330" cy="112" r="4.5" stroke-width="1.5"/>
<text class="t mono" x="330" y="146" font-size="13" font-weight="700" text-anchor="middle">3</text>
<text class="tm" x="330" y="162" font-size="10" text-anchor="middle">+0</text>
<text class="tm" x="330" y="176" font-size="8.5" text-anchor="middle">nothing changes</text>
<text class="t mono" x="280" y="236" font-size="9">ahello</text>
<text class="t mono" x="317.8" y="236" font-size="9">world</text>
<text class="t mono" x="280" y="249" font-size="9">second</text>
<text class="t mono" x="317.8" y="249" font-size="9">line</text>
<text class="tm mono" x="280" y="266" font-size="9">4</text>
<text class="tm mono" x="290.8" y="266" font-size="9">words</text>
<rect class="s f" x="476" y="60" width="68" height="24" rx="5" stroke-width="1.5"/>
