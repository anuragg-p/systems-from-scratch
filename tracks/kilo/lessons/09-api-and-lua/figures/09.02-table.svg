<text class="t mono" x="24" y="191" font-size="9.6" font-weight="600">line_count</text>
<text class="t mono" x="304" y="191" font-size="9.6">integer</text>
<text class="tm" x="372" y="191" font-size="9.5">the number of rows in the file</text>
