<text class="t mono" x="158.56" y="281" font-size="9.6">string</text>
<text class="tm mono" x="304" y="281" font-size="9.6">(none)</text>
<text class="tm" x="372" y="281" font-size="9.5">show text in the message line</text>
<text class="tm" x="24" y="306" font-size="10.5">By 09.09 the same table has 25 entries, and --api-info prints 25 lines.</text>
