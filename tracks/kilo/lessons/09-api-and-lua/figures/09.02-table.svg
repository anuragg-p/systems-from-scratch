<text class="t mono" x="24" y="227" font-size="9.6" font-weight="600">get_cursor</text>
<text class="t mono" x="304" y="227" font-size="9.6">position</text>
<text class="tm" x="372" y="227" font-size="9.5">the cursor&#x27;s {row, col}, col a byte of the row</text>
<text class="t mono" x="24" y="245" font-size="9.6" font-weight="600">get_name</text>
<text class="t mono" x="304" y="245" font-size="9.6">string</text>
<text class="tm" x="372" y="245" font-size="9.5">the file&#x27;s name</text>
