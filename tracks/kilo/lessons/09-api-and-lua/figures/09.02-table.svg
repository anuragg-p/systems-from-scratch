<text class="ta" x="62.8" y="120" font-size="9.5" font-weight="600">what it does, for --api-info</text>
<text class="tm" x="24" y="152" font-size="11">kilo --api-info at 09.02: the table printed, a line per entry, no Lua started</text>
<text class="tm" x="24" y="172" font-size="9.5">name</text>
<text class="tm" x="124" y="172" font-size="9.5">arguments</text>
<text class="tm" x="304" y="172" font-size="9.5">returns</text>
