<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Four keys, the bytes each sends, and the one key code editorReadKey() makes of them</title>
<defs><marker id="k01-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="k01-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="24" font-size="11">key</text>
<text class="tm" x="112" y="24" font-size="11">the bytes read() returns, in raw mode</text>
<text class="t mono" x="400" y="24" font-size="12" font-weight="600" text-anchor="middle">editorReadKey()</text>
<text class="tm" x="504" y="24" font-size="11">key code</text>
<rect class="s fs" x="330" y="38" width="140" height="230" rx="10" stroke-width="1.5"/>
<rect class="s f" x="24" y="52" width="72" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="60" y="74.5" font-size="12.5" font-weight="600" text-anchor="middle">a</text>
<rect class="s f" x="112" y="52" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="t mono" x="132" y="71" font-size="12.5" font-weight="600" text-anchor="middle">97</text>
<text class="tm mono" x="132" y="83" font-size="9.5" text-anchor="middle">&#x27;a&#x27;</text>
<line class="s" x1="156" y1="70" x2="328" y2="70" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-ah)"/>
<text class="tm mono" x="400" y="74" font-size="11" text-anchor="middle">a byte</text>
<line class="s" x1="472" y1="70" x2="500" y2="70" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-ah)"/>
<text class="t mono" x="506" y="75" font-size="15" font-weight="700">97</text>
<text class="tm mono" x="532" y="74" font-size="10">&#x27;a&#x27;</text>
<rect class="s f" x="24" y="106" width="72" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="60" y="128.5" font-size="12.5" font-weight="600" text-anchor="middle">Up</text>
<rect class="a af" x="112" y="106" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="132" y="125" font-size="12.5" font-weight="600" text-anchor="middle">27</text>
<text class="ta mono" x="132" y="137" font-size="9.5" text-anchor="middle">ESC</text>
<rect class="s f" x="158" y="106" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="t mono" x="178" y="125" font-size="12.5" font-weight="600" text-anchor="middle">91</text>
<text class="tm mono" x="178" y="137" font-size="9.5" text-anchor="middle">[</text>
<rect class="s f" x="204" y="106" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="t mono" x="224" y="125" font-size="12.5" font-weight="600" text-anchor="middle">65</text>
<text class="tm mono" x="224" y="137" font-size="9.5" text-anchor="middle">A</text>
<line class="s" x1="248" y1="124" x2="328" y2="124" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-ah)"/>
<text class="tm mono" x="400" y="128" font-size="11" text-anchor="middle">ESC [ A</text>
<line class="a" x1="472" y1="124" x2="500" y2="124" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-aa)"/>
<text class="ta mono" x="506" y="129" font-size="15" font-weight="700">1002</text>
<text class="ta mono" x="550" y="128" font-size="10">ARROW_UP</text>
<rect class="s f" x="24" y="160" width="72" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="60" y="182.5" font-size="12.5" font-weight="600" text-anchor="middle">Page Down</text>
<rect class="a af" x="112" y="160" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="132" y="179" font-size="12.5" font-weight="600" text-anchor="middle">27</text>
<text class="ta mono" x="132" y="191" font-size="9.5" text-anchor="middle">ESC</text>
<rect class="s f" x="158" y="160" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="t mono" x="178" y="179" font-size="12.5" font-weight="600" text-anchor="middle">91</text>
<text class="tm mono" x="178" y="191" font-size="9.5" text-anchor="middle">[</text>
<rect class="s f" x="204" y="160" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="t mono" x="224" y="179" font-size="12.5" font-weight="600" text-anchor="middle">54</text>
<text class="tm mono" x="224" y="191" font-size="9.5" text-anchor="middle">6</text>
<rect class="s f" x="250" y="160" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="t mono" x="270" y="179" font-size="12.5" font-weight="600" text-anchor="middle">126</text>
<text class="tm mono" x="270" y="191" font-size="9.5" text-anchor="middle">~</text>
<line class="s" x1="294" y1="178" x2="328" y2="178" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-ah)"/>
<text class="tm mono" x="400" y="182" font-size="11" text-anchor="middle">ESC [ 6 ~</text>
<line class="a" x1="472" y1="178" x2="500" y2="178" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-aa)"/>
<text class="ta mono" x="506" y="183" font-size="15" font-weight="700">1008</text>
<text class="ta mono" x="550" y="182" font-size="10">PAGE_DOWN</text>
<rect class="s f" x="24" y="214" width="72" height="36" rx="7" stroke-width="1.5"/>
<text class="t" x="60" y="236.5" font-size="12.5" font-weight="600" text-anchor="middle">Esc</text>
<rect class="a af" x="112" y="214" width="40" height="36" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="132" y="233" font-size="12.5" font-weight="600" text-anchor="middle">27</text>
<text class="ta mono" x="132" y="245" font-size="9.5" text-anchor="middle">ESC</text>
<text class="tm" x="160" y="236" font-size="11">then nothing for 0.1 s</text>
<line class="s" x1="294" y1="232" x2="328" y2="232" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-ah)"/>
<text class="tm mono" x="400" y="236" font-size="11" text-anchor="middle">ESC alone</text>
<line class="s" x1="472" y1="232" x2="500" y2="232" stroke-width="1.5" stroke-linecap="round" marker-end="url(#k01-ah)"/>
<text class="t mono" x="506" y="237" font-size="15" font-weight="700">27</text>
<text class="tm mono" x="532" y="236" font-size="10">ESC</text>
<text class="tm" x="24" y="290" font-size="11.5">A sequence editorReadKey() knows becomes one code above 1000; a lone Escape is 27, once 0.1 s has passed.</text>
</svg>
