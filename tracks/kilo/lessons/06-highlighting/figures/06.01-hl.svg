<text class="t mono" x="160" y="252" font-size="14">&lt;stdio.h&gt;</text>
<text class="t" x="24" y="292" font-size="11.5" font-weight="600">the classes, HL_*, and how editorSyntaxToColor() turns each into a colour</text>
<text class="t mono" x="48" y="314" font-size="11" text-anchor="middle">0</text>
<text class="t mono" x="72" y="314" font-size="11">HL_NORMAL</text>
<text class="t" x="290" y="314" font-size="10.5">the terminal&#x27;s default colour</text>
<text class="ta" x="616" y="314" font-size="10.5" font-weight="600" text-anchor="end">here</text>
<text class="t mono" x="48" y="333" font-size="11" text-anchor="middle">1</text>
<text class="t mono" x="72" y="333" font-size="11">HL_NONPRINT</text>
<text class="t" x="290" y="333" font-size="10.5">reverse video, a letter or ?</text>
<text class="ta" x="616" y="333" font-size="10.5" font-weight="600" text-anchor="end">here</text>
<text class="tm mono" x="48" y="352" font-size="11" text-anchor="middle">6</text>
<text class="tm mono" x="72" y="352" font-size="11">HL_STRING</text>
<text class="mono" x="290" y="352" font-size="11"><tspan fill="#c43fb0">magenta</tspan></text>
<text class="tm mono" x="342.2" y="352" font-size="10.5">ESC [35m</text>
<text class="tm" x="616" y="352" font-size="10.5" text-anchor="end">comes with 06.02</text>
<text class="tm mono" x="48" y="371" font-size="11" text-anchor="middle">7</text>
<text class="tm mono" x="72" y="371" font-size="11">HL_NUMBER</text>
<text class="mono" x="290" y="371" font-size="11"><tspan fill="#e03e3e">red</tspan></text>
<text class="tm mono" x="315.8" y="371" font-size="10.5">ESC [31m</text>
<text class="tm" x="616" y="371" font-size="10.5" text-anchor="end">comes with 06.02</text>
<text class="tm mono" x="48" y="390" font-size="11" text-anchor="middle">2, 3</text>
<text class="tm mono" x="72" y="390" font-size="11">HL_COMMENT, HL_MLCOMMENT</text>
<text class="mono" x="290" y="390" font-size="11"><tspan fill="#13899a">cyan</tspan></text>
<text class="tm mono" x="322.4" y="390" font-size="10.5">ESC [36m</text>
<text class="tm" x="616" y="390" font-size="10.5" text-anchor="end">comes with 06.03</text>
<text class="tm mono" x="48" y="409" font-size="11" text-anchor="middle">4</text>
<text class="tm mono" x="72" y="409" font-size="11">HL_KEYWORD1</text>
<text class="mono" x="290" y="409" font-size="11"><tspan fill="#9a7400">yellow</tspan></text>
