<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" fill="none">
<title>Three places in rows 7 and 8 where a word may start, and how each is tried against the keyword list</title>
<defs><marker id="f0604b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0604b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0604b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">at a word start (prev_sep is 1) each word of C_HL_keywords is tried in turn; the first that fits wins</text>
<text class="tm" x="24" y="56" font-size="10.5">row 7, column 8:</text>
<rect class="a af" x="40" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="41.5" y="80" font-size="11"><tspan fill="#2f8a3c">c</tspan></text>
<rect class="a af" x="53" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="54.5" y="80" font-size="11"><tspan fill="#2f8a3c">h</tspan></text>
<rect class="a af" x="66" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="67.5" y="80" font-size="11"><tspan fill="#2f8a3c">a</tspan></text>
<rect class="a af" x="79" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="80.5" y="80" font-size="11"><tspan fill="#2f8a3c">r</tspan></text>
<rect class="s f" x="92" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<rect class="m f" x="105" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="106.5" y="80" font-size="11">o</text>
<rect class="m f" x="118" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="119.5" y="80" font-size="11">r</text>
<rect class="m f" x="131" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="132.5" y="80" font-size="11">d</text>
<rect class="m f" x="144" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="145.5" y="80" font-size="11">e</text>
<rect class="m f" x="157" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="158.5" y="80" font-size="11">r</text>
<rect class="m f" x="170" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="171.5" y="80" font-size="11">[</text>
<rect class="m f" x="183" y="66" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="184.5" y="80" font-size="11"><tspan fill="#e03e3e">1</tspan></text>
<text class="tm" x="97.5" y="100" font-size="9.5" text-anchor="middle">next</text>
<text class="t mono" x="223" y="80" font-size="11" font-weight="600">tried: &quot;char|&quot;</text>
<text class="tm" x="223" y="98" font-size="10.5">&quot;char|&quot;: the | marks a type. c h a r match, and the space</text>
<text class="tm" x="223" y="112" font-size="10.5">after them is a separator</text>
<text class="mono" x="40" y="120" font-size="11"><tspan fill="#2f8a3c">-&gt; HL_KEYWORD2, green</tspan></text>
<text class="tm" x="24" y="144" font-size="10.5">row 7, column 13:</text>
<rect class="a af" x="40" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="41.5" y="168" font-size="11">o</text>
<rect class="a af" x="53" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="54.5" y="168" font-size="11">r</text>
<rect class="s f" x="66" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="67.5" y="168" font-size="11">d</text>
<rect class="m f" x="79" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="80.5" y="168" font-size="11">e</text>
<rect class="m f" x="92" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="93.5" y="168" font-size="11">r</text>
<rect class="m f" x="105" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="106.5" y="168" font-size="11">[</text>
<rect class="m f" x="118" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="119.5" y="168" font-size="11"><tspan fill="#e03e3e">1</tspan></text>
<rect class="m f" x="131" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="132.5" y="168" font-size="11"><tspan fill="#e03e3e">0</tspan></text>
<rect class="m f" x="144" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="145.5" y="168" font-size="11">]</text>
<rect class="m f" x="157" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<rect class="m f" x="170" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="171.5" y="168" font-size="11">=</text>
<rect class="m f" x="183" y="154" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="tm" x="71.5" y="188" font-size="9.5" text-anchor="middle">next</text>
<text class="t mono" x="223" y="168" font-size="11" font-weight="600">tried: &quot;or&quot;</text>
<text class="tm" x="223" y="186" font-size="10.5">&quot;or&quot; (a C++ keyword) matches o r, but d comes next: no</text>
<text class="tm" x="223" y="200" font-size="10.5">separator, so no keyword. Nothing else in the list fits</text>
<text class="t" x="40" y="208" font-size="10.5">-&gt; normal; and d e r are inside a word now, so no keyword can start there</text>
<text class="tm" x="24" y="232" font-size="10.5">row 8, column 8:</text>
<rect class="a af" x="40" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="41.5" y="256" font-size="11"><tspan fill="#9a7400">f</tspan></text>
<rect class="a af" x="53" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="54.5" y="256" font-size="11"><tspan fill="#9a7400">o</tspan></text>
<rect class="a af" x="66" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="67.5" y="256" font-size="11"><tspan fill="#9a7400">r</tspan></text>
<rect class="s f" x="79" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<rect class="m f" x="92" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="93.5" y="256" font-size="11">(</text>
<rect class="m f" x="105" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="106.5" y="256" font-size="11"><tspan fill="#2f8a3c">i</tspan></text>
<rect class="m f" x="118" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="119.5" y="256" font-size="11"><tspan fill="#2f8a3c">n</tspan></text>
<rect class="m f" x="131" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="mono" x="132.5" y="256" font-size="11"><tspan fill="#2f8a3c">t</tspan></text>
<rect class="m f" x="144" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<rect class="m f" x="157" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="158.5" y="256" font-size="11">i</text>
<rect class="m f" x="170" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<rect class="m f" x="183" y="242" width="11" height="20" rx="2" stroke-width="1.5"/>
<text class="t mono" x="184.5" y="256" font-size="11">=</text>
<text class="tm" x="84.5" y="276" font-size="9.5" text-anchor="middle">next</text>
<text class="t mono" x="223" y="256" font-size="11" font-weight="600">tried: &quot;for&quot;</text>
<text class="tm" x="223" y="274" font-size="10.5">&quot;for&quot;: f o r match, and the space after them is a</text>
<text class="tm" x="223" y="288" font-size="10.5">separator</text>
<text class="mono" x="40" y="296" font-size="11"><tspan fill="#9a7400">-&gt; HL_KEYWORD1, yellow</tspan></text>
</svg>
