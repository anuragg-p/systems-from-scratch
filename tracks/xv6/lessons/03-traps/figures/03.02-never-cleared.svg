<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" fill="none">
<title>A timer interrupt that is never cleared</title>
<defs><marker id="f0302b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0302b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0302b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="22" font-size="11">without the write to stimecmp</text>
<text class="tm" x="86" y="67" font-size="10.5" text-anchor="end">pending</text>
<path class="a" d="M96 70 L140 70 L140 50 L616 50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta" x="146" y="42" font-size="11">time &gt;= stimecmp, and stays true</text>
<text class="tm" x="86" y="113" font-size="10.5" text-anchor="end">the hart</text>
<rect class="s f" x="140" y="96" width="42.4" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="161.2" y="113" font-size="11" text-anchor="middle">trap</text>
<rect class="s f" x="192.4" y="96" width="88.6" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="236.7" y="113" font-size="11" text-anchor="middle">clockintr()</text>
<rect class="s fs" x="291" y="96" width="42.4" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="312.2" y="113" font-size="11" text-anchor="middle">sret</text>
<rect class="s f" x="343.4" y="96" width="42.4" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="364.6" y="113" font-size="11" text-anchor="middle">trap</text>
<rect class="s f" x="395.8" y="96" width="88.6" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="440.1" y="113" font-size="11" text-anchor="middle">clockintr()</text>
<rect class="s fs" x="494.4" y="96" width="42.4" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="515.6" y="113" font-size="11" text-anchor="middle">sret</text>
<rect class="s f" x="546.8" y="96" width="42.4" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="568" y="113" font-size="11" text-anchor="middle">trap</text>
<text class="tm" x="601.2" y="113" font-size="12">...</text>
<text class="tm" x="140" y="150" font-size="11">sret turns interrupts back on, the interrupt is still pending,</text>
<text class="tm" x="140" y="166" font-size="11">and the hart traps again before the interrupted code runs.</text>
</svg>
