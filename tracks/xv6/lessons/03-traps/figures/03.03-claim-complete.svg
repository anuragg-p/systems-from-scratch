<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" fill="none">
<title>Claim and complete</title>
<defs><marker id="f0303a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s f" x="18" y="12" width="124" height="36" rx="8" stroke-width="1.5"/>
<text class="t" x="80" y="28" font-size="12" font-weight="600" text-anchor="middle">UART</text>
<text class="tm mono" x="80" y="42" font-size="10" text-anchor="middle">irq 10</text>
<line class="m" x1="80" y1="48" x2="80" y2="324" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="s f" x="258" y="12" width="124" height="36" rx="8" stroke-width="1.5"/>
<text class="t" x="320" y="28" font-size="12" font-weight="600" text-anchor="middle">PLIC</text>
<text class="tm mono" x="320" y="42" font-size="10" text-anchor="middle">0x0c000000</text>
<line class="m" x1="320" y1="48" x2="320" y2="324" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="s f" x="478" y="12" width="124" height="36" rx="8" stroke-width="1.5"/>
<text class="t" x="540" y="28" font-size="12" font-weight="600" text-anchor="middle">hart 0</text>
<text class="tm mono" x="540" y="42" font-size="10" text-anchor="middle">devintr()</text>
<line class="m" x1="540" y1="48" x2="540" y2="324" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="s" x1="80" y1="76" x2="314" y2="76" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0303a-ah)"/>
<text class="t" x="200" y="70" font-size="11" text-anchor="middle">a byte arrives: line 10 raised</text>
<line class="s" x1="320" y1="116" x2="534" y2="116" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0303a-ah)"/>
<text class="t" x="430" y="110" font-size="11" text-anchor="middle">external interrupt</text>
<text class="tm mono" x="430" y="131" font-size="10" text-anchor="middle">scause 0x8000000000000009</text>
<rect class="a af" x="314" y="160" width="12" height="140" rx="3" stroke-width="1.5"/>
<text class="ta" x="308" y="236" font-size="11" font-weight="600" text-anchor="end">line 10</text>
<text class="ta" x="308" y="251" font-size="11" text-anchor="end">in service</text>
<line class="s" x1="540" y1="164" x2="328" y2="164" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0303a-ah)"/>
<text class="t" x="430" y="158" font-size="11" text-anchor="middle">plic_claim(): 32-bit load</text>
<text class="tm mono" x="430" y="179" font-size="10" text-anchor="middle">PLIC_SCLAIM(0) = 0x0c201004</text>
<line class="s" x1="328" y1="210" x2="534" y2="210" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0303a-ah)" stroke-dasharray="4 4"/>
<text class="t" x="430" y="204" font-size="11" text-anchor="middle">returns 10</text>
<rect class="s fs" x="470" y="224" width="140" height="46" rx="6" stroke-width="1.5"/>
<text class="t mono" x="540" y="243" font-size="11" text-anchor="middle">uartintr()</text>
<text class="t mono" x="540" y="260" font-size="11" text-anchor="middle">consoleintr(c)</text>
<line class="s" x1="540" y1="296" x2="328" y2="296" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0303a-ah)"/>
<text class="t" x="430" y="290" font-size="11" text-anchor="middle">plic_complete(10): store 10</text>
<text class="tm" x="430" y="311" font-size="10" text-anchor="middle">to the same address</text>
<text class="tm" x="308" y="322" font-size="10.5" text-anchor="end">line 10 can be delivered again</text>
</svg>
