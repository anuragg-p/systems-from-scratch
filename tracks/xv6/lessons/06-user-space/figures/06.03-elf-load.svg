<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" fill="none">
<title>The two LOAD program headers of _echo become the first two pages of the new address space</title>
<defs><marker id="f0603a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0603a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0603a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="18" font-size="10.5">build/user/_echo at 07.01, the file (not to scale)</text>
<rect class="s f" x="24" y="26" width="72" height="36" rx="0" stroke-width="1.5"/>
<text class="t" x="60" y="48" font-size="11" text-anchor="middle">ELF header</text>
<rect class="a af" x="96" y="26" width="84" height="36" rx="0" stroke-width="1.5"/>
<text class="ta" x="138" y="48" font-size="11" font-weight="600" text-anchor="middle">phdrs: 2 LOAD</text>
<rect class="m fs" x="180" y="26" width="36" height="36" rx="0" stroke-width="1.5"/>
<rect class="s f" x="216" y="26" width="132" height="36" rx="0" stroke-width="1.5"/>
<text class="t" x="282" y="41" font-size="11" text-anchor="middle">.text .rodata</text>
<text class="tm mono" x="282" y="55" font-size="10" text-anchor="middle">0x909 bytes</text>
<rect class="m fs" x="348" y="26" width="36" height="36" rx="0" stroke-width="1.5"/>
<rect class="m fs" x="384" y="26" width="232" height="36" rx="0" stroke-width="1.5"/>
<text class="tm" x="500" y="48" font-size="11" text-anchor="middle">symbols, section headers</text>
<line class="a" x1="384" y1="22" x2="384" y2="66" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="24" y="76" font-size="10">0x0</text>
<text class="tm mono" x="96" y="76" font-size="10" text-anchor="middle">0x40</text>
<text class="tm mono" x="216" y="76" font-size="10" text-anchor="middle">0x1000</text>
<text class="tm mono" x="348" y="76" font-size="10" text-anchor="middle">0x1909</text>
<text class="tm mono" x="388" y="76" font-size="10">0x2000</text>
<text class="tm mono" x="616" y="76" font-size="10" text-anchor="end">0x87c8</text>
<text class="tm" x="616" y="146" font-size="10.5" text-anchor="end">the new user address space</text>
<rect class="s f" x="24" y="154" width="110" height="60" rx="0" stroke-width="1.5"/>
<text class="t" x="79" y="176" font-size="11.5" font-weight="600" text-anchor="middle">text, rodata</text>
<text class="tm mono" x="79" y="194" font-size="10.5" text-anchor="middle">R X U</text>
<rect class="s f" x="134" y="154" width="110" height="60" rx="0" stroke-width="1.5"/>
<text class="t" x="189" y="176" font-size="11.5" font-weight="600" text-anchor="middle">data, bss</text>
<text class="tm mono" x="189" y="194" font-size="10.5" text-anchor="middle">R W U</text>
<rect class="s fs" x="244" y="154" width="110" height="60" rx="0" stroke-width="1.5"/>
<text class="tm" x="299" y="176" font-size="11.5" font-weight="600" text-anchor="middle">guard page</text>
<text class="tm mono" x="299" y="194" font-size="10.5" text-anchor="middle">R W, no U</text>
<rect class="s f" x="354" y="154" width="110" height="60" rx="0" stroke-width="1.5"/>
<text class="t" x="409" y="176" font-size="11.5" font-weight="600" text-anchor="middle">stack</text>
<text class="tm mono" x="409" y="194" font-size="10.5" text-anchor="middle">R W U</text>
<text class="tm" x="189" y="208" font-size="10" text-anchor="middle">0x20 bytes, zeroed</text>
<text class="tm" x="409" y="208" font-size="10" text-anchor="middle">argv, then sp</text>
<rect class="m" x="464" y="154" width="152" height="60" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="540" y="188" font-size="11" text-anchor="middle">unmapped</text>
<text class="tm mono" x="24" y="228" font-size="10">0x0</text>
<text class="tm mono" x="134" y="228" font-size="10" text-anchor="middle">0x1000</text>
<text class="tm mono" x="244" y="228" font-size="10" text-anchor="middle">0x2000</text>
<text class="tm mono" x="354" y="228" font-size="10" text-anchor="middle">0x3000</text>
<text class="tm mono" x="464" y="228" font-size="10" text-anchor="middle">0x4000</text>
<text class="tm" x="464" y="242" font-size="10" text-anchor="middle">p-&gt;sz; sp starts here</text>
<line class="a" x1="282" y1="82" x2="79" y2="150" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-aa)"/>
<line class="a" x1="384" y1="82" x2="189" y2="150" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603a-aa)"/>
<text class="ta mono" x="180" y="106" font-size="10" text-anchor="end">LOAD: 0x909 bytes, R E</text>
<text class="ta mono" x="302" y="130" font-size="10">LOAD: filesz 0, memsz 0x20, RW</text>
</svg>
