<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" fill="none">
<title>Two names for one inode: link and unlink move nlink, and the inode goes when it reaches 0</title>
<defs><marker id="f0607b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0607b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0607b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="22" font-size="11.5" font-weight="600">echo hello &gt; a</text>
<text class="tm" x="24" y="44" font-size="10">entries in /</text>
<rect class="s f" x="24" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="t mono" x="34" y="69" font-size="11.5">a</text>
<text class="tm mono" x="84" y="69" font-size="11" text-anchor="end">16</text>
<line class="s" x1="59" y1="78" x2="76" y2="126" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0607b-ah)"/>
<rect class="m f" x="94" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="129" y="69" font-size="10" text-anchor="middle">inum 0</text>
<rect class="s f" x="24" y="128" width="140" height="70" rx="6" stroke-width="1.5"/>
<text class="t mono" x="36" y="148" font-size="11.5" font-weight="600">inode 16</text>
<text class="ta mono" x="36" y="168" font-size="12" font-weight="600">nlink 1</text>
<text class="tm" x="36" y="186" font-size="10.5">data: hello</text>
<text class="tm" x="24" y="220" font-size="10.5">create(): nlink = 1</text>
<text class="t mono" x="174" y="22" font-size="11.5" font-weight="600">ln a b</text>
<text class="tm" x="174" y="44" font-size="10">entries in /</text>
<rect class="s f" x="174" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="t mono" x="184" y="69" font-size="11.5">a</text>
<text class="tm mono" x="234" y="69" font-size="11" text-anchor="end">16</text>
<line class="s" x1="209" y1="78" x2="226" y2="126" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0607b-ah)"/>
<rect class="s f" x="244" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="t mono" x="254" y="69" font-size="11.5">b</text>
<text class="tm mono" x="304" y="69" font-size="11" text-anchor="end">16</text>
<line class="s" x1="279" y1="78" x2="262" y2="126" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0607b-ah)"/>
<rect class="s f" x="174" y="128" width="140" height="70" rx="6" stroke-width="1.5"/>
<text class="t mono" x="186" y="148" font-size="11.5" font-weight="600">inode 16</text>
<text class="ta mono" x="186" y="168" font-size="12" font-weight="600">nlink 2</text>
<text class="tm" x="186" y="186" font-size="10.5">data: hello</text>
<text class="tm" x="174" y="220" font-size="10.5">sys_link(): nlink++</text>
<text class="t mono" x="324" y="22" font-size="11.5" font-weight="600">rm a</text>
<text class="tm" x="324" y="44" font-size="10">entries in /</text>
<rect class="m f" x="324" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="359" y="69" font-size="10" text-anchor="middle">inum 0</text>
<rect class="s f" x="394" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="t mono" x="404" y="69" font-size="11.5">b</text>
<text class="tm mono" x="454" y="69" font-size="11" text-anchor="end">16</text>
<line class="s" x1="429" y1="78" x2="412" y2="126" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0607b-ah)"/>
<rect class="s f" x="324" y="128" width="140" height="70" rx="6" stroke-width="1.5"/>
<text class="t mono" x="336" y="148" font-size="11.5" font-weight="600">inode 16</text>
<text class="ta mono" x="336" y="168" font-size="12" font-weight="600">nlink 1</text>
<text class="tm" x="336" y="186" font-size="10.5">data: hello</text>
<text class="tm" x="324" y="220" font-size="10.5">sys_unlink(): zero the</text>
<text class="tm" x="324" y="234" font-size="10.5">entry, nlink--</text>
<text class="t mono" x="474" y="22" font-size="11.5" font-weight="600">rm b</text>
<text class="tm" x="474" y="44" font-size="10">entries in /</text>
<rect class="m f" x="474" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="509" y="69" font-size="10" text-anchor="middle">inum 0</text>
<rect class="m f" x="544" y="52" width="70" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="579" y="69" font-size="10" text-anchor="middle">inum 0</text>
<rect class="m fs" x="474" y="128" width="140" height="70" rx="6" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="486" y="148" font-size="11.5" font-weight="600">inode 16</text>
<text class="ta mono" x="486" y="168" font-size="12" font-weight="600">nlink 0</text>
<text class="tm" x="486" y="186" font-size="10.5">freed</text>
<text class="tm" x="474" y="220" font-size="10.5">nlink 0 and not open:</text>
<text class="tm" x="474" y="234" font-size="10.5">iput frees inode, blocks</text>
</svg>
