<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>B exits: it stays a zombie until its parent waits, and its own child goes to init</title>
<defs><marker id="f0604b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0604b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0604b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="18" font-size="10.5">B&#x27;s slot in proc[]</text>
<rect class="s f" x="24" y="34" width="86" height="28" rx="14" stroke-width="1.5"/>
<text class="t mono" x="67" y="52" font-size="11.5" font-weight="600" text-anchor="middle">RUNNING</text>
<rect class="a af" x="262" y="34" width="116" height="28" rx="14" stroke-width="1.5"/>
<text class="ta mono" x="320" y="52" font-size="11.5" font-weight="600" text-anchor="middle">ZOMBIE</text>
<rect class="m f" x="530" y="34" width="86" height="28" rx="14" stroke-width="1.5"/>
<text class="tm mono" x="573" y="52" font-size="11.5" font-weight="600" text-anchor="middle">UNUSED</text>
<line class="s" x1="110" y1="48" x2="260" y2="48" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0604b-ah)"/>
<text class="t mono" x="185" y="40" font-size="11" text-anchor="middle">exit(3)</text>
<line class="s" x1="378" y1="48" x2="528" y2="48" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0604b-ah)"/>
<text class="t" x="453" y="40" font-size="11" text-anchor="middle">A calls wait()</text>
<text class="tm" x="185" y="82" font-size="10.5" text-anchor="middle">closes every open file</text>
<text class="tm" x="185" y="96" font-size="10.5" text-anchor="middle">iput(cwd)</text>
<text class="tm" x="185" y="110" font-size="10.5" text-anchor="middle">C&#x27;s parent = init</text>
<text class="tm" x="185" y="124" font-size="10.5" text-anchor="middle">wakeup(A)</text>
<text class="tm" x="185" y="138" font-size="10.5" text-anchor="middle">xstate = 3, sched()</text>
<text class="ta" x="320" y="82" font-size="10.5" text-anchor="middle">still holds its pid,</text>
<text class="ta" x="320" y="96" font-size="10.5" text-anchor="middle">xstate = 3, memory,</text>
<text class="ta" x="320" y="110" font-size="10.5" text-anchor="middle">trapframe, page table</text>
<text class="tm" x="453" y="82" font-size="10.5" text-anchor="middle">finds B in ZOMBIE</text>
<text class="tm" x="453" y="96" font-size="10.5" text-anchor="middle">copies 3 out to A</text>
<text class="tm" x="453" y="110" font-size="10.5" text-anchor="middle">freeproc(B)</text>
<text class="tm" x="453" y="124" font-size="10.5" text-anchor="middle">returns B&#x27;s pid</text>
<text class="tm" x="24" y="176" font-size="10.5">parent pointers when B exits</text>
<rect class="s f" x="24" y="188" width="112" height="40" rx="8" stroke-width="1.5"/>
<text class="t mono" x="36" y="205" font-size="12" font-weight="600">init</text>
<text class="tm" x="36" y="220" font-size="10.5">pid 1</text>
<rect class="s f" x="172" y="188" width="112" height="40" rx="8" stroke-width="1.5"/>
<text class="t" x="184" y="205" font-size="12" font-weight="600">A</text>
<text class="tm" x="184" y="220" font-size="10.5">will wait for B</text>
<rect class="a af" x="320" y="188" width="112" height="40" rx="8" stroke-width="1.5"/>
<text class="ta" x="332" y="205" font-size="12" font-weight="600">B</text>
<text class="ta" x="332" y="220" font-size="10.5">ZOMBIE</text>
<rect class="s f" x="468" y="188" width="112" height="40" rx="8" stroke-width="1.5"/>
<text class="t" x="480" y="205" font-size="12" font-weight="600">C</text>
<text class="tm" x="480" y="220" font-size="10.5">still running</text>
<line class="s" x1="172" y1="208" x2="138" y2="208" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0604b-ah)"/>
<line class="s" x1="320" y1="208" x2="286" y2="208" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0604b-ah)"/>
<line class="m" x1="468" y1="208" x2="434" y2="208" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm" x="451" y="202" font-size="10" text-anchor="middle">was</text>
<path class="s" d="M524 228 C 524 286, 80 286, 80 230" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0604b-ah)"/>
<text class="t mono" x="302" y="258" font-size="10.5" text-anchor="middle">reparent: C-&gt;parent = initproc</text>
<text class="tm" x="616" y="176" font-size="10.5" text-anchor="end">each arrow points at the parent</text>
</svg>
