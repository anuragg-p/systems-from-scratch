<text class="tm mono" x="36" y="158" font-size="10.5">p-&gt;trapframe</text>
<text class="t mono" x="36" y="180" font-size="11.5">epc</text>
<text class="t mono" x="146" y="180" font-size="11.5" text-anchor="end">0x90</text>
<text class="t mono" x="36" y="198" font-size="11.5">a0</text>
<text class="t mono" x="146" y="198" font-size="11.5" text-anchor="end">4</text>
<text class="t mono" x="36" y="216" font-size="11.5">a1</text>
<text class="t mono" x="146" y="216" font-size="11.5" text-anchor="end">0x3F90</text>
<text class="ta mono" x="36" y="234" font-size="11.5">sp</text>
<text class="ta mono" x="146" y="234" font-size="11.5" text-anchor="end">0x3F90</text>
<line class="a" x1="156" y1="234" x2="186" y2="234" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0603b-aa)"/>
<text class="tm" x="24" y="262" font-size="10.5">a0 = argc, a1 = argv; main(argc, argv) runs on this stack</text>
</svg>
