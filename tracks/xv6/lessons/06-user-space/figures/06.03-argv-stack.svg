<text class="tm mono" x="232" y="111" font-size="10.5" text-anchor="end">0x3FC0</text>
<rect class="m fs" x="244" y="118" width="160" height="12" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect class="s f" x="244" y="130" width="160" height="20" rx="0" stroke-width="1.5"/>
<text class="t mono" x="254" y="144" font-size="11.5">0</text>
<text class="tm mono" x="396" y="144" font-size="10" text-anchor="end">argv[4]</text>
<text class="tm mono" x="232" y="144" font-size="10.5" text-anchor="end">0x3FB0</text>
<rect class="s f" x="244" y="150" width="160" height="20" rx="0" stroke-width="1.5"/>
<text class="t mono" x="254" y="164" font-size="11.5">0x3FC0</text>
