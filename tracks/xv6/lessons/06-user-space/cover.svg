<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>A process&#x27;s address space next to the kernel&#x27;s, sharing the trampoline</title>
<defs><marker id="m06-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m06-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="210" y="16" font-size="12" font-weight="600" text-anchor="middle">a process (user page table)</text>
<text class="t" x="510" y="16" font-size="12" font-weight="600" text-anchor="middle">the kernel (kernel page table)</text>
<rect class="a af" x="120" y="26" width="180" height="24" stroke-width="1.5"/>
<text class="ta mono" x="210" y="42.0" font-size="11.5" text-anchor="middle">trampoline</text>
<rect class="s fs" x="120" y="50" width="180" height="24" stroke-width="1.5"/>
<text class="t mono" x="210" y="66.0" font-size="11.5" text-anchor="middle">trapframe</text>
<rect class="m" x="120" y="74" width="180" height="84" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="210" y="120.0" font-size="11" text-anchor="middle">unused</text>
<rect class="s f" x="120" y="158" width="180" height="30" stroke-width="1.5"/>
<text class="t" x="210" y="177.0" font-size="11.5" text-anchor="middle">heap (sbrk grows it)</text>
<rect class="s f" x="120" y="188" width="180" height="26" stroke-width="1.5"/>
<text class="t" x="210" y="205.0" font-size="11.5" text-anchor="middle">stack</text>
<rect class="m fs" x="120" y="214" width="180" height="14" stroke-width="1.5"/>
<text class="tm" x="210" y="225.0" font-size="10" text-anchor="middle">guard page</text>
<rect class="s f" x="120" y="228" width="180" height="24" stroke-width="1.5"/>
<text class="t" x="210" y="244.0" font-size="11.5" text-anchor="middle">data, bss</text>
<rect class="s f" x="120" y="252" width="180" height="24" stroke-width="1.5"/>
<text class="t" x="210" y="268.0" font-size="11.5" text-anchor="middle">text (code)</text>
<path class="s" d="M286 182 L286 166 M281 171 L286 166 L291 171" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm mono" x="112" y="40" font-size="10.5" text-anchor="end">MAXVA</text>
<text class="tm mono" x="112" y="280" font-size="10.5" text-anchor="end">0</text>
<text class="tm mono" x="112" y="244" font-size="10" text-anchor="end">PTE_U</text>
<rect class="a af" x="420" y="26" width="180" height="24" stroke-width="1.5"/>
<text class="ta mono" x="510" y="42.0" font-size="11.5" text-anchor="middle">trampoline</text>
<rect class="s fs" x="420" y="50" width="180" height="44" stroke-width="1.5"/>
<text class="t" x="510" y="76.0" font-size="11.5" text-anchor="middle">kernel stacks, guard pages</text>
<rect class="m" x="420" y="94" width="180" height="46" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="510" y="121.0" font-size="11" text-anchor="middle">unused</text>
<rect class="s f" x="420" y="140" width="180" height="84" stroke-width="1.5"/>
<text class="t" x="510" y="186.0" font-size="11.5" text-anchor="middle">RAM, direct mapped</text>
<rect class="s f" x="420" y="224" width="180" height="52" stroke-width="1.5"/>
<text class="t" x="510" y="254.0" font-size="11.5" text-anchor="middle">devices: PLIC, uart, virtio</text>
<text class="tm mono" x="510" y="200" font-size="10" text-anchor="middle">KERNBASE .. PHYSTOP</text>
<line class="a" x1="300" y1="38" x2="418" y2="38" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="ta" x="359" y="58" font-size="10.5" font-weight="600" text-anchor="middle">same address</text>
<text class="ta" x="359" y="72" font-size="10.5" text-anchor="middle">in both</text>
