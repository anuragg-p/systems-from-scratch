<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>From source code to a running virt machine</title>
<defs><marker id="m00-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m00-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s f" x="24" y="60" width="150" height="50" rx="10" stroke-width="1.5"/>
<text class="t mono" x="40" y="82" font-size="13">kernel/*.c</text>
<text class="tm mono" x="40" y="100" font-size="11">kernel/*.S</text>
<line class="s" x1="174" y1="85" x2="294" y2="85" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m00-ah)"/>
<text class="tm mono" x="234" y="76" font-size="11" text-anchor="middle">gcc + ld</text>
<text class="tm mono" x="234" y="102" font-size="11" text-anchor="middle">kernel.ld</text>
<rect class="a af" x="296" y="60" width="150" height="50" rx="10" stroke-width="1.5"/>
<text class="t mono" x="312" y="82" font-size="13">kernel (ELF)</text>
<text class="ta mono" x="312" y="100" font-size="11">_entry 0x80000000</text>
<rect class="s f" x="24" y="190" width="150" height="50" rx="10" stroke-width="1.5"/>
<text class="t mono" x="40" y="212" font-size="13">user/*.c</text>
<text class="tm mono" x="40" y="230" font-size="11">+ README</text>
<line class="s" x1="174" y1="215" x2="294" y2="215" stroke-width="1.5" stroke-linecap="round" marker-end="url(#m00-ah)"/>
<text class="tm mono" x="234" y="206" font-size="11" text-anchor="middle">gcc, mkfs</text>
<rect class="s f" x="296" y="190" width="150" height="50" rx="10" stroke-width="1.5"/>
<text class="t mono" x="312" y="212" font-size="13">fs.img</text>
<text class="tm mono" x="312" y="230" font-size="11">2000 blocks x 1 KB</text>
<rect class="s fs" x="486" y="32" width="130" height="236" rx="14" stroke-width="1.5"/>
<text class="t" x="500" y="56" font-size="13" font-weight="700">qemu virt</text>
<text class="tm" x="500" y="73" font-size="11">riscv64, 3 harts</text>
<rect class="a af" x="500" y="90" width="102" height="44" rx="8" stroke-width="1.5"/>
<text class="t" x="512" y="109" font-size="12" font-weight="600">RAM</text>
<text class="ta mono" x="512" y="125" font-size="10.5">0x80000000</text>
<rect class="s f" x="500" y="150" width="102" height="44" rx="8" stroke-width="1.5"/>
<text class="t" x="512" y="169" font-size="12" font-weight="600">virtio disk</text>
<text class="tm mono" x="512" y="185" font-size="10.5">0x10001000</text>
<rect class="s f" x="500" y="210" width="102" height="44" rx="8" stroke-width="1.5"/>
<text class="t" x="512" y="229" font-size="12" font-weight="600">uart0</text>
<text class="tm mono" x="512" y="245" font-size="10.5">0x10000000</text>
<path class="a" d="M446 85 C 472 85, 474 112, 498 112" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m00-aa)"/>
<path class="s" d="M446 215 C 474 215, 472 172, 498 172" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m00-ah)"/>
<text class="tm" x="24" y="288" font-size="11">loaded at the address the boot ROM jumps to</text>
