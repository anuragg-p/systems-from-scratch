<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" fill="none">
<title>What -mcmodel=medlow and medany can reach</title>
<defs><marker id="f0001b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0001b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="af" x="408" y="24" width="12" height="144"/>
<line class="a" x1="408" y1="24" x2="408" y2="168" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="40" y="46" font-size="12" font-weight="600">-mcmodel=medlow</text>
<text class="tm" x="170" y="46" font-size="11">absolute: lui + addi</text>
<rect class="m fs" x="40" y="56" width="368" height="22" rx="4" stroke-width="1.5"/>
<text class="tm" x="224.0" y="71" font-size="11" text-anchor="middle">reachable: -2 GB to +2 GB</text>
<text class="ta" x="428" y="64" font-size="11.5" font-weight="600">the kernel starts here,</text>
<text class="ta" x="428" y="80" font-size="11.5">just out of medlow&#x27;s reach</text>
<text class="t mono" x="40" y="108" font-size="12" font-weight="600">-mcmodel=medany</text>
<text class="tm" x="170" y="108" font-size="11">pc-relative: auipc + addi</text>
<rect class="s f" x="224" y="118" width="368" height="22" rx="4" stroke-width="1.5"/>
<text class="t" x="316.0" y="133" font-size="11" text-anchor="middle">pc - 2 GB</text>
<text class="t" x="506.0" y="133" font-size="11" text-anchor="middle">pc + 2 GB</text>
<line class="m" x1="28" y1="168" x2="616" y2="168" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="40" y1="163" x2="40" y2="173" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="40" y="188" font-size="11" text-anchor="middle">-2 GB</text>
<line class="s" x1="224" y1="163" x2="224" y2="173" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="224" y="188" font-size="11" text-anchor="middle">0</text>
<line class="s" x1="408" y1="163" x2="408" y2="173" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="408" y="188" font-size="11" text-anchor="middle">+2 GB</text>
<line class="s" x1="592" y1="163" x2="592" y2="173" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="592" y="188" font-size="11" text-anchor="middle">+4 GB</text>
<text class="ta mono" x="408" y="204" font-size="11" text-anchor="middle">0x80000000</text>
</svg>
