<path class="a" d="M316 181 C 340 181, 340 134, 358 132" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0102a-aa)"/>
<line class="a" x1="428" y1="125" x2="470" y2="125" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0102a-aa)"/>
