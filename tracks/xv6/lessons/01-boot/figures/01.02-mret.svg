<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" fill="none">
<title>mret takes the mode from mstatus.MPP and the pc from mepc</title>
<defs><marker id="f0102a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0102a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="fs" x="12" y="12" width="436" height="202" rx="12"/>
<rect class="af" x="456" y="12" width="172" height="202" rx="12"/>
<text class="tm" x="28" y="34" font-size="11">machine mode, in start()</text>
<text class="ta" x="472" y="34" font-size="11" font-weight="600">supervisor mode</text>
<text class="t mono" x="28" y="86" font-size="12.5" font-weight="600">mstatus</text>
