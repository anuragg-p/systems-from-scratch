<text class="t mono" x="210" y="126" font-size="11.5" font-weight="600" text-anchor="middle">MPP = 01: S</text>
<text class="tm mono" x="210" y="142" font-size="10.5" text-anchor="middle">11 = M, 01 = S, 00 = U</text>
<text class="t mono" x="28" y="186" font-size="12.5" font-weight="600">mepc</text>
<rect class="s f" x="104" y="166" width="212" height="30" rx="0" stroke-width="1.5"/>
<text class="t mono" x="116" y="186" font-size="12">main = 0x80000020</text>
<rect class="a f" x="360" y="110" width="68" height="30" rx="15" stroke-width="1.5"/>
<text class="ta mono" x="394" y="130" font-size="13" font-weight="700" text-anchor="middle">mret</text>
