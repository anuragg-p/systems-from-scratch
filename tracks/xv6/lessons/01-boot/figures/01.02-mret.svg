<text class="tm mono" x="139.0" y="60" font-size="10" text-anchor="middle">63 .. 13</text>
<text class="tm mono" x="139.0" y="86" font-size="13" text-anchor="middle">...</text>
<rect class="s f" x="174" y="66" width="36" height="30" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="192.0" y="60" font-size="10" text-anchor="middle">12</text>
<text class="t mono" x="192.0" y="86" font-size="13" font-weight="600" text-anchor="middle">0</text>
<rect class="s f" x="210" y="66" width="36" height="30" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="228.0" y="60" font-size="10" text-anchor="middle">11</text>
<text class="t mono" x="228.0" y="86" font-size="13" font-weight="600" text-anchor="middle">1</text>
