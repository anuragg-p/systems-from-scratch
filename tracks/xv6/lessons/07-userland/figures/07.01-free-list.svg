<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" fill="none">
<title>malloc(100) on a fresh heap: the 4096-unit block from morecore is split, and the caller gets the tail</title>
<defs><marker id="f0701a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0701a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0701a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="616" y="18" font-size="10" text-anchor="end">1 unit = sizeof(Header) = 16 bytes; not to scale</text>
<text class="tm" x="24" y="34" font-size="10.5">after morecore: sbrk(65536) gave one free block, and the list is base -&gt; block -&gt; base</text>
<rect class="s fs" x="24" y="44" width="76" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="36" y="61" font-size="11.5" font-weight="600">base</text>
<text class="tm mono" x="36" y="76" font-size="10">size 0</text>
<rect class="s fs" x="150" y="44" width="56" height="40" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="178" y="61" font-size="10" text-anchor="middle">size</text>
<text class="t mono" x="178" y="76" font-size="11" text-anchor="middle">4096</text>
<rect class="s f" x="206" y="44" width="410" height="40" rx="0" stroke-width="1.5"/>
<text class="tm" x="411" y="69" font-size="11" text-anchor="middle">4095 free units: 65520 bytes</text>
<line class="s" x1="100" y1="58" x2="148" y2="58" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0701a-ah)"/>
<path class="s" d="M178 84 C 178 108, 62 108, 62 86" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0701a-ah)"/>
<text class="tm mono" x="124" y="52" font-size="10" text-anchor="middle">ptr</text>
<text class="tm mono" x="120" y="110" font-size="10" text-anchor="middle">ptr</text>
<text class="tm" x="24" y="146" font-size="10.5">after malloc(100): (100 + 15) / 16 + 1 = 8 units, cut off the tail</text>
<rect class="s fs" x="24" y="156" width="76" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="36" y="173" font-size="11.5" font-weight="600">base</text>
<text class="tm mono" x="36" y="188" font-size="10">size 0</text>
<rect class="s fs" x="150" y="156" width="56" height="40" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="178" y="173" font-size="10" text-anchor="middle">size</text>
<text class="t mono" x="178" y="188" font-size="11" text-anchor="middle">4088</text>
<rect class="s f" x="206" y="156" width="224" height="40" rx="0" stroke-width="1.5"/>
<text class="tm" x="318" y="181" font-size="11" text-anchor="middle">free</text>
<rect class="a af" x="430" y="156" width="56" height="40" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="458" y="173" font-size="10" text-anchor="middle">size</text>
<text class="ta mono" x="458" y="188" font-size="11" font-weight="600" text-anchor="middle">8</text>
<rect class="a af" x="486" y="156" width="130" height="40" rx="0" stroke-width="1.5"/>
<text class="ta" x="551" y="181" font-size="11" font-weight="600" text-anchor="middle">112 bytes for you</text>
<line class="s" x1="100" y1="170" x2="148" y2="170" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0701a-ah)"/>
<path class="s" d="M178 196 C 178 220, 62 220, 62 198" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0701a-ah)"/>
<text class="tm mono" x="124" y="164" font-size="10" text-anchor="middle">ptr</text>
<text class="tm mono" x="120" y="222" font-size="10" text-anchor="middle">ptr</text>
<text class="tm" x="206" y="212" font-size="10">bytes from the start of the block:</text>
<text class="tm mono" x="430" y="212" font-size="10" text-anchor="middle">0xff80</text>
<text class="tm mono" x="616" y="212" font-size="10" text-anchor="end">0x10000</text>
<line class="a" x1="486" y1="240" x2="486" y2="200" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0701a-aa)"/>
<text class="ta" x="478" y="240" font-size="10.5" text-anchor="end">malloc returns the byte after the header</text>
</svg>
