<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" fill="none">
<title>One command, echo hi: the shell forks, the child becomes echo, and the shell waits</title>
<defs><marker id="f0702a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0702a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0702a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="30" font-size="10.5">the shell</text>
<rect class="s f" x="24" y="40" width="112" height="24" rx="0" stroke-width="1.5"/>
<text class="t mono" x="80" y="56" font-size="10.5" text-anchor="middle">getcmd(buf)</text>
<rect class="m fs" x="136" y="40" width="404" height="24" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="338" y="56" font-size="10.5" text-anchor="middle">wait(0): asleep</text>
<rect class="s f" x="540" y="40" width="76" height="24" rx="0" stroke-width="1.5"/>
<text class="t" x="578" y="56" font-size="10.5" text-anchor="middle">next prompt</text>
<circle class="s f" cx="136" cy="52" r="4" stroke-width="1.5"/>
<text class="tm" x="160" y="140" font-size="10.5">its child, one pid throughout</text>
<rect class="s fs" x="160" y="150" width="220" height="24" rx="0" stroke-width="1.5"/>
<text class="t" x="270" y="166" font-size="10.5" text-anchor="middle">a copy of the shell</text>
<rect class="a af" x="380" y="150" width="160" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="460" y="166" font-size="11.5" font-weight="600" text-anchor="middle">echo</text>
<path class="s" d="M136 64 C 136 110, 140 162, 158 162" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0702a-ah)"/>
<text class="t mono" x="128" y="112" font-size="10.5" text-anchor="end">fork1()</text>
<line class="s" x1="540" y1="150" x2="540" y2="66" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0702a-ah)"/>
<text class="t mono" x="532" y="108" font-size="10.5" text-anchor="end">exit(0)</text>
<text class="tm" x="532" y="122" font-size="10.5" text-anchor="end">wait returns its pid</text>
<line class="m" x1="212" y1="174" x2="212" y2="182" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="212" y="194" font-size="10.5" text-anchor="middle">parsecmd(buf)</text>
<line class="m" x1="300" y1="174" x2="300" y2="198" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="300" y="210" font-size="10.5" text-anchor="middle">runcmd(): EXEC</text>
<line class="a" x1="380" y1="174" x2="380" y2="182" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="380" y="194" font-size="10.5" font-weight="600" text-anchor="middle">exec(&quot;echo&quot;, argv)</text>
<line class="m" x1="470" y1="174" x2="470" y2="198" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="470" y="210" font-size="10.5" text-anchor="middle">write(1, &quot;hi&quot;, 2)</text>
</svg>
