<text class="tm mono" x="24" y="132" font-size="11">parsecmd()</text>
<text class="tm mono" x="24" y="246" font-size="11">runcmd()</text>
<rect class="s f" x="110" y="226" width="76" height="32" rx="8" stroke-width="1.5"/>
<text class="t mono" x="148.0" y="247" font-size="12.5" font-weight="600" text-anchor="middle">cat</text>
