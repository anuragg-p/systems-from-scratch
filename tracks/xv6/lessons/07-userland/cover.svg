<text class="t mono" x="405.0" y="176" font-size="11" text-anchor="middle">EXEC grep cat</text>
<rect class="s f" x="480" y="160" width="84" height="24" rx="12" stroke-width="1.5"/>
<text class="t mono" x="522.0" y="176" font-size="11" text-anchor="middle">EXEC wc</text>
<line class="m" x1="320" y1="96" x2="190" y2="116" stroke-width="1.5" stroke-linecap="round"/>
