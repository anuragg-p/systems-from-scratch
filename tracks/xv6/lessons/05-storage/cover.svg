<rect class="s f" x="354" y="32" width="262" height="44" stroke-width="1.5"/>
<text class="t" x="485.0" y="58" font-size="12" font-weight="600" text-anchor="middle">data</text>
<text class="tm mono" x="485.0" y="92" font-size="10.5" text-anchor="middle">47-1999</text>
<text class="tm" x="24" y="122" font-size="11">the layers</text>
<rect class="s f" x="24" y="130" width="250" height="18" rx="5" stroke-width="1.5"/>
<text class="t" x="36" y="143" font-size="11.5">file descriptors</text>
<rect class="s f" x="24" y="153" width="250" height="18" rx="5" stroke-width="1.5"/>
<text class="t" x="36" y="166" font-size="11.5">path names</text>
<rect class="s f" x="24" y="176" width="250" height="18" rx="5" stroke-width="1.5"/>
<text class="t" x="36" y="189" font-size="11.5">directories</text>
