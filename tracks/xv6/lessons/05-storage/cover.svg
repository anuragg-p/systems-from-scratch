<text class="tm mono" x="84.0" y="92" font-size="10.5" text-anchor="middle">1</text>
<rect class="a af" x="104" y="32" width="120" height="44" stroke-width="1.5"/>
<text class="ta" x="164.0" y="58" font-size="12" font-weight="600" text-anchor="middle">log</text>
<text class="tm mono" x="164.0" y="92" font-size="10.5" text-anchor="middle">2-32</text>
<rect class="s f" x="224" y="32" width="90" height="44" stroke-width="1.5"/>
<text class="t" x="269.0" y="58" font-size="12" font-weight="600" text-anchor="middle">inodes</text>
<text class="tm mono" x="269.0" y="92" font-size="10.5" text-anchor="middle">33-45</text>
<rect class="s f" x="314" y="32" width="40" height="44" stroke-width="1.5"/>
