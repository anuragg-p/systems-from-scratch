<text class="tm" x="506" y="197" font-size="10.5">file blocks 12-35</text>
<path class="m" d="M456 166 C 476 166, 476 184, 494 184" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0505a-am)"/>
<path class="m" d="M456 217 C 476 217, 476 184, 494 184" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0505a-am)"/>
<text class="tm" x="496" y="230" font-size="10.5">via the indirect block:</text>
<text class="tm" x="496" y="245" font-size="10.5">one more disk read</text>
<text class="tm" x="24" y="268" font-size="10.5">36176 bytes is 36 blocks: 12 direct,</text>
<text class="tm" x="24" y="283" font-size="10.5">24 through the indirect block</text>
<text class="t mono" x="24" y="304" font-size="10.5">bmap(ip, bn): bn &lt; 12 is addrs[bn]; bn 12 to 267 is entry bn - 12 of the indirect block</text>
