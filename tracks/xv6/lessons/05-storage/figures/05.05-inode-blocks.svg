<text class="ta mono" x="36" y="229" font-size="10.5" font-weight="600" text-anchor="None">addrs[12]</text>
<text class="ta mono" x="208" y="229" font-size="11" font-weight="600" text-anchor="end">61</text>
<rect class="s fs" x="300" y="64" width="156" height="52" rx="8" stroke-width="1.5"/>
<text class="t mono" x="312" y="85" font-size="11" font-weight="600" text-anchor="None">blocks 49 to 60</text>
<text class="tm" x="312" y="103" font-size="10.5">file blocks 0-11</text>
<path class="m" d="M220 121.0 C 260 121.0, 260 90, 298 90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0505a-am)"/>
<path class="m" d="M220 147.0 C 260 147.0, 260 90, 298 90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0505a-am)"/>
