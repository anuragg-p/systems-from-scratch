<text class="ta" x="404" y="212" font-size="11" text-anchor="middle">the first 0: the next balloc() returns 789</text>
<text class="t mono" x="24" y="250" font-size="10.5">block b lives in bitmap block b / BPB + sb.bmapstart, byte (b % BPB) / 8, mask 1 &lt;&lt; (b % 8)</text>
