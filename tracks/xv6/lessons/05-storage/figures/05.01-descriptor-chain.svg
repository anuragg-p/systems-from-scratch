<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>One disk request: three chained descriptors</title>
<defs><marker id="f0501a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0501a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0501a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">reading block 1, the superblock: descriptors 0, 1 and 2 of disk.desc[8]</text>
<rect class="s f" x="24" y="34" width="184" height="106" rx="8" stroke-width="1.5"/>
<text class="t mono" x="36" y="54" font-size="12" font-weight="600" text-anchor="None">desc[0]</text>
<text class="tm mono" x="36" y="76" font-size="10.5" text-anchor="None">addr</text>
<text class="t mono" x="78" y="76" font-size="10.5" text-anchor="None">&amp;disk.ops[0]</text>
<text class="tm mono" x="36" y="94" font-size="10.5" text-anchor="None">len</text>
<text class="t mono" x="78" y="94" font-size="10.5" text-anchor="None">16</text>
<text class="tm mono" x="36" y="112" font-size="10.5" text-anchor="None">flags</text>
<text class="t mono" x="78" y="112" font-size="10.5" text-anchor="None">NEXT</text>
<text class="tm mono" x="36" y="130" font-size="10.5" text-anchor="None">next</text>
<text class="t mono" x="78" y="130" font-size="10.5" text-anchor="None">1</text>
<rect class="s f" x="228" y="34" width="184" height="106" rx="8" stroke-width="1.5"/>
<text class="t mono" x="240" y="54" font-size="12" font-weight="600" text-anchor="None">desc[1]</text>
<text class="tm mono" x="240" y="76" font-size="10.5" text-anchor="None">addr</text>
<text class="t mono" x="282" y="76" font-size="10.5" text-anchor="None">b-&gt;data</text>
<text class="tm mono" x="240" y="94" font-size="10.5" text-anchor="None">len</text>
<text class="t mono" x="282" y="94" font-size="10.5" text-anchor="None">1024</text>
<text class="tm mono" x="240" y="112" font-size="10.5" text-anchor="None">flags</text>
<text class="t mono" x="282" y="112" font-size="10.5" text-anchor="None">NEXT | WRITE</text>
<text class="tm mono" x="240" y="130" font-size="10.5" text-anchor="None">next</text>
<text class="t mono" x="282" y="130" font-size="10.5" text-anchor="None">2</text>
<rect class="s f" x="432" y="34" width="184" height="106" rx="8" stroke-width="1.5"/>
<text class="t mono" x="444" y="54" font-size="12" font-weight="600" text-anchor="None">desc[2]</text>
<text class="tm mono" x="444" y="76" font-size="10.5" text-anchor="None">addr</text>
<text class="t mono" x="486" y="76" font-size="10" text-anchor="None">&amp;disk.info[0].status</text>
<text class="tm mono" x="444" y="94" font-size="10.5" text-anchor="None">len</text>
<text class="t mono" x="486" y="94" font-size="10.5" text-anchor="None">1</text>
<text class="tm mono" x="444" y="112" font-size="10.5" text-anchor="None">flags</text>
<text class="t mono" x="486" y="112" font-size="10.5" text-anchor="None">WRITE</text>
<text class="tm mono" x="444" y="130" font-size="10.5" text-anchor="None">next</text>
<text class="t mono" x="486" y="130" font-size="10.5" text-anchor="None">0</text>
<line class="s" x1="208" y1="130" x2="226" y2="130" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0501a-ah)"/>
<line class="s" x1="412" y1="130" x2="430" y2="130" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0501a-ah)"/>
<line class="a" x1="116" y1="140" x2="116" y2="174" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0501a-aa)"/>
<text class="ta mono" x="124" y="162" font-size="10" text-anchor="None">addr</text>
<rect class="a af" x="24" y="176" width="184" height="92" rx="8" stroke-width="1.5"/>
<text class="ta mono" x="36" y="196" font-size="11.5" font-weight="600" text-anchor="None">struct virtio_blk_req</text>
<text class="ta mono" x="36" y="216" font-size="10.5" text-anchor="None">type     0 (IN, a read)</text>
<text class="ta mono" x="36" y="233" font-size="10.5" text-anchor="None">reserved 0</text>
<text class="ta mono" x="36" y="250" font-size="10.5" text-anchor="None">sector   2 = 1 * 2</text>
<line class="s" x1="320" y1="140" x2="320" y2="174" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0501a-ah)"/>
<text class="tm mono" x="328" y="162" font-size="10" text-anchor="None">addr</text>
<rect class="s fs" x="228" y="176" width="184" height="92" rx="8" stroke-width="1.5"/>
<text class="t mono" x="240" y="196" font-size="11.5" font-weight="600" text-anchor="None">b-&gt;data</text>
<text class="t" x="240" y="216" font-size="10.5" text-anchor="None">the 1024 bytes of</text>
<text class="t" x="240" y="233" font-size="10.5" text-anchor="None">block 1; WRITE: the</text>
<text class="t" x="240" y="250" font-size="10.5" text-anchor="None">device fills them in</text>
<line class="s" x1="524" y1="140" x2="524" y2="174" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0501a-ah)"/>
<text class="tm mono" x="532" y="162" font-size="10" text-anchor="None">addr</text>
<rect class="s fs" x="432" y="176" width="184" height="92" rx="8" stroke-width="1.5"/>
<text class="t mono" x="444" y="196" font-size="11.5" font-weight="600" text-anchor="None">info[0].status</text>
<text class="t" x="444" y="216" font-size="10.5" text-anchor="None">0xff until the</text>
<text class="t" x="444" y="233" font-size="10.5" text-anchor="None">device writes 0</text>
<text class="t" x="444" y="250" font-size="10.5" text-anchor="None">for success</text>
<text class="tm" x="24" y="290" font-size="10.5">desc[3] to desc[7] stay free, so a second request can be in flight</text>
</svg>
