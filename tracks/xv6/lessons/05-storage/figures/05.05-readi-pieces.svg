<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" fill="none">
<title>readi in block-sized pieces</title>
<defs><marker id="f0505b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0505b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0505b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="20" font-size="11">a 2500-byte file, and readi(ip, 0, dst, 900, 2000)</text>
<rect class="s f" x="40" y="70" width="184.32" height="30" rx="0" stroke-width="1.5"/>
<text class="tm" x="46" y="89" font-size="10.5">block 0</text>
<text class="tm mono" x="40" y="114" font-size="9.5" text-anchor="middle">0</text>
<rect class="s f" x="224.32" y="70" width="184.32" height="30" rx="0" stroke-width="1.5"/>
<text class="tm" x="230.32" y="89" font-size="10.5">block 1</text>
<text class="tm mono" x="224.32" y="114" font-size="9.5" text-anchor="middle">1024</text>
<rect class="s f" x="408.64" y="70" width="184.32" height="30" rx="0" stroke-width="1.5"/>
<text class="tm" x="414.64" y="89" font-size="10.5">block 2</text>
<text class="tm mono" x="408.64" y="114" font-size="9.5" text-anchor="middle">2048</text>
<text class="tm mono" x="592.96" y="114" font-size="9.5" text-anchor="middle">3072</text>
<rect class="fs" x="490.0" y="71" width="102.0" height="28"/>
<text class="tm" x="541.48" y="89" font-size="10" text-anchor="middle">past size</text>
<line class="s" x1="490" y1="62" x2="490" y2="106" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="490" y="122" font-size="10" text-anchor="middle">size 2500</text>
<path class="m" d="M202 62 L202 56 L562 56 L562 62" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm mono" x="202" y="48" font-size="10.5" text-anchor="None">asked: off 900, n 2000</text>
<text class="tm mono" x="562" y="48" font-size="9.5" text-anchor="end">2900</text>
<rect class="s fs" x="203" y="146" width="20.32" height="24" rx="4" stroke-width="1.5"/>
<text class="t mono" x="196" y="162" font-size="10.5" text-anchor="end">m = 124</text>
<line class="m" x1="202" y1="100" x2="202" y2="146" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="s fs" x="225.32" y="146" width="182.32" height="24" rx="4" stroke-width="1.5"/>
<text class="t mono" x="316.48" y="162" font-size="10.5" text-anchor="middle">m = 1024</text>
<line class="m" x1="224.32" y1="120" x2="224.32" y2="146" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="s fs" x="409.64" y="146" width="79.36" height="24" rx="4" stroke-width="1.5"/>
<text class="t mono" x="449.32" y="162" font-size="10.5" text-anchor="middle">m = 452</text>
<line class="m" x1="408.64" y1="120" x2="408.64" y2="146" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<line class="m" x1="490" y1="128" x2="490" y2="146" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="ta" x="498" y="162" font-size="10.5">n clamped to</text>
<text class="ta mono" x="498" y="177" font-size="10.5" font-weight="600" text-anchor="None">size - off = 1600</text>
<text class="tm" x="24" y="210" font-size="10.5">each pass copies m = min(n - tot, BSIZE - off % BSIZE) bytes from block off / BSIZE;</text>
<text class="tm" x="24" y="226" font-size="10.5">the first and the last piece are partial</text>
</svg>
