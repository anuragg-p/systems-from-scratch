<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" fill="none">
<title>The pixel format, and where pixel (x, y) is</title>
<defs><marker id="f0901b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="22" font-size="11" font-weight="600">the screen: 640 pixels a row, 480 rows</text>
<rect class="s f" x="40" y="40" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="66" y="40" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="92" y="40" width="26" height="26" rx="0" stroke-width="1.5"/>
