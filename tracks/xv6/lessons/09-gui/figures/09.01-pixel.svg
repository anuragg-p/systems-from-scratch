<rect class="s f" x="66" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="92" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="118" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="144" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="170" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="196" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="222" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="248" y="66" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="40" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="66" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="92" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="a fa" x="118" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="144" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="170" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="196" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="222" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="248" y="92" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="40" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="66" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="92" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="118" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="144" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="170" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="196" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="222" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="248" y="118" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="40" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="66" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="92" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="118" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="144" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="170" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="196" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="222" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<rect class="s f" x="248" y="144" width="26" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="53" y="34" font-size="9" text-anchor="middle">0</text>
<text class="tm mono" x="79" y="34" font-size="9" text-anchor="middle">1</text>
<text class="tm mono" x="105" y="34" font-size="9" text-anchor="middle">2</text>
<text class="tm mono" x="131" y="34" font-size="9" text-anchor="middle">3</text>
<text class="tm mono" x="157" y="34" font-size="9" text-anchor="middle">4</text>
<text class="tm mono" x="183" y="34" font-size="9" text-anchor="middle">5</text>
<text class="tm mono" x="209" y="34" font-size="9" text-anchor="middle">6</text>
<text class="tm mono" x="235" y="34" font-size="9" text-anchor="middle">7</text>
<text class="tm mono" x="261" y="34" font-size="9" text-anchor="middle">...</text>
<text class="tm mono" x="34" y="56" font-size="9" text-anchor="end">0</text>
<text class="tm mono" x="34" y="82" font-size="9" text-anchor="end">1</text>
<text class="tm mono" x="34" y="108" font-size="9" text-anchor="end">2</text>
<text class="tm mono" x="34" y="134" font-size="9" text-anchor="end">3</text>
<text class="tm mono" x="34" y="160" font-size="9" text-anchor="end">...</text>
<text class="ta mono" x="131" y="188" font-size="10.5" font-weight="600" text-anchor="middle">(3, 2)</text>
<text class="t" x="300" y="50" font-size="11">pixel (x, y) is the uint32 at</text>
<text class="ta mono" x="300" y="74" font-size="13" font-weight="600">fb + y * 2560 + x * 4</text>
<text class="tm" x="300" y="96" font-size="10">2560 = 640 pixels x 4 bytes: the stride</text>
<text class="t mono" x="300" y="124" font-size="10.5">(3, 2): fb + 5120 + 12 = fb + 5132</text>
<text class="tm mono" x="300" y="142" font-size="10.5">= 0x8001440c</text>
<text class="t" x="24" y="214" font-size="11" font-weight="600">one pixel in memory: red, 0x00ff0000 as a uint32</text>
<rect class="s f" x="24" y="228" width="76" height="44" rx="0" stroke-width="1.5"/>
<text class="tm" x="62" y="242" font-size="9.5" text-anchor="middle">blue</text>
<text class="t mono" x="62" y="259" font-size="10.5" text-anchor="middle">00</text>
<text class="tm mono" x="27" y="286" font-size="9">+0</text>
<rect class="s f" x="100" y="228" width="76" height="44" rx="0" stroke-width="1.5"/>
<text class="tm" x="138" y="242" font-size="9.5" text-anchor="middle">green</text>
<text class="t mono" x="138" y="259" font-size="10.5" text-anchor="middle">00</text>
<text class="tm mono" x="103" y="286" font-size="9">+1</text>
<rect class="a af" x="176" y="228" width="76" height="44" rx="0" stroke-width="1.5"/>
<text class="ta" x="214" y="242" font-size="9.5" text-anchor="middle">red</text>
<text class="ta mono" x="214" y="259" font-size="10.5" font-weight="600" text-anchor="middle">ff</text>
<text class="tm mono" x="179" y="286" font-size="9">+2</text>
<rect class="m f" x="252" y="228" width="76" height="44" rx="0" stroke-width="1.5"/>
<text class="tm" x="290" y="242" font-size="9.5" text-anchor="middle">unused</text>
<text class="t mono" x="290" y="259" font-size="10.5" text-anchor="middle">00</text>
<text class="tm mono" x="255" y="286" font-size="9">+3</text>
<text class="tm" x="340" y="244" font-size="10.5">RISC-V is little-endian: the low byte</text>
<text class="tm" x="340" y="260" font-size="10.5">comes first, so 0x00RRGGBB is stored</text>
<text class="tm" x="340" y="276" font-size="10.5">as B, G, R, 0. DRM calls it XRGB8888.</text>
<text class="tm" x="24" y="318" font-size="10.5">the whole screen: 640 * 480 * 4 = 1228800 bytes, exactly 300 pages</text>
</svg>
