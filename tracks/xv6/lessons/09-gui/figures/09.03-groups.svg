<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Events come in groups, each ended by EV_SYN</title>
<defs><marker id="f0903b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0903b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0903b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="20" font-size="11" font-weight="600">one event: 8 bytes</text>
<rect class="s f" x="24" y="30" width="120" height="44" rx="0" stroke-width="1.5"/>
<text class="tm" x="84" y="44" font-size="9.5" text-anchor="middle">type, 2 bytes</text>
<text class="t mono" x="84" y="61" font-size="10.5" text-anchor="middle">u16</text>
<rect class="s f" x="144" y="30" width="120" height="44" rx="0" stroke-width="1.5"/>
<text class="tm" x="204" y="44" font-size="9.5" text-anchor="middle">code, 2 bytes</text>
<text class="t mono" x="204" y="61" font-size="10.5" text-anchor="middle">u16</text>
<rect class="s f" x="264" y="30" width="240" height="44" rx="0" stroke-width="1.5"/>
<text class="tm" x="384" y="44" font-size="9.5" text-anchor="middle">value, 4 bytes</text>
<text class="t mono" x="384" y="61" font-size="10.5" text-anchor="middle">s32</text>
<text class="tm" x="514" y="50" font-size="10">little-endian,</text>
<text class="tm" x="514" y="64" font-size="10">as the device wrote it</text>
<text class="t" x="24" y="120" font-size="10.5">the a key goes down</text>
<rect class="s f" x="230" y="104" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="238" y="121" font-size="10">EV_KEY 30 1</text>
<rect class="m f" x="358" y="104" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="366" y="121" font-size="10">EV_SYN 0 0</text>
<text class="t" x="24" y="160" font-size="10.5">and comes up</text>
<rect class="s f" x="230" y="144" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="238" y="161" font-size="10">EV_KEY 30 0</text>
<rect class="m f" x="358" y="144" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="366" y="161" font-size="10">EV_SYN 0 0</text>
<text class="t" x="24" y="200" font-size="10.5">the pointer moves to (100, 200)</text>
<rect class="s f" x="230" y="184" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="238" y="201" font-size="10">EV_ABS ABS_X 100</text>
<rect class="s f" x="358" y="184" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="366" y="201" font-size="10">EV_ABS ABS_Y 200</text>
<rect class="m f" x="486" y="184" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="494" y="201" font-size="10">EV_SYN 0 0</text>
<text class="t" x="24" y="240" font-size="10.5">the left button goes down</text>
<rect class="s f" x="230" y="224" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="238" y="241" font-size="10">EV_KEY 272 1</text>
<rect class="m f" x="358" y="224" width="124" height="26" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="366" y="241" font-size="10">EV_SYN 0 0</text>
<text class="tm" x="24" y="274" font-size="10.5">The tablet sent x = 5145 of 0 to 32767; the driver made it 5145 * 640 / 32768 = 100.</text>
<text class="tm" x="24" y="290" font-size="10.5">A program acts at EV_SYN, when x and y are both there.</text>
</svg>
