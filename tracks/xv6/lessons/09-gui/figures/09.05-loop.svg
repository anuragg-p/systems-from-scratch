<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" fill="none">
<title>One turn of paint&#x27;s loop</title>
<defs><marker id="f0905b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0905b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0905b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="s fs" x="24" y="40" width="172" height="70" rx="8" stroke-width="1.5"/>
<text class="t mono" x="36" y="62" font-size="10.5" font-weight="600">read(fd, ev, 256)</text>
<text class="tm" x="36" y="80" font-size="9.5">sleep until there are events;</text>
<text class="tm" x="36" y="94" font-size="9.5">get up to 32 at once</text>
<rect class="s f" x="234" y="40" width="172" height="70" rx="8" stroke-width="1.5"/>
<text class="t mono" x="246" y="62" font-size="10.5" font-weight="600">handle(e), for each</text>
<text class="tm" x="246" y="80" font-size="9.5">EV_ABS: nx, ny; EV_SYN: move,</text>
<text class="tm" x="246" y="94" font-size="9.5">stroke into the canvas; keys</text>
<rect class="a af" x="444" y="40" width="172" height="70" rx="8" stroke-width="1.5"/>
<text class="ta mono" x="456" y="62" font-size="10.5" font-weight="600">redraw()</text>
<text class="ta" x="456" y="80" font-size="9.5">compose the frame in back,</text>
<text class="ta" x="456" y="94" font-size="9.5">then present()</text>
<line class="s" x1="196" y1="75" x2="232" y2="75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0905b-ah)"/>
<line class="s" x1="406" y1="75" x2="442" y2="75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0905b-ah)"/>
<path class="s" d="M530 110 C 530 150, 110 150, 110 112" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0905b-ah)"/>
<text class="t" x="234" y="176" font-size="10">1  blit the canvas</text>
<text class="t" x="234" y="191" font-size="10">2  the title bar and its text</text>
<text class="t" x="234" y="206" font-size="10">3  the colour bar, the frame, the swatches</text>
<text class="t" x="234" y="221" font-size="10">4  the pointer, if it has moved</text>
<text class="ta" x="234" y="236" font-size="10" font-weight="600">5  present: the whole frame to the screen</text>
<text class="tm" x="24" y="176" font-size="10.5">redraw, back to front:</text>
<text class="tm" x="24" y="194" font-size="10.5">later layers cover earlier</text>
<text class="tm" x="24" y="212" font-size="10.5">ones; nothing from the last</text>
<text class="tm" x="24" y="230" font-size="10.5">frame survives but the canvas</text>
</svg>
