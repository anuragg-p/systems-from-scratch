<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" fill="none">
<title>Finding etc/ramfb in fw_cfg, then writing it by DMA</title>
<defs><marker id="f0901a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0901a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="20" font-size="11.5" font-weight="600">fw_cfg at 0x10100000</text>
<rect class="s f" x="24" y="32" width="150" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="34" y="47" font-size="10">+0</text>
<text class="t mono" x="70" y="47" font-size="10.5" font-weight="600">data</text>
<text class="tm" x="184" y="47" font-size="10">read the selected item, a byte at a time</text>
<rect class="s f" x="24" y="60" width="150" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="34" y="75" font-size="10">+8</text>
<text class="t mono" x="70" y="75" font-size="10.5" font-weight="600">selector</text>
<text class="tm" x="184" y="75" font-size="10">16 bits, big-endian: which item</text>
<rect class="a af" x="24" y="88" width="150" height="22" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="34" y="103" font-size="10">+16</text>
<text class="ta mono" x="70" y="103" font-size="10.5" font-weight="600">DMA</text>
<text class="tm" x="184" y="103" font-size="10">64 bits, big-endian: where a request is</text>
<text class="t" x="24" y="126" font-size="11" font-weight="600">1. selector = 0x0019; read: the file directory</text>
<rect class="s fs" x="24" y="136" width="290" height="22" rx="0" stroke-width="1.5"/>
<text class="tm" x="34" y="151" font-size="10">count</text>
<text class="t mono" x="304" y="151" font-size="10.5" text-anchor="end">00 00 00 09 = 9 files</text>
<rect class="s f" x="24" y="158" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="172" font-size="10">00 20</text>
<text class="t mono" x="84" y="172" font-size="10">bios-geometry</text>
<text class="tm mono" x="304" y="172" font-size="10" text-anchor="end">0</text>
<rect class="s f" x="24" y="179" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="193" font-size="10">00 21</text>
<text class="t mono" x="84" y="193" font-size="10">bootorder</text>
<text class="tm mono" x="304" y="193" font-size="10" text-anchor="end">0</text>
<rect class="s f" x="24" y="200" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="214" font-size="10">00 22</text>
<text class="t mono" x="84" y="214" font-size="10">etc/acpi/rsdp</text>
<text class="tm mono" x="304" y="214" font-size="10" text-anchor="end">36</text>
<rect class="s f" x="24" y="221" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="235" font-size="10">00 23</text>
<text class="t mono" x="84" y="235" font-size="10">etc/acpi/tables</text>
<text class="tm mono" x="304" y="235" font-size="10" text-anchor="end">131072</text>
<rect class="s f" x="24" y="242" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="256" font-size="10">00 24</text>
<text class="t mono" x="84" y="256" font-size="10">etc/boot-fail-wait</text>
<text class="tm mono" x="304" y="256" font-size="10" text-anchor="end">4</text>
<rect class="a af" x="24" y="263" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="34" y="277" font-size="10" font-weight="600">00 25</text>
<text class="ta mono" x="84" y="277" font-size="10" font-weight="600">etc/ramfb</text>
<text class="ta mono" x="304" y="277" font-size="10" text-anchor="end">28</text>
<rect class="s f" x="24" y="284" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="298" font-size="10">00 26</text>
<text class="t mono" x="84" y="298" font-size="10">etc/smbios/smbios-anchor</text>
<text class="tm mono" x="304" y="298" font-size="10" text-anchor="end">24</text>
<rect class="s f" x="24" y="305" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="319" font-size="10">00 27</text>
<text class="t mono" x="84" y="319" font-size="10">etc/smbios/smbios-tables</text>
<text class="tm mono" x="304" y="319" font-size="10" text-anchor="end">287</text>
<rect class="s f" x="24" y="326" width="290" height="21" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="34" y="340" font-size="10">00 28</text>
<text class="t mono" x="84" y="340" font-size="10">etc/table-loader</text>
<text class="tm mono" x="304" y="340" font-size="10" text-anchor="end">2304</text>
<text class="tm" x="24" y="363" font-size="10">each entry: size, select, 2 bytes unused, a 56-byte name</text>
<text class="t" x="350" y="126" font-size="11" font-weight="600">2. DMA = the address of req</text>
<text class="tm mono" x="350" y="144" font-size="10">req at 0x80012020</text>
<rect class="s f" x="350" y="152" width="266" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="169" font-size="10">control</text>
<text class="t mono" x="414" y="169" font-size="10.5">00 25 00 18</text>
<text class="tm" x="608" y="169" font-size="9" text-anchor="end">item 0x25: select, write</text>
<rect class="s f" x="350" y="178" width="266" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="195" font-size="10">length</text>
<text class="t mono" x="414" y="195" font-size="10.5">00 00 00 1c</text>
<text class="tm" x="608" y="195" font-size="9" text-anchor="end">28 bytes</text>
<rect class="s f" x="350" y="204" width="266" height="26" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="221" font-size="10">address</text>
<text class="t mono" x="414" y="221" font-size="10.5">80012000</text>
<text class="tm" x="608" y="221" font-size="9" text-anchor="end">cfg</text>
<path class="s" d="M612 217 C 640 234, 640 240, 600 258" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0901a-ah)"/>
<text class="tm mono" x="350" y="252" font-size="10">cfg at 0x80012000: what ramfb reads</text>
<rect class="a af" x="350" y="260" width="266" height="24" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="358" y="276" font-size="10">addr</text>
<text class="ta mono" x="420" y="276" font-size="10.5" font-weight="600">80013000</text>
<text class="ta" x="608" y="276" font-size="9.5" text-anchor="end">the first pixel: fb</text>
<rect class="s f" x="350" y="284" width="266" height="24" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="300" font-size="10">fourcc</text>
<text class="t mono" x="420" y="300" font-size="10.5">58 52 32 34</text>
<text class="tm" x="608" y="300" font-size="9.5" text-anchor="end">&quot;XR24&quot;</text>
<rect class="s f" x="350" y="308" width="266" height="24" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="324" font-size="10">flags</text>
<text class="t mono" x="420" y="324" font-size="10.5">0</text>
<text class="tm" x="608" y="324" font-size="9.5" text-anchor="end"></text>
<rect class="s f" x="350" y="332" width="266" height="24" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="348" font-size="10">width</text>
<text class="t mono" x="420" y="348" font-size="10.5">640</text>
<text class="tm" x="608" y="348" font-size="9.5" text-anchor="end"></text>
<rect class="s f" x="350" y="356" width="266" height="24" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="372" font-size="10">height</text>
<text class="t mono" x="420" y="372" font-size="10.5">480</text>
<text class="tm" x="608" y="372" font-size="9.5" text-anchor="end"></text>
<rect class="s f" x="350" y="380" width="266" height="24" rx="0" stroke-width="1.5"/>
<text class="tm mono" x="358" y="396" font-size="10">stride</text>
<text class="t mono" x="420" y="396" font-size="10.5">2560</text>
<text class="tm" x="608" y="396" font-size="9.5" text-anchor="end">bytes per row</text>
<text class="tm" x="350" y="420" font-size="10">all big-endian; fourcc is 0x34325258</text>
<line class="m" x1="330" y1="114" x2="330" y2="424" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
</svg>
