<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" fill="none">
<title>Two swtch calls, and the lock that crosses them</title>
<defs><marker id="f0402a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0402a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0402a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="68" font-size="12" font-weight="600">process A</text>
<text class="tm" x="24" y="83" font-size="10.5">A&#x27;s kernel stack</text>
<line class="m" x1="150" y1="70" x2="620" y2="70" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="t mono" x="24" y="148" font-size="12" font-weight="600">scheduler()</text>
<text class="tm" x="24" y="163" font-size="10.5">the hart&#x27;s boot stack</text>
<line class="m" x1="150" y1="150" x2="620" y2="150" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="t" x="24" y="228" font-size="12" font-weight="600">process B</text>
<text class="tm" x="24" y="243" font-size="10.5">B&#x27;s kernel stack</text>
<line class="m" x1="150" y1="230" x2="620" y2="230" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="a af" x="200" y="102" width="130" height="18" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="285" y="115" font-size="10.5" font-weight="600" text-anchor="middle">A-&gt;lock held</text>
<rect class="a af" x="370" y="182" width="150" height="18" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="470" y="195" font-size="10.5" font-weight="600" text-anchor="middle">B-&gt;lock held</text>
<line class="s" x1="150" y1="70" x2="236" y2="70" stroke-width="3" stroke-linecap="round"/>
<line class="s" x1="236" y1="150" x2="420" y2="150" stroke-width="3" stroke-linecap="round"/>
<line class="s" x1="420" y1="230" x2="620" y2="230" stroke-width="3" stroke-linecap="round"/>
<line class="s" x1="200" y1="62" x2="200" y2="78" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="200" y="52" font-size="10.5" text-anchor="middle">yield(): lock A, RUNNABLE</text>
<line class="s" x1="236" y1="74" x2="236" y2="146" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0402a-ah)"/>
<text class="t mono" x="242" y="92" font-size="10.5" font-weight="600">swtch</text>
<text class="tm mono" x="230" y="92" font-size="10.5" text-anchor="end">sched()</text>
<line class="s" x1="330" y1="142" x2="330" y2="158" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="330" y="174" font-size="10.5" text-anchor="middle">release A</text>
<line class="s" x1="370" y1="142" x2="370" y2="158" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="370" y="136" font-size="10.5" text-anchor="middle">lock B, RUNNING</text>
<line class="s" x1="420" y1="154" x2="420" y2="226" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0402a-ah)"/>
<text class="t mono" x="426" y="172" font-size="10.5" font-weight="600">swtch</text>
<line class="s" x1="520" y1="222" x2="520" y2="238" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="520" y="254" font-size="10.5" text-anchor="middle">yield() returns: release B</text>
<text class="tm" x="620" y="220" font-size="10.5" text-anchor="end">B runs</text>
<text class="tm" x="150" y="278" font-size="10.5">time -&gt;</text>
</svg>
