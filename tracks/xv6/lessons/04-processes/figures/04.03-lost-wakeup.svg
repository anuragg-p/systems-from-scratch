<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" fill="none">
<title>The lost wakeup</title>
<defs><marker id="f0403a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0403a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0403a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="40" y="20" font-size="11.5" font-weight="600">hart 0: virtio_disk_rw() sleeping on b</text>
<text class="t" x="340" y="20" font-size="11.5" font-weight="600">hart 1: virtio_disk_intr()</text>
<text class="tm" x="40" y="35" font-size="10.5">if sleep let go of lk before taking p-&gt;lock</text>
<rect class="fs" x="16" y="120" width="608" height="109" rx="6"/>
<text class="tm" x="620" y="138" font-size="10.5" text-anchor="end">the window</text>
<line class="m" x1="44" y1="52" x2="44" y2="297" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="344" y1="52" x2="344" y2="297" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s f" cx="44" cy="58" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="58" y="62" font-size="11">acquire(&amp;disk.vdisk_lock)</text>
<circle class="s f" cx="44" cy="83" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="58" y="87" font-size="11">b-&gt;disk == 1, so sleep(b, lk)</text>
<circle class="s f" cx="44" cy="108" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="58" y="112" font-size="11">release(lk)</text>
<circle class="s f" cx="344" cy="133" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="358" y="137" font-size="11">acquire(&amp;disk.vdisk_lock)</text>
<circle class="s f" cx="344" cy="158" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="358" y="162" font-size="11">b-&gt;disk = 0</text>
<circle class="a fa" cx="344" cy="183" r="3.5" stroke-width="1.5"/>
<text class="ta mono" x="358" y="187" font-size="11" font-weight="600">wakeup(b): nobody is SLEEPING</text>
<circle class="s f" cx="344" cy="208" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="358" y="212" font-size="11">release(&amp;disk.vdisk_lock)</text>
<circle class="s f" cx="44" cy="233" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="58" y="237" font-size="11">acquire(&amp;p-&gt;lock)</text>
<circle class="s f" cx="44" cy="258" r="3.5" stroke-width="1.5"/>
<text class="t mono" x="58" y="262" font-size="11">p-&gt;state = SLEEPING; sched()</text>
<circle class="m f" cx="44" cy="283" r="3.5" stroke-width="1.5"/>
<text class="tm" x="58" y="287" font-size="11">asleep on b; nothing will wake it</text>
</svg>
