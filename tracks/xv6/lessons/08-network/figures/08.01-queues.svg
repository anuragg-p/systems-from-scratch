<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" fill="none">
<title>The receive queue and the transmit queue</title>
<defs><marker id="f0801a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="42" font-size="11.5" font-weight="600">queue 0</text>
<text class="tm" x="24" y="57" font-size="10.5">receive</text>
<rect class="a af" x="150" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="177" y="21" font-size="9.5" text-anchor="middle">buf[0]</text>
<text class="t" x="177" y="47" font-size="10.5" text-anchor="middle">empty</text>
<rect class="a af" x="208" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="235" y="21" font-size="9.5" text-anchor="middle">buf[1]</text>
<text class="t" x="235" y="47" font-size="10.5" text-anchor="middle">empty</text>
<rect class="a fa" x="266" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="293" y="21" font-size="9.5" text-anchor="middle">buf[2]</text>
<text class="f" x="293" y="47" font-size="10.5" font-weight="600" text-anchor="middle">frame</text>
<rect class="a af" x="324" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="351" y="21" font-size="9.5" text-anchor="middle">buf[3]</text>
<text class="t" x="351" y="47" font-size="10.5" text-anchor="middle">empty</text>
<rect class="a af" x="382" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="409" y="21" font-size="9.5" text-anchor="middle">buf[4]</text>
<text class="t" x="409" y="47" font-size="10.5" text-anchor="middle">empty</text>
<rect class="a af" x="440" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="467" y="21" font-size="9.5" text-anchor="middle">buf[5]</text>
<text class="t" x="467" y="47" font-size="10.5" text-anchor="middle">empty</text>
<rect class="a af" x="498" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="525" y="21" font-size="9.5" text-anchor="middle">buf[6]</text>
<text class="t" x="525" y="47" font-size="10.5" text-anchor="middle">empty</text>
<rect class="a af" x="556" y="26" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="583" y="21" font-size="9.5" text-anchor="middle">buf[7]</text>
<text class="t" x="583" y="47" font-size="10.5" text-anchor="middle">empty</text>
<text class="tm" x="150" y="76" font-size="10.5">all eight belong to the card from init on: it fills one per arriving frame</text>
<circle class="a af" cx="158" cy="104" r="7" stroke-width="1.5"/>
<text class="ta mono" x="158" y="107.5" font-size="9.5" font-weight="600" text-anchor="middle">1</text>
<text class="t" x="172" y="108" font-size="10.5">frame arrives: the card writes buf[2], puts 2 in the used ring, raises irq 2</text>
<circle class="a af" cx="158" cy="123" r="7" stroke-width="1.5"/>
<text class="ta mono" x="158" y="126.5" font-size="9.5" font-weight="600" text-anchor="middle">2</text>
<text class="t" x="172" y="127" font-size="10.5">virtio_net_intr: net_rx(buf[2] + 12, len - 12), the stack takes what it needs</text>
<circle class="a af" cx="158" cy="142" r="7" stroke-width="1.5"/>
<text class="ta mono" x="158" y="145.5" font-size="9.5" font-weight="600" text-anchor="middle">3</text>
<text class="t" x="172" y="146" font-size="10.5">2 goes back in the avail ring; QUEUE_NOTIFY = 0: the card has it again</text>
<line class="m" x1="24" y1="170" x2="616" y2="170" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="t mono" x="24" y="212" font-size="11.5" font-weight="600">queue 1</text>
<text class="tm" x="24" y="227" font-size="10.5">transmit</text>
<rect class="s f" x="150" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="177" y="191" font-size="9.5" text-anchor="middle">buf[0]</text>
<text class="t" x="177" y="217" font-size="10.5" text-anchor="middle">free</text>
<rect class="a af" x="208" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="235" y="191" font-size="9.5" text-anchor="middle">buf[1]</text>
<text class="t" x="235" y="217" font-size="10.5" text-anchor="middle">frame</text>
<rect class="s f" x="266" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="293" y="191" font-size="9.5" text-anchor="middle">buf[2]</text>
<text class="t" x="293" y="217" font-size="10.5" text-anchor="middle">free</text>
<rect class="s f" x="324" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="351" y="191" font-size="9.5" text-anchor="middle">buf[3]</text>
<text class="t" x="351" y="217" font-size="10.5" text-anchor="middle">free</text>
<rect class="s f" x="382" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="409" y="191" font-size="9.5" text-anchor="middle">buf[4]</text>
<text class="t" x="409" y="217" font-size="10.5" text-anchor="middle">free</text>
<rect class="s f" x="440" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="467" y="191" font-size="9.5" text-anchor="middle">buf[5]</text>
<text class="t" x="467" y="217" font-size="10.5" text-anchor="middle">free</text>
<rect class="s f" x="498" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="525" y="191" font-size="9.5" text-anchor="middle">buf[6]</text>
<text class="t" x="525" y="217" font-size="10.5" text-anchor="middle">free</text>
<rect class="s f" x="556" y="196" width="54" height="34" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="583" y="191" font-size="9.5" text-anchor="middle">buf[7]</text>
<text class="t" x="583" y="217" font-size="10.5" text-anchor="middle">free</text>
<text class="tm" x="150" y="246" font-size="10.5">a buffer is the card&#x27;s only while txbusy[i] is 1</text>
<circle class="s f" cx="158" cy="270" r="7" stroke-width="1.5"/>
<text class="t mono" x="158" y="273.5" font-size="9.5" font-weight="600" text-anchor="middle">1</text>
<text class="t" x="172" y="274" font-size="10.5">virtio_net_send: header and frame copied into a free buffer, txbusy[1] = 1</text>
<circle class="s f" cx="158" cy="287" r="7" stroke-width="1.5"/>
<text class="t mono" x="158" y="290.5" font-size="9.5" font-weight="600" text-anchor="middle">2</text>
<text class="t" x="172" y="291" font-size="10.5">1 in the avail ring; QUEUE_NOTIFY = 1; the card sends it, no interrupt</text>
<circle class="s f" cx="158" cy="304" r="7" stroke-width="1.5"/>
<text class="t mono" x="158" y="307.5" font-size="9.5" font-weight="600" text-anchor="middle">3</text>
<text class="t" x="172" y="308" font-size="10.5">the next send finds 1 in the used ring and sets txbusy[1] = 0</text>
</svg>
