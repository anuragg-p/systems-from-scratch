<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" fill="none">
<title>One buffer: the virtio header, then the Ethernet frame</title>
<defs><marker id="f0801b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0801b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="a af" x="24" y="58" width="116" height="44" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="82" y="77" font-size="11" font-weight="600" text-anchor="middle">virtio_net_hdr</text>
<text class="ta" x="82" y="92" font-size="9.5" text-anchor="middle">12 bytes, all 0</text>
<rect class="s f" x="140" y="58" width="66" height="44" rx="0" stroke-width="1.5"/>
<text class="t mono" x="173" y="77" font-size="10.5" text-anchor="middle">dst</text>
<text class="tm" x="173" y="92" font-size="9.5" text-anchor="middle">6</text>
<rect class="s f" x="206" y="58" width="66" height="44" rx="0" stroke-width="1.5"/>
<text class="t mono" x="239" y="77" font-size="10.5" text-anchor="middle">src</text>
<text class="tm" x="239" y="92" font-size="9.5" text-anchor="middle">6</text>
<rect class="s f" x="272" y="58" width="44" height="44" rx="0" stroke-width="1.5"/>
<text class="t mono" x="294" y="77" font-size="10.5" text-anchor="middle">type</text>
<text class="tm" x="294" y="92" font-size="9.5" text-anchor="middle">2</text>
<rect class="s fs" x="316" y="58" width="194" height="44" rx="0" stroke-width="1.5"/>
<text class="t" x="413" y="77" font-size="11" text-anchor="middle">payload: ARP or IP</text>
<text class="tm" x="413" y="92" font-size="9.5" text-anchor="middle">up to 1500 bytes</text>
<rect class="m f" x="510" y="58" width="106" height="44" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="563" y="77" font-size="11" text-anchor="middle">unused</text>
<text class="tm" x="563" y="92" font-size="9.5" text-anchor="middle">to 2047</text>
<line class="m" x1="24" y1="102" x2="24" y2="110" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="24" y="122" font-size="10" text-anchor="middle">0</text>
<line class="m" x1="140" y1="102" x2="140" y2="110" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="140" y="122" font-size="10" text-anchor="middle">12</text>
<line class="m" x1="206" y1="102" x2="206" y2="110" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="206" y="122" font-size="10" text-anchor="middle">18</text>
<line class="m" x1="272" y1="102" x2="272" y2="110" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="272" y="122" font-size="10" text-anchor="middle">24</text>
<line class="m" x1="316" y1="102" x2="316" y2="110" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="316" y="122" font-size="10" text-anchor="middle">26</text>
<line class="m" x1="510" y1="102" x2="510" y2="110" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="510" y="122" font-size="10" text-anchor="middle">1526</text>
<path class="s" d="M140 46 L140 40 L510 40 L510 46" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="325" y="30" font-size="10.5" text-anchor="middle">the Ethernet frame: at most 14 + 1500 = 1514 bytes</text>
<path class="a" d="M24 126 L24 132 L140 132 L140 126" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ta mono" x="24" y="154" font-size="10">flags gso_type hdr_len gso_size csum_start csum_offset num_buffers</text>
<text class="tm" x="24" y="172" font-size="10.5">no offload features were accepted, so the driver writes zeroes and skips it on receive</text>
<text class="t mono" x="616" y="154" font-size="10.5" font-weight="600" text-anchor="end">net_rx(buf + 12, len - 12)</text>
<text class="tm" x="616" y="172" font-size="10.5" text-anchor="end">2048 bytes: two buffers per page</text>
</svg>
