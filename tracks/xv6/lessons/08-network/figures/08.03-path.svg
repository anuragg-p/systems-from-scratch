<rect class="s f" x="94" y="344" width="100" height="26" rx="0" stroke-width="1.5"/>
<text class="t mono" x="144" y="361" font-size="10.5" text-anchor="middle">ip</text>
<text class="tm mono" x="94" y="383" font-size="9.5" text-anchor="middle">14</text>
<rect class="s f" x="194" y="344" width="40" height="26" rx="0" stroke-width="1.5"/>
<text class="t mono" x="214" y="361" font-size="10.5" text-anchor="middle">udp</text>
<text class="tm mono" x="194" y="383" font-size="9.5" text-anchor="middle">34</text>
<rect class="a af" x="234" y="344" width="230" height="26" rx="0" stroke-width="1.5"/>
<text class="ta mono" x="349" y="361" font-size="10.5" font-weight="600" text-anchor="middle">data</text>
