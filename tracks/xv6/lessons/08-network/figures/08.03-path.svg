<text class="t mono" x="34" y="43" font-size="11" font-weight="600">sendto()</text>
<text class="tm" x="34" y="57" font-size="9.5">user space: fd, buf, n, ip, port</text>
<rect class="s fs" x="376" y="28" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="386" y="43" font-size="11" font-weight="600">recvfrom()</text>
<text class="tm" x="386" y="57" font-size="9.5">the process wakes with the data</text>
<line class="s" x1="144" y1="64" x2="144" y2="77" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<line class="s" x1="496" y1="78" x2="496" y2="65" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<rect class="s f" x="24" y="78" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="93" font-size="11" font-weight="600">socksend</text>
<text class="tm" x="34" y="107" font-size="9.5">copyin the data to page + 42</text>
<rect class="s f" x="376" y="78" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="386" y="93" font-size="11" font-weight="600">sock_deliver</text>
<text class="tm" x="386" y="107" font-size="9.5">destination port: queue, wakeup</text>
<line class="s" x1="144" y1="114" x2="144" y2="127" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<line class="s" x1="496" y1="128" x2="496" y2="115" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<rect class="s f" x="24" y="128" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="143" font-size="11" font-weight="600">udp_send</text>
<text class="tm" x="34" y="157" font-size="9.5">8-byte UDP header at + 34</text>
<rect class="s f" x="376" y="128" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="386" y="143" font-size="11" font-weight="600">udp_rx</text>
<text class="tm" x="386" y="157" font-size="9.5">checksum and length</text>
<line class="s" x1="144" y1="164" x2="144" y2="177" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<line class="s" x1="496" y1="178" x2="496" y2="165" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<rect class="s f" x="24" y="178" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="193" font-size="11" font-weight="600">ip_send</text>
<text class="tm" x="34" y="207" font-size="9.5">20-byte IP header at + 14, arp_resolve</text>
<rect class="s f" x="376" y="178" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="386" y="193" font-size="11" font-weight="600">ip_rx</text>
<text class="tm" x="386" y="207" font-size="9.5">checksum, MYIP, protocol 17</text>
<line class="s" x1="144" y1="214" x2="144" y2="227" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<line class="s" x1="496" y1="228" x2="496" y2="215" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<rect class="s f" x="24" y="228" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="243" font-size="11" font-weight="600">eth_send</text>
<text class="tm" x="34" y="257" font-size="9.5">14-byte Ethernet header at + 0</text>
<rect class="s f" x="376" y="228" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="386" y="243" font-size="11" font-weight="600">net_rx</text>
<text class="tm" x="386" y="257" font-size="9.5">our card or broadcast, ethertype</text>
<line class="s" x1="144" y1="264" x2="144" y2="277" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
<line class="s" x1="496" y1="278" x2="496" y2="265" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-ah)"/>
