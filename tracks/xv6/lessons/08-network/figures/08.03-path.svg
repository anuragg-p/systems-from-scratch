<text class="t mono" x="34" y="293" font-size="11" font-weight="600">virtio_net_send</text>
<text class="tm" x="34" y="307" font-size="9.5">copy header and frame to the card</text>
<rect class="s f" x="376" y="278" width="240" height="36" rx="6" stroke-width="1.5"/>
<text class="t mono" x="386" y="293" font-size="11" font-weight="600">virtio_net_intr</text>
<text class="tm" x="386" y="307" font-size="9.5">irq 2: frame at buffer + 12</text>
<line class="a" x1="266" y1="296" x2="374" y2="296" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0803c-aa)"/>
<text class="ta" x="320" y="289" font-size="10" text-anchor="middle">the wire</text>
<text class="tm" x="24" y="334" font-size="10">the page socksend fills, back to front</text>
