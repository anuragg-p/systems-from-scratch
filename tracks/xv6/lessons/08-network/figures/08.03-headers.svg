<rect class="s f" x="320" y="28" width="224" height="34" rx="0" stroke-width="1.5"/>
<text class="tm" x="328" y="49" font-size="10">total length</text>
<text class="t mono" x="536" y="49" font-size="10.5" text-anchor="end">00 39 = 57</text>
<text class="tm mono" x="86" y="84" font-size="10" text-anchor="end">4</text>
<rect class="s f" x="96" y="62" width="224" height="34" rx="0" stroke-width="1.5"/>
<text class="tm" x="104" y="83" font-size="10">id</text>
<text class="t mono" x="312" y="83" font-size="10.5" text-anchor="end">00 00</text>
<rect class="s f" x="320" y="62" width="224" height="34" rx="0" stroke-width="1.5"/>
<text class="tm" x="328" y="83" font-size="10">flags, fragment offset</text>
<text class="t mono" x="536" y="83" font-size="10.5" text-anchor="end">00 00</text>
<text class="tm mono" x="86" y="118" font-size="10" text-anchor="end">8</text>
<rect class="s f" x="96" y="96" width="112" height="34" rx="0" stroke-width="1.5"/>
<text class="tm" x="104" y="117" font-size="10">ttl</text>
