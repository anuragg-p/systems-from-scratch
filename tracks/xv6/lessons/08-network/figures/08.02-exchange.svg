<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" fill="none">
<title>ARP in both directions</title>
<defs><marker id="f0802b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0802b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0802b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="160" y="20" font-size="12" font-weight="600" text-anchor="middle">xv6</text>
<text class="tm mono" x="160" y="35" font-size="10" text-anchor="middle">10.0.2.15</text>
<text class="t" x="540" y="20" font-size="12" font-weight="600" text-anchor="middle">QEMU&#x27;s network</text>
<text class="tm mono" x="540" y="35" font-size="10" text-anchor="middle">10.0.2.2, 10.0.2.3</text>
<line class="m" x1="160" y1="44" x2="160" y2="340" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="540" y1="44" x2="540" y2="340" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm" x="24" y="62" font-size="10.5" font-weight="600">nslookup</text>
<line class="a" x1="164" y1="80" x2="536" y2="80" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0802b-aa)"/>
<text class="ta mono" x="350" y="74" font-size="10.5" text-anchor="middle">who-has 10.0.2.3? tell 10.0.2.15</text>
<text class="tm" x="350" y="93" font-size="9.5" text-anchor="middle">to ff:ff:ff:ff:ff:ff, 42 bytes</text>
<line class="s" x1="536" y1="120" x2="164" y2="120" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0802b-ah)"/>
<text class="t mono" x="350" y="114" font-size="10.5" text-anchor="middle">10.0.2.3 is-at 52:55:0a:00:02:03</text>
<text class="tm" x="350" y="133" font-size="9.5" text-anchor="middle">to 52:54:00:12:34:56 only</text>
<text class="ta" x="150" y="124" font-size="10" text-anchor="end">cache 10.0.2.3</text>
<line class="s" x1="164" y1="160" x2="536" y2="160" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0802b-ah)"/>
<text class="t mono" x="350" y="154" font-size="10.5" text-anchor="middle">UDP to 10.0.2.3:53, the DNS question</text>
<text class="tm" x="350" y="173" font-size="9.5" text-anchor="middle">to 52:55:0a:00:02:03</text>
<line class="m" x1="24" y1="186" x2="616" y2="186" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<text class="tm" x="24" y="206" font-size="10.5" font-weight="600">udpecho 2000</text>
<text class="tm" x="550" y="210" font-size="10">the host</text>
<text class="tm" x="550" y="223" font-size="10">sent hello</text>
<line class="s" x1="536" y1="226" x2="164" y2="226" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0802b-ah)"/>
<text class="t mono" x="350" y="220" font-size="10.5" text-anchor="middle">who-has 10.0.2.15? tell 10.0.2.2</text>
<text class="tm" x="350" y="239" font-size="9.5" text-anchor="middle">to ff:ff:ff:ff:ff:ff</text>
<text class="ta" x="150" y="230" font-size="10" text-anchor="end">cache 10.0.2.2</text>
<text class="ta" x="150" y="243" font-size="10" text-anchor="end">(the merge)</text>
<line class="a" x1="164" y1="270" x2="536" y2="270" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0802b-aa)"/>
<text class="ta mono" x="350" y="264" font-size="10.5" text-anchor="middle">10.0.2.15 is-at 52:54:00:12:34:56</text>
<text class="tm" x="350" y="283" font-size="9.5" text-anchor="middle">to 52:55:0a:00:02:02 only</text>
<line class="s" x1="536" y1="306" x2="164" y2="306" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0802b-ah)"/>
<text class="t mono" x="350" y="300" font-size="10.5" text-anchor="middle">UDP hello, 10.0.2.2 &gt; 10.0.2.15:2000</text>
<line class="s" x1="164" y1="334" x2="536" y2="334" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0802b-ah)"/>
<text class="t mono" x="350" y="328" font-size="10.5" text-anchor="middle">UDP hello back: no request of its own</text>
</svg>
