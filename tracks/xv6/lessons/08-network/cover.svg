<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>A datagram from a socket in xv6, through the card, onto QEMU&#x27;s network</title>
<defs><marker id="m08-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m08-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="22" font-size="12" font-weight="700">xv6, 10.0.2.15</text>
<text class="tm mono" x="24" y="38" font-size="10.5">card 52:54:00:12:34:56</text>
<rect class="s fs" x="24" y="52" width="250" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="36" y="72" font-size="12">nslookup, udpecho</text>
