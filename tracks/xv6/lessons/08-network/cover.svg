<text class="t mono" x="36" y="110" font-size="11.5">socket sendto recvfrom</text>
<text class="tm" x="262" y="110" font-size="10.5" text-anchor="end">system calls</text>
<rect class="s f" x="24" y="128" width="250" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="36" y="148" font-size="12">sockets</text>
<text class="tm mono" x="262" y="148" font-size="10.5" text-anchor="end">sock.c</text>
<rect class="s f" x="24" y="166" width="250" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="36" y="186" font-size="12">UDP and IPv4</text>
<text class="tm mono" x="262" y="186" font-size="10.5" text-anchor="end">ip.c</text>
<rect class="s f" x="24" y="204" width="250" height="30" rx="6" stroke-width="1.5"/>
<text class="t" x="36" y="224" font-size="12">Ethernet and ARP</text>
