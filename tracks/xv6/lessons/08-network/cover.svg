<text class="ta" x="36" y="262" font-size="12" font-weight="600">virtio network card</text>
<text class="ta mono" x="262" y="262" font-size="10.5" text-anchor="end">virtio_net.c</text>
<line class="m" x1="24" y1="124" x2="274" y2="124" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="s fs" x="352" y="52" width="264" height="210" rx="14" stroke-width="1.5"/>
<text class="t" x="368" y="76" font-size="12" font-weight="700">QEMU&#x27;s user-mode network</text>
<rect class="s f" x="368" y="96" width="232" height="50" rx="8" stroke-width="1.5"/>
<text class="t mono" x="380" y="117" font-size="12.5" font-weight="600">10.0.2.2</text>
<text class="tm" x="380" y="134" font-size="10.5">gateway: the host&#x27;s 127.0.0.1</text>
<rect class="s f" x="368" y="164" width="232" height="50" rx="8" stroke-width="1.5"/>
<text class="t mono" x="380" y="185" font-size="12.5" font-weight="600">10.0.2.3</text>
<text class="tm" x="380" y="202" font-size="10.5">DNS: asks the host&#x27;s resolver</text>
<text class="tm" x="368" y="246" font-size="10.5">Ethernet frames in and out</text>
<path class="a" d="M274 257 C 312 257, 316 214, 350 214" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m08-aa)"/>
