<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" fill="none">
<title>x = x + 1 on two harts, without and with a lock</title>
<defs><marker id="f0203a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0203a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="fs" x="12" y="12" width="300" height="312" rx="12"/>
<rect class="fs" x="328" y="12" width="300" height="312" rx="12"/>
<text class="t" x="28" y="36" font-size="12.5" font-weight="600">no lock</text>
<text class="t" x="344" y="36" font-size="12.5" font-weight="600">with a spinlock</text>
<text class="tm" x="108.0" y="60" font-size="11" text-anchor="middle">hart 0</text>
<text class="tm" x="242.0" y="60" font-size="11" text-anchor="middle">hart 1</text>
<rect class="a af" x="48" y="72" width="120" height="20" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="108.0" y="86.0" font-size="11" text-anchor="middle">load x  -&gt; 5</text>
<rect class="a af" x="182" y="102" width="120" height="20" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="242.0" y="116.0" font-size="11" text-anchor="middle">load x  -&gt; 5</text>
<rect class="s f" x="48" y="132" width="120" height="20" rx="6" stroke-width="1.5"/>
<text class="t mono" x="108.0" y="146.0" font-size="11" text-anchor="middle">add     -&gt; 6</text>
<rect class="s f" x="182" y="162" width="120" height="20" rx="6" stroke-width="1.5"/>
<text class="t mono" x="242.0" y="176.0" font-size="11" text-anchor="middle">add     -&gt; 6</text>
<rect class="s f" x="48" y="192" width="120" height="20" rx="6" stroke-width="1.5"/>
<text class="t mono" x="108.0" y="206.0" font-size="11" text-anchor="middle">store 6</text>
<rect class="s f" x="182" y="222" width="120" height="20" rx="6" stroke-width="1.5"/>
<text class="t mono" x="242.0" y="236.0" font-size="11" text-anchor="middle">store 6</text>
<line class="m" x1="30" y1="72" x2="30" y2="248" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0203a-ah)"/>
<text class="tm" x="30" y="266" font-size="10.5" text-anchor="middle">time</text>
<text class="ta" x="162" y="296" font-size="12" font-weight="600" text-anchor="middle">x = 6: one increment lost</text>
<text class="tm" x="162" y="312" font-size="11" text-anchor="middle">both harts loaded 5</text>
<text class="tm" x="404.0" y="60" font-size="11" text-anchor="middle">hart 0</text>
<text class="tm" x="546.0" y="60" font-size="11" text-anchor="middle">hart 1</text>
<rect class="s f" x="344" y="70" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="404.0" y="83.0" font-size="11" text-anchor="middle">acquire</text>
<rect class="s f" x="344" y="91" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="404.0" y="104.0" font-size="11" text-anchor="middle">load x  -&gt; 5</text>
<rect class="s f" x="344" y="112" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="404.0" y="125.0" font-size="11" text-anchor="middle">add     -&gt; 6</text>
<rect class="s f" x="344" y="133" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="404.0" y="146.0" font-size="11" text-anchor="middle">store 6</text>
<rect class="s f" x="344" y="154" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="404.0" y="167.0" font-size="11" text-anchor="middle">release</text>
<line class="m" x1="546.0" y1="74" x2="546.0" y2="173" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect class="f" x="516" y="112" width="60" height="20" rx="4" stroke-width="1.5"/>
<text class="tm" x="546.0" y="126" font-size="11" text-anchor="middle">spins</text>
<rect class="s f" x="486" y="175" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="546.0" y="188.0" font-size="11" text-anchor="middle">acquire</text>
<rect class="s f" x="486" y="196" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="546.0" y="209.0" font-size="11" text-anchor="middle">load x  -&gt; 6</text>
<rect class="s f" x="486" y="217" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="546.0" y="230.0" font-size="11" text-anchor="middle">add     -&gt; 7</text>
<rect class="s f" x="486" y="238" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="546.0" y="251.0" font-size="11" text-anchor="middle">store 7</text>
<rect class="s f" x="486" y="259" width="120" height="18" rx="6" stroke-width="1.5"/>
<text class="t mono" x="546.0" y="272.0" font-size="11" text-anchor="middle">release</text>
<text class="t mono" x="478" y="296" font-size="12" font-weight="600" text-anchor="middle">x = 7</text>
<text class="tm" x="478" y="312" font-size="11" text-anchor="middle">the second load waits for the first store</text>
</svg>
