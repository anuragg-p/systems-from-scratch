<text class="t mono" x="224" y="286" font-size="10.5" text-anchor="end"><tspan class="tm mono">0x3ffff7e000</tspan></text>
<rect class="m" x="236" y="268" width="176" height="28" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
