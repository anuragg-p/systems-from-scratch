<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" fill="none">
<title>The top of the virtual address space, page by page</title>
<defs><marker id="f0201b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0201b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="324.0" y="22" font-size="12" font-weight="600" text-anchor="middle">the kernel&#x27;s page table</text>
<text class="t" x="528.0" y="22" font-size="12" font-weight="600" text-anchor="middle">a process&#x27;s page table</text>
<text class="tm mono" x="224" y="36" font-size="10.5" text-anchor="end">MAXVA 0x4000000000</text>
<line class="m" x1="236" y1="32" x2="616" y2="32" stroke-width="1.5" stroke-linecap="round"/>
<text class="t mono" x="224" y="50" font-size="10.5" text-anchor="end">TRAMPOLINE  <tspan class="tm mono">0x3ffffff000</tspan></text>
<rect class="s fs" x="236" y="32" width="176" height="28" rx="0" stroke-width="1.5"/>
<text class="t mono" x="324.0" y="50" font-size="11.5" text-anchor="middle">trampoline</text>
<rect class="s fs" x="440" y="32" width="176" height="28" rx="0" stroke-width="1.5"/>
<text class="t mono" x="528.0" y="50" font-size="11.5" text-anchor="middle">trampoline</text>
<text class="t mono" x="224" y="78" font-size="10.5" text-anchor="end">TRAPFRAME  <tspan class="tm mono">0x3fffffe000</tspan></text>
<rect class="m" x="236" y="60" width="176" height="28" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="324.0" y="78" font-size="11.5" text-anchor="middle">unmapped</text>
<rect class="s f" x="440" y="60" width="176" height="28" rx="0" stroke-width="1.5"/>
<text class="t mono" x="528.0" y="78" font-size="11.5" text-anchor="middle">trapframe</text>
<text class="t mono" x="224" y="106" font-size="10.5" text-anchor="end">KSTACK(0)  <tspan class="tm mono">0x3fffffd000</tspan></text>
<rect class="s f" x="236" y="88" width="176" height="28" rx="0" stroke-width="1.5"/>
<text class="t" x="324.0" y="106" font-size="11.5" text-anchor="middle">kernel stack, proc[0]</text>
<text class="t mono" x="224" y="134" font-size="10.5" text-anchor="end"><tspan class="tm mono">0x3fffffc000</tspan></text>
<rect class="a af" x="236" y="116" width="176" height="28" rx="0" stroke-width="1.5"/>
<text class="ta" x="324.0" y="134" font-size="11.5" font-weight="600" text-anchor="middle">guard page, unmapped</text>
<text class="t mono" x="224" y="162" font-size="10.5" text-anchor="end">KSTACK(1)  <tspan class="tm mono">0x3fffffb000</tspan></text>
<rect class="s f" x="236" y="144" width="176" height="28" rx="0" stroke-width="1.5"/>
<text class="t" x="324.0" y="162" font-size="11.5" text-anchor="middle">kernel stack, proc[1]</text>
<text class="t mono" x="224" y="190" font-size="10.5" text-anchor="end"><tspan class="tm mono">0x3fffffa000</tspan></text>
<rect class="m" x="236" y="172" width="176" height="28" rx="0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm" x="324.0" y="190" font-size="11.5" text-anchor="middle">guard page, unmapped</text>
<text class="tm" x="324.0" y="224" font-size="14" text-anchor="middle">...</text>
<text class="tm" x="224" y="224" font-size="10.5" text-anchor="end">62 more stacks</text>
<text class="t mono" x="224" y="258" font-size="10.5" text-anchor="end">KSTACK(63)  <tspan class="tm mono">0x3ffff7f000</tspan></text>
<rect class="s f" x="236" y="240" width="176" height="28" rx="0" stroke-width="1.5"/>
