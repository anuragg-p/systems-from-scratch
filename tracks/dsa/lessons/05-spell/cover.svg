<line class="s" x1="50.3" y1="160.9" x2="101.7" y2="215.1" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="127.0" y1="226.0" x2="169.0" y2="226.0" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="199.0" y1="226.0" x2="241.0" y2="226.0" stroke-width="1.5" stroke-linecap="round"/>
<circle class="s fs" cx="40" cy="150" r="15" stroke-width="1.5"/>
<circle class="a af" cx="112" cy="106" r="15" stroke-width="1.5"/>
<text class="ta mono" x="112" y="110.5" font-size="13" font-weight="700" text-anchor="middle">c</text>
<circle class="s f" cx="112" cy="226" r="15" stroke-width="1.5"/>
<text class="t mono" x="112" y="230.5" font-size="13" font-weight="700" text-anchor="middle">d</text>
<circle class="a af" cx="184" cy="106" r="15" stroke-width="1.5"/>
<text class="ta mono" x="184" y="110.5" font-size="13" font-weight="700" text-anchor="middle">a</text>
<circle class="s f" cx="184" cy="226" r="15" stroke-width="1.5"/>
<circle class="s" cx="184" cy="226" r="11" stroke-width="1.5"/>
<text class="t mono" x="184" y="230.5" font-size="13" font-weight="700" text-anchor="middle">o</text>
<circle class="a af" cx="256" cy="70" r="15" stroke-width="1.5"/>
<circle class="a" cx="256" cy="70" r="11" stroke-width="1.5"/>
<text class="ta mono" x="256" y="74.5" font-size="13" font-weight="700" text-anchor="middle">r</text>
<circle class="a af" cx="256" cy="166" r="15" stroke-width="1.5"/>
<circle class="a" cx="256" cy="166" r="11" stroke-width="1.5"/>
<text class="ta mono" x="256" y="170.5" font-size="13" font-weight="700" text-anchor="middle">t</text>
<circle class="s f" cx="256" cy="226" r="15" stroke-width="1.5"/>
<circle class="s" cx="256" cy="226" r="11" stroke-width="1.5"/>
<text class="t mono" x="256" y="230.5" font-size="13" font-weight="700" text-anchor="middle">g</text>
<circle class="a af" cx="328" cy="44" r="15" stroke-width="1.5"/>
<circle class="a" cx="328" cy="44" r="11" stroke-width="1.5"/>
<text class="ta mono" x="328" y="48.5" font-size="13" font-weight="700" text-anchor="middle">d</text>
<circle class="a af" cx="328" cy="100" r="15" stroke-width="1.5"/>
<circle class="a" cx="328" cy="100" r="11" stroke-width="1.5"/>
<text class="ta mono" x="328" y="104.5" font-size="13" font-weight="700" text-anchor="middle">e</text>
<text class="tm" x="40" y="182" font-size="10.5" text-anchor="middle">root</text>
<text class="ta mono" x="277" y="74" font-size="10.5">car</text>
<text class="ta mono" x="349" y="48" font-size="10.5">card</text>
<text class="ta mono" x="349" y="104" font-size="10.5">care</text>
<text class="ta mono" x="277" y="170" font-size="10.5">cat</text>
<text class="tm mono" x="184" y="256" font-size="10.5" text-anchor="middle">do</text>
<text class="tm mono" x="256" y="256" font-size="10.5" text-anchor="middle">dog</text>
<text class="t" x="432" y="34" font-size="12" font-weight="700">complete &#x27;ca&#x27;</text>
<text class="tm" x="432" y="52" font-size="10.5">walk c, a, then list the</text>
<text class="tm" x="432" y="67" font-size="10.5">words below it:</text>
<text class="ta mono" x="432" y="86" font-size="11.5" font-weight="600">car  card  care  cat</text>
<text class="t" x="432" y="124" font-size="12" font-weight="700">check &#x27;cst&#x27;</text>
<text class="tm" x="432" y="142" font-size="10.5">after &#x27;c&#x27; there is no &#x27;s&#x27; branch:</text>
<text class="tm" x="432" y="157" font-size="10.5">not in the dictionary</text>
<text class="ta mono" x="432" y="176" font-size="11.5" font-weight="600">did you mean: cat?</text>
<text class="tm" x="432" y="192" font-size="10.5">edit distance 1: s -&gt; a</text>
<text class="t" x="432" y="230" font-size="12" font-weight="700">Bloom filter</text>
<text class="tm" x="432" y="248" font-size="10.5">the same check in 9.6 bits a word:</text>
<text class="tm" x="432" y="263" font-size="10.5">its &#x27;no&#x27; is always right, its</text>
<text class="tm" x="432" y="278" font-size="10.5">&#x27;maybe&#x27; wrong 1% of the time</text>
<text class="tm" x="24" y="284" font-size="10.5">Double ring: a word ends here.</text>
</svg>
