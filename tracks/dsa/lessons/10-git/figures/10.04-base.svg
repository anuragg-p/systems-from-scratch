<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" fill="none">
<title>The merge base of main and side, painted: each commit marked with which tip reaches it, newest first off the heap</title>
<defs><marker id="f1004b-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f1004b-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f1004b-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="24" font-size="11">bin/git merge-base main side, with DS_TRACE=1: the commits in the order popped</text>
<line class="m" x1="319" y1="90" x2="287" y2="90" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f1004b-am)"/>
<line class="m" x1="179" y1="90" x2="147" y2="90" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f1004b-am)"/>
<path class="m" d="M179 170.0 C156 170.0 168 90.0 147 90.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f1004b-am)"/>
<rect class="s f" x="320" y="70" width="104" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="330" y="86" font-size="11.5" font-weight="700">f59a714</text>
<text class="tm" x="330" y="101" font-size="10.5">third</text>
<circle class="a f" cx="420" cy="68" r="10" stroke-width="1.5"/>
<text class="ta mono" x="420" y="72" font-size="11" font-weight="700" text-anchor="middle">1</text>
<text class="t" x="372" y="126" font-size="11" font-weight="600" text-anchor="middle">1: from main</text>
<text class="tm mono" x="372" y="140" font-size="10" text-anchor="middle">+120 s</text>
<rect class="s f" x="180" y="70" width="104" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="190" y="86" font-size="11.5" font-weight="700">04edf9e</text>
<text class="tm" x="190" y="101" font-size="10.5">second</text>
<circle class="a f" cx="280" cy="68" r="10" stroke-width="1.5"/>
<text class="ta mono" x="280" y="72" font-size="11" font-weight="700" text-anchor="middle">2</text>
<text class="t" x="232" y="126" font-size="11" font-weight="600" text-anchor="middle">1: from main</text>
<text class="tm mono" x="232" y="140" font-size="10" text-anchor="middle">+60 s</text>
<rect class="s f" x="180" y="150" width="104" height="40" rx="6" stroke-width="1.5"/>
<text class="t mono" x="190" y="166" font-size="11.5" font-weight="700">4e71d40</text>
<text class="tm" x="190" y="181" font-size="10.5">on a side branch</text>
<circle class="a f" cx="280" cy="148" r="10" stroke-width="1.5"/>
<text class="ta mono" x="280" y="152" font-size="11" font-weight="700" text-anchor="middle">3</text>
<text class="t" x="232" y="206" font-size="11" font-weight="600" text-anchor="middle">2: from side</text>
<text class="tm mono" x="232" y="220" font-size="10" text-anchor="middle">+30 s</text>
<rect class="a fa" x="40" y="70" width="104" height="40" rx="6" stroke-width="1.5"/>
<text class="f mono" x="50" y="86" font-size="11.5" font-weight="700">4531ec6</text>
<text class="f" x="50" y="101" font-size="10.5">first</text>
<circle class="a f" cx="140" cy="68" r="10" stroke-width="1.5"/>
<text class="ta mono" x="140" y="72" font-size="11" font-weight="700" text-anchor="middle">4</text>
<text class="ta" x="92" y="126" font-size="11" font-weight="700" text-anchor="middle">1 and 2: the merge base</text>
<text class="tm mono" x="92" y="140" font-size="10" text-anchor="middle">+0 s</text>
<text class="tm" x="92" y="154" font-size="10.5" text-anchor="middle">popped twice: both</text>
<text class="tm" x="92" y="167" font-size="10.5" text-anchor="middle">its children pushed it</text>
<rect class="s" x="438" y="79" width="44" height="22" rx="11" stroke-width="1.5"/>
<text class="t mono" x="460" y="94" font-size="11" font-weight="700" text-anchor="middle">main</text>
<line class="s" x1="437" y1="90" x2="427" y2="90" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f1004b-ah)"/>
<rect class="s" x="298" y="159" width="44" height="22" rx="11" stroke-width="1.5"/>
<text class="t mono" x="320" y="174" font-size="11" font-weight="700" text-anchor="middle">side</text>
<line class="s" x1="297" y1="170" x2="287" y2="170" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f1004b-ah)"/>
<text class="t" x="24" y="252" font-size="11.5">Reached by both: 4531ec6, the newest commit both histories hold, so the merge base.</text>
<text class="t" x="24" y="270" font-size="11.5">Its marks go on to its parents as stale, and with nothing but stale commits left, the walk stops.</text>
</svg>
