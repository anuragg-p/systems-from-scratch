<text class="tm mono" x="24" y="322" font-size="10.5">78 01: DEFLATE with a 32 KB window, the fastest level; 78 x 256 + 01 = 30721 = 31 x 991</text>
<text class="tm mono" x="24" y="340" font-size="10.5">1d c5 04 14: the Adler-32 of the 13 bytes before compression, most significant byte first</text>
