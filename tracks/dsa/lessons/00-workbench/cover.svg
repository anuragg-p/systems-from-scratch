<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>The doubling test: run one job at n, 2n, 4n and 8n, and read how it grows from the ratio of the times</title>
<defs><marker id="d00-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d00-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="30" font-size="12" font-weight="700">one job: does any value appear twice?</text>
<text class="tm" x="24" y="49" font-size="10.5">slow: compare every pair</text>
<text class="tm" x="24" y="65" font-size="10.5">fast: sort, then compare neighbours</text>
<text class="tm" x="24" y="94" font-size="10.5">n</text>
<text class="tm" x="104" y="94" font-size="10.5">slow</text>
<text class="tm" x="206" y="94" font-size="10.5">fast</text>
<text class="t mono" x="24" y="114" font-size="11">10,000</text>
<text class="t mono" x="104" y="114" font-size="11">0.05 s</text>
<text class="t mono" x="206" y="114" font-size="11">1.00 ms</text>
<text class="t mono" x="24" y="132" font-size="11">20,000</text>
<text class="t mono" x="104" y="132" font-size="11">0.20 s</text>
<text class="t mono" x="206" y="132" font-size="11">2.15 ms</text>
<text class="ta mono" x="158" y="132" font-size="10.5" font-weight="600">x4.00</text>
<text class="ta mono" x="266" y="132" font-size="10.5" font-weight="600">x2.15</text>
<text class="t mono" x="24" y="150" font-size="11">40,000</text>
<text class="t mono" x="104" y="150" font-size="11">0.80 s</text>
<text class="t mono" x="206" y="150" font-size="11">4.60 ms</text>
<text class="ta mono" x="158" y="150" font-size="10.5" font-weight="600">x4.00</text>
<text class="ta mono" x="266" y="150" font-size="10.5" font-weight="600">x2.14</text>
<text class="t mono" x="24" y="168" font-size="11">80,000</text>
<text class="t mono" x="104" y="168" font-size="11">3.20 s</text>
<text class="t mono" x="206" y="168" font-size="11">9.81 ms</text>
<text class="ta mono" x="158" y="168" font-size="10.5" font-weight="600">x4.00</text>
<text class="ta mono" x="266" y="168" font-size="10.5" font-weight="600">x2.13</text>
<text class="t" x="24" y="204" font-size="11.5" font-weight="700">1,000x the input, n = 10,000,000:</text>
<text class="tm mono" x="24" y="223" font-size="11">slow</text>
<text class="ta mono" x="64" y="223" font-size="11" font-weight="600">50,000 s = 14 hours</text>
<text class="tm mono" x="24" y="240" font-size="11">fast</text>
<text class="t mono" x="64" y="240" font-size="11" font-weight="600">1.75 s</text>
<line class="m" x1="376" y1="208" x2="604" y2="208" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="376" y1="208" x2="376" y2="36" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="372" y1="189.8" x2="376" y2="189.8" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="368" y="193.3" font-size="9.5" text-anchor="end">1 ms</text>
