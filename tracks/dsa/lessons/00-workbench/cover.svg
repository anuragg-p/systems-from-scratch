<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>One job done two ways: paste -s with strcat(), which reads all it has joined again for each line, and with the end remembered; doubling the input tells them apart</title>
<defs><marker id="d00-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d00-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="24" y="30" font-size="12" font-weight="700">one job: paste -s, a file&#x27;s lines joined into one</text>
<text class="tm" x="24" y="49" font-size="10.5">slow, --algo=strcat: strlen() finds the end again for each line</text>
<text class="tm" x="24" y="65" font-size="10.5">fast, --algo=end: it remembers where the end is</text>
<text class="tm" x="24" y="98" font-size="10">input</text>
<text class="tm" x="132" y="98" font-size="10" text-anchor="end">lines</text>
<text class="tm" x="264" y="98" font-size="10" text-anchor="end">bytes strlen() read</text>
<text class="tm" x="340" y="98" font-size="10" text-anchor="end">fast</text>
<text class="t mono" x="24" y="119" font-size="11">book.txt</text>
<text class="t mono" x="132" y="119" font-size="11" text-anchor="end">11,922</text>
<text class="t mono" x="264" y="119" font-size="11" text-anchor="end">6,659,837,313</text>
<text class="t mono" x="340" y="119" font-size="11" text-anchor="end">0</text>
<text class="t mono" x="24" y="138" font-size="11">two.txt</text>
<text class="t mono" x="132" y="138" font-size="11" text-anchor="end">23,844</text>
<text class="t mono" x="264" y="138" font-size="11" text-anchor="end">26,729,635,601</text>
<text class="ta mono" x="272" y="138" font-size="10.5" font-weight="600">x4.01</text>
<text class="t mono" x="340" y="138" font-size="11" text-anchor="end">0</text>
<text class="t mono" x="24" y="157" font-size="11">four.txt</text>
<text class="t mono" x="132" y="157" font-size="11" text-anchor="end">47,688</text>
<text class="ta mono" x="264" y="157" font-size="11" font-weight="700" text-anchor="end">107,099,115,105</text>
<text class="ta mono" x="272" y="157" font-size="10.5" font-weight="600">x4.01</text>
<text class="t mono" x="340" y="157" font-size="11" text-anchor="end">0</text>
<text class="tm" x="24" y="196" font-size="10.5">To copy 2.2 million bytes, the slow way read</text>
<text class="tm" x="24" y="212" font-size="10.5">107 billion: twice the lines, four times the reading.</text>
<text class="tm" x="24" y="236" font-size="10.5">The fast way reads none of it again, however long</text>
<text class="tm" x="24" y="252" font-size="10.5">the file: the same output, one line of add() apart.</text>
<line class="m" x1="394" y1="200" x2="612" y2="200" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="394" y1="200" x2="394" y2="36" stroke-width="1.5" stroke-linecap="round"/>
<line class="m" x1="390" y1="185.8" x2="394" y2="185.8" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="386" y="189.3" font-size="9.5" text-anchor="end">1 ms</text>
<line class="m" x1="390" y1="150.4" x2="394" y2="150.4" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="386" y="153.9" font-size="9.5" text-anchor="end">10 ms</text>
<line class="m" x1="390" y1="114.9" x2="394" y2="114.9" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="386" y="118.4" font-size="9.5" text-anchor="end">0.1 s</text>
<line class="m" x1="390" y1="79.5" x2="394" y2="79.5" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="386" y="83.0" font-size="9.5" text-anchor="end">1 s</text>
<line class="m" x1="390" y1="44.0" x2="394" y2="44.0" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="386" y="47.5" font-size="9.5" text-anchor="end">10 s</text>
<line class="m" x1="406.0" y1="200" x2="406.0" y2="204" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="406.0" y="216" font-size="9.5" text-anchor="middle">16k</text>
<line class="m" x1="438.3" y1="200" x2="438.3" y2="204" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="438.3" y="216" font-size="9.5" text-anchor="middle">32k</text>
<line class="m" x1="470.7" y1="200" x2="470.7" y2="204" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="470.7" y="216" font-size="9.5" text-anchor="middle">64k</text>
<line class="m" x1="503.0" y1="200" x2="503.0" y2="204" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="503.0" y="216" font-size="9.5" text-anchor="middle">128k</text>
<line class="m" x1="535.3" y1="200" x2="535.3" y2="204" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="535.3" y="216" font-size="9.5" text-anchor="middle">256k</text>
<line class="m" x1="567.7" y1="200" x2="567.7" y2="204" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="567.7" y="216" font-size="9.5" text-anchor="middle">512k</text>
<line class="m" x1="600.0" y1="200" x2="600.0" y2="204" stroke-width="1.5" stroke-linecap="round"/>
<text class="tm mono" x="600.0" y="216" font-size="9.5" text-anchor="middle">1M</text>
<text class="tm" x="394" y="30" font-size="10.5">seconds, log scale</text>
<text class="tm" x="612" y="234" font-size="10.5" text-anchor="end">words of text, log scale</text>
<path class="a" d="M406.0 164.1 L438.3 151.2 L470.7 133.8 L503.0 113.2 L535.3 91.6 L567.7 70.1 L600.0 48.6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="s" d="M406.0 173.7 L438.3 170.5 L470.7 172.3 L503.0 170.5 L535.3 162.0 L567.7 165.7 L600.0 155.2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="a fa" cx="406.0" cy="164.1" r="3.5" stroke-width="1.5"/>
<circle class="a fa" cx="438.3" cy="151.2" r="3.5" stroke-width="1.5"/>
<circle class="a fa" cx="470.7" cy="133.8" r="3.5" stroke-width="1.5"/>
<circle class="a fa" cx="503.0" cy="113.2" r="3.5" stroke-width="1.5"/>
<circle class="a fa" cx="535.3" cy="91.6" r="3.5" stroke-width="1.5"/>
<circle class="a fa" cx="567.7" cy="70.1" r="3.5" stroke-width="1.5"/>
<circle class="a fa" cx="600.0" cy="48.6" r="3.5" stroke-width="1.5"/>
<circle class="s f" cx="406.0" cy="173.7" r="3.5" stroke-width="1.5"/>
<circle class="s f" cx="438.3" cy="170.5" r="3.5" stroke-width="1.5"/>
<circle class="s f" cx="470.7" cy="172.3" r="3.5" stroke-width="1.5"/>
<circle class="s f" cx="503.0" cy="170.5" r="3.5" stroke-width="1.5"/>
<circle class="s f" cx="535.3" cy="162.0" r="3.5" stroke-width="1.5"/>
<circle class="s f" cx="567.7" cy="165.7" r="3.5" stroke-width="1.5"/>
<circle class="s f" cx="600.0" cy="155.2" r="3.5" stroke-width="1.5"/>
<text class="ta mono" x="408" y="62" font-size="10.5" font-weight="700">--algo=strcat</text>
<text class="ta" x="408" y="77" font-size="10.5" font-weight="600">x4.0 a doubling: n^2</text>
<text class="t" x="612" y="193" font-size="10" font-weight="600" text-anchor="end">--algo=end: start-up only</text>
<text class="tm" x="24" y="282" font-size="11">Double n and divide the times: a steady x4 is n^2, x2 is n. Small inputs hide it: at 16,000 words the two take 4 ms and 2 ms.</text>
</svg>
