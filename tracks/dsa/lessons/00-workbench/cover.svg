<circle class="s f" cx="590.0" cy="153.6" r="3.5" stroke-width="1.5"/>
<text class="ta" x="450.7" y="81.9" font-size="11" font-weight="600">slope 2: n^2</text>
<text class="t" x="384.0" y="149.8" font-size="11" font-weight="600">slope about 1: n log n</text>
<text class="tm" x="24" y="282" font-size="11">Double n and divide the times: a steady x4 is n^2, a bit over x2 is n log n. Trust the ratio, not one run.</text>
