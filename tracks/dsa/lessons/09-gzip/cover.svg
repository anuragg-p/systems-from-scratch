<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Huffman&#x27;s greedy tree gives common bytes short codes; LZ77 writes a repeat as a pointer back to its earlier copy</title>
<defs><marker id="d09-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d09-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="30" font-size="11.5" font-weight="600">printf abracadabra | bin/gzip --huffman</text>
<text class="tm" x="24" y="64" font-size="10">byte</text>
<text class="tm" x="96" y="64" font-size="10" text-anchor="end">count</text>
<text class="tm" x="134" y="64" font-size="10" text-anchor="end">bits</text>
<text class="tm" x="148" y="64" font-size="10">code</text>
<text class="t mono" x="30" y="84" font-size="12" font-weight="700">&#x27;a&#x27;</text>
<text class="tm mono" x="90" y="84" font-size="12" text-anchor="end">5</text>
<text class="tm mono" x="128" y="84" font-size="12" text-anchor="end">1</text>
<text class="ta mono" x="148" y="84" font-size="12" font-weight="600">0</text>
<text class="t mono" x="30" y="102" font-size="12" font-weight="700">&#x27;b&#x27;</text>
<text class="tm mono" x="90" y="102" font-size="12" text-anchor="end">2</text>
<text class="tm mono" x="128" y="102" font-size="12" text-anchor="end">3</text>
<text class="ta mono" x="148" y="102" font-size="12" font-weight="600">100</text>
<text class="t mono" x="30" y="120" font-size="12" font-weight="700">&#x27;c&#x27;</text>
<text class="tm mono" x="90" y="120" font-size="12" text-anchor="end">1</text>
<text class="tm mono" x="128" y="120" font-size="12" text-anchor="end">3</text>
<text class="ta mono" x="148" y="120" font-size="12" font-weight="600">101</text>
<text class="t mono" x="30" y="138" font-size="12" font-weight="700">&#x27;d&#x27;</text>
<text class="tm mono" x="90" y="138" font-size="12" text-anchor="end">1</text>
<text class="tm mono" x="128" y="138" font-size="12" text-anchor="end">3</text>
<text class="ta mono" x="148" y="138" font-size="12" font-weight="600">110</text>
<text class="t mono" x="30" y="156" font-size="12" font-weight="700">&#x27;r&#x27;</text>
<text class="tm mono" x="90" y="156" font-size="12" text-anchor="end">2</text>
<text class="tm mono" x="128" y="156" font-size="12" text-anchor="end">3</text>
<text class="ta mono" x="148" y="156" font-size="12" font-weight="600">111</text>
<text class="tm" x="24" y="190" font-size="10.5">the tree gives each byte its length;</text>
<text class="tm" x="24" y="205" font-size="10.5">the codes are then numbered in order</text>
<line class="s" x1="313.7" y1="59.0" x2="274.3" y2="91.8" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s fs" x="243" y="88" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="262.0" y="106.2" font-size="12" font-weight="700" text-anchor="middle">a 5</text>
<line class="s" x1="335.3" y1="59.0" x2="376.2" y2="93.0" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="377.3" y1="112.1" x2="346.7" y2="143.9" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="330.9" y1="166.6" x2="318.9" y2="191.6" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s fs" x="293" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="312.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">c 1</text>
<line class="s" x1="343.1" y1="166.6" x2="355.1" y2="191.6" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s fs" x="343" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="362.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">d 1</text>
<circle class="s f" cx="337.0" cy="154" r="14" stroke-width="1.5"/>
<text class="t mono" x="337.0" y="157.8" font-size="11" font-weight="600" text-anchor="middle">2</text>
<text class="tm mono" x="355.0" y="144" font-size="9.5">n1</text>
<line class="s" x1="396.7" y1="112.1" x2="427.3" y2="143.9" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="430.9" y1="166.6" x2="418.9" y2="191.6" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s fs" x="393" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="412.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">b 2</text>
<line class="s" x1="443.1" y1="166.6" x2="455.1" y2="191.6" stroke-width="1.5" stroke-linecap="round"/>
<rect class="s fs" x="443" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="462.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">r 2</text>
<circle class="s f" cx="437.0" cy="154" r="14" stroke-width="1.5"/>
<text class="t mono" x="437.0" y="157.8" font-size="11" font-weight="600" text-anchor="middle">4</text>
<text class="tm mono" x="455.0" y="144" font-size="9.5">n2</text>
<circle class="s f" cx="387.0" cy="102" r="14" stroke-width="1.5"/>
<text class="t mono" x="387.0" y="105.8" font-size="11" font-weight="600" text-anchor="middle">6</text>
<text class="tm mono" x="405.0" y="92" font-size="9.5">n3</text>
<circle class="s f" cx="324.5" cy="50" r="14" stroke-width="1.5"/>
<text class="t mono" x="324.5" y="53.9" font-size="11" font-weight="600" text-anchor="middle">11</text>
<text class="tm mono" x="342.5" y="40" font-size="9.5">n4</text>
<text class="t" x="486" y="30" font-size="11.5" font-weight="700">join the two lightest,</text>
<text class="t" x="486" y="45" font-size="11.5" font-weight="700">until one tree is left</text>
<text class="t mono" x="486" y="70" font-size="11">&#x27;c&#x27; 1 + &#x27;d&#x27; 1 = n1 2</text>
<text class="t mono" x="486" y="88" font-size="11">&#x27;b&#x27; 2 + &#x27;r&#x27; 2 = n2 4</text>
<text class="t mono" x="486" y="106" font-size="11">n1 2 + n2 4 = n3 6</text>
<text class="t mono" x="486" y="124" font-size="11">&#x27;a&#x27; 5 + n3 6 = n4 11</text>
<text class="ta" x="486" y="168" font-size="11.5" font-weight="700">23 bits instead of</text>
<text class="ta" x="486" y="184" font-size="11.5" font-weight="700">88 as bytes</text>
<text class="t" x="24" y="252" font-size="12" font-weight="700">LZ77</text>
<text class="t mono" x="72" y="252" font-size="12">abracad<tspan class="ta" font-weight="700">[distance 7, length 4]</tspan></text>
<text class="tm" x="372" y="252" font-size="10.5">the second &#x27;abra&#x27; points at the first</text>
<text class="tm" x="24" y="282" font-size="11">DEFLATE does both: LZ77 finds the repeats, then Huffman codes what is left.</text>
</svg>
