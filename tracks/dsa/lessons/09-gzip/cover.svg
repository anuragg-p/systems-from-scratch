<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Huffman&#x27;s greedy tree gives common symbols short codes; LZ77 replaces a repeat with a pointer back</title>
<defs><marker id="d09-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d09-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="30" font-size="10.5">input</text>
<text class="t mono" x="24" y="52" font-size="14" font-weight="700">abracadabra</text>
<text class="tm" x="24" y="84" font-size="10">symbol</text>
<text class="tm" x="104" y="84" font-size="10" text-anchor="end">count</text>
<text class="tm" x="120" y="84" font-size="10">code</text>
<text class="t mono" x="30" y="104" font-size="12" font-weight="700">a</text>
<text class="tm mono" x="98" y="104" font-size="12" text-anchor="end">5</text>
<text class="ta mono" x="120" y="104" font-size="12" font-weight="600">0</text>
<text class="t mono" x="30" y="122" font-size="12" font-weight="700">b</text>
<text class="tm mono" x="98" y="122" font-size="12" text-anchor="end">2</text>
<text class="ta mono" x="120" y="122" font-size="12" font-weight="600">110</text>
<text class="t mono" x="30" y="140" font-size="12" font-weight="700">r</text>
<text class="tm mono" x="98" y="140" font-size="12" text-anchor="end">2</text>
<text class="ta mono" x="120" y="140" font-size="12" font-weight="600">111</text>
<text class="t mono" x="30" y="158" font-size="12" font-weight="700">c</text>
<text class="tm mono" x="98" y="158" font-size="12" text-anchor="end">1</text>
<text class="ta mono" x="120" y="158" font-size="12" font-weight="600">100</text>
<text class="t mono" x="30" y="176" font-size="12" font-weight="700">d</text>
<text class="tm mono" x="98" y="176" font-size="12" text-anchor="end">1</text>
<text class="ta mono" x="120" y="176" font-size="12" font-weight="600">101</text>
<line class="s" x1="272.9" y1="52.6" x2="226.7" y2="88.2" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="240.0" y="73.0" font-size="11" font-weight="700" text-anchor="middle">0</text>
<rect class="s fs" x="195" y="84" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="214.0" y="102.2" font-size="12" font-weight="700" text-anchor="middle">a 5</text>
<line class="s" x1="295.1" y1="52.6" x2="342.9" y2="89.4" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="328.0" y="73.0" font-size="11" font-weight="700" text-anchor="middle">1</text>
<line class="s" x1="343.9" y1="107.7" x2="308.1" y2="142.3" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="317.0" y="127.0" font-size="11" font-weight="700" text-anchor="middle">0</text>
<line class="s" x1="291.6" y1="164.4" x2="277.4" y2="191.8" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="275.0" y="181.0" font-size="11" font-weight="700" text-anchor="middle">0</text>
<rect class="s fs" x="251" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="270.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">c 1</text>
<line class="s" x1="304.4" y1="164.4" x2="318.6" y2="191.8" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="321.0" y="181.0" font-size="11" font-weight="700" text-anchor="middle">1</text>
<rect class="s fs" x="307" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="326.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">d 1</text>
<circle class="s f" cx="298.0" cy="152" r="14" stroke-width="1.5"/>
<text class="tm mono" x="298.0" y="155.8" font-size="11" font-weight="600" text-anchor="middle">2</text>
<line class="s" x1="364.1" y1="107.7" x2="399.9" y2="142.3" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="391.0" y="127.0" font-size="11" font-weight="700" text-anchor="middle">1</text>
<line class="s" x1="403.6" y1="164.4" x2="389.4" y2="191.8" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="387.0" y="181.0" font-size="11" font-weight="700" text-anchor="middle">0</text>
<rect class="s fs" x="363" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="382.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">b 2</text>
<line class="s" x1="416.4" y1="164.4" x2="430.6" y2="191.8" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta mono" x="433.0" y="181.0" font-size="11" font-weight="700" text-anchor="middle">1</text>
<rect class="s fs" x="419" y="192" width="38" height="28" rx="6" stroke-width="1.5"/>
<text class="t mono" x="438.0" y="210.2" font-size="12" font-weight="700" text-anchor="middle">r 2</text>
<circle class="s f" cx="410.0" cy="152" r="14" stroke-width="1.5"/>
<text class="tm mono" x="410.0" y="155.8" font-size="11" font-weight="600" text-anchor="middle">4</text>
<circle class="s f" cx="354.0" cy="98" r="14" stroke-width="1.5"/>
<text class="tm mono" x="354.0" y="101.8" font-size="11" font-weight="600" text-anchor="middle">6</text>
<circle class="s f" cx="284.0" cy="44" r="14" stroke-width="1.5"/>
<text class="tm mono" x="284.0" y="47.9" font-size="11" font-weight="600" text-anchor="middle">11</text>
<text class="t" x="488" y="30" font-size="11.5" font-weight="700">join the two smallest,</text>
<text class="t" x="488" y="45" font-size="11.5" font-weight="700">until one tree is left</text>
<text class="t mono" x="488" y="70" font-size="11">1 + 1 = 2</text>
<text class="tm mono" x="568" y="70" font-size="10.5">c, d</text>
<text class="t mono" x="488" y="88" font-size="11">2 + 2 = 4</text>
<text class="tm mono" x="568" y="88" font-size="10.5">b, r</text>
<text class="t mono" x="488" y="106" font-size="11">2 + 4 = 6</text>
<text class="tm mono" x="568" y="106" font-size="10.5">cd, br</text>
<text class="t mono" x="488" y="124" font-size="11">5 + 6 = 11</text>
<text class="tm mono" x="568" y="124" font-size="10.5">a, cdbr</text>
<text class="ta" x="488" y="168" font-size="11.5" font-weight="700">23 bits instead of</text>
<text class="ta" x="488" y="184" font-size="11.5" font-weight="700">88 as bytes</text>
<text class="t" x="24" y="262" font-size="12" font-weight="700">LZ77</text>
<text class="t mono" x="72" y="262" font-size="12">abracad<tspan class="ta" font-weight="700">[back 7, copy 4]</tspan></text>
<text class="tm" x="330" y="262" font-size="10.5">the second &#x27;abra&#x27; points at the first</text>
<text class="tm" x="24" y="284" font-size="11">DEFLATE does both: LZ77 finds the repeats, then Huffman codes what is left.</text>
</svg>
