<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" fill="none">
<title>The tree the parser makes of (a|b)*abb: one function for each rule of the grammar, each node labelled with the part of the pattern it was made from</title>
<defs><marker id="f0402a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0402a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0402a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="24" font-size="12" font-weight="600">grep -E &#x27;(a|b)*abb&#x27;</text>
<text class="tm mono" x="24" y="44" font-size="10.5">stats: regex: nodes 10</text>
<text class="tm" x="24" y="68" font-size="10.5">the grammar, loosest rule first: a function each</text>
<rect class="s f" x="24" y="76" width="212" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="93" font-size="12" font-weight="700">parse_alt</text>
<text class="ta mono" x="226" y="93" font-size="10.5" font-weight="600" text-anchor="end">ALT</text>
<text class="t mono" x="34" y="111" font-size="11.5">seq | seq | ...</text>
<line class="s" x1="130" y1="120" x2="130" y2="134" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0402a-ah)"/>
<rect class="s f" x="24" y="134" width="212" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="151" font-size="12" font-weight="700">parse_cat</text>
<text class="ta mono" x="226" y="151" font-size="10.5" font-weight="600" text-anchor="end">CAT</text>
<text class="t mono" x="34" y="169" font-size="11.5">rep rep ...</text>
<line class="s" x1="130" y1="178" x2="130" y2="192" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0402a-ah)"/>
<rect class="s f" x="24" y="192" width="212" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="209" font-size="12" font-weight="700">parse_repeat</text>
<text class="ta mono" x="226" y="209" font-size="10.5" font-weight="600" text-anchor="end">STAR PLUS QUEST</text>
<text class="t mono" x="34" y="227" font-size="11.5">atom * + ?</text>
<line class="s" x1="130" y1="236" x2="130" y2="250" stroke-width="1.5" stroke-linecap="round" marker-end="url(#f0402a-ah)"/>
<rect class="s f" x="24" y="250" width="212" height="44" rx="6" stroke-width="1.5"/>
<text class="t mono" x="34" y="267" font-size="12" font-weight="700">parse_atom</text>
<text class="ta" x="226" y="267" font-size="10.5" font-weight="600" text-anchor="end">a byte, ^, $</text>
<text class="t mono" x="34" y="285" font-size="11.5">a . [..] ^ $ ( alt )</text>
<path class="a" d="M236 282 C 262 282, 262 94, 238 94" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#f0402a-aa)"/>
<text class="tm" x="24" y="314" font-size="10.5">each rule calls the next, tighter one;</text>
<text class="ta" x="24" y="329" font-size="10.5">a group, ( alt ), calls the first again</text>
<text class="tm" x="616" y="24" font-size="10.5" text-anchor="end">each node: what it is, and the part</text>
<text class="tm" x="616" y="39" font-size="10.5" text-anchor="end">of the pattern it was parsed from</text>
