<text class="tm mono" x="484" y="115" font-size="11" font-weight="600">D1</text>
<rect class="s fs" x="508" y="98" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="554.0" y="115.0" font-size="11.5" font-weight="600" text-anchor="middle">{1 2 5 6}</text>
<line class="s" x1="554" y1="124" x2="554" y2="136" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d04-ah)"/>
<text class="tm mono" x="564" y="134" font-size="11.5" font-weight="600">b</text>
<text class="tm mono" x="484" y="155" font-size="11" font-weight="600">D2</text>
<rect class="s fs" x="508" y="138" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="554.0" y="155.0" font-size="11.5" font-weight="600" text-anchor="middle">{1 3 5 7}</text>
<line class="s" x1="554" y1="164" x2="554" y2="176" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d04-ah)"/>
<text class="tm mono" x="564" y="174" font-size="11.5" font-weight="600">b</text>
<text class="tm mono" x="484" y="195" font-size="11" font-weight="600">D3</text>
<rect class="s fs" x="508" y="178" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="554.0" y="195.0" font-size="11.5" font-weight="600" text-anchor="middle">{1 5 8}</text>
<line class="s" x1="554" y1="204" x2="554" y2="216" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d04-ah)"/>
<text class="tm mono" x="564" y="214" font-size="11.5" font-weight="600">b</text>
<text class="ta mono" x="484" y="235" font-size="11" font-weight="600">D4</text>
<rect class="a af" x="508" y="218" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="554.0" y="235.0" font-size="11.5" font-weight="600" text-anchor="middle">{1 5 9}</text>
<text class="tm" x="24" y="262" font-size="11">States 1 and 5 stay live: a match may start at any byte. No backtracking: each byte is read once,</text>
<text class="tm" x="24" y="280" font-size="11">and the DFA keeps each set it has made in a hash table, so meeting it again costs one lookup. Double ring: the match.</text>
</svg>
