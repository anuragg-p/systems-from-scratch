<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>A regular expression as a machine: grep -E follows every live state at once, a byte at a time, and each set of states becomes a DFA state the first time it is met</title>
<defs><marker id="d04-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d04-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="30" font-size="12.5" font-weight="700">grep -E &#x27;abab|abbb&#x27;</text>
<line class="s" x1="24" y1="146" x2="44" y2="146" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d04-ah)"/>
<text class="tm" x="24" y="136" font-size="10">start</text>
