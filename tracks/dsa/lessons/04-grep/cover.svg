<text class="ta mono" x="417.0" y="187.0" font-size="12" font-weight="600" text-anchor="middle">b</text>
<circle class="a af" cx="62" cy="146" r="16" stroke-width="1.5"/>
<text class="ta mono" x="62" y="150.5" font-size="12" font-weight="600" text-anchor="middle">0</text>
