<text class="ta mono" x="212" y="208.5" font-size="12" font-weight="600" text-anchor="middle">6</text>
<circle class="s f" cx="288" cy="88" r="16" stroke-width="1.5"/>
<text class="t mono" x="288" y="92.5" font-size="12" font-weight="600" text-anchor="middle">3</text>
<circle class="a af" cx="288" cy="204" r="16" stroke-width="1.5"/>
<text class="ta mono" x="288" y="208.5" font-size="12" font-weight="600" text-anchor="middle">7</text>
<circle class="m f" cx="364" cy="88" r="16" stroke-width="1.5"/>
<text class="tm mono" x="364" y="92.5" font-size="12" font-weight="600" text-anchor="middle">4</text>
<circle class="a af" cx="364" cy="204" r="16" stroke-width="1.5"/>
<text class="ta mono" x="364" y="208.5" font-size="12" font-weight="600" text-anchor="middle">8</text>
<text class="tm" x="288" y="62" font-size="10.5" text-anchor="middle">wants &#x27;a&#x27;, reads &#x27;b&#x27;: dropped</text>
<text class="ta" x="446" y="180" font-size="11" font-weight="700" text-anchor="middle">match</text>
<text class="tm" x="62" y="176" font-size="10" text-anchor="middle">split</text>
<text class="t" x="484" y="30" font-size="12" font-weight="700">reading &#x27;abbb&#x27;</text>
<text class="tm" x="484" y="46" font-size="10.5">live states: a DFA state each</text>
<text class="tm mono" x="484" y="75" font-size="11" font-weight="600">D0</text>
<rect class="s fs" x="508" y="58" width="92" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="554.0" y="75.0" font-size="11.5" font-weight="600" text-anchor="middle">{1 5}</text>
<line class="s" x1="554" y1="84" x2="554" y2="96" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d04-ah)"/>
