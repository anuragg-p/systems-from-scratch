<text class="t mono" x="36" y="52" font-size="10.5">all: freq sort</text>
<text class="t mono" x="36" y="66" font-size="10.5">freq: freq.o libds.a</text>
<text class="t mono" x="36" y="80" font-size="10.5">sort: sort.o libds.a</text>
<text class="t mono" x="36" y="94" font-size="10.5">libds.a: util.o table.o</text>
<text class="t mono" x="36" y="108" font-size="10.5">freq.o: freq.c ds.h</text>
<text class="t mono" x="36" y="122" font-size="10.5">sort.o: sort.c ds.h</text>
<text class="t mono" x="36" y="136" font-size="10.5">util.o: util.c ds.h</text>
<text class="t mono" x="36" y="150" font-size="10.5">table.o: table.c ds.h</text>
<text class="ta mono" x="24" y="178" font-size="12" font-weight="700">you edit table.c: make -j 2</text>
<text class="tm" x="24" y="196" font-size="10.5">step 1</text>
<text class="t mono" x="76" y="196" font-size="10.5">table.o</text>
<text class="tm" x="24" y="211" font-size="10.5">step 2</text>
<text class="t mono" x="76" y="211" font-size="10.5">libds.a</text>
<text class="tm" x="24" y="226" font-size="10.5">step 3</text>
<text class="t mono" x="76" y="226" font-size="10.5">freq, sort: at the same time</text>
<text class="tm" x="24" y="245" font-size="10.5">freq.o, sort.o and util.o: newer than</text>
<text class="tm" x="24" y="260" font-size="10.5">all they need, skipped</text>
