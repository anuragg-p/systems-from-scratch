<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>make: the makefile is a graph; after an edit, rebuild only what depends on it, in topological order</title>
<defs><marker id="d07-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d07-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="28" font-size="12" font-weight="700">Makefile</text>
<rect class="s fs" x="24" y="38" width="212" height="82" rx="8" stroke-width="1.5"/>
<text class="t mono" x="36" y="60" font-size="10.5">freq: freq.o hash.o vec.o</text>
<text class="t mono" x="36" y="77" font-size="10.5">freq.o: freq.c hash.h vec.h</text>
<text class="t mono" x="36" y="94" font-size="10.5">hash.o: hash.c hash.h</text>
<text class="t mono" x="36" y="111" font-size="10.5">vec.o: vec.c vec.h</text>
<text class="ta" x="24" y="146" font-size="12" font-weight="700">you edit hash.h:</text>
<text class="tm" x="24" y="165" font-size="10.5">step 1, at the same time</text>
<text class="t mono" x="36" y="181" font-size="10.5">cc -c hash.c</text>
<text class="t mono" x="36" y="196" font-size="10.5">cc -c freq.c</text>
<text class="tm" x="24" y="216" font-size="10.5">step 2, after both</text>
<text class="t mono" x="36" y="232" font-size="10.5">cc -o freq freq.o hash.o vec.o</text>
<line class="a" x1="448" y1="127.0" x2="448.0" y2="81.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-aa)"/>
<line class="a" x1="340" y1="127.0" x2="428.6" y2="81.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-aa)"/>
<line class="m" x1="556" y1="127.0" x2="467.4" y2="81.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-ah)"/>
<line class="m" x1="448" y1="201.0" x2="448.0" y2="155.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-ah)"/>
<line class="a" x1="376" y1="201.0" x2="435.0" y2="155.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-aa)"/>
<line class="m" x1="520" y1="201.0" x2="461.0" y2="155.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-ah)"/>
<line class="m" x1="304" y1="201.0" x2="333.5" y2="155.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-ah)"/>
<line class="a" x1="376" y1="201.0" x2="346.5" y2="155.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-aa)"/>
<line class="m" x1="592" y1="201.0" x2="562.5" y2="155.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-ah)"/>
<line class="m" x1="520" y1="201.0" x2="549.5" y2="155.0" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d07-ah)"/>
<rect class="s f" x="273.0" y="201.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="304.0" y="217.8" font-size="11" text-anchor="middle">hash.c</text>
<rect class="a af" x="345.0" y="201.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="376.0" y="217.8" font-size="11" font-weight="700" text-anchor="middle">hash.h</text>
<rect class="s f" x="417.0" y="201.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="448.0" y="217.8" font-size="11" text-anchor="middle">freq.c</text>
<rect class="s f" x="489.0" y="201.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="520.0" y="217.8" font-size="11" text-anchor="middle">vec.h</text>
<rect class="s f" x="561.0" y="201.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="592.0" y="217.8" font-size="11" text-anchor="middle">vec.c</text>
<rect class="a af" x="309.0" y="127.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="340.0" y="143.8" font-size="11" font-weight="700" text-anchor="middle">hash.o</text>
<rect class="a af" x="417.0" y="127.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="448.0" y="143.8" font-size="11" font-weight="700" text-anchor="middle">freq.o</text>
<rect class="s fs" x="525.0" y="127.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="t mono" x="556.0" y="143.8" font-size="11" text-anchor="middle">vec.o</text>
<rect class="a af" x="417.0" y="53.0" width="62" height="26" rx="6" stroke-width="1.5"/>
<text class="ta mono" x="448.0" y="69.8" font-size="11" font-weight="700" text-anchor="middle">freq</text>
<text class="tm" x="24" y="256" font-size="10.5">vec.o is newer than vec.c and vec.h: skipped</text>
<text class="ta" x="491.0" y="70" font-size="11" font-weight="600">step 2</text>
<text class="ta" x="299.0" y="144" font-size="11" font-weight="600" text-anchor="end">step 1</text>
<text class="tm" x="616" y="28" font-size="10.5" text-anchor="end">arrow: is needed to build</text>
<text class="tm" x="24" y="284" font-size="11">A depth-first walk orders the graph so each file is built after all it needs, once. A cycle is an error.</text>
</svg>
