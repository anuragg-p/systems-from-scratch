<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Sorting a file bigger than memory: sorted runs on disk, merged through a heap of their heads</title>
<defs><marker id="d02-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d02-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tm" x="24" y="30" font-size="10.5">sorted runs on disk</text>
<text class="t mono" x="24" y="63" font-size="11">run 1</text>
<rect class="m" x="80" y="44" width="36" height="28" rx="5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="98.0" y="62.2" font-size="12" text-anchor="middle">3</text>
<rect class="m" x="120" y="44" width="36" height="28" rx="5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="138.0" y="62.2" font-size="12" text-anchor="middle">8</text>
<rect class="s fs" x="160" y="44" width="36" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="178.0" y="62.2" font-size="12" font-weight="700" text-anchor="middle">15</text>
<rect class="s f" x="200" y="44" width="36" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="218.0" y="62.2" font-size="12" text-anchor="middle">21</text>
<text class="t mono" x="24" y="109" font-size="11" font-weight="600">run 2</text>
<rect class="m" x="80" y="90" width="36" height="28" rx="5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="98.0" y="108.2" font-size="12" text-anchor="middle">1</text>
<rect class="a af" x="120" y="90" width="36" height="28" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="138.0" y="108.2" font-size="12" font-weight="700" text-anchor="middle">9</text>
<rect class="s f" x="160" y="90" width="36" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="178.0" y="108.2" font-size="12" text-anchor="middle">12</text>
<rect class="s f" x="200" y="90" width="36" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="218.0" y="108.2" font-size="12" text-anchor="middle">30</text>
<text class="t mono" x="24" y="155" font-size="11">run 3</text>
<rect class="m" x="80" y="136" width="36" height="28" rx="5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="98.0" y="154.2" font-size="12" text-anchor="middle">5</text>
<rect class="m" x="120" y="136" width="36" height="28" rx="5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="138.0" y="154.2" font-size="12" text-anchor="middle">6</text>
<rect class="s fs" x="160" y="136" width="36" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="178.0" y="154.2" font-size="12" font-weight="700" text-anchor="middle">17</text>
<rect class="s f" x="200" y="136" width="36" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="218.0" y="154.2" font-size="12" text-anchor="middle">25</text>
<text class="tm" x="80" y="196" font-size="10.5">dashed: already written out</text>
<text class="tm" x="330" y="30" font-size="10.5" text-anchor="middle">heap of run heads</text>
<line class="s" x1="320.2" y1="83.1" x2="295.8" y2="120.9" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="339.8" y1="83.1" x2="364.2" y2="120.9" stroke-width="1.5" stroke-linecap="round"/>
<circle class="a af" cx="330" cy="68" r="18" stroke-width="1.5"/>
<text class="ta mono" x="330" y="72.5" font-size="13" font-weight="700" text-anchor="middle">9</text>
<text class="ta" x="330" y="100" font-size="10" text-anchor="middle">run 2</text>
<circle class="s fs" cx="286" cy="136" r="18" stroke-width="1.5"/>
<text class="t mono" x="286" y="140.6" font-size="13" font-weight="700" text-anchor="middle">17</text>
<text class="tm" x="286" y="168" font-size="10" text-anchor="middle">run 3</text>
<circle class="s fs" cx="374" cy="136" r="18" stroke-width="1.5"/>
<text class="t mono" x="374" y="140.6" font-size="13" font-weight="700" text-anchor="middle">15</text>
<text class="tm" x="374" y="168" font-size="10" text-anchor="middle">run 1</text>
<text class="tm mono" x="330" y="196" font-size="10.5" text-anchor="middle">as an array: [9, 17, 15]</text>
<text class="tm" x="436" y="30" font-size="10.5">output</text>
<rect class="s f" x="436" y="54" width="26" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="449.0" y="72.2" font-size="12" text-anchor="middle">1</text>
<rect class="s f" x="465" y="54" width="26" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="478.0" y="72.2" font-size="12" text-anchor="middle">3</text>
<rect class="s f" x="494" y="54" width="26" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="507.0" y="72.2" font-size="12" text-anchor="middle">5</text>
<rect class="s f" x="523" y="54" width="26" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="536.0" y="72.2" font-size="12" text-anchor="middle">6</text>
<rect class="s f" x="552" y="54" width="26" height="28" rx="5" stroke-width="1.5"/>
<text class="t mono" x="565.0" y="72.2" font-size="12" text-anchor="middle">8</text>
<rect class="a af" x="581" y="54" width="26" height="28" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="594.0" y="72.2" font-size="12" font-weight="700" text-anchor="middle">9</text>
<path class="a" d="M348 68 C 390 104, 561 104, 594.0 86" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d02-aa)"/>
<text class="ta" x="436" y="124" font-size="11" font-weight="600">pop 9, the smallest head;</text>
<text class="tm" x="436" y="141" font-size="11">push 12, the next value</text>
<text class="tm" x="436" y="156" font-size="11">from run 2</text>
<text class="tm" x="24" y="252" font-size="11">Sort what fits in memory into runs, write them to disk, then merge: one heap entry per run.</text>
<text class="tm" x="24" y="270" font-size="11">Each step costs log(runs), and memory holds one block per run however big the file is.</text>
</svg>
