<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>Sorting a file bigger than memory: sorted runs on disk, merged through a heap of the runs, the run with the smallest next line on top</title>
<defs><marker id="d02-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d02-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="30" font-size="11" font-weight="600">printf &#x27;to sherlock holmes she is always the woman&#x27; | tr &#x27; &#x27; &#x27;\n&#x27; | bin/sort -S 100b</text>
<text class="tm" x="24" y="52" font-size="10.5">the runs on disk, each sorted</text>
<text class="t mono" x="24" y="82" font-size="11">run 1</text>
<rect class="m" x="74" y="64" width="66" height="26" rx="5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="107.0" y="81.0" font-size="11.5" text-anchor="middle">holmes</text>
<rect class="s fs" x="144" y="64" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="177.0" y="81.0" font-size="11.5" font-weight="700" text-anchor="middle">sherlock</text>
<rect class="s f" x="214" y="64" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="247.0" y="81.0" font-size="11.5" text-anchor="middle">to</text>
<text class="ta mono" x="24" y="126" font-size="11" font-weight="700">run 2</text>
<rect class="m" x="74" y="108" width="66" height="26" rx="5" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="107.0" y="125.0" font-size="11.5" text-anchor="middle">always</text>
<rect class="a af" x="144" y="108" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="177.0" y="125.0" font-size="11.5" font-weight="700" text-anchor="middle">is</text>
<rect class="s f" x="214" y="108" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="247.0" y="125.0" font-size="11.5" text-anchor="middle">she</text>
<text class="t mono" x="24" y="170" font-size="11">run 3</text>
<rect class="s fs" x="74" y="152" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="107.0" y="169.0" font-size="11.5" font-weight="700" text-anchor="middle">the</text>
<rect class="s f" x="144" y="152" width="66" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="177.0" y="169.0" font-size="11.5" text-anchor="middle">woman</text>
<text class="tm" x="74" y="208" font-size="10.5">dashed: written out already</text>
<text class="tm" x="382" y="52" font-size="10.5" text-anchor="middle">the heap of runs</text>
<line class="s" x1="368" y1="95.0" x2="324" y2="136.0" stroke-width="1.5" stroke-linecap="round"/>
<line class="s" x1="396" y1="95.0" x2="440" y2="136.0" stroke-width="1.5" stroke-linecap="round"/>
<rect class="a af" x="344.0" y="69.0" width="76" height="26" rx="13" stroke-width="1.5"/>
<text class="ta mono" x="382.0" y="86.2" font-size="12" font-weight="700" text-anchor="middle">is</text>
<text class="ta" x="382" y="109.0" font-size="10" text-anchor="middle">run 2</text>
<rect class="s fs" x="286.0" y="137.0" width="76" height="26" rx="13" stroke-width="1.5"/>
<text class="t mono" x="324.0" y="154.2" font-size="12" font-weight="700" text-anchor="middle">the</text>
<text class="tm" x="324" y="177.0" font-size="10" text-anchor="middle">run 3</text>
<rect class="s fs" x="402.0" y="137.0" width="76" height="26" rx="13" stroke-width="1.5"/>
<text class="t mono" x="440.0" y="154.2" font-size="12" font-weight="700" text-anchor="middle">sherlock</text>
<text class="tm" x="440" y="177.0" font-size="10" text-anchor="middle">run 1</text>
<text class="tm mono" x="382" y="208" font-size="10.5" text-anchor="middle">as an array: [is, the, sherlock]</text>
<text class="tm" x="506" y="52" font-size="10.5">output</text>
<rect class="s f" x="506" y="64" width="76" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="544.0" y="81.0" font-size="11.5" text-anchor="middle">always</text>
<rect class="s f" x="506" y="96" width="76" height="26" rx="5" stroke-width="1.5"/>
<text class="t mono" x="544.0" y="113.0" font-size="11.5" text-anchor="middle">holmes</text>
<rect class="a af" x="506" y="128" width="76" height="26" rx="5" stroke-width="1.5"/>
<text class="ta mono" x="544.0" y="145.0" font-size="11.5" font-weight="700" text-anchor="middle">is</text>
<path class="a" d="M420.0 82 C 462 82, 466 141.0, 504 141.0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d02-aa)"/>
<text class="ta" x="506" y="178" font-size="10.5" font-weight="600">pop is, the smallest;</text>
<text class="tm" x="506" y="194" font-size="10.5">push she, the next</text>
<text class="tm" x="506" y="210" font-size="10.5">line of run 2</text>
<text class="tm" x="24" y="252" font-size="11">Sort what fits in memory into runs on disk, then merge them, 16 at a time at most: one heap entry per run,</text>
<text class="tm" x="24" y="270" font-size="11">so each line out costs about log2(runs) comparisons, and only one line a run is held in memory.</text>
</svg>
