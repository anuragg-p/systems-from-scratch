<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none">
<title>A hash table with chained buckets: a word&#x27;s hash picks one of 1024 buckets, each bucket is a list of entries kept in one array, and the buckets double once there are as many entries as buckets</title>
<defs><marker id="d01-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="d01-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t mono" x="24" y="30" font-size="11.5" font-weight="600">printf &#x27;the cat sat on the mat, the act\n&#x27; | bin/freq</text>
<text class="tm" x="24" y="50" font-size="10.5">14 lookups (a get for each word, a put for each new one): 4 entries compared by the sum, 2 by FNV-1a</text>
<text class="tm" x="24" y="72" font-size="10">the sum&#x27;s bucket (01.02)</text>
<text class="tm" x="176" y="72" font-size="10">entries: one Array, in the order added</text>
<text class="tm" x="616" y="72" font-size="10" text-anchor="end">FNV-1a&#x27;s bucket (01.03)</text>
<text class="tm" x="206" y="88" font-size="9.5">key</text>
<text class="tm" x="296" y="88" font-size="9.5">count</text>
<text class="tm" x="356" y="88" font-size="9.5" text-anchor="middle">next</text>
<rect class="s f" x="176" y="94" width="206" height="21" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="188" y="110" font-size="11" text-anchor="middle">0</text>
<text class="t mono" x="206" y="110" font-size="12" font-weight="600">the</text>
<text class="t mono" x="296" y="109" font-size="11">3</text>
<text class="tm mono" x="356" y="109" font-size="11" text-anchor="middle">-1</text>
<rect class="s fs" x="24" y="94" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="68.0" y="108.5" font-size="11.5" text-anchor="middle">321</text>
<line class="s" x1="112" y1="104.5" x2="173" y2="104.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d01-ah)"/>
<rect class="s f" x="528" y="94" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="572.0" y="108.5" font-size="11.5" text-anchor="middle">380</text>
<rect class="a af" x="176" y="118" width="206" height="21" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="188" y="134" font-size="11" text-anchor="middle">1</text>
<text class="ta mono" x="206" y="134" font-size="12" font-weight="700">cat</text>
<text class="ta mono" x="296" y="133" font-size="11">1</text>
<text class="ta mono" x="356" y="133" font-size="11" text-anchor="middle">-1</text>
<text class="ta" x="68" y="133" font-size="10" text-anchor="middle">in 312&#x27;s list</text>
<rect class="s f" x="528" y="118" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="572.0" y="132.5" font-size="11.5" text-anchor="middle">807</text>
<rect class="s f" x="176" y="142" width="206" height="21" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="188" y="158" font-size="11" text-anchor="middle">2</text>
<text class="t mono" x="206" y="158" font-size="12" font-weight="600">sat</text>
<text class="t mono" x="296" y="157" font-size="11">1</text>
<text class="tm mono" x="356" y="157" font-size="11" text-anchor="middle">-1</text>
<rect class="s fs" x="24" y="142" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="68.0" y="156.5" font-size="11.5" text-anchor="middle">328</text>
<line class="s" x1="112" y1="152.5" x2="173" y2="152.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d01-ah)"/>
<rect class="s f" x="528" y="142" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="572.0" y="156.5" font-size="11.5" text-anchor="middle">1015</text>
<rect class="s f" x="176" y="166" width="206" height="21" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="188" y="182" font-size="11" text-anchor="middle">3</text>
<text class="t mono" x="206" y="182" font-size="12" font-weight="600">on</text>
<text class="t mono" x="296" y="181" font-size="11">1</text>
<text class="tm mono" x="356" y="181" font-size="11" text-anchor="middle">-1</text>
<rect class="s fs" x="24" y="166" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="68.0" y="180.5" font-size="11.5" text-anchor="middle">221</text>
<line class="s" x1="112" y1="176.5" x2="173" y2="176.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d01-ah)"/>
<rect class="s f" x="528" y="166" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="572.0" y="180.5" font-size="11.5" text-anchor="middle">880</text>
<rect class="s f" x="176" y="190" width="206" height="21" rx="4" stroke-width="1.5"/>
<text class="tm mono" x="188" y="206" font-size="11" text-anchor="middle">4</text>
<text class="t mono" x="206" y="206" font-size="12" font-weight="600">mat</text>
<text class="t mono" x="296" y="205" font-size="11">1</text>
<text class="tm mono" x="356" y="205" font-size="11" text-anchor="middle">-1</text>
<rect class="s fs" x="24" y="190" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="68.0" y="204.5" font-size="11.5" text-anchor="middle">322</text>
<line class="s" x1="112" y1="200.5" x2="173" y2="200.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d01-ah)"/>
<rect class="s f" x="528" y="190" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="572.0" y="204.5" font-size="11.5" text-anchor="middle">93</text>
<rect class="a af" x="176" y="214" width="206" height="21" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="188" y="230" font-size="11" text-anchor="middle">5</text>
<text class="ta mono" x="206" y="230" font-size="12" font-weight="700">act</text>
<text class="ta mono" x="296" y="229" font-size="11">1</text>
<text class="ta mono" x="356" y="229" font-size="11" text-anchor="middle">1</text>
<rect class="a af" x="24" y="214" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="ta mono" x="68.0" y="228.5" font-size="11.5" font-weight="700" text-anchor="middle">312</text>
<line class="a" x1="112" y1="224.5" x2="173" y2="224.5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#d01-aa)"/>
<rect class="s f" x="528" y="214" width="88" height="21" rx="4" stroke-width="1.5"/>
<text class="t mono" x="572.0" y="228.5" font-size="11.5" text-anchor="middle">107</text>
<path class="a" d="M382 224.5 C 416 224.5, 416 128.5, 384 128.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d01-aa)"/>
<text class="ta" x="416" y="180.5" font-size="10.5" font-weight="600">next</text>
<text class="tm" x="24" y="250" font-size="10.5">&#x27;cat&#x27; and &#x27;act&#x27; both add up to 312: one bucket, one list, &#x27;act&#x27; at its head as the newer.</text>
<text class="tm" x="616" y="250" font-size="10.5" text-anchor="end">by FNV-1a, a list each</text>
<text class="tm" x="24" y="272" font-size="11">A new key goes at the head of its bucket&#x27;s list. Once there are as many entries as buckets, the buckets double</text>
<text class="tm" x="24" y="289" font-size="11">and every entry is linked into its new bucket&#x27;s list, from the hash it kept; the entries never move.</text>
</svg>
