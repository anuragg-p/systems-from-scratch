<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" fill="none">
<title>Undo and redo as two stacks of edits: what was done, and what was undone</title>
<defs><marker id="f0303a-ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="s" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303a-aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="a" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="f0303a-am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M1 1.5L8.5 5L1 8.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="step"><title>goto 4, and the first key, f: a change to the text, noted as a new edit on top of the done stack: insert 4 "f".</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">type f</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;the fcat\n&quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="a fa" x="96" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="f mono" x="196" y="171.5" font-size="12" font-weight="600" text-anchor="middle">insert 4 &quot;f&quot;</text>
<text class="tm" x="308" y="171" font-size="10">top</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="456" y="172" font-size="10.5" text-anchor="middle">empty</text>
</g>
<g class="step"><title>Three more keys, a, t and a space, each typed where the last one ended, join the same edit. Four keys, one edit: insert 4 "fat ".</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">the keys a, t and a space</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;the fat cat\n&quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="a fa" x="96" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="f mono" x="196" y="171.5" font-size="12" font-weight="600" text-anchor="middle">insert 4 &quot;fat &quot;</text>
<text class="tm" x="308" y="171" font-size="10">top</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="456" y="172" font-size="10.5" text-anchor="middle">empty</text>
</g>
<g class="step"><title>goto end, then Backspace four times: a new edit, an erase, and each Backspace after the first adds its byte to it. The edit keeps the bytes it took out, "cat\n", so that they can be put back.</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">back 4</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;the fat &quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s f" x="96" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="t mono" x="196" y="171.5" font-size="12" text-anchor="middle">insert 4 &quot;fat &quot;</text>
<rect class="a fa" x="96" y="118" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="f mono" x="196" y="137.5" font-size="12" font-weight="600" text-anchor="middle">erase 8 &quot;cat\n&quot;</text>
<text class="tm" x="308" y="137" font-size="10">top</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="456" y="172" font-size="10.5" text-anchor="middle">empty</text>
</g>
<g class="step"><title>undo: the top of done, erase 8 "cat\n", comes off; its opposite is done to the text ("cat\n" inserted again); and it goes on top of undone.</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">undo</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;the fat cat\n&quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s f" x="96" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="t mono" x="196" y="171.5" font-size="12" text-anchor="middle">insert 4 &quot;fat &quot;</text>
<text class="tm" x="308" y="171" font-size="10">top</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="a fa" x="356" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="f mono" x="456" y="171.5" font-size="12" font-weight="600" text-anchor="middle">erase 8 &quot;cat\n&quot;</text>
<text class="tm" x="568" y="171" font-size="10">top</text>
</g>
<g class="step"><title>undo: the top of done, insert 4 "fat ", comes off; its opposite is done to the text ("fat " erased); and it goes on top of undone.</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">undo</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;the cat\n&quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="196" y="172" font-size="10.5" text-anchor="middle">empty</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s f" x="356" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="t mono" x="456" y="171.5" font-size="12" text-anchor="middle">erase 8 &quot;cat\n&quot;</text>
<rect class="a fa" x="356" y="118" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="f mono" x="456" y="137.5" font-size="12" font-weight="600" text-anchor="middle">insert 4 &quot;fat &quot;</text>
<text class="tm" x="568" y="137" font-size="10">top</text>
</g>
<g class="step"><title>redo: the top of undone, insert 4 "fat ", comes off, is done to the text again, and goes back on top of done.</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">redo</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;the fat cat\n&quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="a fa" x="96" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="f mono" x="196" y="171.5" font-size="12" font-weight="600" text-anchor="middle">insert 4 &quot;fat &quot;</text>
<text class="tm" x="308" y="171" font-size="10">top</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s f" x="356" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="t mono" x="456" y="171.5" font-size="12" text-anchor="middle">erase 8 &quot;cat\n&quot;</text>
<text class="tm" x="568" y="171" font-size="10">top</text>
</g>
<g class="step"><title>goto 0 and type "&gt;": a new edit. It empties the undone stack first: erase 8 "cat\n" was undone in a text that has changed since, and can no longer be redone.</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">type &gt;</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;&gt;the fat cat\n&quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s f" x="96" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="t mono" x="196" y="171.5" font-size="12" text-anchor="middle">insert 4 &quot;fat &quot;</text>
<rect class="a fa" x="96" y="118" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="f mono" x="196" y="137.5" font-size="12" font-weight="600" text-anchor="middle">insert 0 &quot;&gt;&quot;</text>
<text class="tm" x="308" y="137" font-size="10">top</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="456" y="172" font-size="10.5" text-anchor="middle">empty</text>
<rect class="m f" x="356" y="84" width="200" height="30" rx="4" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="tm mono" x="456" y="103.5" font-size="12" text-anchor="middle">erase 8 &quot;cat\n&quot;</text>
<line class="a" x1="364" y1="99" x2="548" y2="99" stroke-width="1.5" stroke-linecap="round"/>
<text class="ta" x="456" y="78" font-size="10" text-anchor="middle">forgotten</text>
</g>
<g class="step"><title>redo: the undone stack is empty, so there is nothing to redo, and the text stays as it is. 3 edits made, 2 undone, 1 redone; the stacks keep 5 bytes.</title>
<text class="ta mono" x="24" y="18" font-size="11.5" font-weight="600">redo</text>
<text class="tm" x="24" y="50" font-size="10.5">the text</text>
<rect class="s fs" x="84" y="34" width="260" height="26" rx="4" stroke-width="1.5"/>
<text class="t mono" x="94" y="52" font-size="12.5">&quot;&gt;the fat cat\n&quot;</text>
<text class="t" x="196" y="210" font-size="11" font-weight="600" text-anchor="middle">done: what undo takes</text>
<path class="m" d="M90 80 L90 190 L302 190 L302 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="s f" x="96" y="152" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="t mono" x="196" y="171.5" font-size="12" text-anchor="middle">insert 4 &quot;fat &quot;</text>
<rect class="s f" x="96" y="118" width="200" height="30" rx="4" stroke-width="1.5"/>
<text class="t mono" x="196" y="137.5" font-size="12" text-anchor="middle">insert 0 &quot;&gt;&quot;</text>
<text class="tm" x="308" y="137" font-size="10">top</text>
<text class="t" x="456" y="210" font-size="11" font-weight="600" text-anchor="middle">undone: what redo takes</text>
<path class="m" d="M350 80 L350 190 L562 190 L562 80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tm" x="456" y="172" font-size="10.5" text-anchor="middle">empty</text>
</g>
</svg>
